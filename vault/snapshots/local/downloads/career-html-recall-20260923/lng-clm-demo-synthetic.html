送往终端并等待回复。终端确认的是接收安排；如果调整触及已经签署的合同条款，还要发起合同变更，经过审批并取得双方确认。原版本、变更理由和新版本都保留在同一合同记录中。"],["在 10 月 28 日的独立结算情景中，计量证书记录交付能量 3,400,000 MMBtu，合同固定单价为 12 美元/MMBtu，对应基础货值 40,800,000 美元。收到的发票采用 3,420,000 MMBtu，金额为 41,040,000 美元，数量相差 20,000 MMBtu，价款相差 240,000 美元。","财务需要核对计量证书版本、合同计价条款和发票明细，查明差额原因，再决定是否要求调整。合同中台保存差异事项与处理依据，ERP 继续办理财务记录。滞期费另有计时与审核依据，单独核算。"],["AI 可以从合同里提取条款、比较版本、整理审查意见，也可以在收到履约通知后归纳影响、起草待审函件。业务规则负责日期和金额计算、审批路由与办理状态，相关负责人对接受条款、对外承诺和合同变更作出决定。","条款接受和升级处理需记录理由、适用条件及来源版本。后续负责人接收合同材料、审查依据、决定与待办；事实或条款变化时，按原决定的适用条件重新复核。"]],vO={"销售合同 CT-047":{kind:"LNG 销售合同主记录",owner:"合同负责人 · Mei",version:"MSPA-07 + Confirmation v3 · 10-01 签署",status:"已签署 · 履约监控中",permission:"合同运营维护义务台账；条款修订需审批并由双方确认。",evidence:"签署确认书 v3 · 通知义务 §11.4",description:"主体、标的、条款版本与履约义务由合同主记录统一关联。Cargo、ETA、终端预约和发票提供执行证据。"},"FOB SPA-02":{permission:"Contract Ops 维护条款索引；签署文本变更须另行审批。",kind:"上游长期买入",owner:"合同运营 · Lin",version:"SPA-02 / 修订 R4",status:"签署版本已登记",evidence:"合成合同摘录 § 8.2 · 装港交付安排",description:"上游供货义务、装港安排和相关通知由 SPA-02 及修订件约定。"},"DES MSPA-07":{permission:"商业与履约共同审核对外请求；合同变更需双方确认。",kind:"下游卖出主协议",owner:"商业合同 · Mei",version:"MSPA-07 / 修订 R2",status:"签署版本已登记",evidence:"合成合同摘录 § 11.4 · 目的地交付安排",description:"trader 与终端买方之间的独立卖出义务。交付安排由本主协议与单船确认书共同约定。"},"Confirmation v3":{permission:"双方确认后生效；运营读取交付参数，不能自行改约。",kind:"单船确认书",owner:"商业运营 · Lin",version:"确认书 v3 · 10-01 14:32 UTC",status:"双方已确认",evidence:"确认书附件 A · Cargo LNG-047",description:"约定本船交付窗口、数量和价格，并关联到 MSPA-07。"},"Cargo LNG-047":{permission:"运营更新执行状态；关联的合同与财务记录由各自系统维护。",kind:"船货对象",owner:"航次运营 · Mei",version:"对象修订 6 · 最近更新 10-03 12:00 UTC",status:"计划变更待核",evidence:"装港事件摘要 · 来源记录",description:"连接上游采购、下游转售、船舶、接收窗口与计量结算。"},"MV North Star":{permission:"运营可更新 ETA 预测；实际到港由作业记录确认。",kind:"船舶与航次",owner:"航次运营 · Mei",version:"Voyage snapshot · 10-03 12:00 UTC",status:"ETA 是预测值",evidence:"船期更新 · 合成调度记录",description:"保留到港预测、生成时间与航次假设，随运营更新形成新版本。"},"Meridian LNG":{permission:"协调人员提交扩窗请求；终端确认预约安排。",kind:"接收终端",owner:"终端协调 · Arun",version:"预约窗口 v1 · 10-02 09:00 UTC",status: 合同中台收到这条变化后，首先核对 CT-047 的通知义务：获知预计延迟后 24 小时内告知下游。系统生成待办并分派给合同运营；履约负责人判断交付安排是否需要协调，运营继续确认船期。费用和责任等待合同条件与实际记录齐备后复核。`,terms:["ETA","laytime"],questions:["迟到是否自动产生费用？没有；不能从 ETA 直接推出罚款或滞期费。","24 小时通知期限是什么？仅是本例合成条款参数。"],sources:["时间、追回假设和窗口均是合成值；ETA 仍是预测。"],references:[{label:"SLNG · Berthing Information",url:"https://www.slng.com.sg/berthing-information"},{label:"Veson · VMS Laytime",url:"https://help.veson.com/vms/vms-laytime"}]},{script:`合同负责人需要协调新的接收安排，可以申请延长当前窗口，也可以请求下一可用窗口。商业负责人判断对下游交付的影响，履约负责人核对通知内容和合同约定，两方审核同一版请求。
