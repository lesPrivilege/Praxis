<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>rule-console · 规则策略控制面（演示与学习材料）</title>
<style>
  /* ==========================================================================
     视觉 token —— 取自成熟企业中台设计系统的公开规范，不自创配色：
       · Ant Design v5 seed：colorPrimary #1677ff / borderRadius 6 /
         colorBorder #d9d9d9 / controlHeight 32 / 基号 14 行高 22；
         中性用透明度分级（正文 .88 / 次要 .65 / 失效 .25 / 分隔 rgba(5,5,5,.06)）；
         功能色 success #52c41a / warning #faad14 / error #ff4d4f / info #1677ff
       · AWS Cloudscape 色彩原则：界面主体由白与灰阶构成，仅主操作与状态指示带色
       · IBM Carbon 数据表行高档位：紧凑 24 / 短 32 / 中 40 / 默认 48，本表取中档
     字号只用 5 档（20 / 16 / 14 / 13 / 12），字重只用 400 与 500。
     ========================================================================== */
  :root{
    --primary:#1677ff; --primary-h:#4096ff; --primary-a:#0958d9; --primary-bg:#e6f4ff;
    --success:#52c41a; --warning:#faad14; --error:#ff4d4f;
    --t1:rgba(0,0,0,.88); --t2:rgba(0,0,0,.65); --t3:rgba(0,0,0,.45); --t4:rgba(0,0,0,.25);
    --bd:#d9d9d9; --bd-c:#f0f0f0; --split:rgba(5,5,5,.06);
    --bg:#f5f5f5; --paper:#fff; --hover:#fafafa;
    --r:6px; --r-c:8px; --h:32px;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",
      "PingFang SC","Hiragino Sans GB","Microsoft YaHei",Arial,sans-serif;
    font-size:14px; line-height:22px; color:var(--t1);
    font-variant-numeric:tabular-nums;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--t1)}

  /* ---- 顶部：产品栏 + 主导航（Ant Design Pro top-menu 版式） ---- */
  .topbar{background:var(--paper);border-bottom:1px solid var(--bd-c)}
  .topbar__row{max-width:1440px;margin:0 auto;padding:0 24px;display:flex;align-items:center;gap:16px}
  .topbar__row--brand{height:48px}
  .logo{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:500;white-space:nowrap}
  .logo span{width:16px;height:16px;border-radius:3px;background:var(--primary);flex:none}
  .topbar__sep{width:1px;height:16px;background:var(--bd-c)}
  .topbar__sub{color:var(--t3);font-size:13px;white-space:nowrap}
  .topbar__right{margin-left:auto;display:flex;align-items:center;gap:12px}
  .field{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--t2);white-space:nowrap}
  .env{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--t2);white-space:nowrap}
  .env::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--success)}
  nav{max-width:1440px;margin:0 auto;padding:0 24px;display:flex;gap:24px;overflow-x:auto}
  nav button{border:0;background:none;padding:11px 0 10px;font:inherit;font-size:14px;color:var(--t2);
    cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
  nav button:hover{color:var(--primary)}
  nav button.on{color:var(--primary);font-weight:500;border-bottom-color:var(--primary)}

  main{max-width:1440px;margin:0 auto;padding:16px 24px 40px}

  /* ---- 面包屑 + 页头 ---- */
  .crumb{font-size:14px;color:var(--t3);margin-bottom:8px}
  .crumb b{color:var(--t1);font-weight:400}
  .pagehead{display:flex;justify-content:space-between;align-items:flex-start;gap:24px;margin-bottom:16px}
  .pagehead h1{margin:0 0 4px;font-size:20px;line-height:28px;font-weight:500}
  .pagehead h1 em{font-style:normal;font-size:14px;font-weight:400;color:var(--t3);margin-left:8px}
  .pagehead p{margin:0;font-size:14px;color:var(--t2);max-width:82ch}

  /* ---- 容器（Cloudscape container / AntD card） ---- */
  .panel{background:var(--paper);border:1px solid var(--bd-c);border-radius:var(--r-c);margin-bottom:16px}
  .panel>header{display:flex;justify-content:space-between;align-items:center;gap:12px;
    padding:12px 16px;border-bottom:1px solid var(--bd-c)}
  .panel>header h2{margin:0;font-size:16px;font-weight:500}
  .panel>header .sub{font-size:13px;color:var(--t3);font-weight:400;margin-left:8px}
  .panel>.body{padding:16px}
  .panel>.body>:first-child{margin-top:0}
  .cols{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px;align-items:start}
  .cols>*{margin-bottom:0}
  .cols--wide-right{grid-template-columns:minmax(0,1fr) minmax(0,1.35fr)}

  /* ---- 表格（Carbon 中档行高 40px；表头灰底、次要色、500 字重） ---- */
  table{width:100%;border-collapse:collapse;font-size:14px}
  thead th{background:var(--hover);color:var(--t2);font-size:12px;font-weight:500;text-align:left;
    padding:8px 16px;border-bottom:1px solid var(--bd-c);white-space:nowrap}
  tbody td{padding:9px 16px;border-bottom:1px solid var(--bd-c);vertical-align:top;color:var(--t1)}
  tbody tr:last-child td{border-bottom:0}
  tbody tr.clickable{cursor:pointer}
  tbody tr.clickable:hover{background:var(--hover)}
  tbody tr.on{background:var(--primary-bg)}
  td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
  td.dim,.dim{color:var(--t3)}
  .empty{padding:32px 16px;text-align:center;color:var(--t3);font-size:14px}

  /* ---- 状态指示（Cloudscape status indicator：色点 + 文字，非药丸） ---- */
  .st{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;color:var(--t1)}
  .st::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
  .st-draft,.st-submitted{color:var(--t3)}
  .st-in_review,.st-under_review,.st-shadow{color:var(--primary)}
  .st-approved,.st-applied,.st-active,.st-upheld{color:var(--success)}
  .st-partial{color:var(--warning)}
  .st-rolled_back,.st-rejected,.st-cancelled,.st-overturned{color:var(--error)}
  .st-superseded,.st-retired{color:var(--t4)}
  .yes{color:var(--success)} .no{color:var(--error)}

  /* ---- 键值对（Cloudscape key-value pairs） ---- */
  .kvs{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px 24px}
  .kvs.one{grid-template-columns:1fr}
  .kv>label{display:block;font-size:12px;line-height:20px;color:var(--t3)}
  .kv>div{font-size:14px;line-height:22px;color:var(--t1);overflow-wrap:anywhere}

  /* ---- 提示条（AntD Alert 官方配色，替代自创的琥珀色装饰块） ---- */
  .alert{display:flex;gap:8px;align-items:flex-start;padding:9px 12px;border:1px solid;
    border-radius:var(--r);font-size:14px;margin-bottom:16px;color:var(--t1)}
  .alert::before{font-size:13px;line-height:22px;flex:none}
  .alert-info{background:var(--primary-bg);border-color:#91caff}
  .alert-info::before{content:"ⓘ";color:var(--primary)}
  .alert-success{background:#f6ffed;border-color:#b7eb8f}
  .alert-success::before{content:"✓";color:var(--success)}
  .alert-warning{background:#fffbe6;border-color:#ffe58f}
  .alert-warning::before{content:"!";color:var(--warning);font-weight:600}
  .alert .grow{flex:1}

  /* ---- 步骤条（AntD Steps small） ---- */
  .steps{display:flex;align-items:center;margin:0 0 16px;overflow-x:auto;padding-bottom:2px}
  .steps .s{display:flex;align-items:center;gap:8px;flex:none}
  .steps .s i{width:22px;height:22px;border-radius:50%;border:1px solid var(--bd);
    display:grid;place-items:center;font:400 12px/1 inherit;font-style:normal;color:var(--t3);flex:none}
  .steps .s b{font-weight:400;font-size:13px;color:var(--t3);white-space:nowrap}
  .steps .s.done i{background:var(--primary);border-color:var(--primary);color:#fff}
  .steps .s.done b{color:var(--t1)}
  .steps .s.now i{background:var(--primary);border-color:var(--primary);color:#fff}
  .steps .s.now b{color:var(--t1);font-weight:500}
  .steps .bar{flex:1;min-width:16px;height:1px;background:var(--bd-c);margin:0 8px}
  .steps .s.done+.bar{background:var(--primary)}

  /* ---- 时间线（AntD Timeline） ---- */
  .tl{margin:0;padding:0 0 0 4px;list-style:none}
  .tl li{position:relative;padding:0 0 16px 20px;border-left:1px solid var(--bd-c)}
  .tl li:last-child{border-left-color:transparent;padding-bottom:0}
  .tl li::before{content:"";position:absolute;left:-4px;top:6px;width:7px;height:7px;border-radius:50%;
    background:var(--paper);border:1px solid var(--primary)}
  .tl li.hist::before{border-color:var(--t4)}
  .tl b{font-weight:500}
  .tl small{display:block;color:var(--t3);font-size:12px;line-height:20px}

  /* ---- 控件 ---- */
  button,select,textarea,input{font-family:inherit;font-size:14px}
  .btn{height:var(--h);padding:0 15px;border:1px solid var(--bd);border-radius:var(--r);
    background:var(--paper);color:var(--t1);cursor:pointer;white-space:nowrap;
    transition:color .1s,border-color .1s,background-color .1s}
  .btn:hover{color:var(--primary-h);border-color:var(--primary-h)}
  .btn:active{color:var(--primary-a);border-color:var(--primary-a)}
  .btn-primary{background:var(--primary);border-color:var(--primary);color:#fff}
  .btn-primary:hover{background:var(--primary-h);border-color:var(--primary-h);color:#fff}
  .btn-primary:active{background:var(--primary-a);border-color:var(--primary-a)}
  .btn-sm{height:24px;padding:0 7px;font-size:13px;border-radius:4px}
  .btn-link{border:0;background:none;color:var(--primary);padding:0;height:auto;cursor:pointer;font-size:inherit}
  .btn-link:hover{color:var(--primary-h);text-decoration:underline}
  .btn:disabled{color:var(--t4);border-color:var(--bd);background:var(--hover);cursor:not-allowed}
  select{height:var(--h);padding:0 8px;border:1px solid var(--bd);border-radius:var(--r);
    background:var(--paper);color:var(--t1);cursor:pointer}
  select:hover{border-color:var(--primary-h)}
  textarea{width:100%;min-height:56px;padding:5px 11px;border:1px solid var(--bd);border-radius:var(--r);
    resize:vertical;line-height:22px;color:var(--t1)}
  textarea:hover{border-color:var(--primary-h)}
  textarea:focus{outline:0;border-color:var(--primary);box-shadow:0 0 0 2px rgba(5,145,255,.1)}
  :focus-visible{outline:2px solid var(--primary);outline-offset:1px}
  .toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:12px 16px;
    border-bottom:1px solid var(--bd-c)}
  .toolbar .count{margin-left:auto;color:var(--t3);font-size:13px;white-space:nowrap}
  .actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .form-item{margin-bottom:12px}
  .form-item>label{display:block;font-size:14px;color:var(--t1);margin-bottom:4px}

  code{font-family:Monaco,Menlo,Consolas,"Courier New",monospace;font-size:13px;
    background:rgba(0,0,0,.04);padding:1px 5px;border-radius:4px;color:var(--t1)}
  pre{font-family:Monaco,Menlo,Consolas,"Courier New",monospace;font-size:12px;line-height:20px;
    background:var(--hover);border:1px solid var(--bd-c);border-radius:var(--r);padding:12px;
    margin:0;overflow:auto;max-height:280px;color:var(--t2)}
  h3{font-size:14px;font-weight:500;margin:20px 0 8px;color:var(--t1)}
  .note{font-size:13px;color:var(--t3);line-height:20px}
  footer{max-width:1440px;margin:0 auto;padding:16px 24px 32px;color:var(--t3);font-size:13px;line-height:20px}

  @media(max-width:900px){
    .cols{grid-template-columns:1fr}
    .topbar__sub,.env{display:none}
    .topbar__row,nav,main,footer{padding-left:16px;padding-right:16px}
  }
  @media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar__row topbar__row--brand">
    <div class="logo"><span></span>rule-console</div>
    <div class="topbar__sep"></div>
    <div class="topbar__sub">规则策略控制面</div>
    <div class="topbar__right">
      <label class="field">业务皮肤 <select id="skin"></select></label>
      <div class="env">本地演示环境</div>
    </div>
  </div>
  <nav id="tabs"></nav>
</header>
<main id="app"></main>
<footer>
  演示与学习材料 · 规则与数据均为合成 · 非产品、无生产验证。
  控制面组件对皮肤零耦合：组件只读 SKIN_* 声明，不含任何 <code>if (skin === ...)</code> 分支。
  对象与状态机的唯一规格源：<code>../../技术扫盲/规则策略控制面.md</code> §三 / §六。
  <div id="skincheck" style="margin-top:4px"></div>
</footer>

<script>
/* ==========================================================================
   一、标准内核常量 —— §三 对象模型与状态机，原样落地，集中一处
   面试时直接打开本段指认：对象、状态取值、动作分级与可逆性。
   ========================================================================== */

/* §三「对象」块：desc 为规格原文，逐字未改；fields 为该行名词落成的字段名。 */
const OBJECTS = Object.freeze({
  RuleSource:      { desc: "规则来源：法规/平台政策/内部制度/事故复盘，带 URL 或文号、证据等级",
                     fields: ["type", "ref", "evidenceLevel"] },
  Rule:            { desc: "规则本体：目的、对象类型、判断条件的语义描述，跨版本稳定",
                     fields: ["purpose", "subjectType", "semantic"] },
  RuleVersion:     { desc: "规则版本：条件表达式、动作绑定、生效日、过渡期处理，不可变",
                     fields: ["expression", "actionTier", "effectiveDate", "transition"] },
  Scope:           { desc: "范围声明：市场/品类/组织/环境 × 版本，声明式配置",
                     fields: ["market", "category", "org", "env", "version"] },
  ChangeRequest:   { desc: "变更请求：draft → in_review → approved → applied / rejected / cancelled",
                     fields: ["state", "proposer", "reviewer", "flips"] },
  DecisionRecord:  { desc: "判定记录：输入快照、命中版本、结果、动作、时间——判定级留痕",
                     fields: ["input", "ruleVersionId", "result", "actionTier", "time"] },
  AuditEvent:      { desc: "变更审计：谁在何时改了什么，含前后对比——配置级留痕",
                     fields: ["who", "when", "what", "before", "after"] },
  Case:            { desc: "案件：一次命中形成的处置对象，绑定 Subject（被处置主体）",
                     fields: ["subject", "ruleVersionId", "actionTier", "evidence", "status"] },
  Action:          { desc: "动作：分级谱系（提示 → 限制 → 阻断 → 下架/冻结 → 终止），与可逆性绑定",
                     fields: ["tier", "label", "reversible", "execution"] },
  Exception:       { desc: "例外：申请人、批准人、理由、期限、超期升级、使用记录",
                     fields: ["applicant", "approver", "reason", "expiry", "escalation", "usage"] },
  Appeal:          { desc: "申诉：submitted → under_review → upheld / overturned；overturned 回流评测集",
                     fields: ["state", "sections", "reviewNote", "returnedToEval"] },
  GuardrailMetric: { desc: "护栏指标：误伤率、申诉推翻率、处置时长，超阈值触发回滚",
                     fields: ["name", "value", "threshold", "breached"] }
});

/* §三 RuleVersion 状态机：九个取值原样，未增未删未改名。 */
const RULE_VERSION_STATES = Object.freeze([
  "draft", "in_review", "approved", "shadow", "partial",
  "active", "superseded", "rolled_back", "retired"
]);

/* 状态注释同为 §三 原文（draft/in_review/approved 规格未附注释，此处留空）。 */
const RULE_VERSION_STATE_NOTES = Object.freeze({
  draft: "", in_review: "", approved: "",
  shadow:      "对真实流量旁路判定，只记录不执行——回放或双跑实现",
  partial:     "灰度：按范围或比例部分生效，护栏指标监控中",
  active:      "全量生效",
  superseded:  "被新版本替代，历史判定仍指向本版",
  rolled_back: "护栏触发或人工回滚",
  retired:     "退役：停用但留痕，不删除"
});

/* 迁移边：§三 以箭头链给出顺序，未穷举分支边。下表是对该链的显式化，
   只补边不增删状态；灰度/全量的回滚边与退役边按状态注释补齐。 */
const RULE_VERSION_TRANSITIONS = Object.freeze({
  draft:       ["in_review"],
  in_review:   ["approved", "draft"],
  approved:    ["shadow"],
  shadow:      ["partial"],
  partial:     ["active", "rolled_back"],
  active:      ["superseded", "rolled_back", "retired"],
  superseded:  ["retired"],
  rolled_back: ["draft", "retired"],
  retired:     []
});

const CHANGE_REQUEST_STATES = Object.freeze(
  ["draft", "in_review", "approved", "applied", "rejected", "cancelled"]);
const APPEAL_STATES = Object.freeze(
  ["submitted", "under_review", "upheld", "overturned"]);
const RULE_SOURCE_TYPES = Object.freeze(["法规", "平台政策", "内部制度", "事故复盘"]);

/* §三 判断 3：动作不按严厉程度排，按错误代价与可逆性排。
   可逆动作允许规则自动执行；不可逆动作强制人工确认或例外授权。
   规格点名了「提示、限流」可逆与「下架、冻结、终止」不可逆；
   「阻断」未点名，此处按可撤销判为可逆。 */
const ACTION_TIERS = Object.freeze([
  { tier: "提示",      reversible: true,  execution: "规则自动执行" },
  { tier: "限制",      reversible: true,  execution: "规则自动执行" },
  { tier: "阻断",      reversible: true,  execution: "规则自动执行" },
  { tier: "下架/冻结", reversible: false, execution: "人工确认或例外授权" },
  { tier: "终止",      reversible: false, execution: "人工确认或例外授权" }
]);

/* §六 视图清单 */
const VIEWS = ["规则库", "变更请求", "发布时间线", "案件与申诉", "决策日志"];

/* §六 验收链 */
const FLOW_STEPS = ["新规上线", "shadow", "灰度", "命中成案", "申诉", "推翻", "回流评测集"];


/* ==========================================================================
   二、皮肤声明 —— { skinName, subjectTypes[], actionLadder[], appealPath{},
                    ruleLexicon{}, sampleData{} }
   皮肤只声明「叫什么、管什么、动作怎么落地、申诉走哪条路」；
   内核的 tier 取值来自 ACTION_TIERS，皮肤只给这些 tier 换本地称谓。
   全部数值、主体名、来源文号均为合成，不指向任何真实平台。
   ========================================================================== */

const SKIN_COMMERCE = {
  skinName: "商品治理",
  subjectTypes: ["商品条目", "店铺主体", "内容素材"],
  actionLadder: [
    { tier: "提示",      label: "违规提示" },
    { tier: "限制",      label: "能力限制" },
    { tier: "阻断",      label: "条目下架" },
    { tier: "下架/冻结", label: "资金扣留与账户暂停" },
    { tier: "终止",      label: "账户终止" }
  ],
  appealPath: {
    submitAction: "提交申诉",
    stateLabels: { submitted: "已提交", under_review: "复核中",
                   upheld: "维持原判", overturned: "推翻原判" },
    form: [
      { key: "rootCause",   label: "根因",       preset: "合成：证据快照采集于素材更新前，判定输入与当时页面不一致。" },
      { key: "actionTaken", label: "已采取行动", preset: "合成：已补齐凭证并重新提交核验，条目文案同步修订。" },
      { key: "prevention",  label: "防复发方案", preset: "合成：新增上架前自检清单，凭证到期前触发提醒。" }
    ],
    evalReturnNote: "overturned 的 Appeal 连同其 DecisionRecord 进入评测集，作为下一版回归用例。"
  },
  ruleLexicon: {
    subject: "商品/店铺", rule: "治理规则", case: "治理案件",
    appeal: "申诉", decision: "判定记录", source: "规则来源",
    scope: "适用范围", exception: "准入豁免"
  },
  sampleData: {
    ruleSources: [

/* 动作：内核 tier → 皮肤称谓 → 可逆性。皮肤未声明该 tier 时退回内核名。 */
const tierMeta = t => ACTION_TIERS.find(a => a.tier === t) || null;
const tierLabel = t => {
  const row = skin().actionLadder.find(a => a.tier === t);
  return row ? row.label : (t || "—");
};
const actionText = t => t && t !== "—"
  ? `${esc(tierLabel(t))} <span class="dim">（${esc(t)}）</span>` : `<span class="dim">—</span>`;
const revText = t => {
  const m = tierMeta(t);
  return m ? `<span class="${m.reversible ? "yes" : "no"}">${m.reversible ? "可逆" : "不可逆"}</span>
              <span class="dim">· ${esc(m.execution)}</span>` : `<span class="dim">—</span>`;
};
const kv = (label, value) => `<div class="kv"><label>${esc(label)}</label><div>${value}</div></div>`;
const scopeText = sc => `市场=${esc(sc.market)} / 品类=${esc(sc.category)} / 组织=${esc(sc.org)} / 环境=${esc(sc.env)}`;

const rules       = () => state.data.rules;
const ruleOf      = vid => rules().find(r => r.version.id === vid);
const ruleById    = id => rules().find(r => r.id === id);
const flow        = () => state.data.flow;
const flowRule    = () => ruleById(flow().ruleId);
const flowVersion = () => flowRule().version;
const flowCR      = () => state.data.changeRequests.find(c => c.id === flow().changeRequestId);
const flowCase    = () => state.data.cases.find(c => c.isFlow);
const appealOf    = kase => kase && kase.appealId
  ? state.data.appeals.find(a => a.id === kase.appealId) : null;
const recordById  = id => state.data.decisionRecords.find(d => d.id === id);

function mark(s) { if (!flow().reached.includes(s)) flow().reached.push(s); }

/* 皮肤校验：受控配置不得发明内核以外的取值。
   一份新皮肤只能在 RULE_VERSION_STATES / ACTION_TIERS / RULE_SOURCE_TYPES /
   CHANGE_REQUEST_STATES / APPEAL_STATES 的取值域内声明——这正是
   「标准内核—受控配置」在代码里的落点，也是本 demo 论题的可执行版本。 */
function validateSkin(s) {
  const tiers = ACTION_TIERS.map(a => a.tier), d = s.sampleData, bad = [];
  const chk = (ok, msg) => { if (!ok) bad.push(msg); };
  s.actionLadder.forEach(a => chk(tiers.includes(a.tier), `actionLadder 越界 tier: ${a.tier}`));
  d.ruleSources.forEach(x => chk(RULE_SOURCE_TYPES.includes(x.type), `RuleSource 越界 type: ${x.type}`));
  d.rules.forEach(r => {
    chk(RULE_VERSION_STATES.includes(r.version.state), `RuleVersion 越界 state: ${r.version.state}`);
    chk(tiers.includes(r.version.actionTier), `RuleVersion 越界 actionTier: ${r.version.actionTier}`);
    chk(s.subjectTypes.includes(r.subjectType), `Rule 越界 subjectType: ${r.subjectType}`);
  });
  d.changeRequests.forEach(c => chk(CHANGE_REQUEST_STATES.includes(c.state), `ChangeRequest 越界 state: ${c.state}`));
  d.appeals.forEach(a => chk(APPEAL_STATES.includes(a.state), `Appeal 越界 state: ${a.state}`));
  return bad;
}

function audit(what, before, after) {
  state.data.auditEvents.unshift({ who: "演示维护者", when: "本地交互", what, before, after });
}

/* 验收链进度：每一步都由对象的真实状态推出，不额外维护一个 UI 计数器 */
function milestones() {
  const r = flow().reached, k = flowCase(), a = appealOf(k);
  return [
    r.includes("in_review"),
    r.includes("shadow"),
    r.includes("partial"),
    !!k,
    !!a,
    !!a && a.state === "overturned",
    !!a && a.returnedToEval === true
  ];
}

function steps() {
  const m = milestones(), cur = m.indexOf(false);
  return `<div class="steps">${FLOW_STEPS.map((label, i) => {
    const cls = m[i] ? "done" : i === cur ? "now" : "";
    return `<div class="s ${cls}"><i>${m[i] ? "✓" : i + 1}</i><b>${esc(label)}</b></div>`
      + (i < FLOW_STEPS.length - 1 ? `<div class="bar"></div>` : "");
  }).join("")}</div>`;
}

function page(o) {
  return `<div class="crumb">规则策略控制面 / <b>${esc(o.title)}</b></div>
    <div class="pagehead">
      <div><h1>${esc(o.title)}${o.count != null ? `<em>共 ${o.count} 项</em>` : ""}</h1><p>${o.desc}</p></div>
      ${o.actions ? `<div class="actions">${o.actions}</div>` : ""}
    </div>
    ${steps()}`;
}

      </div>

        <header><h2>护栏指标<span class="sub">GuardrailMetric</span></h2></header>
        <table><thead><tr><th>指标</th><th>取值</th><th>阈值</th><th>判定</th><th>处置</th></tr></thead>
          <tbody>${metrics}</tbody></table>
        <div class="body">
          <h3>历史：一次护栏触发的自动回滚</h3>
          <ul class="tl">${hist}</ul>
          <p class="note">回滚是护栏的自动动作，同时写入配置级 AuditEvent，见「决策日志」右栏。</p>
        </div>
      </div>
    </div>`;
}

/* --------------------------------------------------------------- 视图 4 */
function viewCases() {
  const list = state.data.cases;
  const sel = list.find(c => c.id === state.caseId) || list[0] || null;
  if (sel) state.caseId = sel.id;
  const ap = appealOf(sel);
  const v = flowVersion();
  const canCreate = (v.state === "partial" || v.state === "active") && !flowCase();

  const rows = list.map(c => {
    const a = appealOf(c);
    return `<tr class="clickable ${c.id === state.caseId ? "on" : ""}" data-act="pickCase" data-arg="${esc(c.id)}">
      <td class="num"><code>${esc(c.id)}</code>${c.isFlow ? ` <span class="dim">· 演示链路</span>` : ""}</td>
      <td>${esc(c.subject)}</td>
      <td class="dim">${esc(c.subjectType)}</td>
      <td class="num"><code>${esc(c.ruleVersionId)}</code></td>
      <td>${actionText(c.actionTier)}</td>
      <td>${a ? st(a.state) : `<span class="dim">无</span>`}</td>
      <td class="dim">${esc(c.status)}</td>
    </tr>`;
  }).join("");

  let detail = `<div class="empty">暂无案件。</div>`;
  if (sel) {
    const path = skin().appealPath;
    let body;
    if (!ap) {
      body = `<h3>${esc(lex("appeal"))}：${path.form.length} 段式提交</h3>
        ${path.form.map(f => `<div class="form-item"><label>${esc(f.label)}</label>
          <textarea data-field="${esc(f.key)}">${esc(f.preset)}</textarea></div>`).join("")}
        <div class="actions">${btn("submitAppeal", path.submitAction, "btn-primary")}</div>`;
    } else {
      let ops = "";
      if (ap.state === "submitted") ops = btn("reviewAppeal", "受理复核", "btn-primary");
      else if (ap.state === "under_review") ops = btn("overturn", "推翻", "btn-primary") + btn("uphold", "维持原判");
      else if (ap.state === "upheld") ops = btn("reviewAppeal", "重开复核");
      else if (ap.state === "overturned" && !ap.returnedToEval) ops = btn("returnEval", "回流评测集", "btn-primary");
      body = `<h3>${esc(lex("appeal"))}</h3>
        <div class="kvs one">
          ${kv("状态", `${st(ap.state)} <span class="dim">${esc(path.stateLabels[ap.state] || "")}</span>`)}
          ${ap.sections.map(x => kv(x.label, esc(x.text))).join("")}
          ${kv("复核意见", esc(ap.reviewNote))}
        </div>
        ${ap.returnedToEval
          ? notice("success", `<b>已回流评测集</b>　${esc(path.evalReturnNote)}
              本案的 <code>${esc(sel.decisionRecordId)}</code> 已标记为回归用例。`)
          : ""}
        ${ops ? `<div class="actions">${ops}</div>` : ""}`;
    }
    detail = `<div class="body">
      <div class="kvs">
        ${kv("Subject", `${esc(sel.subject)} <span class="dim">（${esc(sel.subjectType)}）</span>`)}
        ${kv("命中版本", `<code>${esc(sel.ruleVersionId)}</code> ${esc(ruleOf(sel.ruleVersionId) ? ruleOf(sel.ruleVersionId).name : "")}`)}
        ${kv("动作", actionText(sel.actionTier))}
        ${kv("可逆性", revText(sel.actionTier))}
        ${kv("处置状态", esc(sel.status))}
        ${kv("判定记录", `<button class="btn-link" data-act="openRecord" data-arg="${esc(sel.decisionRecordId)}">${esc(sel.decisionRecordId)}</button>`)}
        ${kv("证据", esc(sel.evidence))}
      </div>
      ${body}
    </div>`;
  }

  return `${page({
    title: "案件与申诉", count: list.length,
    desc: `Case 是一次命中形成的处置对象，绑定 Subject。Appeal 状态机
           <code>${APPEAL_STATES.join(" / ")}</code>；申诉表单的段数与字段由皮肤声明，不由组件写死。`,
    actions: canCreate ? btn("createCase", "模拟命中 → 建立案件", "btn-primary") : ""
  })}
    ${canCreate
      ? notice("info", "灰度版本对真实流量生效后，一次命中同时产出 DecisionRecord 与 Case。")
      : (!flowCase() ? notice("warning", "链路案件尚未产生：请先在「发布时间线」把演示版本推进到 partial。") : "")}
    <div class="panel">
      <header><h2>案件清单<span class="sub">Case</span></h2></header>
      <table>
        <thead><tr><th>编号</th><th>Subject</th><th>对象类型</th><th>命中版本</th><th>动作</th><th>申诉</th><th>处置状态</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
    <div class="panel">
      <header><h2>${sel ? esc(sel.subject) : "详情"}<span class="sub">${sel ? esc(sel.id) : ""}</span></h2></header>
      ${detail}
    </div>`;
}

/* --------------------------------------------------------------- 视图 5 */
function viewDecisions() {
  const all = state.data.decisionRecords;
  const subjects = [...new Set(all.map(d => d.subject))];
  const versions = [...new Set(all.map(d => d.ruleVersionId))];
  const rows = all.filter(d =>
    (!state.fSubject || d.subject === state.fSubject) &&
    (!state.fVersion || d.ruleVersionId === state.fVersion));
  const sel = recordById(state.recordId) || rows[0] || all[0] || null;

  const body = rows.map(d => `<tr class="clickable ${sel && d.id === sel.id ? "on" : ""}"
      data-act="openRecord" data-arg="${esc(d.id)}">
      <td class="num"><code>${esc(d.id)}</code></td>
      <td class="num dim">${esc(d.time)}</td>
      <td>${esc(d.subject)}</td>
      <td class="num"><code>${esc(d.ruleVersionId)}</code></td>
      <td>${esc(d.result)}</td>
      <td>${actionText(d.actionTier)}</td>
      <td>${d.returnedToEval ? `<span class="st st-overturned">已回流评测集</span>` : ""}</td>
    </tr>`).join("") || `<tr><td colspan="7"><div class="empty">无匹配记录</div></td></tr>`;

  const audits = state.data.auditEvents.map(e => `<tr>
      <td class="num dim">${esc(e.when)}</td><td class="num">${esc(e.who)}</td><td>${esc(e.what)}</td>
      <td class="dim">${esc(e.before)} → <b>${esc(e.after)}</b></td></tr>`).join("");

  return `${page({
    title: "决策日志",
    desc: `两层留痕，不合并：DecisionRecord 答「这一单当时按哪版规则判的」（高频、按对象），
           AuditEvent 答「谁改了规则」（低频、按人）。合并成一张表会丢掉这两个问题的区分，
           保留策略也无法分别设定。`
  })}
    <div class="panel">
      <header><h2>判定级留痕<span class="sub">DecisionRecord</span></h2></header>
      <div class="toolbar">
        <select data-act="fSubject"><option value="">全部 Subject</option>
          ${subjects.map(x => `<option ${state.fSubject === x ? "selected" : ""}>${esc(x)}</option>`).join("")}</select>
        <select data-act="fVersion"><option value="">全部 RuleVersion</option>
          ${versions.map(x => `<option ${state.fVersion === x ? "selected" : ""}>${esc(x)}</option>`).join("")}</select>
        ${state.fSubject || state.fVersion ? btn("clearFilter", "清除筛选") : ""}
        <span class="count">显示 ${rows.length} / ${all.length} 条</span>
      </div>
      <table>
        <thead><tr><th>记录</th><th>时间</th><th>Subject</th><th>命中版本</th><th>结果</th><th>动作</th><th>标记</th></tr></thead>
        <tbody>${body}</tbody>
      </table>
    </div>
    <div class="cols cols--wide-right">
      <div class="panel">
        <header><h2>单条判定<span class="sub">${sel ? esc(sel.id) : ""}</span></h2></header>
        <div class="body">
          ${sel ? `<div class="kvs one">
              ${kv("命中链", sel.hitChain.map(h => `<code>${esc(h)}</code>`).join(" → "))}
            </div>
            <h3>输入快照</h3>
            <pre>${esc(JSON.stringify({
              输入快照: sel.input, 命中版本: sel.ruleVersionId, 结果: sel.result,
              动作: sel.actionTier, 动作称谓: tierLabel(sel.actionTier),
              时间: sel.time, 回流评测集: !!sel.returnedToEval
            }, null, 2))}</pre>` : `<div class="empty">无记录。</div>`}
        </div>
      </div>
      <div class="panel">
        <header><h2>配置级留痕<span class="sub">AuditEvent</span></h2></header>
        <table><thead><tr><th>时间</th><th>操作人</th><th>改了什么</th><th>前后对比</th></tr></thead>
          <tbody>${audits}</tbody></table>
      </div>
    </div>`;
}

/* ----------------------------------------------------------- 链路动作 */
function setVersionState(next, note) {
  const v = flowVersion(), before = v.state;
  if (!RULE_VERSION_TRANSITIONS[before].includes(next)) {
    alert(`状态机不允许 ${before} → ${next}`);
    return;
  }
  v.state = next;
  mark(next);
  flow().timeline = flow().timeline || [];
  flow().timeline.push({ at: "本地交互", state: next, note });
  audit(`更新 ${v.id}`, before, next);
}

const ACTIONS = {
  goto(arg) { state.view = arg; },

  submitCR() {
    const cr = flowCR();
    cr.state = "in_review"; cr.reviewer = "合成审批者"; cr.note = "已提交，等待审批";
    audit(`提交 ${cr.id}`, "draft", "in_review");
    setVersionState("in_review", "提交变更请求");
    state.view = "变更请求";
  },
  approveCR() {
    const cr = flowCR();
    cr.state = "approved"; cr.note = "已批准，待应用";
    audit(`批准 ${cr.id}`, "in_review", "approved");
    setVersionState("approved", "变更请求批准");
  },
  applyCR() {
    const cr = flowCR(), v = flowVersion();
    cr.state = "applied"; cr.note = "已应用，版本上线至 shadow";
    audit(`应用 ${cr.id}`, "approved", "applied");
    setVersionState("shadow", RULE_VERSION_STATE_NOTES.shadow);
    v.effectiveDate = "本地交互"; v.transition = RULE_VERSION_STATE_NOTES.shadow;
    state.view = "发布时间线";
  },
  toPartial() {
    const v = flowVersion();
    setVersionState("partial", "按范围灰度，放量 10%，护栏监控中");
    v.rollout = 10; v.transition = RULE_VERSION_STATE_NOTES.partial;
  },
  rampUp() {
    const v = flowVersion();
    if (v.rollout >= 30) return;
    const before = v.rollout; v.rollout = 30;
    flow().timeline.push({ at: "本地交互", state: "partial", note: "放量 10% → 30%" });
    audit(`扩量 ${v.id}`, `${before}%`, "30%");
  },
  toActive() {
    const v = flowVersion();
    setVersionState("active", RULE_VERSION_STATE_NOTES.active);
    v.rollout = 100; v.transition = RULE_VERSION_STATE_NOTES.active;
  },
  rollback() {
    const v = flowVersion();
    setVersionState("rolled_back", "误伤率超阈值，护栏自动回滚");
    v.rollout = 0; v.transition = RULE_VERSION_STATE_NOTES.rolled_back;
  },
  reopen() {
    const v = flowVersion();
    setVersionState("draft", "修订后重新起草");
    flowCR().state = "draft"; flowCR().note = "回滚后重新起草";
    v.rollout = 0; v.effectiveDate = "待批准";
    state.view = "规则库";
  },

  createCase() {
    const r = flowRule(), v = r.version;
    const rid = "flow-d01", cid = "flow-case-01";
    state.data.decisionRecords.unshift({
      id: rid, time: "本地交互", subject: `合成${lex("subject")} Flow-01`,
      subjectType: r.subjectType, ruleVersionId: v.id, result: "命中", actionTier: v.actionTier,
      input: { demo_match: true, expression: v.expression, rollout: v.rollout },
      hitChain: [r.id, v.id, `rollout: ${v.rollout}%`]
    });
    state.data.cases.unshift({
      id: cid, subject: `合成${lex("subject")} Flow-01`, subjectType: r.subjectType,
      decisionRecordId: rid, ruleVersionId: v.id, actionTier: v.actionTier,
      evidence: `合成输入快照命中 ${v.expression}`, status: "已处置", appealId: null, isFlow: true
    });
    state.caseId = cid; state.recordId = rid;
    audit(`建立 ${cid}`, "—", `命中 ${v.id}`);
  },
  submitAppeal() {
    const kase = state.data.cases.find(c => c.id === state.caseId);
    const path = skin().appealPath;
    const sections = path.form.map(f => {
      const el = document.querySelector(`[data-field="${f.key}"]`);
      return { label: f.label, text: (el && el.value.trim()) || f.preset };
    });
    const id = `${kase.id}-appeal`;
    state.data.appeals.unshift({
      id, caseId: kase.id, state: "submitted", sections,
      reviewNote: "待复核", returnedToEval: false
    });
    kase.appealId = id;
    audit(`提交 ${id}`, "—", "submitted");
  },
  reviewAppeal() {
    const a = appealOf(state.data.cases.find(c => c.id === state.caseId));
    const before = a.state;
    a.state = "under_review"; a.reviewNote = "人工复核中";
    audit(`复核 ${a.id}`, before, "under_review");
  },
  uphold() {
    const a = appealOf(state.data.cases.find(c => c.id === state.caseId));
    a.state = "upheld"; a.reviewNote = "复核认定原判定成立，维持原处置。";
    audit(`维持 ${a.id}`, "under_review", "upheld");
  },
  overturn() {
    const kase = state.data.cases.find(c => c.id === state.caseId);
    const a = appealOf(kase);
    a.state = "overturned"; a.reviewNote = "复核认定判定依据不成立，推翻原处置。";
    kase.status = "已撤销（申诉推翻）";
    audit(`推翻 ${a.id}`, "under_review", "overturned");
  },
  returnEval() {
    const kase = state.data.cases.find(c => c.id === state.caseId);
    const a = appealOf(kase);
    a.returnedToEval = true;
    const rec = recordById(kase.decisionRecordId);
    if (rec) rec.returnedToEval = true;
    audit(`回流评测集 ${a.id}`, "overturned", "已回流评测集（回归用例）");
  },

  pickRule(arg) { state.ruleId = arg; },
  pickCR(arg)   { state.crId = arg; },
  clearFilter() { state.fSubject = ""; state.fVersion = ""; },
  pickCase(arg) { state.caseId = arg; },
  openRecord(arg) { state.recordId = arg; state.view = "决策日志"; }
};

/* ----------------------------------------------------------- 渲染与事件 */
const RENDERERS = {
  "规则库": viewRules, "变更请求": viewChange, "发布时间线": viewTimeline,
  "案件与申诉": viewCases, "决策日志": viewDecisions
};

let lastView = null;
function render() {
  tabsEl.innerHTML = VIEWS.map(v =>
    `<button class="${v === state.view ? "on" : ""}" data-act="goto" data-arg="${esc(v)}">${esc(v)}</button>`).join("");
  app.innerHTML = RENDERERS[state.view]();
  /* 只在换视图时回到顶部：链路按钮多在下方面板，逐步操作时不该把人弹回页首 */
  if (state.view !== lastView) { window.scrollTo({ top: 0 }); lastView = state.view; }
}

function loadSkin(i) {
  state.skinIndex = i;
  const bad = validateSkin(SKINS[i]);
  document.getElementById("skincheck").innerHTML = bad.length
    ? `皮肤校验未通过：${bad.map(esc).join("；")}`
    : `皮肤校验通过：<b>${esc(SKINS[i].skinName)}</b> 的全部取值都落在内核取值域内
       （RuleVersion ${RULE_VERSION_STATES.length} 态 / Action ${ACTION_TIERS.length} 级 /
       ChangeRequest ${CHANGE_REQUEST_STATES.length} 态 / Appeal ${APPEAL_STATES.length} 态）。`;
  state.data = clone(SKINS[i].sampleData);
  state.view = VIEWS[0];
  state.caseId = null; state.recordId = null;
  state.ruleId = null; state.crId = null;
  state.fSubject = ""; state.fVersion = "";
  render();
}

document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if (!el || el.tagName === "SELECT") return;
  const fn = ACTIONS[el.dataset.act];
  if (!fn) return;
  fn(el.dataset.arg);
  render();
});

document.addEventListener("change", e => {
  const el = e.target;
  if (el === skinSelect) { loadSkin(Number(el.value)); return; }
  if (el.dataset.act === "fSubject") { state.fSubject = el.value; render(); }
  if (el.dataset.act === "fVersion") { state.fVersion = el.value; render(); }
});

skinSelect.innerHTML = SKINS.map((s, i) => `<option value="${i}">${esc(s.skinName)}</option>`).join("");
loadSkin(0);
</script>
