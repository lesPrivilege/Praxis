<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="635" viewBox="0 0 1000 635" role="img"><title>图 16-1 同一业务任务可以跨越五种边界</title><desc>统一入口改变访问方式，不自动合并权威、执行权、合同或运营责任</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#597084"/></marker></defs><rect width="1000" height="635" fill="#f6f8fa" rx="16"/><text x="35" y="46" font-family="Noto Sans CJK SC, sans-serif" font-size="25" fill="#193246" font-weight="700" text-anchor="start"><tspan x="35" dy="0">图 16-1 同一业务任务可以跨越五种边界</tspan></text><text x="35" y="76" font-family="Noto Sans CJK SC, sans-serif" font-size="15" fill="#536778" font-weight="400" text-anchor="start"><tspan x="35" dy="0">统一入口改变访问方式，不自动合并权威、执行权、合同或运营责任</tspan></text><rect x="35" y="115" width="170" height="70" rx="10" fill="#e8f1f5" stroke="#d5dee5" stroke-width="1.5"/><text x="53" y="147" font-family="Noto Sans CJK SC, sans-serif" font-size="19" fill="#193246" font-weight="700" text-anchor="start"><tspan x="53" dy="0">交互入口</tspan></text><rect x="230" y="115" width="370" height="70" rx="10" fill="#fff" stroke="#d5dee5" stroke-width="1.5"/><text x="248" y="147" font-family="Noto Sans CJK SC, sans-serif" font-size="19" fill="#193246" font-weight="700" text-anchor="start"><tspan x="248" dy="0"></tspan></text><text x="245" y="157" font-family="Noto Sans CJK SC, sans-serif" font-size="17" fill="#193246" font-weight="400" text-anchor="start"><tspan x="245" dy="0">采购门户 / 表格 / 对话</tspan></text><path d="M605 150 L642 150" fill="none" stroke="#597084" stroke-width="2" marker-end="url(#a)"/><text x="660" y="157" font-family="Noto Sans CJK SC, sans-serif" font-size="16" fill="#193246" font-weight="400" text-anchor="start"><tspan x="660" dy="0">可以统一展示与导航</tspan></text><rect x="35" y="203" width="170" height="70" rx="10" fill="#e8f1f5" stroke="#d5dee5" stroke-width="1.5"/><text x="53" y="235" font-family="Noto Sans CJK SC, sans-serif" font-size="19" fill="#193246" font-weight="700" text-anchor="start"><tspan x="53" dy="0">正式记录</tspan></text><rect x="230" y="203" width="370" height="70" rx="10" fill="#fff" stroke="#d5dee5" stroke-width="1.5"/><text x="248" y="235" font-family="Noto Sans CJK SC, sans-serif" font-size="19" fill="#193246" font-weight="700" text-anchor="start"><tspan x="248" dy="0"></tspan></text><text x="245" y="245" font-family="Noto Sans CJK SC, sans-serif" font-size="17" fill="#193246" font-weight="400" text-anchor="start"><tspan x="245" dy="0">ERP / 合同档案 / 银行流水</tspan></text><path d="M605 238 L642 238" fill="none" stroke="#597084" stroke-width="2" marker-end="url(#a)"/><text x="660" y="245" font-family="Noto Sans CJK SC, sans-serif" font-size="16" fill="#193246" font-weight="400" text-anchor="start"><tspan x="660" dy="0">各自保留权威对象和版本</tspan></text><rect x="35" y="291" width="170" height="70" rx="10" fill="#e8f1f5" stroke="#d5dee5" stroke-width="1.5"/><text x="53" y="323" font-family="Noto Sans CJK SC, sans-serif" font-size="19" fill="#193246" font-weight="700" text-anchor="start"><tspan x="53" dy="0">行动权</tspan></text><rect x="230" y="291" width="370" height="70" rx="10" fill="#fff" stroke="#d5dee5" stroke-width="1.5"/><text x="248" y="323" font-family="Noto Sans CJK SC, sans-serif" font-size="19" fill="#193246" font-weight="700" text-anchor="start"><tspan x="248" dy="0"></tspan></text><text x="245" y="333" font-family="Noto Sans CJK SC, sans-serif" font-size="17" fill="#193246" font-weight="400" text-anchor="start"><tspan x="245" dy="0">下单 / 批准 / 付款</tspan></text><path d="M605 326 L642 326" fill="none" stroke="#597084" stroke-width="2" marker-end="url(#a)"/><text x="660" y="333" font-family="Noto Sans CJK SC, sans-serif" font-size="16" fill="#193246" font-weight="400" text-anchor="start"><tspan x="660" dy="0">各动作受不同授权约束</tspan></text><rect x="35" y="379" width="170" height="70" rx="10" fill="#e8f1f5" stroke="#d5dee5" stroke-width="1.5"/><text x="53" y="411" font-family="Noto Sans CJK SC, sans-serif" font-size="19" fill="#193246" font-weight="700" text-anchor="start"><tspan x="53" dy="0">合同边界</tspan></text><rect x="230" y="379" width="370" height="70" rx="10" fill="#fff" stroke="#d5dee5" stroke-width="1.5"/><text x="248" y="411" font-family="Noto Sans CJK SC, sans-serif" font-size="19" fill="#193246" font-weight="700" text-anchor="start"><tspan x="248" dy="0"></tspan></text><text x="245" y="421" font-family="Noto Sans CJK SC, sans-serif" font-size="17" fill="#193246" font-weight="400" text-anchor="start"><tspan x="245" dy="0">软件服务 / 供货合同 / 支付服务</tspan></text><path d="M605 414 L642 414" fill="none" stroke="#597084" stroke-width="2" marker-end="url(#a)"/><text x="660" y="421" font-family="Noto Sans CJK SC, sans-serif" font-size="16" fill="#193246" font-weight="400" text-anchor="start"><tspan x="660" dy="0">退出、救济与责任分别约定</tspan></text><rect x="35" y="467" width="170" height="70" rx="10" fill="#e8f1f5" stroke="#d5dee5" stroke-width="1.5"/><text x="53" y="499" font-family="Noto Sans CJK SC, sans-serif" font-size="19" fill="#193246" font-weight="700" text-anchor="start"><tspan x="53" dy="0">运营边界</tspan></text><rect x="230" y="467" width="370" height="70" rx="10" fill="#fff" stroke="#d5dee5" stroke-width="1.5"/><text x="248" y="499" font-family="Noto Sans CJK SC, sans-serif" font-size="19" fill="#193246" font-weight="700" text-anchor="start"><tspan x="248" dy="0"></tspan></text><text x="245" y="509" font-family="Noto Sans CJK SC, sans-serif" font-size="17" fill="#193246" font-weight="400" text-anchor="start"><tspan x="245" dy="0">企业团队 / SaaS 运营方 / 支付机构</tspan></text><path d="M605 502 L642 502" fill="none" stroke="#597084" stroke-width="2" marker-end="url(#a)"/><text x="660" y="509" font-family="Noto Sans CJK SC, sans-serif" font-size="16" fill="#193246" font-weight="400" text-anchor="start"><tspan x="660" dy="0">故障、升级、租户隔离各有负责人</tspan></text><text x="35" y="594" font-family="Noto Sans CJK SC, sans-serif" font-size="18" fill="#193246" font-weight="400" text-anchor="start"><tspan x="35" dy="0">合并或拆分的判断单位，是任务收益、责任衔接、故障范围和退出成本。</tspan></text></svg>