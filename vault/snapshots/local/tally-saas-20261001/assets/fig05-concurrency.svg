<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="610" viewBox="0 0 1000 610" role="img"><title>图 5-1 最后一件库存的两种并发结果</title><desc>合成时序：两个请求各需 1 件；初始可用量为 1；时间自上而下</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#597084"/></marker></defs><rect width="1000" height="610" fill="#f6f8fa" rx="16"/><text x="35" y="46" font-family="Noto Sans CJK SC, sans-serif" font-size="25" fill="#193246" font-weight="700" text-anchor="start"><tspan x="35" dy="0">图 5-1 最后一件库存的两种并发结果</tspan></text><text x="35" y="76" font-family="Noto Sans CJK SC, sans-serif" font-size="15" fill="#536778" font-weight="400" text-anchor="start"><tspan x="35" dy="0">合成时序：两个请求各需 1 件；初始可用量为 1；时间自上而下</tspan></text><rect x="35" y="105" width="440" height="395" rx="10" fill="#fff" stroke="#d5dee5" stroke-width="1.5"/><text x="53" y="137" font-family="Noto Sans CJK SC, sans-serif" font-size="19" fill="#193246" font-weight="700" text-anchor="start"><tspan x="53" dy="0">分离读取与写入</tspan></text><rect x="525" y="105" width="440" height="395" rx="10" fill="#fff" stroke="#d5dee5" stroke-width="1.5"/><text x="543" y="137" font-family="Noto Sans CJK SC, sans-serif" font-size="19" fill="#193246" font-weight="700" text-anchor="start"><tspan x="543" dy="0">原子检查并预留</tspan></text><path d="M95 166 L95 442" stroke="#d5dee5" stroke-width="1.5"/><path d="M360 166 L360 442" stroke="#d5dee5" stroke-width="1.5"/><path d="M585 166 L585 442" stroke="#d5dee5" stroke-width="1.5"/><path d="M850 166 L850 442" stroke="#d5dee5" stroke-width="1.5"/><text x="95" y="159" font-family="Noto Sans CJK SC, sans-serif" font-size="16" fill="#193246" font-weight="400" text-anchor="middle"><tspan x="95" dy="0">请求 A</tspan></text><text x="360" y="159" font-family="Noto Sans CJK SC, sans-serif" font-size="16" fill="#193246" font-weight="400" text-anchor="middle"><tspan x="360" dy="0">请求 B</tspan></text><text x="585" y="159" font-family