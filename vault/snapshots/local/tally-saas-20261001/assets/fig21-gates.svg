<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="660" viewBox="0 0 1000 660" role="img"><title>图 21-1 从试验到迁移的证据关口</title><desc>这是待执行协议，不是已获得实验结果；没有通过关口就不扩大授权</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#597084"/></marker></defs><rect width="1000" height="660" fill="#f6f8fa" rx="16"/><text x="35" y="46" font-family="Noto Sans CJK SC, sans-serif" font-size="25" fill="#193246" font-weight="700" text-anchor="start"><tspan x="35" dy="0">图 21-1 从试验到迁移的证据关口</tspan></text><text x="35" y="76" font-family="Noto Sans CJK SC, sans-serif" font-size="15" fill="#536778" font-weight="400" text-anchor="start"><tspan x="35" dy="0">这是待执行协议，不是已获得实验结果；没有通过关口就不扩大授权</tspan></text><rect x="35" y="115" width="290" height="126" rx="10" fill="#e8f1f5" stroke="#d5dee5" stroke-width="1.5"/><text x="53" y="147" font-family="Noto Sans CJK SC, sans-serif" font-size="19" fill="#193246" font-weight="700" text-anchor="start"><tspan x="53" dy="0">受控测试</tspan></text><text x="53" y="177" font-family="Noto Sans CJK SC, sans-serif" font-size="16" fill="#193246" font-weight="400" text-anchor="start"><tspan x="53" dy="0">正常项、压力项、留出族</tspan><tspan x="53" dy="24.8">公平基线、盲评和消融</tspan></text><rect x="355" y="115" width="290" height="126" rx="10" fill="#e8f1f5" stroke="#d5dee5" stroke-width="1.5"/><text x="373" y="147" font-family="Noto Sans CJK SC, sans-serif" font-size="19" fill="#193246" font-weight="700" text-anchor="start"><tspan x="373" dy="0">影子运行</tspan></text><text x="373" y="177" font-family="Noto Sans CJK SC, sans-serif" font-size="16" fill="#193246" font-weight="400" text-anchor="start"><tspan x="373" dy="0">观察真实分布与遗漏</tspan><tspan x="373" dy="24.8">不以影子建议造成外部动作</tspan></text><rect x="675" y="115" width="290" height="126" rx="10" fill="#e8f1f5" stroke="#d5dee5" stroke-width="1.5"/><text x="693" y="147" font-family="Noto Sans CJK SC, sans-serif" font-size="19" fill="#193246" font-weight="700" text-anchor="start"><tspan x="693" dy="0">限定执行</tspan></text><text x="693" y="177" font-family="Noto Sans CJK SC, sans-serif" font-size="16" fill="#193246" font-weight="400" text-anchor="start"><tspan x="693" dy="0">小范围、明确权限</tspan><tspan x="693" dy="24.8">监测、拥有者与接管能力</tspan></text><path d="M325 175 L355 175" fill="none" stroke="#597084" stroke-width="2" marker-end="url(#a)"/><path d="M645 175 L675 175" fill="none" stroke="#597084" stroke-width="2" marker-end="url(#a)"/><rect x="35" y="290" width="930" height="160" rx="10" fill="#fff" stroke="#d5dee5" stroke-width="1.5"/><text x="53" y="322" font-family="Noto Sans CJK SC, sans-serif" font-size="19" fill="#193246" font-weight="700" text-anchor="start"><tspan x="53" dy="0">每个关口都要回答</tspan></text><text x="53" y="352" font-family="Noto Sans CJK SC, sans-serif" font-size="18" fill="#193246" font-weight="400" text-anchor="start"><tspan x="53" dy="0">能否安全推进，而非只会阻塞？  有权且可完成的任务是否被误拒？</tspan><tspan x="53" dy="27.900000000000002">未知结果能否恢复？  人工监督与异常劳动是否被计入？</tspan><tspan x="53" dy="27.900000000000002">证据是否适用于当前任务分布、模型版本与授权范围？</tspan></text><rect x="35" y="500" width="445" height="109" rx="10" fill="#fff1da" stroke="#d5dee5" stroke-width="1.5"/><text x="53" y="532" font-family="Noto Sans CJK SC, sans-serif" font-size="19" fill="#193246" font-weight="700" text-anchor="start"><tspan x="53" dy="0">证据不足或条件变化</tspan></text><text x="53" y="562" font-family="Noto Sans CJK SC, sans-serif" font-size="16" fill="#193246" font-weight="400" text-anchor="start"><tspan x="53" dy="0">保留原方式，缩小范围或重做测试</tspan><tspan x="53" dy="24.8">“暂无结论”是允许的结果。</tspan></text><rect x="520" y="500" width="445" height="109" rx="10" fill="#fff" stroke="#d5dee5" stroke-width="1.5"/><text x="538" y="532" font-family="Noto Sans CJK SC, sans-serif" font-size="19" fill="#193246" font-weight="700" text-anchor="start"><tspan x="538" dy="0">故障与退出</tspan></text><text x="538" y="562" font-family="Noto Sans CJK SC, sans-serif" font-size="16" fill="#193246" font-weight="400" text-anchor="start"><tspan x="538" dy="0">回退控制未来动作；补救既成后果</tspan><tspan x="538" dy="24.8">软件回滚不撤销已经发生的外部效果。</tspan></text></svg>