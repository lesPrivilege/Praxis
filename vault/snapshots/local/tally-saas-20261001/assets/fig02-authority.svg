<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" role="img"><title>图 2-1 主张如何成为可行动的权威状态</title><desc>合成案例：发票、正式验收、内部批准和银行结果分别由各自契约决定</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#597084"/></marker></defs><rect width="1000" height="640" fill="#f6f8fa" rx="16"/><text x="35" y="46" font-family="Noto Sans CJK SC, sans-serif" font-size="25" fill="#193246" font-weight="700" text-anchor="start"><tspan x="35" dy="0">图 2-1 主张如何成为可行动的权威状态</tspan></text><text x="35" y="76" font-family="Noto Sans CJK SC, sans-serif" font-size="15" fill="#536778" font-weight="400" text-anchor="start"><tspan x="35" dy="0">合成案例：发票、正式验收、内部批准和银行结果分别由各自契约决定</tspan></text><rect x="35" y="112" width="275" height="132" rx="10" fill="#fff" stroke="#d5dee5" stroke-width="1.5"/><text x="53" y="144" font-family="Noto Sans CJK SC, sans-serif" font-size="19" fill="#193246" font-weight="700" text-anchor="start"><tspan x="53" dy="0">观察与主张</tspan></text><text x="53" y="174" font-family="Noto Sans CJK SC, sans-serif" font-size="17" fill="#193246" font-weight="400" text-anchor="start"><tspan x="53" dy="0">发票 INV-17：主张 10 件</tspan><tspan x="53" dy="26.35">仓库记录：正式验收 8 件</tspan><tspan x="53" dy="26.35">邮件：声称“其余已到”</tspan></text><rect x="365" y="112" width="270" height="132" rx="10" fill="#e8f1f5" stroke="#d5dee5" stroke-width="1.5"/><text x="383" y="144" font-family="Noto Sans CJK SC, sans-serif" font-size="19" fill="#193246" font-weight="700" text-anchor="start"><tspan x="383" dy="0">证据与采纳程序</tspan></text><text x="383" y="174" font-family="Noto Sans CJK SC, sans-serif" font-size="17" fill="#193246" font-weight="400" text-anchor="start"><tspan x="383" dy="0">检查来源、对象、版本</tspan><tspan x="383" dy="26.35">由有权主体核验和确认</tspan><tspan x="383" dy="26.35">冲突保留异议与更正路径</tspan></text><rect x="690" y="112" width="275" height="132" rx="10" fill="#fff" stroke="#d5dee5" stroke-width="1.5"/><text x="708" y="144" font-family="Noto Sans CJK SC, sans-serif" font-size="19" fill="#193246" font-weight="700" text-anchor="start"><tspan x="708" dy="0">正式验收状态</tspan></text><text x="708" y="174" font-family="Noto Sans CJK SC, sans-serif" font-size="17" fill="#193246" font-weight="400" text-anchor="start"><tspan x="708" dy="0">本例仍为 8 件</tspan><tspan x="708" dy="26.35">邮件不自行升级为验收</tspan><tspan x="708" dy="26.35">采纳后可成为权威记录</tspan></text><path d="M310 177 L365 177" fill="none" stroke="#597084" stroke-width="2" marker-end="url(#a)"/><path d="M635 177 L690 177" fill="none" stroke="#597084" stroke-width="2" marker-end="url(#a)"/><rect x="35" y="305" width="275" height="132" rx="10" fill="#fff" stroke="#d5dee5" stroke-width="1.5"/><text x="53" y="337" font-family="Noto Sans CJK SC, sans-serif" font-size="19" fill="#193246" font-weight="700" text-anchor="start"><tspan x="53" dy="0">内部付款批准</tspan></text><text x="53" y="367" font-family="Noto Sans CJK SC, sans-serif" font-size="17" fill="#193246" font-weight="400" text-anchor="start"><tspan x="53" dy="0">按合同可部分付款</tspan><tspan x="53" dy="26.35">额度问题解决后批准 800</tspan><tspan x="53" dy="26.35">绑定金额、受益人和版本</tspan></text><rect x="365" y="305" width="270" height="132" rx="10" fill="#fff1da" stroke="#d5dee5" stroke-width="1.5"/><text x="383" y="337" font-family="Noto Sans CJK SC, sans-serif" font-size="19" fill="#193246" font-weight="700" text-anchor="start"><tspan x="383" dy="0">执行与外部结果</tspan></text><text x="383" y="367" font-family="Noto Sans CJK SC, sans-serif" font-size="17" fill="#193246" font-weight="400" text-anchor="start"><tspan x="383" dy="0">发送支付请求</tspan><tspan x="383" dy="26.35">回执丢失 → 结果未知</tspan><tspan x="383" dy="26.35">查询与对账后再定状态</tspan></text><rect x="690" y="305" width="275" height="132" rx="10" fill="#fff" stroke="#d5dee5" stroke-width="1.5"/><text x="708" y="337" font-family="Noto Sans CJK SC, sans-serif" font-size="19" fill="#193246" font-weight="700" text-anchor="start"><tspan x="708" dy="0">各域仍有独立边界</tspan></text><text x="708" y="367" font-family="Noto Sans CJK SC, sans-serif" font-size="17" fill="#193246" font-weight="400" text-anchor="start"><tspan x="708" dy="0">批准不等于银行付款</tspan><tspan x="708" dy="26.35">受理不等于最终结算</tspan><tspan x="708" dy="26.35">数据库提交不等于到货</tspan></text><path d="M827 244 L827 274 L170 274 L170 305" fill="none" stroke="#597084" stroke-width="2" marker-end="url(#a)"/><text x="500" y="265" font-family="Noto Sans CJK SC, sans-serif" font-size="14" fill="#193246" font-weight="400" text-anchor="middle"><tspan x="500" dy="0">合同与授权条件</tspan></text><path d="M310 370 L365 370" fill="none" stroke="#597084" stroke-width="2" marker-end="url(#a)"/><path d="M635 370 L690 370" fill="none" stroke="#597084" stroke-width="2" marker-end="url(#a)"/><rect x="35" y="483" width="930" height="112" rx="10" fill="#edf5ee" stroke="#d5dee5" stroke-width="1.5"/><text x="53" y="515" font-family="Noto Sans CJK SC, sans-serif" font-size="19" fill="#193246" font-weight="700" text-anchor="start"><tspan x="53" dy="0">解释边界</tspan></text><text x="53" y="545" font-family="Noto Sans CJK SC, sans-serif" font-size="17" fill="#193246" font-weight="400" text-anchor="start"><tspan x="53" dy="0">本图不主张记录永远只是意见。合格主体按制度完成登记、批准或裁决，</tspan><tspan x="53" dy="26.35">可能直接改变制度状态；其效力来自证据、程序与授权，而非写入动作本身。</tspan></text></svg>