<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img"><title>图 13-1 委托之后哪些职责仍需交接</title><desc>把机器处理更多项目，与人是否能及时判断和接管分别评价</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#597084"/></marker></defs><rect width="1000" height="600" fill="#f6f8fa" rx="16"/><text x="35" y="46" font-family="Noto Sans CJK SC, sans-serif" font-size="25" fill="#193246" font-weight="700" text-anchor="start"><tspan x="35" dy="0">图 13-1 委托之后哪些职责仍需交接</tspan></text><text x="35" y="76" font-family="Noto Sans CJK SC, sans-serif" font-size="15" fill="#536778" font-weight="400" text-anchor="start"><tspan x="35" dy="0">把机器处理更多项目，与人是否能及时判断和接管分别评价</tspan></text><rect x="35" y="110" width="190" height="55" rx="10" fill="#e8f1f5" stroke="#d5dee5" stroke-width="1.5"/><text x="53" y="142" font-family="Noto Sans CJK SC, sans-serif" font-size="19" fill="#193246" font-weight="700" text-anchor="start"><tspan x="53" dy="0">环节</tspan></text><rect x="245" y="110" width="320" height="55" rx="10" fill="#e8f1f5" stroke="#d5dee5" stroke-width="1.5"/><text x="263" y="142" font-family="Noto Sans CJK SC, sans-serif" font-size="19" fill="#193246" font-weight="700" text-anchor="start"><tspan x="263" dy="0">可由机器承担的劳动</tspan></text><rect x="585" y="110" width="380" height="55" rx="10" fill="#e8f1f5" stroke="#d5dee5" stroke-width="1.5"/><text x="603" y="142" font-family="Noto Sans CJK SC, sans-serif" font-size="19" fill="#193246" font-weight="700" text-anchor="start"><tspan x="603" dy="0">仍须明确的责任与证据</tspan></text><rect x="35" y="183" width="190" height="66" rx="10" fill="#fff" stroke="#d5dee5" stroke-width="1.5"/><text x="53" y="215" font-family="Noto Sans CJK SC, sans-serif" font-size="19" fill="#193246" font-weight="700" text-anchor="start"><tspan x="53" dy="0"></tspan></text><text x="48" y="223" font-family="Noto Sans CJK SC, sans-serif" font-size="15" fill="#193246" font-weight="400" text-anchor="start"><tspan x="48" dy="0">整理与提示</tspan></text><rect x="245" y="183" width="320" height="66" rx="10" fill="#fff" stroke="#d5dee5" stroke-width="1.5"/><text x="263" y="215" font-family="Noto Sans CJK SC, sans-serif" font-size="19" fill="#193246" font-weight="700" text-anchor="start"><tspan x="263" dy="0"></tspan></text><text x="258" y="223" font-family="Noto Sans CJK SC, sans-serif" font-size="15" fill="#193246" font-weight="400" text-anchor="start"><tspan x="258" dy="0">检索、提取、聚合和差异提示</tspan></text><rect x="585" y="183" width="380" height="66" rx="10" fill="#fff" stroke="#d5dee5" stroke-width="1.5"/><text x="603" y="215" font-family="Noto Sans CJK SC, sans-serif" font-size="19" fill="#193246" font-weight="700" text-anchor="start"><tspan x="603" dy="0"></tspan></text><text x="598" y="223" font-family="Noto Sans CJK SC, sans-serif" font-size="15" fill="#193246" font-weight="400" text-anchor="start"><tspan x="598" dy="0">来源、缺口、优先级和遗漏责任</tspan></text><rect x="35" y="262" width="190" height="66" rx="10" fill="#fff" stroke="#d5dee5" stroke-width="1.5"/><text x="53" y="294" font-family="Noto Sans CJK SC, sans-serif" font-size="19" fill="#193246" font-weight="700" text-anchor="start"><tspan x="53" dy="0"></tspan></text><text x="48" y="302" font-family="Noto Sans CJK SC, sans-serif" font-size="15" fill="#193246" font-weight="400" text-anchor="start"><tspan x="48" dy="0">判断与授权</tspan></text><rect x="245" y="262" width="320" height="66" rx="10" fill="#fff" stroke="#d5dee5" stroke-width="1.5"/><text x="263" y="294" font-family="Noto Sans CJK SC, sans-serif" font-size="19" fill="#193246" font-weight="700" text-anchor="start"><tspan x="263" dy="0"></tspan></text><text x="258" y="302" font-family="Noto Sans CJK SC, sans-serif" font-size="15" fill="#193246" font-weight="400" text-anchor="start"><tspan x="258" dy="0">形成方案或在限定范围内选择</tspan></text><rect x="585" y="262" width="380" height="66" rx="10" fill="#fff" stroke="#d5dee5" stroke-width="1.5"/><text x="603" y="294" font-family="Noto Sans CJK SC, sans-serif" font-size="19" fill="#193246" font-weight="700" text-anchor="start"><tspan x="603" dy="0"></tspan></text><text x="598" y="302" font-family="Noto Sans CJK SC, sans-serif" font-size="15" fill="#193246" font-weight="400" text-anchor="start"><tspan x="598" dy="0">授权主体、范围、有效期与拒绝依据</tspan></text><rect x="35" y="341" width="190" height="66" rx="10" fill="#fff" stroke="#d5dee5" stroke-width="1.5"/><text x="53" y="373" font-family="Noto Sans CJK SC, sans-serif" font-size="19" fill="#193246" font-weight="700" text-anchor="start"><tspan x="53" dy="0"></tspan></text><text x="48" y="381" font-family="Noto Sans CJK SC, sans-serif" font-size="15" fill="#193246" font-weight="400" text-anchor="start"><tspan x="48" dy="0">执行与监测</tspan></text><rect x="245" y="341" width="320" height="66" rx="10" fill="#fff" stroke="#d5dee5" stroke-width="1.5"/><text x="263" y="373" font-family="Noto Sans CJK SC, sans-serif" font-size="19" fill="#193246" font-weight="700" text-anchor="start"><tspan x="263" dy="0"></tspan></text><text x="258" y="381" font-family="Noto Sans CJK SC, sans-serif" font-size="15" fill="#193246" font-weight="400" text-anchor="start"><tspan x="258" dy="0">调用工具、追踪状态、发现偏离</tspan></text><rect x="585" y="341" width="380" height="66" rx="10" fill="#fff" stroke="#d5dee5" stroke-width="1.5"/><text x="603" y="373" font-family="Noto Sans CJK SC, sans-serif" font-size="19" fill="#193246" font-weight="700" text-anchor="start"><tspan x="603" dy="0"></tspan></text><text x="598" y="381" font-family="Noto Sans CJK SC, sans-serif" font-size="15" fill="#193246" font-weight="400" text-anchor="start"><tspan x="598" dy="0">副作用、未知结果、升级时限</tspan></text><rect x="35" y="420" width="190" height="66" rx="10" fill="#fff" stroke="#d5dee5" stroke-width="1.5"/><text x="53" y="452" font-family="Noto Sans CJK SC, sans-serif" font-size="19" fill="#193246" font-weight="700" text-anchor="start"><tspan x="53" dy="0"></tspan></text><text x="48" y="460" font-family="Noto Sans CJK SC, sans-serif" font-size="15" fill="#193246" font-weight="400" text-anchor="start"><tspan x="48" dy="0">接管与恢复</tspan></text><rect x="245" y="420" width="320" height="66" rx="10" fill="#fff" stroke="#d5dee5" stroke-width="1.5"/><text x="263" y="452" font-family="Noto Sans CJK SC, sans-serif" font-size="19" fill="#193246" font-weight="700" text-anchor="start"><tspan x="263" dy="0"></tspan></text><text x="258" y="460" font-family="Noto Sans CJK SC, sans-serif" font-size="15" fill="#193246" font-weight="400" text-anchor="start"><tspan x="258" dy="0">汇总轨迹、准备可行恢复步骤</tspan></text><rect x="585" y="420" width="380" height="66" rx="10" fill="#fff" stroke="#d5dee5" stroke-width="1.5"/><text x="603" y="452" font-family="Noto Sans CJK SC, sans-serif" font-size="19" fill="#193246" font-weight="700" text-anchor="start"><tspan x="603" dy="0"></tspan></text><text x="598" y="460" font-family="Noto Sans CJK SC, sans-serif" font-size="15" fill="#193246" font-weight="400" text-anchor="start"><tspan x="598" dy="0">可接管的人、可用上下文与外部后果</tspan></text><text x="35" y="540" font-family="Noto Sans CJK SC, sans-serif" font-size="18" fill="#193246" font-weight="400" text-anchor="start"><tspan x="35" dy="0">审阅次数、审阅时间、判断准确性、误拒和事故恢复共同构成注意力成本。</tspan></text></svg>