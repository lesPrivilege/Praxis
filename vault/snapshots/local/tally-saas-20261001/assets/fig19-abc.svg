<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650" role="img"><title>图 19-1 A/B/C 改变什么 保持什么</title><desc>同一后端、同一任务、同一控制；禁止用削弱的传统基线制造优势</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#597084"/></marker></defs><rect width="1000" height="650" fill="#f6f8fa" rx="16"/><text x="35" y="46" font-family="Noto Sans CJK SC, sans-serif" font-size="25" fill="#193246" font-weight="700" text-anchor="start"><tspan x="35" dy="0">图 19-1 A/B/C 改变什么 保持什么</tspan></text><text x="35" y="76" font-family="Noto Sans CJK SC, sans-serif" font-size="15" fill="#536778" font-weight="400" text-anchor="start"><tspan x="35" dy="0">同一后端、同一任务、同一控制；禁止用削弱的传统基线制造优势</tspan></text><rect x="35" y="112" width="290" height="178" rx="10" fill="#e8f1f5" stroke="#d5dee5" stroke-width="1.5"/><text x="53" y="144" font-family="Noto Sans CJK SC, sans-serif" font-size="19" fill="#193246" font-weight="700" text-anchor="start"><tspan x="53" dy="0">A 现代传统 SaaS</tspan></text><text x="53" y="174" font-family="Noto Sans CJK SC, sans-serif" font-size="16" fill="#193246" font-weight="400" text-anchor="start"><tspan x="53" dy="0">结构化输入、规则与 API</tspan><tspan x="53" dy="24.8">确定性自动化与异常队列</tspan><tspan x="53" dy="24.8">既定路径由系统执行</tspan></text><rect x="355" y="112" width="290" height="178" rx="10" fill="#e8f1f5" stroke="#d5dee5" stroke-width="1.5"/><text x="373" y="144" font-family="Noto Sans CJK SC, sans-serif" font-size="19" fill="#193246" font-weight="700" text-anchor="start"><tspan x="373" dy="0">B Copilot</tspan></text><text x="373" y="174" font-family="Noto Sans CJK SC, sans-serif" font-size="16" fill="#193246" font-weight="400" text-anchor="start"><tspan x="373" dy="0">解释材料、提出候选动作</tspan><tspan x="373" dy="24.8">人审查并决定批准与执行</tspan><tspan x="373" dy="24.8">记录采纳与改写的建议</tspan></text><rect x="675" y="112" width="290" height="178" rx="10" fill="#e8f1f5" stroke="#d5dee5" stroke-width="1.5"/><text x="693" y="144" font-family="Noto Sans CJK SC, sans-serif" font-size="19" fill="#193246" font-weight="700" text-anchor="start"><tspan x="693" dy="0">C 受限 Agent</tspan></text><text x="693" y="174" font-family="Noto Sans CJK SC, sans-serif" font-size="16" fill="#193246" font-weight="400" text-anchor="start"><tspan x="693" dy="0">解释、选择与调用工具</tspan><tspan x="693" dy="24.8">仅在已授范围内自主行动</tspan><tspan x="693" dy="24.8">越界停止；未知转入恢复</tspan></text><path d="M180 290 L180 330" fill="none" stroke="#597084" stroke-width="2" marker-end="url(#a)"/><path d="M500 290 L500 330" fill="none" stroke="#597084" stroke-width="2" marker-end="url(#a)"/><path d="M820 290 L820 330" fill="none" stroke="#597084" stroke-width="2" marker-end="url(#a)"/><rect x="35" y="330" width="930" height="135" rx="10" fill="#fff" stroke="#d5dee5" stroke-width="1.5"/><text x="53" y="362" font-family="Noto Sans CJK SC, sans-serif" font-size="19" fill="#193246" font-weight="700" text-anchor="start"><tspan x="53" dy="0">三组共有的验收底座</tspan></text><text x="53" y="392" font-family="Noto Sans CJK SC, sans-serif" font-size="17" fill="#193246" font-weight="400" text-anchor="start"><tspan x="53" dy="0">实体与发票识别、8 件正式验收、部分付款合同、额度控制、对象绑定批准、</tspan><tspan x="53" dy="26.35">相同支付接口与幂等契约、未知结果恢复、最终对账、申诉与合法例外路径。</tspan></text><rect x="35" y="501" width="930" height="103" rx="10" fill="#edf5ee" stroke="#d5dee5" stroke-width="1.5"/><text x="53" y="533" font-family="Noto Sans CJK SC, sans-serif" font-size="19" fill="#193246" font-weight="700" text-anchor="start"><tspan x="53" dy="0">完整评价</tspan></text><text x="53" y="563" font-family="Noto Sans CJK SC, sans-serif" font-size="17" fill="#193246" font-weight="400" text-anchor="start"><tspan x="53" dy="0">安全和正确性是门槛；进展、误拒、恢复、人工劳动与全生命周期成本同时报告。</tspan></text></svg>