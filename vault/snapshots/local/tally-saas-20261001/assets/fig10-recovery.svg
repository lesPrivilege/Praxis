<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650" role="img"><title>图 10-1 支付结果未知时怎样继续</title><desc>未知是一种需要调查的状态；不能把网络超时直接写成“未付款”</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#597084"/></marker></defs><rect width="1000" height="650" fill="#f6f8fa" rx="16"/><text x="35" y="46" font-family="Noto Sans CJK SC, sans-serif" font-size="25" fill="#193246" font-weight="700" text-anchor="start"><tspan x="35" dy="0">图 10-1 支付结果未知时怎样继续</tspan></text><text x="35" y="76" font-family="Noto Sans CJK SC, sans-serif" font-size="15" fill="#536778" font-weight="400" text-anchor="start"><tspan x="35" dy="0">未知是一种需要调查的状态；不能把网络超时直接写成“未付款”</tspan></text><rect x="35" y="112" width="275" height="110" rx="10" fill="#fff" stroke="#d5dee5" stroke-width="1.5"/><text x="53" y="144" font-family="Noto Sans CJK SC, sans-serif" font-size="19" fill="#193246" font-weight="700" text-anchor="start"><tspan x="53" dy="0">已批准的支付意图</tspan></text><text x="53" y="174" font-family="Noto Sans CJK SC, sans-serif" font-size="17" fill="#193246" font-weight="400" text-anchor="start"><tspan x="53" dy="0">金额 800、受益人、版本</tspan><tspan x="53" dy="26.35">固定业务幂等键</tspan></text><rect x="365" y="112" width="270" height="110" rx="10" fill="#fff1da" stroke="#d5dee5" stroke-width="1.5"/><text x="383" y="144" font-family="Noto Sans CJK SC, sans-serif" font-size="19" fill="#193246" font-weight="700" text-anchor="start"><tspan x="383" dy="0">请求已发送</tspan></text><text x="383" y="174" font-family="Noto Sans CJK SC, sans-serif" font-size="17" fill="#193246" font-weight="400" text-anchor="start"><tspan x="383" dy="0">支付端可能已经接收</tspan><tspan x="383" dy="26.35">回执在网络中丢失</tspan></text><rect x="690" y="112" width="275" height="110" rx="10" fill="#fff1da" stroke="#d5dee5" stroke-width="1.5"/><text x="708" y="144" font-family="Noto Sans CJK SC, sans-serif" font-size="19" fill="#193246" font-weight="700" text-anchor="start"><tspan x="708" dy="0">结果未知</tspan></text><text x="708" y="174" font-family="Noto Sans CJK SC, sans-serif" font-size="17" fill="#193246" font-weight="400" text-anchor="start"><tspan x="708" dy="0">暂停依赖付款结果的动作</tspan><tspan x="708" dy="26.35">保留拥有者和调查时限</tspan></text><path d="M310 167 L365 167" fill="none" stroke="#597084" stroke-width="2" marker-end="url(#a)"/><path d="M635 167 L690 167" fill="none" stroke="#597084" stroke-width="2" marker-end="url(#a)"/><rect x="690" y="286" width="275" height="120" rx="10" fill="#fff" stroke="#d5dee5" stroke-width="1.5"/><text x="708" y="318" font-family="Noto Sans CJK SC, sans-serif" font-size="19" fill="#193246" font-weight="700" text-anchor="start"><tspan x="708" dy="0">查询与对账</tspan></text><text x="708" y="348" font-family="Noto Sans CJK SC, sans-serif" font-size="17" fill="#193246" font-weight="400" text-anchor="start"><tspan x="708" dy="0">查同一支付意图的状态</tspan><tspan x="708" dy="26.35">按接口契约同键重试</tspan><tspan x="708" dy="26.35">不生成新标识盲目再付</tspan></text><path d="M827 222 L827 286" fill="none" stroke="#597084" stroke-width="2" marker-end="url(#a)"/><rect x="35" y="470" width="270" height="115" rx="10" fill="#edf5ee" stroke="#d5dee5" stroke-width="1.5"/><text x="53" y="502" font-family="Noto Sans CJK SC, sans-serif" font-size="19" fill="#193246" font-weight="700" text-anchor="start"><tspan x="53" dy="0">确认成功或最终结算</tspan></text><text x="53" y="532" font-family="Noto Sans CJK SC, sans-serif" font-size="17" fill="#193246" font-weight="400" text-anchor="start"><tspan x="53" dy="0">取得相应阶段的外部证据</tspan><tspan x="53" dy="26.35">对账后更新本地状态</tspan></text><rect x="365" y="470" width="270" height="115" rx="10" fill="#fff" stroke="#d5dee5" stroke-width="1.5"/><text x="383" y="502" font-family="Noto Sans CJK SC, sans-serif" font-size="19" fill="#193246" font-weight="700" text-anchor="start"><tspan x="383" dy="0">确认失败</tspan></text><text x="383" y="532" font-family="Noto Sans CJK SC, sans-serif" font-size="17" fill="#193246" font-weight="400" text-anchor="start"><tspan x="383" dy="0">有外部失败证据</tspan><tspan x="383" dy="26.35">按授权规则修复或重提</tspan></text><rect x="695" y="470" width="270" height="115" rx="10" fill="#fff1da" stroke="#d5dee5" stroke-width="1.5"/><text x="713" y="502" font-family="Noto Sans CJK SC, sans-serif" font-size="19" fill="#193246" font-weight="700" text-anchor="start"><tspan x="713" dy="0">仍然未知</tspan></text><text x="713" y="532" font-family="Noto Sans CJK SC, sans-serif" font-size="17" fill="#193246" font-weight="400" text-anchor="start"><tspan x="713" dy="0">继续调查或人工升级</tspan><tspan x="713" dy="26.35">不能伪造终局</tspan></text><path d="M780 406 L170 470" fill="none" stroke="#597084" stroke-width="2" marker-end="url(#a)"/><path d="M820 406 L500 470" fill="none" stroke="#597084" stroke-width="2" marker-end="url(#a)"/><path d="M860 406 L830 470" fill="none" stroke="#597084" stroke-width="2" marker-end="url(#a)"/></svg>