<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650" role="img"><title>图 3-1 组织约束怎样进入软件设计</title><desc>箭头表示约束与反馈；不表示唯一实现，也不是把概念相加得到定理</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#597084"/></marker></defs><rect width="1000" height="650" fill="#f6f8fa" rx="16"/><text x="35" y="46" font-family="Noto Sans CJK SC, sans-serif" font-size="25" fill="#193246" font-weight="700" text-anchor="start"><tspan x="35" dy="0">图 3-1 组织约束怎样进入软件设计</tspan></text><text x="35" y="76" font-family="Noto Sans CJK SC, sans-serif" font-size="15" fill="#536778" font-weight="400" text-anchor="start"><tspan x="35" dy="0">箭头表示约束与反馈；不表示唯一实现，也不是把概念相加得到定理</tspan></text><rect x="35" y="112" width="170" height="105" rx="10" fill="#e8f1f5" stroke="#d5dee5" stroke-width="1.5"/><text x="53" y="144" font-family="Noto Sans CJK SC, sans-serif" font-size="19" fill="#193246" font-weight="700" text-anchor="start"><tspan x="53" dy="0">资源</tspan></text><text x="53" y="174" font-family="Noto Sans CJK SC, sans-serif" font-size="14" fill="#193246" font-weight="400" text-anchor="start"><tspan x="53" dy="0">数量、排他与稀缺</tspan></text><path d="M120 217 L120 267" fill="none" stroke="#597084" stroke-width="2" marker-end="url(#a)"/><rect x="225" y="112" width="170" height="105" rx="10" fill="#e8f1f5" stroke="#d5dee5" stroke-width="1.5"/><text x="243" y="144" font-family="Noto Sans CJK SC, sans-serif" font-size="19" fill="#193246" font-weight="700" text-anchor="start"><tspan x="243" dy="0">依赖</tspan></text><text x="243" y="174" font-family="Noto Sans CJK SC, sans-serif" font-size="14" fill="#193246" font-weight="400" text-anchor="start"><tspan x="243" dy="0">先后、等待与时限</tspan></text><path d="M310 217 L310 267" fill="none" stroke="#597084" stroke-width="2" marker-end="url(#a)"/><rect x="415" y="112" width="170" height="105" rx="10" fill="#e8f1f5" stroke="#d5dee5" stroke-width="1.5"/><text x="433" y="144" font-family="Noto Sans CJK SC, sans-serif" font-size="19" fill="#193246" font-weight="700" text-anchor="start"><tspan x="433" dy="0">权力</tspan></text><text x="433" y="174" font-family="Noto Sans CJK SC, sans-serif" font-size="14" fill="#193246" font-weight="400" text-anchor="start"><tspan x="433" dy="0">制定、授权与裁决</tspan></text><path d="M500 217 L500 267" fill="none" stroke="#597084" stroke-width="2" marker-end="url(#a)"/><rect x="605" y="112" width="170" height="105" rx="10" fill="#e8f1f5" stroke="#d5dee5" stroke-width="1.5"/><text x="623" y="144" font-family="Noto Sans CJK SC, sans-serif" font-size="19" fill="#193246" font-weight="700" text-anchor="start"><tspan x="623" dy="0">承诺</tspan></text><text x="623" y="174" font-family="Noto Sans CJK SC, sans-serif" font-size="14" fill="#193246" font-weight="400" text-anchor="start"><tspan x="623" dy="0">对象、条件与接受</tspan></text><path d="M690 217 L690 267" fill="none" stroke="#597084" stroke-width="2" marker-end="url(#a)"/><rect x="795" y="112" width="170" height="105" rx="10" fill="#e8f1f5" stroke="#d5dee5" stroke-width="1.5"/><text x="813" y="144" font-family="Noto Sans CJK SC, sans-serif" font-size="19" fill="#193246" font-weight="700" text-anchor="start"><tspan x="813" dy="0">证据</tspan></text><text x="813" y="174" font-family="Noto Sans CJK SC, sans-serif" font-size="14" fill="#193246" font-weight="400" text-anchor="start"><tspan x="813" dy="0">来源、版本与争议</tspan></text><path d="M880 217 L880 267" fill="none" stroke="#597084" stroke-width="2" marker-end="url(#a)"/><rect x="35" y="267" width="930" height="102" rx="10" fill="#fff" stroke="#d5dee5" stroke-width="1.5"/><text x="53" y="299" font-family="Noto Sans CJK SC, sans-serif" font-size="19" fill="#193246" font-weight="700" text-anchor="start"><tspan x="53" dy="0">任务问题</tspan></text><text x="53" y="329" font-family="Noto Sans CJK SC, sans-serif" font-size="17" fill="#193246" font-weight="400" text-anchor="start"><tspan x="53" dy="0">谁在谈什么；谁可改变什么；什么算完成；出现冲突、未知结果或损失时怎样继续。</tspan></text><path d="M500 369 L500 407" fill="none" stroke="#597084" stroke-width="2" marker-end="url(#a)"/><rect x="35" y="407" width="445" height="110" rx="10" fill="#fff" stroke="#d5dee5" stroke-width="1.5"/><text x="53" y="439" font-family="Noto Sans CJK SC, sans-serif" font-size="19" fill="#193246" font-weight="700" text-anchor="start"><tspan x="53" dy="0">可比较的实现</tspan></text><text x="53" y="469" font-family="Noto Sans CJK SC, sans-serif" font-size="17" fill="#193246" font-weight="400" text-anchor="start"><tspan x="53" dy="0">关系表、文档、事件、事务、规则与队列</tspan><tspan x="53" dy="26.35">满足同一要求可以有多种组合。</tspan></text><rect x="520" y="407" width="445" height="110" rx="10" fill="#fff" stroke="#d5dee5" stroke-width="1.5"/><text x="538" y="439" font-family="Noto Sans CJK SC, sans-serif" font-size="19" fill="#193246" font-weight="700" text-anchor="start"><tspan x="538" dy="0">人机接面与组织安排</tspan></text><text x="538" y="469" font-family="Noto Sans CJK SC, sans-serif" font-size="17" fill="#193246" font-weight="400" text-anchor="start"><tspan x="538" dy="0">表单、表格、对话、审阅、申诉与接管</tspan><tspan x="538" dy="26.35">改变观察方式，也可能改变职责分工。</tspan></text><path d="M480 463 L520 463" fill="none" stroke="#597084" stroke-width="2" marker-end="url(#a)"/><text x="35" y="562" font-family="Noto Sans CJK SC, sans-serif" font-size="18" fill="#193246" font-weight="400" text-anchor="start"><tspan x="35" dy="0">成本归属：实施、学习、监督、异常、审计与退出，由具体参与者承担。</tspan></text><text x="35" y="597" font-family="Noto Sans CJK SC, sans-serif" font-size="18" fill="#536778" font-weight="400" text-anchor="start"><tspan x="35" dy="0">反馈：价格与合约会反过来影响边界、规则和实现选择。</tspan></text></svg>