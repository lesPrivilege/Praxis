<div class="dw-scroll" style="--dw-min:640px;--dw-max:960px">
<svg viewBox="0 0 880 220" role="img" aria-labelledby="v13-order-t v13-order-d">
  <title id="v13-order-t">免赔与限额的先后</title>
  <desc id="v13-order-d">损失 6,000 时两种顺序都得 5,500。损失 10,000 时，先扣免赔 500、后受限额 8,000 约束，得 8,000；先取限额再扣免赔，得 7,500。</desc>
  <text class="t-s mid" x="205" y="30">免赔 500</text>
  <path class="ln-soft" d="M220 36 V200"/>
  <g data-s="1">
    <text class="t-b end" x="180" y="64">损失 6,000</text><text class="t-s end" x="180" y="80">两种顺序</text>
    <rect class="box f3" x="190" y="50" width="30" height="32"/>
    <rect class="box f2" x="220" y="50" width="330" height="32"/>
    <text class="t-s mid" x="385" y="70">6,000 − 500</text>
    <text class="t-n" x="806" y="71">5,500</text>
  </g>
  <g data-s="2">
    <text class="t-b end" x="180" y="124">损失 10,000</text><text class="t-s end" x="180" y="140">先扣免赔、后限额</text>
    <rect class="box" x="190" y="110" width="600" height="32"/>
    <rect class="box f3" x="190" y="110" width="30" height="32"/>
    <rect class="box-em" x="220" y="110" width="480" height="32"/>
    <text class="t-s mid" x="460" y="130">min(10,000−500, 8,000)</text>
    <text class="t-s mid" x="745" y="130">限额外</text>
    <text class="t-n t-em" x="806" y="131">8,000</text>
  </g>
  <g data-s="3">
    <text class="t-b end" x="180" y="184">损失 10,000</text><text class="t-s end" x="180" y="200">先限额、后扣免赔</text>
    <rect class="box" x="190" y="170" width="600" height="32"/>
    <rect class="box f3" x="190" y="170" width="30" height="32"/>
    <rect class="box f2" x="220" y="170" width="450" height="32"/>
    <text class="t-s mid" x="445" y="190">min(10,000, 8,000)−500</text>
    <text class="t-s mid" x="730" y="190">限额外</text>
    <text class="t-n" x="806" y="191">7,500</text>
  </g>
</svg>
</div>
<figcaption>免赔 500 都扣在损失的开头；先扣免赔时，限额 8,000 量的是扣后的部分，先取限额就少赔 500。</figcaption>
