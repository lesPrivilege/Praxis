<div class="dw-scroll" style="--dw-min:600px;--dw-max:880px">
<svg viewBox="0 0 760 270" role="img" aria-labelledby="v22-correction-t v22-correction-d">
  <title id="v22-correction-t">出账后 U2 从 8 GB 更正为 5 GB</title>
  <desc id="v22-correction-d">B1 按 U1 4 GB、U2 8 GB 共 12 GB 以 1,900 分 issued。U2 更正为 5 GB 后，有效总量 9 GB，超量费归零，重算为 1500 分，产生 -400 分的调整 ADJ1，原账单保留。只把 5 GB 追加进去会得到 17 GB。</desc>
  <text class="t-b" x="20" y="24">U2 修订</text><text class="t-b" x="260" y="24">有效总量</text><text class="t-b" x="520" y="24">账单</text>
  <path class="ln-soft" d="M20 38 H740"/>
  <g data-s="1">
    <rect class="box" x="20" y="54" width="180" height="48"/><text class="t-n" x="34" y="83">U2 · 8 GB</text>
    <path class="ln" d="M200 78 H260"/>
    <rect class="box" x="260" y="54" width="200" height="48"/><text class="t-n" x="274" y="83">4 + 8 = 12 GB</text>
    <path class="ln" d="M460 78 H520"/>
    <rect class="box" x="520" y="54" width="220" height="48"/><text class="t-b" x="534" y="76">B1 · issued</text><text class="t-n" x="534" y="94">1900</text>
  </g>
  <g data-s="2">
    <path class="ln-soft" d="M110 102 V136"/><text class="t-s" x="118" y="124">superseded</text>
    <rect class="box" x="20" y="136" width="180" height="48"/><text class="t-n" x="34" y="165">U2 更正 · 5 GB</text>
    <path class="ln" d="M200 160 H260"/>
    <rect class="box" x="260" y="136" width="200" height="48"/><text class="t-n" x="274" y="158">4 + 5 = 9 GB</text><text class="t-s" x="274" y="176">超量费归零 · 1500</text>
  </g>
  <g data-s="3">
    <path class="ln" d="M460 160 H520"/>
    <rect class="box-em" x="520" y="136" width="220" height="48"/><text class="t-b" x="534" y="158">ADJ1</text><text class="t-n" x="534" y="176">1500 − 1900 = −400</text>
    <path class="ln" d="M630 136 V102"/><text class="t-s" x="638" y="124">B1 保留</text>
  </g>
  <g data-s="4">
    <path class="ln-dash" d="M110 184 V230 H260"/>
    <rect class="box-dash" x="260" y="208" width="200" height="44"/><text class="t-n" x="274" y="235">4 + 8 + 5 = 17 GB</text>
    <text class="t-s" x="476" y="235">只追加新记录，得到错误的总量</text>
  </g>

<figcaption>更正替换 U2 的有效版本，总量从 12 降到 9；差额作为 ADJ1 记在 B1 之后。</figcaption>
