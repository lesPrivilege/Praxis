<div class="dw-scroll" style="--dw-min:620px;--dw-max:900px">
<svg viewBox="0 0 800 310" role="img" aria-labelledby="v22-release-t v22-release-d">
  <title id="v22-release-t">退役时资源释放的前提</title>
  <desc id="v22-release-d">PO2 使 SV1 进入 terminating，先停网络权限，再核对停用，之后 RA1 才进入 released，下一客户才能预留。核对停用的依据是确认撤销的事件，或有权限的人工确认。持续送入空用量流时，资源仍停在 releasing。</desc>
  <g data-s="1">
    <rect class="box" x="20" y="60" width="130" height="52"/><text class="t-b" x="34" y="82">PO2</text><text class="t-s" x="34" y="100">SV1 terminating</text>
    <path class="ln" d="M150 86 H180"/>
    <rect class="box" x="180" y="60" width="130" height="52"/><text class="t-b mid" x="245" y="91">停网络权限</text>
    <path class="ln" d="M310 86 H340"/>
    <rect class="box" x="340" y="60" width="130" height="52"/><text class="t-b mid" x="405" y="91">核对停用</text>
  </g>
  <g data-s="2">
    <rect class="box" x="20" y="236" width="230" height="48"/><text class="t" x="34" y="258">持续送入空用量流</text><text class="t-s" x="34" y="275">没有观测到用量</text>
    <path class="ln" d="M250 260 H500"/>
    <rect class="box-em" x="500" y="236" width="280" height="48"/><text class="t-b" x="514" y="258">RA1 仍停在 releasing</text><text class="t-s" x="514" y="275">证明不了配置已撤销</text>
  </g>
  <g data-s="3">
    <rect class="box" x="340" y="150" width="190" height="52"/><text class="t" x="354" y="172">确认撤销的事件</text><text class="t-s" x="354" y="190">或有权限的人工确认</text>
    <path class="ln" d="M405 150 V112"/>
    <path class="ln" d="M470 86 H500"/>
    <rect class="box" x="500" y="60" width="130" height="52"/><text class="t-b" x="514" y="82">RA1</text><text class="t-s" x="514" y="100">released</text>
    <path class="ln" d="M630 86 H660"/>
    <rect class="box" x="660" y="60" width="120" height="52"/><text class="t-b mid" x="720" y="91">下一客户预留</text>
  </g>
</svg>
</div>
<figcaption>释放依次跟在停权限与核对停用之后；能推动这一步的只有撤销证据，空用量流让资源留在 releasing。</figcaption>
