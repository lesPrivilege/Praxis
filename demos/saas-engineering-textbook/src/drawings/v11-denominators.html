<div class="dw-scroll" style="--dw-min:600px;--dw-max:880px">
<svg viewBox="0 0 760 210" role="img" aria-labelledby="v11-denominators-t v11-denominators-d">
  <title id="v11-denominators-t">同一个估算值的两种比例</title>
  <desc id="v11-denominators-d">估算区间比例为 1/4 = 25%，估算电量比例为 4/14 ≈ 28.57%。电量比例低于 30% 的上限，可以发布；超过 25% 的上限，发布被阻断。区间比例 25% 恰好落在 25% 上限上。</desc>
  <path class="ln-soft" d="M170 44 V160"/>
  <g data-s="1">
    <text class="t-b end" x="150" y="78">按区间</text><text class="t-s end" x="150" y="96">1/4 = 25%</text>
    <rect class="box f2" x="170" y="66" width="400" height="30"/>
  </g>
  <g data-s="2">
    <text class="t-b end" x="150" y="134">按电量</text><text class="t-s end" x="150" y="152">4/14 ≈ 28.57%</text>
    <rect class="box f2" x="170" y="122" width="400" height="30"/>
    <rect class="box-em" x="570" y="122" width="57" height="30"/>
  </g>
  <g data-s="3">
    <path class="ln-strong" d="M570 40 V168"/><text class="t-s mid" x="570" y="30">上限 25%</text>
  </g>
  <g data-s="4">
    <path class="ln-strong" d="M650 40 V168"/><text class="t-s mid" x="660" y="30">上限 30%</text>
  </g>
  <g data-s="5">
    <text class="t" x="170" y="196">按电量比例：上限 30% 可以发布，上限 25% 阻断。</text>
  </g>
</svg>
</div>
<figcaption>分子都是估算的 4，分母一个是区间数 4，一个是总电量 14 kWh；越过 25% 上限的是电量比例。</figcaption>
