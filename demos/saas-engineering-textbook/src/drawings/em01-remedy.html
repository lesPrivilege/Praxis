<div class="dw-scroll" style="--dw-min:600px;--dw-max:880px">
<svg viewBox="0 0 740 270" role="img" aria-labelledby="em01-remedy-t em01-remedy-d">
  <title id="em01-remedy-t">指令走到哪一段，就用哪种撤回</title>
  <desc id="em01-remedy-d">指令尚未发出时可以取消；已被外部系统受理时要核对；已经生效后，补救是一项新的工作，例如退货、退款或恢复配置，它有自己的完成条件。</desc>
  <path class="ln-strong" data-draw="1" d="M30 90 H720"/>
  <g data-s="1">
    <text class="t-b mid" x="150" y="60">尚未发出</text>
    <path class="ln" d="M210 128 H92 M102 121 L92 128 L102 135"/>
    <text class="t-b mid" x="150" y="160">取消</text>
    <text class="t-s mid" x="150" y="180">撤下指令</text>
  </g>
  <g data-s="2">
    <path class="ln" d="M270 76 V104"/><text class="t-s mid" x="270" y="120">发出</text>
    <text class="t-b mid" x="390" y="60">已被外部系统受理</text>
    <text class="t-b mid" x="390" y="160">核对</text>
    <text class="t-s mid" x="390" y="180">向外部系统核对结果</text>
  </g>
  <g data-s="3">
    <path class="ln" d="M510 76 V104"/><text class="t-s mid" x="510" y="120">生效</text>
    <text class="t-b mid" x="625" y="60">已经生效</text>
    <text class="t-b mid" x="625" y="160">补偿</text>
    <path class="ln-dash" d="M625 168 V196"/>
    <rect class="box-em" x="540" y="196" width="170" height="56"/>
    <text class="t mid" x="625" y="219">新的工作</text>
    <text class="t-s mid" x="625" y="240">退货 · 退款 · 恢复配置</text>
  </g>
</svg>
</div>
<figcaption>取消撤下尚未发出的指令，核对查明外部受理的结果；生效之后的补偿是另一项工作，带着自己的完成条件。</figcaption>
