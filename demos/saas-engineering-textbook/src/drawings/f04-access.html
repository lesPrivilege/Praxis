  <rect class="box" x="133" y="56" width="44" height="34"/><text class="t-b mid" x="155" y="78">B</text>
  <rect class="box" x="226" y="104" width="44" height="34"/><text class="t-b mid" x="248" y="126">C</text>
  <path class="ln" d="M84 112 L133 82 M177 82 L226 112"/>

    <rect class="box" x="493" y="56" width="44" height="34"/><text class="t-b mid" x="515" y="78">B</text>
    <rect class="box" x="586" y="104" width="44" height="34"/><text class="t-b mid" x="608" y="126">C</text>
    <path class="ln" marker-end="url(#f04-access-ah)" d="M444 112 L489 85"/>

  <g data-s="2">
