<div class="dw-scroll" style="--dw-min:600px;--dw-max:900px">

  <text class="t-b end" x="110" y="55">工单</text>
  <path class="ln-strong" d="M130 50 H640"/>
  <text class="t-s mid" x="385" y="38">open · 未关闭</text>
  <text class="t-b end" x="110" y="145">booking</text>
  <g data-s="1">
    <path class="ln-soft" d="M200 50 V110"/>
    <rect class="box" x="130" y="110" width="140" height="64"/>
    <text class="t-b mid" x="200" y="134">第一次</text>
    <text class="t-n mid" x="200" y="156">no_access</text>
  </g>
  <g data-s="2">
    <path class="ln-soft" d="M270 142 H300 M294 137 L300 142 L294 147"/>
    <path class="ln-soft" d="M370 50 V110"/>
    <rect class="box" x="300" y="110" width="140" height="64"/>
    <text class="t-b mid" x="370" y="134">第二次</text>
    <text class="t-n mid" x="370" y="152">completed</text>
    <text class="t-s mid" x="370" y="167">发现配件待订</text>
  </g>
  <g data-s="3">
    <path class="ln-soft" d="M440 142 H470 M464 137 L470 142 L464 147"/>

    <text class="t-n mid" x="540" y="152">completed</text>
    <text class="t-s mid" x="540" y="167">完成维修</text>
  </g>
  <text class="t-s mid" x="370" y="200" data-s="2">每次新 booking 重新核对进入许可</text>
  <g data-s="4">
    <circle class="f-em" cx="646" cy="50" r="6"/>

    <text class="t-n t-em" x="658" y="64">closed</text>
