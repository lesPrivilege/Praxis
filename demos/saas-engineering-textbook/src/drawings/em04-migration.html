<div class="dw-scroll" style="--dw-min:580px;--dw-max:860px">
<svg viewBox="-10 0 760 230" role="img" aria-labelledby="em04-migration-t em04-migration-d">
  <title id="em04-migration-t">条数相符，关系可能已丢失</title>
  <desc id="em04-migration-d">100 张旧工单迁成 100 张新工单。旧工单连着批准版本、附件关系和客户接收状态；新工单的条数相符，这三项关系可能已经丢失。</desc>
  <g data-s="1">
    <text class="t-b mid" x="120" y="28">旧工单</text>
    <rect class="box" x="70" y="90" width="100" height="44"/><text class="t mid" x="120" y="117">工单</text>
    <path class="ln" d="M70 100 L40 60 M170 100 L200 60 M120 134 V170"/>
    <rect class="box" x="0" y="40" width="80" height="24"/><text class="t-s mid" x="40" y="56">批准版本</text>
    <rect class="box" x="170" y="40" width="70" height="24"/><text class="t-s mid" x="205" y="56">附件</text>
    <rect class="box" x="70" y="170" width="100" height="24"/><text class="t-s mid" x="120" y="186">客户接收状态</text>
  </g>
  <g data-s="2">
    <text class="t-big mid" x="370" y="110">100 = 100</text>
    <path class="ln" d="M290 130 H450 M440 123 L450 130 L440 137"/>
    <text class="t-s mid" x="370" y="156">条数相符</text>
  </g>
  <g data-s="3">
    <text class="t-b mid" x="620" y="28">新工单</text>
    <rect class="box" x="570" y="90" width="100" height="44"/><text class="t mid" x="620" y="117">工单</text>
    <path class="ln-dash" d="M570 100 L540 60 M670 100 L700 60 M620 134 V170"/>
    <rect class="box-dash" x="500" y="40" width="80" height="24"/><text class="t-s mid" x="540" y="56">批准版本</text>
    <rect class="box-dash" x="670" y="40" width="70" height="24"/><text class="t-s mid" x="705" y="56">附件</text>
    <rect class="box-dash" x="570" y="170" width="100" height="24"/><text class="t-s mid" x="620" y="186">客户接收状态</text>
    <text class="t-em mid" x="620" y="220">三项关系可能已丢失</text>
  </g>
</svg>
</div>
<figcaption>条数相等只说明工单都到了；批准版本、附件和客户接收状态要逐项跟到新工单上。</figcaption>
