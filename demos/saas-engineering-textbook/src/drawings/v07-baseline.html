<div class="dw-scroll" style="--dw-min:600px;--dw-max:880px">
<svg viewBox="0 0 720 230" role="img" aria-labelledby="v07-baseline-t v07-baseline-d">
  <title id="v07-baseline-t">生产中发布 D4 之后的两类单件</title>
  <desc id="v07-baseline-d">D4 取代 D3。已加工的单件保留 D3 引用，必须改造时另开返工单，返工单附 D4 的新检验要求。未开工的单件原按 D3 计划，经批准后切换到 D4。</desc>
  <g data-s="1">
    <rect class="box" x="30" y="94" width="110" height="52"/><text class="t-b mid" x="85" y="126">D3</text>
    <rect class="box" x="250" y="36" width="180" height="44"/><text class="t mid" x="340" y="63">已加工单件</text>
    <rect class="box" x="250" y="166" width="180" height="44"/><text class="t mid" x="340" y="193">未开工单件</text>
    <path class="ln-em" d="M250 58 L140 106"/>
    <text class="t t-em" x="150" y="50">保留 D3 引用</text>
    <path class="ln-dash" d="M250 188 L140 134"/>
    <text class="t-s" x="160" y="186">原计划</text>
  </g>
  <g data-s="2">
    <rect class="box" x="580" y="94" width="110" height="52"/><text class="t-b mid" x="635" y="126">D4</text>
    <path class="ln" d="M140 120 H580 M572 114 L580 120 L572 126"/>
    <text class="t-s mid" x="360" y="114">生产中发布，D4 取代 D3</text>
  </g>
  <g data-s="3">
    <path class="ln" d="M430 58 H470"/>
    <rect class="box f1" x="470" y="36" width="96" height="44"/><text class="t mid" x="518" y="55">返工单</text><text class="t-s mid" x="518" y="72">新检验要求</text>
    <path class="ln" d="M566 70 L600 94"/>
    <path class="ln" d="M430 188 L580 140"/>
    <text class="t-s" x="490" y="186">批准后切换</text>
  </g>
</svg>
</div>
<figcaption>已加工的单件仍指向 D3，改造另走返工单；只有未开工的单件在批准后改按 D4 生产。</figcaption>
