  </g>
  <g data-s="2">
    <path class="ln" d="M390 34 V60"/><text class="t-b mid" x="390" y="26">撤单请求</text>

    <text class="t mid t-inv" x="345" y="257">成交义务 651.00</text>
    <rect class="box-dash" x="541" y="234" width="212" height="36"/>
    <text class="t-s mid" x="647" y="256">释放 353.50</text>
    <text class="t-n" x="766" y="257">651.00</text>
