<div class="dw-scroll" style="--dw-min:580px;--dw-max:860px">
<svg viewBox="0 0 720 176" role="img" aria-labelledby="f12-fill-t f12-fill-d">
  <title id="f12-fill-t">订单 100 件的守恒式</title>
  <desc id="f12-fill-d">订单 100 件，已成交 60，剩余 40 的撤单请求结果未知：成交 60 + 未决 40 = 原订 100。结果未知期间又成交 10，变为成交 70、剩余 30 待核对。</desc>
  <text class="t-s mid" x="100" y="16">0</text><text class="t-s mid" x="400" y="16">60</text><text class="t-s mid" x="600" y="16">100</text>
  <text class="t-b end" x="88" y="53">撤单发出</text>
  <rect class="box f3" x="100" y="28" width="300" height="38"/><text class="t-b mid" x="250" y="52">成交 60</text>
  <rect class="box-dash" x="400" y="28" width="200" height="38"/><text class="t mid" x="500" y="52">未决 40</text>
  <text class="t-n" x="614" y="52">= 原订 100</text>
  <text class="t-s mid" x="500" y="84">撤单结果未知</text>
  <g data-s="1">
    <text class="t-b end" x="88" y="126">又成交 10</text>
    <rect class="box f3" x="100" y="102" width="300" height="38"/><text class="t-b mid" x="250" y="126">成交 60</text>
    <rect class="box-em" x="400" y="102" width="50" height="38"/><text class="t-b mid t-em" x="425" y="126">+10</text>
    <rect class="box-dash" x="450" y="102" width="150" height="38"/><text class="t mid" x="525" y="126">待核对 30</text>
    <text class="t-n" x="614" y="126">= 原订 100</text>
    <text class="t-s mid" x="275" y="168">成交 70</text>
    <path class="ln-soft" d="M100 146 V152 H450 V146"/>
  </g>
</svg>
</div>
<figcaption>未决的 40 件在收到外部确认前仍留在守恒式里；撤单结果未知期间又成交 10，成交一侧变为 70，待核对的剩余变为 30。</figcaption>
