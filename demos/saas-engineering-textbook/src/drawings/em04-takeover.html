<div class="dw-scroll" style="--dw-min:620px;--dw-max:900px">
<svg viewBox="0 0 760 300" role="img" aria-labelledby="em04-takeover-t em04-takeover-d">
  <title id="em04-takeover-t">切换时移交结果未知的操作</title>
  <desc id="em04-takeover-d">切换前，旧 worker 已向外部系统发出变更，结果没有返回。切换时把操作身份连同“结果未知”移交给新系统，新系统按原操作核对，再决定下一步。若新系统把导入状态解释成“尚未执行”并再次发送，同一变更会被发出两次。</desc>
  <text class="t-b end" x="100" y="64">旧 worker</text>
  <text class="t-b end" x="100" y="144">外部系统</text>
  <text class="t-b end" x="100" y="224">新系统</text>
  <path class="ln-soft" d="M120 60 H740 M120 140 H740 M120 220 H740"/>
  <path class="ln" d="M380 30 V280"/><text class="t-s mid" x="380" y="22">切换</text>
  <g data-s="1">
    <circle class="f-ink" cx="180" cy="60" r="5"/><text class="t-s" x="150" y="46">发出变更</text>
    <path class="ln" d="M180 65 V134 M173 126 L180 134 L187 126"/>
    <path class="ln-dash" d="M240 134 V68"/><text class="t-s" x="248" y="104">结果未返回</text>
  </g>
  <g data-s="2">
    <path class="ln" d="M330 60 C380 60 380 220 400 220"/>
    <rect class="box-em" x="400" y="204" width="170" height="34"/><text class="t mid" x="485" y="226">操作身份 + 结果未知</text>
  </g>
  <g data-s="3">
    <path class="ln" d="M600 214 V146 M593 154 L600 146 L607 154"/>
    <text class="t-s" x="610" y="186">按原操作核对</text>
    <text class="t-s" x="610" y="202">再决定下一步</text>
  </g>
  <g data-s="4">
    <rect class="box-dash" x="400" y="252" width="230" height="30"/><text class="t-s mid" x="515" y="272">解释成“尚未执行”，再次发送</text>
    <path class="ln-dash" d="M630 267 H700 V146 M693 154 L700 146 L707 154"/>
    <text class="t-s" x="708" y="186">第二次</text>
  </g>
</svg>
</div>
<figcaption>移交的是操作身份和“结果未知”，新系统先向外部核对；虚线是把导入状态读成“尚未执行”时会发生的重复发送。</figcaption>
