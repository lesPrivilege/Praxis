<div class="dw-scroll" style="--dw-min:600px;--dw-max:900px">
<svg viewBox="0 0 760 224" role="img" aria-labelledby="v02-impact-t v02-impact-d">
  <title id="v02-impact-t">定义 F1 修订的影响链</title>
  <desc id="v02-impact-d">字段 F1 的代码值 2 由“第二次访视”改为“补充访视”。从 F1 沿依赖访问 A2、派生表 D1、签名 S2、锁定候选 L1，标出需要重算、重签或重新准备的节点。A1 没有依赖 F1，不受影响。</desc>
  <defs><marker id="v02-impact-ah" viewBox="0 0 8 8" refX="7" refY="4" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto"><path class="f-ink" d="M0 0 L8 4 L0 8 z"/></marker></defs>
  <rect class="box f2" x="10" y="40" width="120" height="48"/><text class="t-b mid" x="70" y="69">定义 F1</text>
  <text class="t-s" x="10" y="110">代码 2：</text>
  <text class="t-s" x="10" y="126">第二次访视</text>
  <text class="t-s" x="10" y="142">→ 补充访视</text>
  <g data-s="1">
    <path class="ln" marker-end="url(#v02-impact-ah)" d="M130 64 H166"/>
    <rect class="box" x="170" y="40" width="110" height="48"/><text class="t-b mid" x="225" y="69">表单 A2</text>
    <text class="t-s mid" x="225" y="110">值仍是 2</text>
  </g>
  <g data-s="2">
    <path class="ln" marker-end="url(#v02-impact-ah)" d="M280 64 H316"/>
    <rect class="box" x="320" y="40" width="110" height="48"/><text class="t-b mid" x="375" y="69">派生表 D1</text>
    <text class="t-s mid" x="375" y="110">重算</text>
  </g>
  <g data-s="3">
    <path class="ln" marker-end="url(#v02-impact-ah)" d="M430 64 H466"/>
    <rect class="box-em" x="470" y="40" width="110" height="48"/><text class="t-b mid t-em" x="525" y="69">签名 S2</text>
    <text class="t-s mid t-em" x="525" y="110">重签</text>
  </g>
  <g data-s="4">
    <path class="ln" marker-end="url(#v02-impact-ah)" d="M580 64 H616"/>
    <rect class="box" x="620" y="40" width="130" height="48"/><text class="t-b mid" x="685" y="69">锁定候选 L1</text>
    <text class="t-s mid" x="685" y="110">重新准备</text>
  </g>
  <path class="ln-soft" d="M150 160 H750"/>
  <rect class="box" x="170" y="174" width="110" height="40"/><text class="t-b mid" x="225" y="199">表单 A1</text>
  <text class="t-s" x="296" y="199">与 F1 之间没有依赖边，遍历不到，不受影响</text>

<figcaption>A2 的值没变，含义随 F1 变了；遍历沿依赖走到签名 S2，摘要里带着定义版本才能发现这一变化。</figcaption>
