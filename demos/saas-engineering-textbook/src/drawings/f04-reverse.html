<div class="dw-scroll" style="--dw-min:520px;--dw-max:800px">
<svg viewBox="0 0 660 170" role="img" aria-labelledby="f04-reverse-t f04-reverse-d">
  <title id="f04-reverse-t">原边与反向邻接表</title>
  <desc id="f04-reverse-d">存下的关系是 B depends_on A，箭头从 B 指向 A。要从 A 找受影响的对象，另建一张反向邻接表，遍历方向为 A→B；原边不动。</desc>
  <defs><marker id="f04-reverse-ah" viewBox="0 0 8 8" refX="7" refY="4" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto"><path class="f-ink" d="M0 0 L8 4 L0 8 z"/></marker><marker id="f04-reverse-ahe" viewBox="0 0 8 8" refX="7" refY="4" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path class="f-em" d="M0 0 L8 4 L0 8 z"/></marker></defs>
  <text class="t-b" x="20" y="24">存下的关系</text>
  <rect class="box" x="20" y="62" width="64" height="40"/><text class="t-b mid" x="52" y="87">B</text>
  <rect class="box" x="220" y="62" width="64" height="40"/><text class="t-b mid" x="252" y="87">A</text>
  <path class="ln" marker-end="url(#f04-reverse-ah)" d="M84 82 H216"/>
  <text class="t-n mid" x="150" y="74">depends_on</text>
  <text class="t-s" x="20" y="134">B 依赖 A；按 relation-types 定义的方向保存</text>
  <path class="ln-soft" d="M330 20 V150"/>
  <g data-s="1">
    <text class="t-b" x="370" y="24">反向邻接表</text>
    <rect class="box f1" x="370" y="62" width="64" height="40"/><text class="t-b mid" x="402" y="87">A</text>
    <rect class="box" x="570" y="62" width="64" height="40"/><text class="t-b mid" x="602" y="87">B</text>
    <path class="ln-strong" marker-end="url(#f04-reverse-ah)" d="M434 82 H566"/>
    <text class="t-s mid" x="500" y="74">受影响</text>
    <text class="t-s" x="370" y="134">从 A 出发找受影响的对象，计算时另建</text>
  </g>
</svg>
</div>
<figcaption>同一条关系存一次、读两种方向：原边保持 B depends_on A，遍历时沿反向表从 A 走到 B。</figcaption>
