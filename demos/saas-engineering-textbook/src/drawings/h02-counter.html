<div class="dw-scroll" style="--dw-min:600px;--dw-max:900px">
<svg viewBox="0 0 760 190" role="img" aria-labelledby="h02-counter-t h02-counter-d">
  <title id="h02-counter-t">各自比较与累计占用</title>
  <desc id="h02-counter-d">各自比较时，发票 A 的 70 件和发票 B 的 10 件都从 0 量起，都不超过合格量 75，两张都通过。累计占用时，B 接在 A 的 70 件之后，排到 80，越过 75。</desc>
  <text class="t-b" x="20" y="22">各自与合格量 75 比较</text>
  <path class="ln-soft" d="M330 34 V132"/><text class="t-s mid" x="330" y="148">75</text>
  <text class="t-b end" x="54" y="67">A</text>
  <rect class="box f1" x="60" y="50" width="252" height="24"/><text class="t-n" x="70" y="67">70</text>
  <text class="t-b end" x="54" y="111">B</text>
  <rect class="box f1" x="60" y="94" width="36" height="24"/><text class="t-n" x="104" y="111">10</text>
  <text class="t" x="20" y="176">两张都通过，合计 80 件</text>
  <g data-s="1">
    <text class="t-b" x="420" y="22">累计占用同一份合格量</text>
    <path class="ln-soft" d="M690 34 V132"/><text class="t-s mid" x="690" y="148">75</text>
    <text class="t-b end" x="414" y="89">A + B</text>
    <rect class="box f1" x="420" y="72" width="252" height="24"/><text class="t-n" x="430" y="89">A 70</text>
    <rect class="box" x="672" y="72" width="18" height="24"/>
    <rect class="box-em" x="690" y="72" width="18" height="24"/>
    <text class="t-s" x="672" y="64">B</text>
    <text class="t-s mid" x="708" y="148">80</text>
    <text class="t" x="420" y="176">B 排到 80，越过合格量 5 件</text>
  </g>
</svg>
</div>
<figcaption>两张发票各自与 75 比较都能通过；接在已占用的 70 件之后比较，B 的后 5 件落在合格量之外。</figcaption>
