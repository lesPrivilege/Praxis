<div class="dw-scroll" style="--dw-min:600px;--dw-max:860px">
<svg viewBox="0 0 720 222" role="img" aria-labelledby="f10-denom-t f10-denom-d">
  <title id="f10-denom-t">同一组计数上的三个分母</title>
  <desc id="f10-denom-d">40 条留出样本，实际阳性 20、阴性 20；TP 18、FP 4、FN 2、TN 16。精确率以建议的 22 条为分母，18/22≈81.8%；召回率以实际阳性 20 条为分母，18/20=90%；准确率以全部 40 条为分母，34/40=85%。</desc>
  <text class="t-s end" x="54" y="83">建议</text><text class="t-s end" x="54" y="129">未建议</text>
  <g>
    <text class="t-b mid" x="156" y="20">精确率</text>
    <text class="t-s mid" x="111" y="48">实际阳性 20</text><text class="t-s mid" x="201" y="48">实际阴性 20</text>
    <rect class="box f3" x="66" y="58" width="90" height="46"/><text class="t-n mid" x="111" y="86">TP 18</text>
    <rect class="box f1" x="156" y="58" width="90" height="46"/><text class="t-n mid" x="201" y="86">FP 4</text>
    <rect class="box" x="66" y="104" width="90" height="46"/><text class="t-s mid" x="111" y="132">FN 2</text>
    <rect class="box" x="156" y="104" width="90" height="46"/><text class="t-s mid" x="201" y="132">TN 16</text>
    <rect class="ln-strong" x="66" y="58" width="180" height="46"/>
    <text class="t-n mid" x="156" y="182">18/22 ≈ 81.8%</text>
    </g>
  <g data-s="1">
    <text class="t-b mid" x="382" y="20">召回率</text>
    <text class="t-s mid" x="337" y="48">实际阳性 20</text><text class="t-s mid" x="427" y="48">实际阴性 20</text>
    <rect class="box f3" x="292" y="58" width="90" height="46"/><text class="t-n mid" x="337" y="86">TP 18</text>
    <rect class="box" x="382" y="58" width="90" height="46"/><text class="t-s mid" x="427" y="86">FP 4</text>
    <rect class="box f1" x="292" y="104" width="90" height="46"/><text class="t-n mid" x="337" y="132">FN 2</text>
    <rect class="box" x="382" y="104" width="90" height="46"/><text class="t-s mid" x="427" y="132">TN 16</text>
    <rect class="ln-strong" x="292" y="58" width="90" height="92"/>
    <text class="t-n mid" x="382" y="182">18/20 = 90%</text>
    </g>
  <g data-s="2">
    <text class="t-b mid" x="608" y="20">准确率</text>
    <text class="t-s mid" x="563" y="48">实际阳性 20</text><text class="t-s mid" x="653" y="48">实际阴性 20</text>
    <rect class="box f3" x="518" y="58" width="90" height="46"/><text class="t-n mid" x="563" y="86">TP 18</text>
    <rect class="box f1" x="608" y="58" width="90" height="46"/><text class="t-n mid" x="653" y="86">FP 4</text>
    <rect class="box f1" x="518" y="104" width="90" height="46"/><text class="t-n mid" x="563" y="132">FN 2</text>
    <rect class="box f3" x="608" y="104" width="90" height="46"/><text class="t-n mid" x="653" y="132">TN 16</text>
    <rect class="ln-strong" x="518" y="58" width="180" height="92"/>

<figcaption>三个指标读的是同一张表，分母各圈一块；准确率把 FP 4 和 FN 2 并进一个 85%，精确率和召回率才把两种错误分开。</figcaption>
