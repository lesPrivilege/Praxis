<div class="dw-scroll" style="--dw-min:600px;--dw-max:880px">
<svg viewBox="0 0 780 250" role="img" aria-labelledby="v11-swap-t v11-swap-d">
  <title id="v11-swap-t">00:30 换表时的倍率归属</title>
  <desc id="v11-swap-d">00:30 换表。旧表倍率 1，覆盖前两个区间，原始值 2、3；新表倍率 2，覆盖后两个区间，原始值 2、2.5。按有效安装关系得到 2、3、4、5 kWh，账单 13.50；把旧倍率用到新表上得到 2、3、2、2.5 kWh，账单错成 9.00。</desc>
  <text class="t-n mid" x="160" y="24">00:00</text><text class="t-n mid" x="280" y="24">00:15</text>
  <text class="t-n mid" x="400" y="24">00:30</text><text class="t-n mid" x="520" y="24">00:45</text><text class="t-n mid" x="640" y="24">01:00</text>
  <text class="t-b mid" x="720" y="24">账单</text>
  <g data-s="1">
    <text class="t-b end" x="140" y="66">安装关系</text>
    <rect class="box" x="164" y="44" width="232" height="34"/><text class="t mid" x="280" y="66">旧表 · 倍率 1</text>
    <rect class="box" x="404" y="44" width="232" height="34"/><text class="t mid" x="520" y="66">新表 · 倍率 2</text>
  </g>
  <path class="ln-em" d="M400 34 V228"/>
  <g data-s="2">
    <text class="t-b end" x="140" y="118">原始值</text>
    <text class="t-n mid" x="220" y="118">2</text><text class="t-n mid" x="340" y="118">3</text>
    <text class="t-n mid" x="460" y="118">2</text><text class="t-n mid" x="580" y="118">2.5</text>
    <path class="ln-soft" d="M20 136 H760"/>
  </g>
  <g data-s="3">
    <text class="t-b end" x="140" y="166">按有效关系</text>
    <text class="t-s mid" x="220" y="152">×1</text><text class="t-s mid" x="340" y="152">×1</text>
    <text class="t-s mid" x="460" y="152">×2</text><text class="t-s mid" x="580" y="152">×2</text>
    <text class="t-n mid" x="220" y="170">2</text><text class="t-n mid" x="340" y="170">3</text>

    <text class="t-big mid" x="720" y="172">13.50</text>

    <text class="t-n mid" x="460" y="218">2</text><text class="t-n mid" x="580" y="218">2.5</text>
    <text class="t-big mid" x="720" y="220">9.00</text>
  </g>
</svg>
</div>
<figcaption>换表边界把一个期间切成两段安装关系，后两个区间按新表的倍率 2 换算；按此算出 13.50，与无换表、含估算的金额恰好相同。</figcaption>
