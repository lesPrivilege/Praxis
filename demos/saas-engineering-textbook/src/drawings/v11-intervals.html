<div class="dw-scroll" style="--dw-min:580px;--dw-max:860px">
<svg viewBox="0 0 720 300" role="img" aria-labelledby="v11-intervals-t v11-intervals-d">
  <title id="v11-intervals-t">SP-1 一小时的四个区间与分时计价</title>
  <desc id="v11-intervals-d">四个 15 分钟区间原始值为 2、3、缺失、5 kWh，第三个区间按相邻均值 (3+5)/2 估算为 4。00:30 的费率边界把前两个区间归入谷段、后两个归入峰段：谷 5 kWh 乘 0.50 得 2.50，峰 9 kWh 乘 1.00 得 9.00，加固定费用 2.00，账单为 13.50。</desc>
  <path class="ln-soft" d="M120 190 H600"/>
  <text class="t-n mid" x="120" y="210">00:00</text><text class="t-n mid" x="240" y="210">00:15</text>
  <text class="t-n mid" x="360" y="210">00:30</text><text class="t-n mid" x="480" y="210">00:45</text>
  <text class="t-n mid" x="600" y="210">01:00</text>
  <g data-s="1">
    <rect class="box f2" x="140" y="150" width="80" height="40"/><text class="t-n mid" x="180" y="142">2</text>
    <rect class="box f2" x="260" y="130" width="80" height="60"/><text class="t-n mid" x="300" y="122">3</text>
    <text class="t-s mid" x="420" y="180">缺失</text>
    <rect class="box f2" x="500" y="90" width="80" height="100"/><text class="t-n mid" x="540" y="82">5</text>
  </g>
  <g data-s="2">
    <rect class="box-dash" x="380" y="110" width="80" height="80"/>
    <text class="t-s mid" x="420" y="155">估算</text>
    <text class="t-n mid" x="420" y="102">4</text><text class="t-s mid" x="420" y="84">(3+5)/2</text>
  </g>
  <g data-s="3">
    <path class="ln-strong" d="M360 40 V194"/>
    <text class="t-b mid" x="240" y="30">谷 · 0.50 /kWh</text><text class="t-b mid" x="480" y="30">峰 · 1.00 /kWh</text>
  </g>
  <g data-s="4">
    <text class="t mid" x="240" y="248">谷 5 kWh × 0.50 = 2.50</text>
    <text class="t mid" x="480" y="248">峰 9 kWh × 1.00 = 9.00</text>
  </g>
  <g data-s="5">
    <path class="ln-soft" d="M120 264 H700"/>
    <text class="t end" x="590" y="290">2.50 + 9.00 + 固定 2.00 =</text>
    <text class="t-big" x="604" y="292">13.50</text>
  </g>
</svg>
</div>
<figcaption>00:30 的费率边界把四个区间分成谷、峰两段；估算的 4 kWh 落在峰段，按 1.00 计价。</figcaption>
