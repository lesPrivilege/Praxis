<div class="dw-scroll" style="--dw-min:620px;--dw-max:900px">
<svg viewBox="0 0 770 250" role="img" aria-labelledby="h05-pauses-t h05-pauses-d">
  <title id="h05-pauses-t">两条重叠的暂停记录</title>
  <desc id="h05-pauses-d">事故第 0 分钟出错，第 10 分钟接管，第 45 分钟回滚，第 70 分钟通过恢复验证，第 90 分钟接收方确认关闭。暂停记录 [20,35) 与 [30,40) 在第 30—35 分钟重叠；直接相加得 25 分钟，有效时间 45；合并为 [20,40) 共 20 分钟，有效时间 70 − 20 = 50，超出目标 45 五分钟。</desc>
  <path class="ln-soft" d="M150 40 H600"/>
  <path class="ln" d="M150 36 V44 M200 36 V44 M375 36 V44 M500 36 V44 M600 36 V44"/>
  <text class="t-n mid" x="150" y="28">0</text><text class="t-n mid" x="200" y="28">10</text><text class="t-n mid" x="375" y="28">45</text><text class="t-n mid" x="500" y="28">70</text><text class="t-n mid" x="600" y="28">90</text>
  <text class="t-s mid" x="150" y="58">出错</text><text class="t-s mid" x="200" y="58">接管</text><text class="t-s mid" x="375" y="58">回滚</text><text class="t-s mid" x="500" y="58">恢复验证通过</text><text class="t-s mid" x="600" y="58">确认关闭</text>
  <text class="t-s end" x="150" y="12">分钟</text>
  <g data-s="1">
    <text class="t-b end" x="135" y="91">暂停记录一</text>
    <rect class="box f1" x="250" y="76" width="75" height="22"/><text class="t-n" x="333" y="92">[20,35) · 15</text>
    <text class="t-b end" x="135" y="125">暂停记录二</text>
    <rect class="box f1" x="300" y="110" width="50" height="22"/><text class="t-n" x="358" y="126">[30,40) · 10</text>
  </g>
  <g data-s="2">
    <rect class="box-em" x="300" y="76" width="25" height="56"/>
    <text class="t" x="620" y="92">直接相加：25</text>
    <text class="t-n" x="620" y="126">70 − 25 = 45</text>
  </g>
  <g data-s="3">
    <text class="t-b end" x="135" y="171">合并</text>
    <rect class="box f2" x="250" y="156" width="100" height="22"/><text class="t-n mid" x="300" y="172">[20,40)</text>
    <text class="t" x="620" y="172">合并：20</text>
    <text class="t-b end" x="135" y="215">恢复计时</text>
    <path class="ln-strong" d="M150 210 H250 M350 210 H500"/>
    <path class="ln-soft" d="M500 210 H600"/>
    <text class="t-s mid" x="550" y="200">不计入恢复时长</text>
    <text class="t-n" x="620" y="206">70 − 20 = 50</text>
    <text class="t-s" x="620" y="226">目标 45，超出 5</text>
  </g>
</svg>
</div>
<figcaption>第 30—35 分钟被两条暂停记录同时覆盖；先合并再扣除，这五分钟只扣一次，有效时间是 50 而非 45。</figcaption>
