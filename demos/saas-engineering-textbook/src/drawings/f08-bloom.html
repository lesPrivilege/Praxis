<div class="dw-scroll" style="--dw-min:560px;--dw-max:760px">
<svg viewBox="100 0 600 250" role="img" aria-labelledby="f08-bloom-t f08-bloom-d">
  <title id="f08-bloom-t">布隆过滤器的 8 位位图</title>
  <desc id="f08-bloom-d">插入 A 置第 1、4 位，插入 B 置第 4、6 位。查询 C 查第 1、6 位，两位都是 1，回答可能存在；查询 D 查第 2、6 位，第 2 位为 0，回答确定不在。</desc>
  <!-- inserts -->
  <text class="t-b mid" x="240" y="24">插入 A</text>
  <text class="t-b mid" x="390" y="24">插入 B</text>
  <path class="ln" d="M228 32 L156 84"/><path class="ln" d="M252 32 L324 84"/>
  <path class="ln" d="M378 32 L336 84"/><path class="ln" d="M402 32 L444 84"/>
  <!-- bits -->
  <g>
    <rect class="box f-ink" x="120" y="88" width="60" height="44"/><text class="t-n mid t-inv" x="150" y="115">1</text>
    <rect class="box" x="180" y="88" width="60" height="44"/><text class="t-n mid" x="210" y="115">0</text>
    <rect class="box" x="240" y="88" width="60" height="44"/><text class="t-n mid" x="270" y="115">0</text>
    <rect class="box f-ink" x="300" y="88" width="60" height="44"/><text class="t-n mid t-inv" x="330" y="115">1</text>
    <rect class="box" x="360" y="88" width="60" height="44"/><text class="t-n mid" x="390" y="115">0</text>
    <rect class="box f-ink" x="420" y="88" width="60" height="44"/><text class="t-n mid t-inv" x="450" y="115">1</text>
    <rect class="box" x="480" y="88" width="60" height="44"/><text class="t-n mid" x="510" y="115">0</text>
    <rect class="box" x="540" y="88" width="60" height="44"/><text class="t-n mid" x="570" y="115">0</text>
  </g>
  <g class="t-s">
    <text class="t-s mid" x="150" y="148">第1位</text><text class="t-s mid" x="210" y="148">第2位</text><text class="t-s mid" x="270" y="148">第3位</text><text class="t-s mid" x="330" y="148">第4位</text>
    <text class="t-s mid" x="390" y="148">第5位</text><text class="t-s mid" x="450" y="148">第6位</text><text class="t-s mid" x="510" y="148">第7位</text><text class="t-s mid" x="570" y="148">第8位</text>
  </g>
  <!-- queries -->
  <path class="ln-em" d="M232 200 L156 156"/><path class="ln-em" d="M268 200 L444 156"/>
  <text class="t-b mid t-em" x="250" y="222">查询 C</text>
  <text class="t mid" x="250" y="242">第1、6位都是 1 → 可能存在</text>
  <path class="ln" d="M500 200 L216 156"/><path class="ln" d="M524 200 L456 156"/>
  <text class="t-b mid" x="560" y="222">查询 D</text>
  <text class="t mid" x="560" y="242">第2位是 0 → 确定不在</text>
</svg>
</div>
<figcaption>C 从未插入，它查的两位都被 A、B 置为 1；D 碰到一个 0 就能确定不在。</figcaption>
