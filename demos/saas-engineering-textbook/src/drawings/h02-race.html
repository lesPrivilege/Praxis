<div class="dw-scroll" style="--dw-min:600px;--dw-max:900px">
<svg viewBox="0 0 760 300" role="img" aria-labelledby="h02-race-t h02-race-d">
  <title id="h02-race-t">两人同时申请最后 5 件</title>
  <desc id="h02-race-d">检查与占用分开时，操作员甲和乙都读到剩余 5 件，各自写入 5 件，累计占用 80。在同一事务里锁定 PO-1/L1 的余额记录时，甲先锁行、读到 5、写入并提交；乙等锁释放后读到 0，返回冲突或 hold，累计仍为 75。</desc>
  <text class="t-b" x="20" y="22">检查与占用分开</text>
  <text class="t-b end" x="100" y="65">甲</text><text class="t-b end" x="100" y="115">乙</text>
  <path class="ln" d="M120 60 H560"/><path class="ln" d="M120 110 H560"/>
  <g data-s="1">
    <circle class="f-ink" cx="200" cy="60" r="4"/><text class="t-s mid" x="200" y="48">读到剩余 5</text>
    <circle class="f-ink" cx="250" cy="110" r="4"/><text class="t-s mid" x="250" y="132">读到剩余 5</text>
  </g>
  <g data-s="2">
    <circle class="f-ink" cx="360" cy="60" r="4"/><text class="t-s mid" x="360" y="48">写入 5 件</text>
    <circle class="f-ink" cx="420" cy="110" r="4"/><text class="t-s mid" x="420" y="132">写入 5 件</text>
    <text class="t-b t-em" x="590" y="80">累计 80</text>
    <text class="t-s" x="590" y="98">超出合格量 75</text>
  </g>
  <path class="ln-soft" d="M20 156 H740"/>
  <text class="t-b" x="20" y="182">同一事务里先锁行再判断</text>
  <text class="t-b end" x="100" y="225">甲</text><text class="t-b end" x="100" y="275">乙</text>
  <path class="ln" d="M120 220 H560"/><path class="ln" d="M120 270 H250"/><path class="ln" d="M380 270 H560"/>
  <g data-s="3">
    <rect class="box f2" x="200" y="210" width="160" height="20"/>
    <text class="t-s" x="206" y="206">锁 PO-1/L1 · 读到 5 · 写入 5</text>
    <circle class="f-ink" cx="360" cy="220" r="4"/><text class="t-s" x="368" y="238">提交，剩余 0</text>
    <path class="ln-dash" d="M250 270 H380"/><text class="t-s mid" x="315" y="292">等锁释放</text>
  </g>
  <g data-s="4">
    <circle class="f-ink" cx="390" cy="270" r="4"/><text class="t-s" x="398" y="260">读到 0 · 冲突或 hold</text>
    <text class="t-b" x="590" y="250">累计 75</text>
  </g>
</svg>
</div>
<figcaption>两人都读到同一份剩余 5 件时，各自写入就超出合格量；先锁采购单行，后到的一方读到的是前一笔提交后的 0。</figcaption>
