<div class="dw-scroll" style="--dw-min:540px;--dw-max:800px">
<svg viewBox="0 0 640 214" role="img" aria-labelledby="f12-prop-t f12-prop-d">
  <title id="f12-prop-t">设计升版后的依赖链</title>
  <desc id="f12-prop-d">依赖链 D1→B1→R1：D 是设计版本，B 是依赖这份设计的验证任务，R 是凭验证结果放行的发布。D1 升为 D2 后，按规则产生新实例 B2、R2；旧 B1 的完成只支持 R1，新发布 R2 等待 B2。</desc>
  <defs><marker id="f12-prop-ah" viewBox="0 0 8 8" refX="7" refY="4" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto"><path class="f-ink" d="M0 0 L8 4 L0 8 z"/></marker></defs>
  <text class="t-s mid" x="90" y="18">设计版本 D</text><text class="t-s mid" x="320" y="18">验证任务 B</text><text class="t-s mid" x="550" y="18">放行的发布 R</text>
  <rect class="box" x="40" y="34" width="100" height="36"/><text class="t-b mid" x="90" y="57">D1</text>
  <path class="ln" marker-end="url(#f12-prop-ah)" d="M140 52 H268"/>
  <rect class="box" x="270" y="34" width="100" height="36"/><text class="t-b mid" x="320" y="57">B1 已完成</text>
  <path class="ln" marker-end="url(#f12-prop-ah)" d="M370 52 H498"/>
  <rect class="box" x="500" y="34" width="100" height="36"/><text class="t-b mid" x="550" y="57">R1</text>
  <text class="t-s mid" x="435" y="44">只支持 R1</text>
  <g data-s="1">
    <path class="ln" marker-end="url(#f12-prop-ah)" d="M90 70 V142"/><text class="t-s" x="98" y="110">升版</text>
    <rect class="box" x="40" y="144" width="100" height="36"/><text class="t-b mid" x="90" y="167">D2</text>
  </g>
  <g data-s="2">
    <path class="ln-dash" d="M140 162 H268"/>
    <rect class="box-dash" x="270" y="144" width="100" height="36"/><text class="t-b mid" x="320" y="167">B2 新实例</text>
    <path class="ln-dash" d="M370 162 H498"/>
    <rect class="box-em" x="500" y="144" width="100" height="36"/><text class="t-b mid t-em" x="550" y="167">R2</text>
    <text class="t-b mid t-em" x="550" y="200">等待 B2</text>
  </g>
</svg>
</div>
<figcaption>D1 升为 D2 后，B1 的完成仍只属于 D1 与 R1；新发布 R2 等新的验证 B2 完成后才能放行。</figcaption>
