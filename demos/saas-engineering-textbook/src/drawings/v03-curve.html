<div class="dw-scroll" style="--dw-min:600px;--dw-max:900px">
<svg viewBox="0 0 760 330" role="img" aria-labelledby="v03-curve-t v03-curve-d">
  <title id="v03-curve-t">校准直线与三次逆算</title>
  <desc id="v03-curve-d">三个标准点 0 mg/L 对 1 AU、5 mg/L 对 11 AU、10 mg/L 对 21 AU，拟合为 y = 1 + 2x。样品 18.0 AU 逆算为 8.5 mg/L；独立 QC 11.2 AU 逆算为 5.1 mg/L，在 5.0 ± 0.25 内；25 AU 外推为 12 mg/L，在方法范围 0–10 mg/L 之外。</desc>
  <rect class="f1" x="90" y="40" width="500" height="250"/>
  <text class="t-s" x="100" y="58">M1@3 范围 0–10 mg/L</text>
  <path class="ln" d="M90 34 V290 H710"/>
  <text class="t-s" x="10" y="22">响应 / AU</text>
  <text class="t-s end" x="740" y="324">浓度 / (mg/L)</text>
  <text class="t-n end" x="82" y="284">1</text><text class="t-n end" x="82" y="184">11</text><text class="t-n end" x="82" y="84">21</text>
  <text class="t-n mid" x="90" y="308">0</text><text class="t-n mid" x="340" y="308">5</text><text class="t-n mid" x="590" y="308">10</text>
  <g data-s="1">
    <path class="ln-strong" data-draw="1" d="M90 280 L590 80"/>
    <circle class="f-ink" cx="90" cy="280" r="4.5"/><circle class="f-ink" cx="340" cy="180" r="4.5"/><circle class="f-ink" cx="590" cy="80" r="4.5"/>
    <text class="t" x="420" y="176">y = 1 + 2x</text>
  </g>
  <g data-s="2">
    <path class="ln-em" d="M90 110 H515 V290"/>
    <circle class="f-em" cx="515" cy="110" r="5"/>
    <text class="t-n end t-em" x="82" y="114">18.0</text>
    <text class="t-n mid t-em" x="515" y="308">8.5</text>
  </g>
  <g data-s="3">
    <path class="ln-soft" d="M90 178 H345 V290"/>
    <circle class="ln" cx="345" cy="178" r="6"/>
    <path class="ln-soft" d="M262 160 L338 175"/>
    <text class="t-s" x="104" y="150">QC：11.2 AU → 5.1 mg/L</text>
    <text class="t-s" x="104" y="166">已知 5.0，允许 ± 0.25</text>
  </g>
  <g data-s="4">
    <path class="ln-dash" d="M590 80 L690 40"/>
    <path class="ln-dash" d="M90 40 H690 V290"/>
    <text class="t-n end" x="82" y="44">25</text>
    <text class="t-n mid" x="690" y="308">12</text>
    <text class="t-s end" x="680" y="60">25 AU 外推为 12 mg/L，在范围之外</text>
  </g>
</svg>
</div>
<figcaption>18.0 AU 落在校准范围内，逆算得 8.5 mg/L；25 AU 只能沿直线外推，得到的 12 mg/L 不作报告。</figcaption>
