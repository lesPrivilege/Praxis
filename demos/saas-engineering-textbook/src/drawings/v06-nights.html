<div class="dw-scroll" style="--dw-min:620px;--dw-max:920px">
<svg viewBox="0 0 780 330" role="img" aria-labelledby="v06-nights-t v06-nights-d">
  <title id="v06-nights-t">按当地日期计数的三晚</title>
  <desc id="v06-nights-d">R1 的计费日期是半开区间 [24,27)，即 24、25、26 日三晚，房价 120、150、130 EUR，合计 40000 分。相邻预订 [27,29) 从 27 日开始，两者不重复计算 27 日。实际从 24 日 15:00 到 27 日 11:00 是 69 小时，两个当地午夜之间是 73 小时；69 除以 24 向下取整得两晚，73 除以 24 向上取整得四晚，按日期计数是三晚。</desc>
  <g data-s="1">
    <path class="ln-soft" d="M120 40 H740"/>
    <path class="ln-soft" d="M120 34 V300 M240 34 V44 M360 34 V44 M480 34 V200 M480 236 V300 M600 34 V44 M720 34 V44"/>
    <text class="t-s mid" x="180" y="28">24 日</text><text class="t-s mid" x="300" y="28">25 日</text><text class="t-s mid" x="420" y="28">26 日</text>
    <text class="t-s mid" x="540" y="28">27 日</text><text class="t-s mid" x="660" y="28">28 日</text>
    <text class="t-b" x="0" y="82">R1</text><text class="t-s" x="0" y="98">[24,27)</text>
    <rect class="box f1" x="120" y="58" width="120" height="40"/><text class="t-n mid" x="180" y="83">120 EUR</text>
    <rect class="box f1" x="240" y="58" width="120" height="40"/><text class="t-n mid" x="300" y="83">150 EUR</text>
    <rect class="box f1" x="360" y="58" width="120" height="40"/><text class="t-n mid" x="420" y="83">130 EUR</text>
    <path class="ln-strong" d="M120 110 H480"/><circle class="f-ink" cx="120" cy="110" r="5"/><circle class="box" cx="480" cy="110" r="5"/>
    <text class="t-b" x="500" y="83">合计 40000 分</text>
  </g>
  <g data-s="2">
    <text class="t" x="0" y="154">相邻预订</text><text class="t-s" x="0" y="170">[27,29)</text>
    <rect class="box" x="480" y="134" width="120" height="36"/><rect class="box" x="600" y="134" width="120" height="36"/>
    <text class="t-s mid" x="540" y="156">27 日夜</text><text class="t-s mid" x="660" y="156">28 日夜</text>
    <path class="ln" d="M480 182 H720"/><circle class="f-ink" cx="480" cy="182" r="5"/><circle class="box" cx="720" cy="182" r="5"/>
  </g>
  <g data-s="3">
    <text class="t" x="0" y="226">实际时间</text>
    <path class="ln-strong" d="M195 218 H535 M195 210 V226 M535 210 V226"/>
    <text class="t-s" x="199" y="206">24 日 15:00 入住</text><text class="t-s" x="543" y="222">27 日 11:00 退房</text>
    <text class="t-n mid" x="365" y="240">69 小时</text>
    <path class="ln" d="M120 262 H480 M120 254 V270 M480 254 V270"/>
    <text class="t-s mid" x="300" y="284">两个当地午夜之间 73 小时（跨越时钟回拨）</text>
  </g>
  <g data-s="4">
    <text class="t" x="0" y="318">69 ÷ 24 向下取整 → 2 晚</text>
    <text class="t" x="260" y="318">73 ÷ 24 向上取整 → 4 晚</text>
    <text class="t-em" x="520" y="318">按日期计数 → 3 晚</text>
  </g>
</svg>
</div>
<figcaption>房晚按酒店当地日期的半开区间计数；按实际小时数除以 24，向下取整少一晚，向上取整多一晚。</figcaption>
