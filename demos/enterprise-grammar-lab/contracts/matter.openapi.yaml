openapi: 3.1.0
info:
  title: Matter Workbench API
  version: 0.2.0
  description: >
    Contract for scenario matter-workbench r0.1. The web app and any backend
    (the fake one in this demo or a real one later) are both written against
    this file. Every request carries X-Demo-Persona; identity is a demo persona,
    not authentication.
servers:
  - url: /api/matter
security:
  - persona: []

paths:
  /meta:
    get:
      operationId: getMeta
      security: []
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200": { description: Environment the backend reports, content: { application/json: { schema: { $ref: "./work.yaml#/components/schemas/Meta" } } } }
  /me:
    get:
      operationId: getMe
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200": { description: Current actor, content: { application/json: { schema: { $ref: "#/components/schemas/User" } } } }
        "401": { $ref: "#/components/responses/Problem" }
  /users:
    get:
      operationId: listUsers
      description: The demo identities. Open, because one has to be picked before anything else can be asked.
      security: []
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200": { description: Users, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/User" } } } } }
        "401": { $ref: "#/components/responses/Problem" }
  /search:
    get:
      operationId: search
      parameters:
        - { name: q, in: query, required: true, schema: { type: string } }
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200": { description: Objects the actor may see, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/SearchHit" } } } } }
        "401": { $ref: "#/components/responses/Problem" }

  /matters:
    get:
      operationId: listMatters
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { $ref: "#/components/schemas/MatterStatus" } }
        - { name: stage, in: query, schema: { $ref: "#/components/schemas/MatterStage" } }
        - { name: reviewer, in: query, description: 'A user id, "me" for the current actor, or "none" for unassigned', schema: { type: string } }
        - { name: openRisk, in: query, description: Only matters with risks awaiting disposition, schema: { type: boolean } }
        - { name: sort, in: query, schema: { $ref: "#/components/schemas/MatterSort" } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 10 } }
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200": { description: A page of matters, content: { application/json: { schema: { $ref: "#/components/schemas/MatterPage" } } } }
        "401": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /matters/{matterId}:
    parameters: [{ $ref: "#/components/parameters/matterId" }]
    get:
      operationId: getMatter
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200": { description: Matter, content: { application/json: { schema: { $ref: "#/components/schemas/Matter" } } } }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /matters/{matterId}/parties:
    parameters: [{ $ref: "#/components/parameters/matterId" }]
    get:
      operationId: listParties
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200": { description: Parties, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Party" } } } } }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /matters/{matterId}/documents:
    parameters: [{ $ref: "#/components/parameters/matterId" }]
    get:
      operationId: listDocuments
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200": { description: Documents, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Document" } } } } }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /matters/{matterId}/evidence:
    parameters: [{ $ref: "#/components/parameters/matterId" }]
    get:
      operationId: listEvidence
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200": { description: Evidence, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Evidence" } } } } }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /matters/{matterId}/risks:
    parameters: [{ $ref: "#/components/parameters/matterId" }]
    get:
      operationId: listRisks
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200": { description: Risks, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/RiskSummary" } } } } }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /matters/{matterId}/tasks:
    parameters: [{ $ref: "#/components/parameters/matterId" }]
    get:
      operationId: listTasks
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200": { description: Tasks, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Task" } } } } }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /matters/{matterId}/events:
    parameters: [{ $ref: "#/components/parameters/matterId" }]
    get:
      operationId: listEvents
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200": { description: Audit events, newest first, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/AuditEvent" } } } } }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /risks/{riskId}:
    parameters:
      - { name: riskId, in: path, required: true, schema: { type: string } }
    get:
      operationId: getRisk
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200": { description: Risk with its evidence, records and affordances, content: { application/json: { schema: { $ref: "#/components/schemas/Risk" } } } }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /saved-views:
    get:
      operationId: listSavedViews
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200": { description: Shared views and the actor's own, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/SavedView" } } } } }
        "401": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createSavedView
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/SavedViewInput" } } }
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/SavedView" } } } }
        "401": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /saved-views/{viewId}:
    parameters:
      - { name: viewId, in: path, required: true, schema: { type: string } }
    delete:
      operationId: deleteSavedView
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /actions/propose-risk-disposition:
    post:
      operationId: proposeRiskDisposition
      parameters: [{ $ref: "#/components/parameters/idempotencyKey" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/DispositionInput" } } }
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200": { $ref: "#/components/responses/ActionApplied" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /actions/decide-risk:
    post:
      operationId: decideRisk
      parameters: [{ $ref: "#/components/parameters/idempotencyKey" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/DispositionInput" } } }
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200": { $ref: "#/components/responses/ActionApplied" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /actions/return-risk-proposal:
    post:
      operationId: returnRiskProposal
      parameters: [{ $ref: "#/components/parameters/idempotencyKey" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ReturnInput" } } }
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200": { $ref: "#/components/responses/ActionApplied" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /actions/assign-reviewer:
    post:
      operationId: assignReviewer
      parameters: [{ $ref: "#/components/parameters/idempotencyKey" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AssignReviewerInput" } } }
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "202": { description: Accepted as a job; each matter is checked and applied on its own, content: { application/json: { schema: { $ref: "./work.yaml#/components/schemas/Job" } } } }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /action-attempts/{attemptId}:
    parameters:
      - { name: attemptId, in: path, required: true, schema: { type: string } }
    get:
      operationId: getActionAttempt
      description: >
        What the backend knows about one attempt. 404 means the attempt never
        arrived, so the same key may be sent again.
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200": { description: Attempt, content: { application/json: { schema: { $ref: "./work.yaml#/components/schemas/ActionAttempt" } } } }
        "404": { $ref: "#/components/responses/Problem" }
  /jobs/{jobId}:
    parameters:
      - { name: jobId, in: path, required: true, schema: { type: string } }
    get:
      operationId: getJob
      responses:
        default: { $ref: "#/components/responses/Problem" }
        "200": { description: Job, content: { application/json: { schema: { $ref: "./work.yaml#/components/schemas/Job" } } } }
        "404": { $ref: "#/components/responses/Problem" }

components:
  securitySchemes:
    persona:
      type: apiKey
      in: header
      name: X-Demo-Persona
  parameters:
    matterId: { name: matterId, in: path, required: true, schema: { type: string } }
    idempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Identity of this attempt. Sending the same key again returns the first result.
      schema: { type: string, minLength: 8 }
  responses:
    Problem:
      description: Why the request was not served
      content: { application/json: { schema: { $ref: "./work.yaml#/components/schemas/Problem" } } }
    ActionApplied:
      description: The action took effect
      content: { application/json: { schema: { $ref: "./work.yaml#/components/schemas/ActionResult" } } }

  schemas:
    User:
      allOf:
        - $ref: "./work.yaml#/components/schemas/User"
        - { type: object, properties: { role: { $ref: "#/components/schemas/Role" } } }
    Affordance:
      allOf:
        - $ref: "./work.yaml#/components/schemas/Affordance"
        - { type: object, properties: { type: { $ref: "#/components/schemas/ActionType" } } }
    ObjectKind: { type: string, enum: [matter, risk, document, evidence, task] }
    ObjectRef:
      allOf:
        - $ref: "./work.yaml#/components/schemas/ObjectRef"
        - { type: object, properties: { kind: { $ref: "#/components/schemas/ObjectKind" } } }
    AuditEventType:
      type: string
      enum: [matter-opened, document-received, document-version-added, evidence-registered, risk-registered, disposition-proposed, proposal-returned, risk-decided, reviewer-assigned, task-created]
    AuditEvent:
      allOf:
        - $ref: "./work.yaml#/components/schemas/AuditEvent"
        - type: object
          properties:
            type: { $ref: "#/components/schemas/AuditEventType" }
            target: { $ref: "#/components/schemas/ObjectRef" }
    Role: { type: string, enum: [partner, associate, paralegal] }
    ActionType:
      type: string
      enum: [propose-risk-disposition, decide-risk, return-risk-proposal, assign-reviewer]
    MatterStatus: { type: string, enum: [active, on-hold, closed] }
    MatterStage: { type: string, enum: [intake, pleading, evidence, hearing, enforcement] }
    MatterSort: { type: string, enum: [deadline, -deadline, updatedAt, -updatedAt], default: deadline }
    MatterFields:
      type: object
      required: [id, title, cause, client, counterparty, stage, status, owner, reviewer, nextDeadline, openRisks, highOpenRisks, recheckRisks, version, updatedAt]
      properties:
        id: { type: string }
        title: { type: string }
        cause: { type: string }
        client: { type: string }
        counterparty: { type: string }
        stage: { $ref: "#/components/schemas/MatterStage" }
        status: { $ref: "#/components/schemas/MatterStatus" }
        owner: { $ref: "./work.yaml#/components/schemas/UserRef" }
        reviewer: { oneOf: [{ $ref: "./work.yaml#/components/schemas/UserRef" }, { type: "null" }] }
        nextDeadline:
          oneOf:
            - type: object
              additionalProperties: false
              required: [label, date]
              properties:
                label: { type: string }
                date: { type: string, format: date }
            - type: "null"
        openRisks: { type: integer, description: Risks in state open or proposed }
        highOpenRisks: { type: integer }
        recheckRisks: { type: integer, description: Risks whose standing proposal or decision cites superseded evidence }
        version: { type: integer }
        updatedAt: { type: string, format: date-time }
    MatterSummary:
      allOf: [{ $ref: "#/components/schemas/MatterFields" }]
      unevaluatedProperties: false
    MatterPage:
      type: object
      additionalProperties: false
      required: [items, total, page, pageSize, actions]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/MatterSummary" } }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
        actions: { type: array, items: { $ref: "#/components/schemas/Affordance" } }
    Matter:
      unevaluatedProperties: false
      allOf:
        - $ref: "#/components/schemas/MatterFields"
        - type: object
          required: [court, caseNumber, openedAt, links]
          properties:
            court: { type: [string, "null"] }
            caseNumber: { type: [string, "null"] }
            openedAt: { type: string, format: date }
            links:
              type: object
              additionalProperties: false
              required: [parties, documents, evidence, risks, tasks]
              properties:
                parties: { type: integer }
                documents: { type: integer }
                evidence: { type: integer }
                risks: { type: integer }
                tasks: { type: integer }
    Party:
      type: object
      additionalProperties: false
      required: [id, name, role, kind]
      properties:
        id: { type: string }
        name: { type: string }
        role: { type: string, enum: [client, counterparty, opposing-counsel, court] }
        kind: { type: string, enum: [organization, person] }
    Document:
      type: object
      additionalProperties: false
      required: [id, title, kind, version, receivedAt, source, privileged, evidenceCount]
      properties:
        id: { type: string }
        title: { type: string }
        kind: { type: string, enum: [contract, correspondence, exhibit, pleading, memo] }
        version: { type: integer, description: Current version }
        receivedAt: { type: string, format: date }
        source: { type: string }
        privileged: { type: boolean }
        evidenceCount: { type: integer }
    Stance: { type: string, enum: [supports, refutes, limits] }
    Evidence:
      type: object
      additionalProperties: false
      required: [id, matterId, document, documentVersion, basisCurrent, restricted, locator, excerpt, risks]
      properties:
        id: { type: string }
        matterId: { type: string }
        document:
          type: object
          additionalProperties: false
          required: [id, title, version]
          properties:
            id: { type: string }
            title: { type: string }
            version: { type: integer, description: Current version of the document }
        documentVersion: { type: integer, description: The version this evidence was taken from }
        basisCurrent: { type: boolean, description: False when the document has a newer version }
        restricted: { type: boolean, description: True when the actor may know it exists but not read it }
        locator: { type: [string, "null"] }
        excerpt: { type: [string, "null"] }
        risks:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, title, stance]
            properties:
              id: { type: string }
              title: { type: string }
              stance: { $ref: "#/components/schemas/Stance" }
    Severity: { type: string, enum: [high, medium, low] }
    RiskStatus: { type: string, enum: [open, proposed, decided] }
    Disposition: { type: string, enum: [accept, mitigate, escalate] }
    RiskFields:
      type: object
      required: [id, matterId, title, category, severity, status, disposition, needsRecheck, evidenceCount, version, updatedAt]
      properties:
        id: { type: string }
        matterId: { type: string }
        title: { type: string }
        category: { type: string, enum: [limitation, evidence, performance, procedure] }
        severity: { $ref: "#/components/schemas/Severity" }
        status: { $ref: "#/components/schemas/RiskStatus" }
        disposition: { oneOf: [{ $ref: "#/components/schemas/Disposition" }, { type: "null" }], description: Set once decided }
        needsRecheck: { type: boolean, description: A recorded proposal or decision cites evidence whose document has since changed }
        evidenceCount: { type: integer }
        version: { type: integer }
        updatedAt: { type: string, format: date-time }
    RiskSummary:
      allOf: [{ $ref: "#/components/schemas/RiskFields" }]
      unevaluatedProperties: false
    DispositionRecord:
      type: object
      additionalProperties: false
      required: [kind, by, at, attemptId]
      properties:
        kind: { type: string, enum: [proposal, decision, return] }
        by: { $ref: "./work.yaml#/components/schemas/UserRef" }
        at: { type: string, format: date-time }
        attemptId: { type: string }
        disposition: { $ref: "#/components/schemas/Disposition" }
        rationale: { type: string }
        cited:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [evidenceId, documentVersion, basisCurrent]
            properties:
              evidenceId: { type: string }
              documentVersion: { type: integer }
              basisCurrent: { type: boolean }
    Risk:
      unevaluatedProperties: false
      allOf:
        - $ref: "#/components/schemas/RiskFields"
        - type: object
          required: [statement, matterTitle, next, evidence, records, actions]
          properties:
            statement: { type: string }
            matterTitle: { type: string }
            next:
              description: The step this risk is waiting for and who holds it. Null when nothing is pending.
              oneOf:
                - type: object
                  additionalProperties: false
                  required: [step, owner]
                  properties:
                    step: { type: string, enum: [propose, decide, redecide] }
                    owner: { oneOf: [{ $ref: "./work.yaml#/components/schemas/UserRef" }, { type: "null" }], description: Null when the role that holds the step has nobody assigned }
                - type: "null"
            evidence:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [stance, item]
                properties:
                  stance: { $ref: "#/components/schemas/Stance" }
                  item: { $ref: "#/components/schemas/Evidence" }
            records:
              type: array
              description: Proposals, returns and the decision, oldest first. Nothing is overwritten.
              items: { $ref: "#/components/schemas/DispositionRecord" }
            actions: { type: array, items: { $ref: "#/components/schemas/Affordance" } }
    Task:
      type: object
      additionalProperties: false
      required: [id, matterId, title, kind, assignee, dueDate, status, origin]
      properties:
        id: { type: string }
        matterId: { type: string }
        title: { type: string }
        kind: { type: string, enum: [review, follow-up, filing] }
        assignee: { $ref: "./work.yaml#/components/schemas/UserRef" }
        dueDate: { type: string, format: date }
        status: { type: string, enum: [open, done] }
        origin:
          oneOf:
            - type: object
              additionalProperties: false
              required: [attemptId, ref]
              properties:
                attemptId: { type: string }
                ref: { type: string, description: The object the originating action was about }
            - type: "null"
    MatterQuery:
      type: object
      additionalProperties: false
      properties:
        q: { type: string }
        status: { $ref: "#/components/schemas/MatterStatus" }
        stage: { $ref: "#/components/schemas/MatterStage" }
        reviewer: { type: string }
        openRisk: { type: boolean }
        sort: { $ref: "#/components/schemas/MatterSort" }
    SavedViewInput:
      type: object
      additionalProperties: false
      required: [name, query]
      properties:
        name: { type: string, minLength: 1, maxLength: 30 }
        query: { $ref: "#/components/schemas/MatterQuery" }
    SavedView:
      type: object
      additionalProperties: false
      required: [id, name, query, shared, owner]
      properties:
        id: { type: string }
        name: { type: string }
        query: { $ref: "#/components/schemas/MatterQuery" }
        shared: { type: boolean, description: Shared views belong to the team and cannot be deleted here }
        owner: { oneOf: [{ $ref: "./work.yaml#/components/schemas/UserRef" }, { type: "null" }] }
    DispositionInput:
      type: object
      additionalProperties: false
      required: [riskId, expectedVersion, disposition, rationale, citedEvidenceIds]
      properties:
        riskId: { type: string }
        expectedVersion: { type: integer }
        disposition: { $ref: "#/components/schemas/Disposition" }
        rationale: { type: string, minLength: 1 }
        citedEvidenceIds: { type: array, items: { type: string } }
    ReturnInput:
      type: object
      additionalProperties: false
      required: [riskId, expectedVersion, rationale]
      properties:
        riskId: { type: string }
        expectedVersion: { type: integer }
        rationale: { type: string, minLength: 1 }
    AssignReviewerInput:
      type: object
      additionalProperties: false
      required: [matterIds, reviewerId]
      properties:
        matterIds: { type: array, minItems: 1, items: { type: string } }
        reviewerId: { type: string }
    SearchHit:
      type: object
      additionalProperties: false
      required: [kind, id, title, matterId, context]
      properties:
        kind: { type: string, enum: [matter, risk] }
        id: { type: string }
        title: { type: string }
        matterId: { type: string }
        context: { type: string }
