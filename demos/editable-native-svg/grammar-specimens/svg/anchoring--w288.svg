<path d="M5 39 L5 59 L32 59" fill="none" stroke="#7b8ba0" stroke-width="1" data-leader-for="e-rule" data-target="c-rule"/>
<circle cx="34" cy="59" r="2.5" fill="#3d4c5e"/>
<path d="M10 126 L5 126 L5 141 L10 141" fill="none" stroke="#1b2733" stroke-width="1.5" data-bracket-for="c-check"/>
<path d="M5 141 L5 161 L32 161" fill="none" stroke="#7b8ba0" stroke-width="1" data-leader-for="e-check" data-target="c-check"/>
<circle cx="34" cy="161" r="2.5" fill="#3d4c5e"/>
<path d="M10 314 L5 314 L5 329 L10 329" fill="none" stroke="#1b2733" stroke-width="1.5" data-bracket-for="c-item"/>
<path d="M5 329 L5 349 L32 349" fill="none" stroke="#7b8ba0" stroke-width="1" data-leader-for="e-item" data-target="c-item"/>
<circle cx="34" cy="349" r="2.5" fill="#ffffff" stroke="#3d4c5e" stroke-width="1.3"/>
<path d="M17 126 L12 126 L12 141 L17 141" fill="none" stroke="#1b2733" stroke-width="1.5" data-bracket-for="c-check" data-fragment="审核通过"/>
<path d="M12 141 L12 226 L32 226" fill="none" stroke="#7b8ba0" stroke-width="1" data-leader-for="e-old" data-target="c-check"/>
<circle cx="34" cy="226" r="2.5" fill="#3d4c5e"/>
<g data-role="legend">
<circle cx="10" cy="418" r="2.5" fill="#3d4c5e" stroke="#3d4c5e" stroke-width="1.3"/>
<text x="26" y="422.2" font-size="12" fill="#526276" data-text="legend.0">已确认</text>
<circle cx="88" cy="418" r="2.5" fill="#ffffff" stroke="#3d4c5e" stroke-width="1.3"/>
<text x="104" y="422.2" font-size="12" fill="#526276" data-text="legend.1">未确认</text>
</g>
</svg>
