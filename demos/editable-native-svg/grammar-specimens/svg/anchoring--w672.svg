<svg xmlns="http://www.w3.org/2000/svg" id="anchoring-w672" viewBox="-2 -2 672 304" width="672" height="304" role="img" aria-labelledby="anchoring-w672-title anchoring-w672-desc" lang="zh-Hans" xml:lang="zh-Hans" font-family="system-ui, -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" data-asset="rel-qualify" data-asset-version="0.2.0">
<title id="anchoring-w672-title">三项主张各自的证据</title>
<desc id="anchoring-w672-desc">3 项主张，4 条限定、注释或证据，各自标在所限定的主张旁。</desc>
<g data-object-id="c-rule" data-role="claim">
<text x="0" y="15.4" font-size="14" fill="#1b2733" data-text="c-rule.text">品相受损的古籍须经修复室同意才能调阅。</text>
</g>
<g data-qualifier-id="e-rule" data-type="evidence" data-relation="supports" data-status="verified" data-source="rule-loan@3#第 8 条">
<text x="316" y="13.2" font-size="12" font-weight="600" fill="#526276" data-text="e-rule.head">证据 · 支持</text>
<text x="316" y="33.4" font-size="14" fill="#1b2733" data-text="e-rule.text">v3 新增的条文。</text>
<text x="316" y="52.2" font-size="12" fill="#526276" data-text="e-rule.source">借阅规则 v3 第 8 条 · 已核对</text>
</g>
<g data-object-id="c-check" data-role="claim">
<text x="0" y="88.4" font-size="14" fill="#1b2733" data-text="c-check.text">调阅单 D-12 已经<tspan text-decoration="underline" data-fragment-of="e-old">审核通过</tspan>。</text>
</g>
<g data-qualifier-id="e-check" data-type="evidence" data-relation="supports" data-status="verified" data-source="slip-D-12@1#审核栏">
<text x="316" y="86.2" font-size="12" font-weight="600" fill="#526276" data-text="e-check.head">证据 · 支持</text>
<text x="316" y="106.4" font-size="14" fill="#1b2733" data-text="e-check.text">审核栏有签字。</text>
<text x="316" y="125.2" font-size="12" fill="#526276" data-text="e-check.source">调阅单 D-12 v1 审核栏 · 已核对</text>
</g>
<g data-qualifier-id="e-old" data-type="evidence" data-relation="limits" data-status="verified" data-source="rule-loan@2#第 8 条">
<text x="316" y="153.2" font-size="12" font-weight="600" fill="#526276" data-text="e-old.head">证据 · 限定 · 限于“审核通过”</text>
<text x="316" y="173.4" font-size="14" fill="#1b2733" data-text="e-old.text">审核用的是 v2，那时还没有“修复室同意”这一项。</text>
<text x="316" y="192.2" font-size="12" fill="#526276" data-text="e-old.source">借阅规则 v2 第 8 条 · 已核对</text>
</g>
<g data-object-id="c-item" data-role="claim">
<text x="0" y="228.4" font-size="14" fill="#1b2733" data-text="c-item.text">馆藏 0871 书脊开裂。</text>
</g>
<g data-qualifier-id="e-item" data-type="evidence" data-relation="supports" data-status="inferred">
<text x="316" y="226.2" font-size="12" font-weight="600" fill="#526276" data-text="e-item.head">证据 · 支持</text>
<text x="316" y="246.4" font-size="14" fill="#1b2733" data-text="e-item.text">没有查到品相记录。</text>
<text x="316" y="265.2" font-size="12" fill="#526276" data-text="e-item.source">阅览室值班员口述（未定位） · 推断，未核对</text>
</g>
