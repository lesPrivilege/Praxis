<svg xmlns="http://www.w3.org/2000/svg" id="counter-height-w288" viewBox="-2 -2 288 136" width="288" height="136" role="img" aria-labelledby="counter-height-w288-title counter-height-w288-desc" lang="zh-Hans" xml:lang="zh-Hans" font-family="system-ui, -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" data-asset="counterexample" data-asset-version="0.3.0">
<title id="counter-height-w288-title">反例：并排的两条线被读成同时</title>
<desc id="counter-height-w288-desc">两条各排各的版本线并排，同一高度的刻度会被读成同一时刻。</desc>
<text x="0" y="13.2" font-size="12" font-weight="600" fill="#526276" data-text="调阅单 D-12.name">调阅单 D-12</text>
<path d="M6 38.5V100.5" fill="none" stroke="#1b2733" stroke-width="1.5"/><circle cx="6" cy="38.5" r="5" fill="#ffffff" stroke="#1b2733" stroke-width="1.5"/><circle cx="6" cy="100.5" r="5" fill="#1b2733" stroke="#1b2733" stroke-width="1.5"/>
<text x="20" y="43.4" font-size="14" font-weight="600" fill="#1b2733" data-text="调阅单 D-12.0.head">v1</text>
<text x="20" y="64.4" font-size="14" fill="#1b2733" data-text="调阅单 D-12.0.text">提交</text>
<text x="20" y="105.4" font-size="14" font-weight="600" fill="#1b2733" data-text="调阅单 D-12.1.head">v2</text>
<text x="20" y="126.4" font-size="14" fill="#1b2733" data-text="调阅单 D-12.1.text">改了取书时间</text>
<text x="150" y="13.2" font-size="12" font-weight="600" fill="#526276" data-text="借阅规则.name">借阅规则</text>
<path d="M156 38.5V100.5" fill="none" stroke="#1b2733" stroke-width="1.5"/><circle cx="156" cy="38.5" r="5" fill="#ffffff" stroke="#1b2733" stroke-width="1.5"/><circle cx="156" cy="100.5" r="5" fill="#1b2733" stroke="#1b2733" stroke-width="1.5"/>
<text x="170" y="43.4" font-size="14" font-weight="600" fill="#1b2733" data-text="借阅规则.0.head">v2</text>
<text x="170" y="64.4" font-size="14" fill="#1b2733" data-text="借阅规则.0.text">审核时用的</text>
<text x="170" y="105.4" font-size="14" font-weight="600" fill="#1b2733" data-text="借阅规则.1.head">v3</text>
<text x="170" y="126.4" font-size="14" fill="#1b2733" data-text="借阅规则.1.text">须经修复室同意</text>
</svg>
