<svg xmlns="http://www.w3.org/2000/svg" id="standing-w288" viewBox="-2 -2 288 767" width="288" height="767" role="img" aria-labelledby="standing-w288-title standing-w288-desc" lang="zh-Hans" xml:lang="zh-Hans" font-family="system-ui, -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" data-asset="rel-tracks" data-asset-version="0.2.0">
<title id="standing-w288-title">规则和调阅单各自的版本</title>
<desc id="standing-w288-desc">2 个对象各有自己的版本，4 条判断、建议或候选分别绑定到具体版本。</desc>
<g data-object-id="rule-loan" data-role="lane">
<text x="0" y="13.2" font-size="12" fill="#526276" data-text="rule-loan.role">规则</text>
<text x="0" y="33.4" font-size="14" font-weight="600" fill="#1b2733" data-text="rule-loan.id">借阅规则</text>
<path d="M6 57.5V138.5" fill="none" stroke="#1b2733" stroke-width="1.5"/><circle cx="6" cy="57.5" r="5" fill="#ffffff" stroke="#1b2733" stroke-width="1.5"/><circle cx="6" cy="138.5" r="5" fill="#1b2733" stroke="#1b2733" stroke-width="1.5"/>
<g data-version="rule-loan@2">
<text x="20" y="62.4" font-size="14" font-weight="600" fill="#1b2733" data-text="rule-loan@2.head">v2</text>
<text x="20" y="83.4" font-size="14" fill="#1b2733" data-text="rule-loan@2.label">古籍可以在阅览室调阅</text>
<text x="43" y="109.2" font-size="12" fill="#526276" data-text="check-01.ref.rule-loan@2">check-01 同时绑定这个版本（已记录）</text>
<path d="M26 90 L26 105 L31 105" fill="none" stroke="#7b8ba0" stroke-width="1" data-link-for="check-01" data-to="rule-loan@2"/>
</g>
<g data-version="rule-loan@3" data-current="true">
<text x="20" y="143.4" font-size="14" font-weight="600" fill="#1b2733" data-text="rule-loan@3.head">v3 · 当前</text>
<text x="20" y="164.4" font-size="14" fill="#1b2733" data-text="rule-loan@3.label"><tspan x="20" y="164.4">品相受损的古籍，须经修复室同意才能</tspan><tspan x="20" y="185.4">调阅</tspan></text>
<g data-binding-id="hint-01" data-origin="machine" data-state="proposed" data-basis="rule-loan@3#第 8 条">
<text x="43" y="211.2" font-size="12" font-weight="600" fill="#526276" data-text="hint-01.head">机器 · 建议 · 未生效</text>
<text x="43" y="231.4" font-size="14" fill="#1b2733" data-text="hint-01.text">规则已经更新，建议重新审核</text>
<text x="43" y="250.2" font-size="12" fill="#526276" data-text="hint-01.basis">hint-01 绑定 借阅规则 v3 第 8 条</text>
<path d="M26 192 L26 207 L31 207" fill="none" stroke="#7b8ba0" stroke-width="1" stroke-dasharray="4 3" data-link-for="hint-01" data-to="rule-loan@3"/>
<circle cx="35" cy="207" r="2.5" fill="#ffffff" stroke="#3d4c5e" stroke-width="1.3"/>
</g>
</g>
</g>
<g data-object-id="slip-D-12" data-role="lane">
<text x="0" y="288.2" font-size="12" fill="#526276" data-text="slip-D-12.role">调阅单</text>
<text x="0" y="308.4" font-size="14" font-weight="600" fill="#1b2733" data-text="slip-D-12.id">调阅单 D-12</text>
<path d="M6 332.5V470.5" fill="none" stroke="#1b2733" stroke-width="1.5"/><circle cx="6" cy="332.5" r="5" fill="#ffffff" stroke="#1b2733" stroke-width="1.5"/><circle cx="6" cy="470.5" r="5" fill="#1b2733" stroke="#1b2733" stroke-width="1.5"/>
<g data-version="slip-D-12@1">
<text x="20" y="337.4" font-size="14" font-weight="600" fill="#1b2733" data-text="slip-D-12@1.head">v1</text>
<text x="20" y="358.4" font-size="14" fill="#1b2733" data-text="slip-D-12@1.label">申请调阅馆藏 0871</text>
<g data-binding-id="check-01" data-origin="human" data-state="recorded" data-basis="slip-D-12@1">
<text x="43" y="384.2" font-size="12" font-weight="600" fill="#526276" data-text="check-01.head">人 · 审核 · 已记录</text>
<text x="43" y="404.4" font-size="14" fill="#1b2733" data-text="check-01.text">审核通过</text>
<text x="43" y="423.2" font-size="12" fill="#526276" data-text="check-01.basis"><tspan x="43" y="423.2">check-01 绑定 调阅单 D-12 v1（非当前版</tspan><tspan x="43" y="441.2">本）；借阅规则 v2 第 8 条（非当前版本）</tspan></text>
<path d="M26 365 L26 380 L31 380" fill="none" stroke="#7b8ba0" stroke-width="1" data-link-for="check-01" data-to="slip-D-12@1"/>
<circle cx="35" cy="380" r="2.5" fill="#3d4c5e"/>
</g>
</g>
<g data-version="slip-D-12@2" data-current="true">
<text x="20" y="475.4" font-size="14" font-weight="600" fill="#1b2733" data-text="slip-D-12@2.head">v2 · 当前</text>
<text x="20" y="496.4" font-size="14" fill="#1b2733" data-text="slip-D-12@2.label">改了取书时间</text>
<g data-binding-id="swap-01" data-origin="machine" data-state="rejected" data-basis="slip-D-12@2">
<text x="43" y="522.2" font-size="12" font-weight="600" fill="#526276" data-text="swap-01.head">机器 · 候选 · 已拒绝</text>
<text x="43" y="542.4" font-size="14" fill="#1b2733" data-text="swap-01.text">改为提供影印件</text>
<text x="43" y="561.2" font-size="12" fill="#526276" data-text="swap-01.basis">swap-01 绑定 调阅单 D-12 v2</text>
<text x="43" y="579.2" font-size="12" fill="#526276" data-text="swap-01.resolution"><tspan x="43" y="579.2">人 · 拒绝 · swap-01-r：读者需要看原件</tspan><tspan x="43" y="597.2">上的批注</tspan></text>
<path d="M26 503 L26 518 L31 518" fill="none" stroke="#7b8ba0" stroke-width="1" stroke-dasharray="4 3" data-link-for="swap-01" data-to="slip-D-12@2"/>
<path d="M32 515L38 521M38 515L32 521" fill="none" stroke="#3d4c5e" stroke-width="1.5"/>
</g>
<g data-binding-id="decision-01" data-origin="human" data-state="open" data-basis="slip-D-12@2">
<text x="43" y="622.2" font-size="12" font-weight="600" fill="#1f5fd1" data-text="decision-01.head">人 · 决定 · 待定</text>
<text x="43" y="642.4" font-size="14" fill="#1b2733" data-text="decision-01.text">是否放行</text>
<text x="43" y="661.2" font-size="12" fill="#526276" data-text="decision-01.basis">decision-01 绑定 调阅单 D-12 v2</text>
<path d="M26 503 L26 618 L31 618" fill="none" stroke="#1f5fd1" stroke-width="1" stroke-dasharray="4 3" data-link-for="decision-01" data-to="slip-D-12@2"/>
<circle cx="35" cy="618" r="3.5" fill="#ffffff" stroke="#1f5fd1" stroke-width="1.5"/>
</g>
<text x="43" y="686.2" font-size="12" fill="#526276" data-text="slip-D-12@2.absence.0">这个版本没有审核记录</text>
<path d="M26 503 L26 682 L31 682" fill="none" stroke="#7b8ba0" stroke-width="1" stroke-dasharray="4 3" data-absence-at="slip-D-12@2"/>
</g>
</g>
<g data-role="legend">
<path d="M0 714L20 714" fill="none" stroke="#3d4c5e" stroke-width="1.3"/>
<text x="26" y="718.2" font-size="12" fill="#526276" data-text="legend.0">已经成立</text>
<path d="M90 714L110 714" fill="none" stroke="#3d4c5e" stroke-width="1.3" stroke-dasharray="4 3"/>
<text x="116" y="718.2" font-size="12" fill="#526276" data-text="legend.1">尚未成立或没有生效</text>
<circle cx="10" cy="734" r="2.5" fill="#3d4c5e" stroke="#3d4c5e" stroke-width="1.3"/>
<text x="26" y="738.2" font-size="12" fill="#526276" data-text="legend.2">已确认</text>
<circle cx="88" cy="734" r="2.5" fill="#ffffff" stroke="#3d4c5e" stroke-width="1.3"/>
<text x="104" y="738.2" font-size="12" fill="#526276" data-text="legend.3">未确认</text>
<path d="M163 731L169 737M169 731L163 737" fill="none" stroke="#3d4c5e" stroke-width="1.5"/>
<text x="182" y="738.2" font-size="12" fill="#526276" data-text="legend.4">已拒绝</text>
<circle cx="10" cy="754" r="3.5" fill="#ffffff" stroke="#1f5fd1" stroke-width="1.5"/>
<text x="26" y="758.2" font-size="12" fill="#526276" data-text="legend.5">等人决定</text>
