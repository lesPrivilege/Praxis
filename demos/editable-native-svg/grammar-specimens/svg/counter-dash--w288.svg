<svg xmlns="http://www.w3.org/2000/svg" id="counter-dash-w288" viewBox="-2 -2 288 141" width="288" height="141" role="img" aria-labelledby="counter-dash-w288-title counter-dash-w288-desc" lang="zh-Hans" xml:lang="zh-Hans" font-family="system-ui, -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" data-asset="counterexample" data-asset-version="0.2.0">
<title id="counter-dash-w288-title">反例：一条虚线回答三个问题</title>
<desc id="counter-dash-w288-desc">三条画法相同的虚线，分别表示未生效、未核对和不存在。</desc>
<path d="M0 10.5 L36 10.5" fill="none" stroke="#3d4c5e" stroke-width="1.3" stroke-dasharray="4 3"/>
<text x="46" y="15.4" font-size="14" fill="#1b2733" data-text="row.0.label">建议：重新审核</text>
<text x="46" y="34.2" font-size="12" fill="#526276" data-text="row.0.meaning">意思是建议还没有生效</text>
<path d="M0 59.5 L36 59.5" fill="none" stroke="#3d4c5e" stroke-width="1.3" stroke-dasharray="4 3"/>
<text x="46" y="64.4" font-size="14" fill="#1b2733" data-text="row.1.label">证据：值班员口述</text>
<text x="46" y="83.2" font-size="12" fill="#526276" data-text="row.1.meaning">意思是证据还没有核对</text>
<path d="M0 108.5 L36 108.5" fill="none" stroke="#3d4c5e" stroke-width="1.3" stroke-dasharray="4 3"/>
<text x="46" y="113.4" font-size="14" fill="#1b2733" data-text="row.2.label">品相记录</text>
<text x="46" y="132.2" font-size="12" fill="#526276" data-text="row.2.meaning">意思是这份记录不存在</text>
</svg>
