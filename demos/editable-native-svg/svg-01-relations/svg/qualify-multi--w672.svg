<svg xmlns="http://www.w3.org/2000/svg" id="qualify-multi-w672" viewBox="-2 -2 672 166" width="672" height="166" role="img" aria-labelledby="qualify-multi-w672-title qualify-multi-w672-desc" lang="zh-Hans" xml:lang="zh-Hans" font-family="system-ui, -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" data-asset="rel-qualify" data-asset-version="0.1.0">
<title id="qualify-multi-w672-title">一条注释限定两项主张</title>
<desc id="qualify-multi-w672-desc">3 项主张，2 条限定、注释或证据，各自标在所限定的主张旁。</desc>
<g data-object-id="c-open" data-role="claim">
<text x="0" y="15.4" font-size="14" fill="#1b2733" data-text="c-open.text">古籍阅览室每周开放三天。</text>
</g>
<g data-qualifier-id="cond-holiday" data-type="condition">
<text x="218" y="13.2" font-size="12" font-weight="600" fill="#526276" data-text="cond-holiday.head">条件</text>
<text x="218" y="33.4" font-size="14" fill="#1b2733" data-text="cond-holiday.text">法定节假日当周另行公告。</text>
</g>
<g data-qualifier-id="note-reader" data-type="note">
<text x="218" y="62.2" font-size="12" font-weight="600" fill="#526276" data-text="note-reader.head">注释</text>
<text x="218" y="82.4" font-size="14" fill="#1b2733" data-text="note-reader.text">这两项只适用于本馆读者。</text>
</g>
<g data-object-id="c-notice" data-role="claim">
<text x="0" y="119.4" font-size="14" fill="#1b2733" data-text="c-notice.text">调阅古籍须提前预约。</text>
</g>
<g data-object-id="c-copy" data-role="claim">
<text x="0" y="156.4" font-size="14" fill="#1b2733" data-text="c-copy.text">馆内提供自助复印。</text>
</g>
<path d="M180 3 L185 3 L185 122 L180 122" fill="none" stroke="#1b2733" stroke-width="1.5" data-bracket-for="c-open c-notice"/>
<path d="M185 58 L210 58" fill="none" stroke="#7b8ba0" stroke-width="1" data-leader-for="note-reader" data-target="c-open c-notice"/>
<circle cx="212" cy="58" r="2" fill="#7b8ba0"/>
<path d="M173 3 L178 3 L178 18 L173 18" fill="none" stroke="#1b2733" stroke-width="1.5" data-bracket-for="c-open"/>
<path d="M178 9 L210 9" fill="none" stroke="#7b8ba0" stroke-width="1" data-leader-for="cond-holiday" data-target="c-open"/>
<circle cx="212" cy="9" r="2" fill="#7b8ba0"/>
</svg>
