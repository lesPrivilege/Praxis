<path d="M9 40 L9 382 L26 382" fill="none" stroke="#3d4c5e" stroke-width="1.3" marker-end="url(#fan-branch-8-w288-arrow-solid)" data-edge-id="b4" data-from="request" data-to="n4" data-state="established"/>
<path d="M9 40 L9 462 L26 462" fill="none" stroke="#3d4c5e" stroke-width="1.3" marker-end="url(#fan-branch-8-w288-arrow-solid)" data-edge-id="b5" data-from="request" data-to="n5" data-state="established"/>
<path d="M9 40 L9 542 L26 542" fill="none" stroke="#3d4c5e" stroke-width="1.3" marker-end="url(#fan-branch-8-w288-arrow-solid)" data-edge-id="b6" data-from="request" data-to="n6" data-state="established"/>
<path d="M9 40 L9 622 L26 622" fill="none" stroke="#3d4c5e" stroke-width="1.3" marker-end="url(#fan-branch-8-w288-arrow-solid)" data-edge-id="b7" data-from="request" data-to="n7" data-state="established"/>
<path d="M9 40 L9 702 L26 702" fill="none" stroke="#3d4c5e" stroke-width="1.3" marker-end="url(#fan-branch-8-w288-arrow-solid)" data-edge-id="b8" data-from="request" data-to="n8" data-state="established"/>
<g data-object-id="request" data-role="hub">
<rect x="0" y="0" width="284" height="40" rx="4" fill="#f2f5f9" stroke="#7b8ba0" stroke-width="1"/>
<text x="12" y="24.4" font-size="14" font-weight="600" fill="#1b2733" data-text="request.label">借阅申请到达</text>
</g>
<text x="0" y="747.2" font-size="12" fill="#526276" data-text="request.basis">依据：借阅规则 v3 第 2–9 条</text>
</svg>
