<svg xmlns="http://www.w3.org/2000/svg" id="fan-branch-8-w288" viewBox="-2 -2 288 756" width="288" height="756" role="img" aria-labelledby="fan-branch-8-w288-title fan-branch-8-w288-desc" lang="zh-Hans" xml:lang="zh-Hans" font-family="system-ui, -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" data-asset="rel-fan" data-asset-version="0.2.0" data-direction="out">
<title id="fan-branch-8-w288-title">借阅申请的八条分支</title>
<desc id="fan-branch-8-w288-desc">借阅申请到达之后有 8 条分支，各由条件决定。</desc>
<defs><marker id="fan-branch-8-w288-arrow-solid" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0.5 0.8 7.5 4 0.5 7.2Z" fill="#3d4c5e"/></marker></defs>
<text x="26" y="69.4" font-size="14" fill="#1b2733" data-text="b1.label">读者证有效，且近 12 个月没有逾期记录</text>
<g data-object-id="n1" data-role="node">
<rect x="26" y="80" width="258" height="40" rx="4" fill="#ffffff" stroke="#7b8ba0" stroke-width="1"/>
<text x="38" y="104.4" font-size="14" fill="#1b2733" data-text="n1.label">当日出借</text>
</g>
<text x="26" y="149.4" font-size="14" fill="#1b2733" data-text="b2.label"><tspan x="26" y="149.4">馆藏在架，但属于参考工具书</tspan><tspan x="26" y="170.4">(reference only)</tspan></text>
<g data-object-id="n2" data-role="node">
<rect x="26" y="181" width="258" height="40" rx="4" fill="#ffffff" stroke="#7b8ba0" stroke-width="1"/>
<text x="38" y="205.4" font-size="14" fill="#1b2733" data-text="n2.label">只在馆内阅览</text>
</g>
<text x="26" y="250.4" font-size="14" fill="#1b2733" data-text="b3.label">馆藏已借出，预约队列不超过 3 人</text>
<g data-object-id="n3" data-role="node">
<rect x="26" y="261" width="258" height="40" rx="4" fill="#ffffff" stroke="#7b8ba0" stroke-width="1"/>
<text x="38" y="285.4" font-size="14" fill="#1b2733" data-text="n3.label">登记预约</text>
</g>
<text x="26" y="330.4" font-size="14" fill="#1b2733" data-text="b4.label"><tspan x="26" y="330.4">馆藏已借出，预约队列超过 3 人，且读者</tspan><tspan x="26" y="351.4">同意等待 30 天以上</tspan></text>
<g data-object-id="n4" data-role="node">
<rect x="26" y="362" width="258" height="40" rx="4" fill="#ffffff" stroke="#7b8ba0" stroke-width="1"/>
<text x="38" y="386.4" font-size="14" fill="#1b2733" data-text="n4.label">登记预约，并告知预计等待时间</text>
</g>
<text x="26" y="431.4" font-size="14" fill="#1b2733" data-text="b5.label">馆藏属于古籍或 1949 年前的出版物</text>
<g data-object-id="n5" data-role="node">
<rect x="26" y="442" width="258" height="40" rx="4" fill="#ffffff" stroke="#7b8ba0" stroke-width="1"/>
<text x="38" y="466.4" font-size="14" fill="#1b2733" data-text="n5.label">转古籍阅览室，不外借</text>
</g>
<text x="26" y="511.4" font-size="14" fill="#1b2733" data-text="b6.label">馆藏在修复中，预计恢复日期未定</text>
<g data-object-id="n6" data-role="node">
<rect x="26" y="522" width="258" height="40" rx="4" fill="#ffffff" stroke="#7b8ba0" stroke-width="1"/>
<text x="38" y="546.4" font-size="14" fill="#1b2733" data-text="n6.label">告知暂不可借，登记到货通知</text>
</g>
<text x="26" y="591.4" font-size="14" fill="#1b2733" data-text="b7.label">读者证已过期，但在 30 天宽限期内</text>
<g data-object-id="n7" data-role="node">
<rect x="26" y="602" width="258" height="40" rx="4" fill="#ffffff" stroke="#7b8ba0" stroke-width="1"/>
<text x="38" y="626.4" font-size="14" fill="#1b2733" data-text="n7.label">先续证，再按上面的条件重新判断</text>
</g>
<text x="26" y="671.4" font-size="14" fill="#1b2733" data-text="b8.label">其余情况（默认）</text>
<g data-object-id="n8" data-role="node">
<rect x="26" y="682" width="258" height="40" rx="4" fill="#ffffff" stroke="#7b8ba0" stroke-width="1"/>
<text x="38" y="706.4" font-size="14" fill="#1b2733" data-text="n8.label">转人工核对</text>
</g>
