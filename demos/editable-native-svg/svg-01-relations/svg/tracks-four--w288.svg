<svg xmlns="http://www.w3.org/2000/svg" id="tracks-four-w288" viewBox="-2 -2 288 813" width="288" height="813" role="img" aria-labelledby="tracks-four-w288-title tracks-four-w288-desc" lang="zh-Hans" xml:lang="zh-Hans" font-family="system-ui, -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" data-asset="rel-tracks" data-asset-version="0.1.0">
<title id="tracks-four-w288-title">调阅单、馆藏、规则与读者证各自的版本</title>
<desc id="tracks-four-w288-desc">4 个对象各有自己的版本，3 条判断、建议或候选分别绑定到具体版本。</desc>
<g data-object-id="slip-D-12" data-role="lane">
<text x="0" y="13.2" font-size="12" fill="#526276" data-text="slip-D-12.role">调阅单</text>
<text x="0" y="33.4" font-size="14" font-weight="600" fill="#1b2733" data-text="slip-D-12.id">slip-D-12</text>
<path d="M6 57.5V195.5" fill="none" stroke="#1b2733" stroke-width="1.5"/><circle cx="6" cy="57.5" r="5" fill="#ffffff" stroke="#1b2733" stroke-width="1.5"/><circle cx="6" cy="195.5" r="5" fill="#1b2733" stroke="#1b2733" stroke-width="1.5"/>
<g data-version="slip-D-12@1">
<text x="20" y="62.4" font-size="14" font-weight="600" fill="#1b2733" data-text="slip-D-12@1.head">v1</text>
<text x="20" y="83.4" font-size="14" fill="#1b2733" data-text="slip-D-12@1.label">已提交</text>
<g data-binding-id="check-01" data-origin="human" data-state="recorded" data-basis="slip-D-12@1 rule-loan@2#第 8 条">
<text x="43" y="109.2" font-size="12" font-weight="600" fill="#526276" data-text="check-01.head">人 · 审核</text>
<text x="43" y="129.4" font-size="14" fill="#1b2733" data-text="check-01.text">按规则 v2 审核通过</text>
<text x="43" y="148.2" font-size="12" fill="#526276" data-text="check-01.basis"><tspan x="43" y="148.2">check-01 绑定 slip-D-12@v1；</tspan><tspan x="43" y="166.2">rule-loan@v2 第 8 条</tspan></text>
<path d="M26 90 L26 105 L31 105" fill="none" stroke="#3d4c5e" stroke-width="1" data-link-for="check-01" data-to="slip-D-12@1"/>
<circle cx="35" cy="105" r="2.5" fill="#3d4c5e"/>
</g>
</g>
<g data-version="slip-D-12@2" data-current="true">
<text x="20" y="200.4" font-size="14" font-weight="600" fill="#1b2733" data-text="slip-D-12@2.head">v2 · 当前</text>
<text x="20" y="221.4" font-size="14" fill="#1b2733" data-text="slip-D-12@2.label">改了取书时间</text>
<g data-binding-id="decision-01" data-origin="human" data-state="open" data-basis="slip-D-12@2">
<text x="43" y="247.2" font-size="12" font-weight="600" fill="#1f5fd1" data-text="decision-01.head">人 · 决定</text>
<text x="43" y="267.4" font-size="14" fill="#1b2733" data-text="decision-01.text">是否放行，尚未决定</text>
<text x="43" y="286.2" font-size="12" fill="#526276" data-text="decision-01.basis">decision-01 绑定 slip-D-12@v2</text>
<path d="M26 228 L26 243 L31 243" fill="none" stroke="#1f5fd1" stroke-width="1" stroke-dasharray="4 3" data-link-for="decision-01" data-to="slip-D-12@2"/>
<circle cx="35" cy="243" r="3.5" fill="#ffffff" stroke="#1f5fd1" stroke-width="1.5"/>
</g>
<text x="43" y="311.2" font-size="12" fill="#526276" data-text="slip-D-12@2.absence.0">这个版本没有审核记录</text>
<path d="M26 228 L26 307 L31 307" fill="none" stroke="#7b8ba0" stroke-width="1" stroke-dasharray="4 3" data-absence-at="slip-D-12@2"/>
</g>
</g>
<g data-object-id="item-0871" data-role="lane">
<text x="0" y="349.2" font-size="12" fill="#526276" data-text="item-0871.role">馆藏</text>
<text x="0" y="369.4" font-size="14" font-weight="600" fill="#1b2733" data-text="item-0871.id">item-0871</text>
<path d="M6 393.5V393.5" fill="none" stroke="#1b2733" stroke-width="1.5"/><circle cx="6" cy="393.5" r="5" fill="#1b2733" stroke="#1b2733" stroke-width="1.5"/>
<g data-version="item-0871@4" data-current="true">
<text x="20" y="398.4" font-size="14" font-weight="600" fill="#1b2733" data-text="item-0871@4.head">v4 · 当前</text>
<text x="20" y="419.4" font-size="14" fill="#1b2733" data-text="item-0871@4.label">在库，品相记录为“书脊开裂”</text>
</g>
</g>
<g data-object-id="rule-loan" data-role="lane">
<text x="0" y="458.2" font-size="12" fill="#526276" data-text="rule-loan.role">规则</text>
<text x="0" y="478.4" font-size="14" font-weight="600" fill="#1b2733" data-text="rule-loan.id">rule-loan</text>
<path d="M6 502.5V583.5" fill="none" stroke="#1b2733" stroke-width="1.5"/><circle cx="6" cy="502.5" r="5" fill="#ffffff" stroke="#1b2733" stroke-width="1.5"/><circle cx="6" cy="583.5" r="5" fill="#1b2733" stroke="#1b2733" stroke-width="1.5"/>
<g data-version="rule-loan@2">
<text x="20" y="507.4" font-size="14" font-weight="600" fill="#1b2733" data-text="rule-loan@2.head">v2</text>
<text x="20" y="528.4" font-size="14" fill="#1b2733" data-text="rule-loan@2.label">古籍可在阅览室调阅</text>
<text x="43" y="554.2" font-size="12" fill="#526276" data-text="check-01.ref.rule-loan@2">check-01 同时绑定这个版本（已记录）</text>
<path d="M26 535 L26 550 L31 550" fill="none" stroke="#7b8ba0" stroke-width="1" data-link-for="check-01" data-to="rule-loan@2"/>
</g>
<g data-version="rule-loan@3" data-current="true">
<text x="20" y="588.4" font-size="14" font-weight="600" fill="#1b2733" data-text="rule-loan@3.head">v3 · 当前</text>
<text x="20" y="609.4" font-size="14" fill="#1b2733" data-text="rule-loan@3.label"><tspan x="20" y="609.4">品相受损的古籍须经修复室同意 (repair</tspan><tspan x="20" y="630.4">sign-off)</tspan></text>
<g data-binding-id="hint-01" data-origin="machine" data-state="proposed" data-basis="rule-loan@3#第 8 条">
<text x="43" y="656.2" font-size="12" font-weight="600" fill="#526276" data-text="hint-01.head">机器 · 建议</text>
<text x="43" y="676.4" font-size="14" fill="#1b2733" data-text="hint-01.text">规则已更新到 v3，建议重新审核</text>
<text x="43" y="695.2" font-size="12" fill="#526276" data-text="hint-01.basis">hint-01 绑定 rule-loan@v3 第 8 条</text>
<path d="M26 637 L26 652 L31 652" fill="none" stroke="#3d4c5e" stroke-width="1" stroke-dasharray="4 3" data-link-for="hint-01" data-to="rule-loan@3"/>
<circle cx="35" cy="652" r="2.5" fill="#ffffff" stroke="#3d4c5e" stroke-width="1.3"/>
</g>
</g>
</g>
<g data-object-id="card-5521" data-role="lane">
<text x="0" y="733.2" font-size="12" fill="#526276" data-text="card-5521.role">读者证</text>
<text x="0" y="753.4" font-size="14" font-weight="600" fill="#1b2733" data-text="card-5521.id">card-5521</text>
<path d="M6 777.5V777.5" fill="none" stroke="#1b2733" stroke-width="1.5"/><circle cx="6" cy="777.5" r="5" fill="#1b2733" stroke="#1b2733" stroke-width="1.5"/>
<g data-version="card-5521@1" data-current="true">
<text x="20" y="782.4" font-size="14" font-weight="600" fill="#1b2733" data-text="card-5521@1.head">v1 · 当前</text>
<text x="20" y="803.4" font-size="14" fill="#1b2733" data-text="card-5521@1.label">有效期至 2027-03-31</text>
</g>
</g>
</svg>
