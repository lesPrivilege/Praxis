<svg xmlns="http://www.w3.org/2000/svg" id="tracks-four-w288" viewBox="-2 -2 288 883" width="288" height="883" role="img" aria-labelledby="tracks-four-w288-title tracks-four-w288-desc" lang="zh-Hans" xml:lang="zh-Hans" font-family="system-ui, -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" data-asset="rel-tracks" data-asset-version="0.2.0">
<title id="tracks-four-w288-title">调阅单、馆藏、规则与读者证各自的版本</title>
<desc id="tracks-four-w288-desc">4 个对象各有自己的版本，3 条判断、建议或候选分别绑定到具体版本。</desc>
<g data-object-id="slip-D-12" data-role="lane">
<text x="0" y="13.2" font-size="12" fill="#526276" data-text="slip-D-12.role">调阅单</text>
<text x="0" y="33.4" font-size="14" font-weight="600" fill="#1b2733" data-text="slip-D-12.id">slip-D-12</text>
<path d="M6 57.5V213.5" fill="none" stroke="#1b2733" stroke-width="1.5"/><circle cx="6" cy="57.5" r="5" fill="#ffffff" stroke="#1b2733" stroke-width="1.5"/><circle cx="6" cy="213.5" r="5" fill="#1b2733" stroke="#1b2733" stroke-width="1.5"/>
<g data-version="slip-D-12@1">
<text x="20" y="62.4" font-size="14" font-weight="600" fill="#1b2733" data-text="slip-D-12@1.head">v1</text>
<text x="20" y="83.4" font-size="14" fill="#1b2733" data-text="slip-D-12@1.label">已提交</text>
<g data-binding-id="check-01" data-origin="human" data-state="recorded" data-basis="slip-D-12@1">
<text x="43" y="109.2" font-size="12" font-weight="600" fill="#526276" data-text="check-01.head">人 · 审核 · 已记录</text>
<text x="43" y="129.4" font-size="14" fill="#1b2733" data-text="check-01.text">按规则 v2 审核通过</text>
<text x="43" y="148.2" font-size="12" fill="#526276" data-text="check-01.basis"><tspan x="43" y="148.2">check-01 绑定 slip-D-12@v1（非当前版</tspan><tspan x="43" y="166.2">本）；rule-loan@v2 第 8 条（非当前版</tspan><tspan x="43" y="184.2">本）</tspan></text>
<path d="M26 90 L26 105 L31 105" fill="none" stroke="#7b8ba0" stroke-width="1" data-link-for="check-01" data-to="slip-D-12@1"/>
<circle cx="35" cy="105" r="2.5" fill="#3d4c5e"/>
</g>
</g>
<g data-version="slip-D-12@2" data-current="true">
<text x="20" y="218.4" font-size="14" font-weight="600" fill="#1b2733" data-text="slip-D-12@2.head">v2 · 当前</text>
<text x="20" y="239.4" font-size="14" fill="#1b2733" data-text="slip-D-12@2.label">改了取书时间</text>
<g data-binding-id="decision-01" data-origin="human" data-state="open" data-basis="slip-D-12@2">
<text x="43" y="265.2" font-size="12" font-weight="600" fill="#1f5fd1" data-text="decision-01.head">人 · 决定 · 待定</text>
<text x="43" y="285.4" font-size="14" fill="#1b2733" data-text="decision-01.text">是否放行，尚未决定</text>
<text x="43" y="304.2" font-size="12" fill="#526276" data-text="decision-01.basis">decision-01 绑定 slip-D-12@v2</text>
<path d="M26 246 L26 261 L31 261" fill="none" stroke="#1f5fd1" stroke-width="1" stroke-dasharray="4 3" data-link-for="decision-01" data-to="slip-D-12@2"/>
<circle cx="35" cy="261" r="3.5" fill="#ffffff" stroke="#1f5fd1" stroke-width="1.5"/>
</g>
<text x="43" y="329.2" font-size="12" fill="#526276" data-text="slip-D-12@2.absence.0">这个版本没有审核记录</text>
<path d="M26 246 L26 325 L31 325" fill="none" stroke="#7b8ba0" stroke-width="1" stroke-dasharray="4 3" data-absence-at="slip-D-12@2"/>
</g>
</g>
<g data-object-id="item-0871" data-role="lane">
<text x="0" y="367.2" font-size="12" fill="#526276" data-text="item-0871.role">馆藏</text>
<text x="0" y="387.4" font-size="14" font-weight="600" fill="#1b2733" data-text="item-0871.id">item-0871</text>
<path d="M6 411.5V411.5" fill="none" stroke="#1b2733" stroke-width="1.5"/><circle cx="6" cy="411.5" r="5" fill="#1b2733" stroke="#1b2733" stroke-width="1.5"/>
<g data-version="item-0871@4" data-current="true">
<text x="20" y="416.4" font-size="14" font-weight="600" fill="#1b2733" data-text="item-0871@4.head">v4 · 当前</text>
<text x="20" y="437.4" font-size="14" fill="#1b2733" data-text="item-0871@4.label">在库，品相记录为“书脊开裂”</text>
</g>
</g>
<g data-object-id="rule-loan" data-role="lane">
