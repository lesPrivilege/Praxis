<text x="0" y="496.4" font-size="14" font-weight="600" fill="#1b2733" data-text="rule-loan.id">rule-loan</text>
<path d="M6 520.5V601.5" fill="none" stroke="#1b2733" stroke-width="1.5"/><circle cx="6" cy="520.5" r="5" fill="#ffffff" stroke="#1b2733" stroke-width="1.5"/><circle cx="6" cy="601.5" r="5" fill="#1b2733" stroke="#1b2733" stroke-width="1.5"/>
<g data-version="rule-loan@2">
<text x="20" y="525.4" font-size="14" font-weight="600" fill="#1b2733" data-text="rule-loan@2.head">v2</text>
<text x="20" y="546.4" font-size="14" fill="#1b2733" data-text="rule-loan@2.label">古籍可在阅览室调阅</text>
<text x="43" y="572.2" font-size="12" fill="#526276" data-text="check-01.ref.rule-loan@2">check-01 同时绑定这个版本（已记录）</text>
<path d="M26 553 L26 568 L31 568" fill="none" stroke="#7b8ba0" stroke-width="1" data-link-for="check-01" data-to="rule-loan@2"/>
</g>
<g data-version="rule-loan@3" data-current="true">
<text x="20" y="606.4" font-size="14" font-weight="600" fill="#1b2733" data-text="rule-loan@3.head">v3 · 当前</text>
<text x="20" y="627.4" font-size="14" fill="#1b2733" data-text="rule-loan@3.label"><tspan x="20" y="627.4">品相受损的古籍须经修复室同意 (repair</tspan><tspan x="20" y="648.4">sign-off)</tspan></text>
<g data-binding-id="hint-01" data-origin="machine" data-state="proposed" data-basis="rule-loan@3#第 8 条">
<text x="43" y="674.2" font-size="12" font-weight="600" fill="#526276" data-text="hint-01.head">机器 · 建议 · 未生效</text>
<text x="43" y="694.4" font-size="14" fill="#1b2733" data-text="hint-01.text">规则已更新到 v3，建议重新审核</text>
<text x="43" y="713.2" font-size="12" fill="#526276" data-text="hint-01.basis">hint-01 绑定 rule-loan@v3 第 8 条</text>
<path d="M26 655 L26 670 L31 670" fill="none" stroke="#7b8ba0" stroke-width="1" stroke-dasharray="4 3" data-link-for="hint-01" data-to="rule-loan@3"/>
<circle cx="35" cy="670" r="2.5" fill="#ffffff" stroke="#3d4c5e" stroke-width="1.3"/>
</g>
</g>
</g>
<g data-object-id="card-5521" data-role="lane">
<text x="0" y="751.2" font-size="12" fill="#526276" data-text="card-5521.role">读者证</text>
<text x="0" y="771.4" font-size="14" font-weight="600" fill="#1b2733" data-text="card-5521.id">card-5521</text>
<path d="M6 795.5V795.5" fill="none" stroke="#1b2733" stroke-width="1.5"/><circle cx="6" cy="795.5" r="5" fill="#1b2733" stroke="#1b2733" stroke-width="1.5"/>
<g data-version="card-5521@1" data-current="true">
<text x="20" y="800.4" font-size="14" font-weight="600" fill="#1b2733" data-text="card-5521@1.head">v1 · 当前</text>
<text x="20" y="821.4" font-size="14" fill="#1b2733" data-text="card-5521@1.label">有效期至 2027-03-31</text>
</g>
</g>
<g data-role="legend">
<path d="M0 850L20 850" fill="none" stroke="#3d4c5e" stroke-width="1.3"/>
<text x="26" y="854.2" font-size="12" fill="#526276" data-text="legend.0">已经成立</text>
<path d="M90 850L110 850" fill="none" stroke="#3d4c5e" stroke-width="1.3" stroke-dasharray="4 3"/>
