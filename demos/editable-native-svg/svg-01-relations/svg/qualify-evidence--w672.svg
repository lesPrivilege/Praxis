<svg xmlns="http://www.w3.org/2000/svg" id="qualify-evidence-w672" viewBox="-2 -2 672 361" width="672" height="361" role="img" aria-labelledby="qualify-evidence-w672-title qualify-evidence-w672-desc" lang="zh-Hans" xml:lang="zh-Hans" font-family="system-ui, -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" data-asset="rel-qualify" data-asset-version="0.1.0">
<title id="qualify-evidence-w672-title">三项主张各自的条件与证据</title>
<desc id="qualify-evidence-w672-desc">3 项主张，5 条限定、注释或证据，各自标在所限定的主张旁。</desc>
<g data-object-id="c-open" data-role="claim">
<text x="0" y="15.4" font-size="14" fill="#1b2733" data-text="c-open.text">古籍阅览室每周开放三天。</text>
</g>
<g data-qualifier-id="ev-notice" data-type="evidence" data-relation="supports" data-status="verified">
<text x="260" y="13.2" font-size="12" font-weight="600" fill="#526276" data-text="ev-notice.head">证据 · 支持</text>
<text x="260" y="33.4" font-size="14" fill="#1b2733" data-text="ev-notice.text">公告写明周二、周四、周六开放。</text>
<text x="260" y="52.2" font-size="12" fill="#526276" data-text="ev-notice.source">notice-03@v2 第 1 段 · 已核对</text>
</g>
<g data-qualifier-id="ev-roster" data-type="evidence" data-relation="contradicts" data-status="verified">
<text x="260" y="80.2" font-size="12" font-weight="600" fill="#526276" data-text="ev-roster.head">证据 · 反驳</text>
<text x="260" y="100.4" font-size="14" fill="#1b2733" data-text="ev-roster.text">十月值班表只排了两天。</text>
<text x="260" y="119.2" font-size="12" fill="#526276" data-text="ev-roster.source">roster-10@v1 第 3 行 · 已核对</text>
</g>
<g data-object-id="c-notice" data-role="claim">
<text x="0" y="155.4" font-size="14" fill="#1b2733" data-text="c-notice.text">调阅古籍须提前<tspan text-decoration="underline" data-fragment-of="cond-days">两个工作日</tspan>预约。</text>
</g>
<g data-qualifier-id="cond-days" data-type="condition">
<text x="260" y="153.2" font-size="12" font-weight="600" fill="#526276" data-text="cond-days.head">条件 · 限于“两个工作日”</text>
<text x="260" y="173.4" font-size="14" fill="#1b2733" data-text="cond-days.text"><tspan x="260" y="173.4">遇法定节假日顺延；跨馆调阅 (inter-library) 另加 1 个工作</tspan><tspan x="260" y="194.4">日。</tspan></text>
</g>
<g data-qualifier-id="ev-rule" data-type="evidence" data-relation="supports" data-status="inferred">
<text x="260" y="223.2" font-size="12" font-weight="600" fill="#526276" data-text="ev-rule.head">证据 · 支持</text>
<text x="260" y="243.4" font-size="14" fill="#1b2733" data-text="ev-rule.text">规则只写“提前预约”，天数来自服务台的口头说明。</text>
<text x="260" y="262.2" font-size="12" fill="#526276" data-text="ev-rule.source">rule-loan@v3 · 推断，未核对</text>
</g>
<g data-object-id="c-repair" data-role="claim">
<text x="0" y="298.4" font-size="14" fill="#1b2733" data-text="c-repair.text">修复室今年内恢复使用。</text>
</g>
<g data-qualifier-id="c-repair.no-evidence" data-type="evidence" data-status="none">
<text x="260" y="296.2" font-size="12" font-weight="600" fill="#526276" data-text="c-repair.no-evidence.head">证据 · 尚无</text>
</g>
<path d="M222 3 L227 3 L227 18 L222 18" fill="none" stroke="#1b2733" stroke-width="1.5" data-bracket-for="c-open"/>
<path d="M227 9 L252 9" fill="none" stroke="#7b8ba0" stroke-width="1" data-leader-for="ev-notice" data-target="c-open"/>
<circle cx="254" cy="9" r="2" fill="#7b8ba0"/>
<path d="M227 18 L240 18 L240 76 L252 76" fill="none" stroke="#7b8ba0" stroke-width="1" data-leader-for="ev-roster" data-target="c-open"/>
<circle cx="254" cy="76" r="2" fill="#7b8ba0"/>
<path d="M222 143 L227 143 L227 158 L222 158" fill="none" stroke="#1b2733" stroke-width="1.5" data-bracket-for="c-notice"/>
<path d="M227 158 L240 158 L240 219 L252 219" fill="none" stroke="#7b8ba0" stroke-width="1" stroke-dasharray="4 3" data-leader-for="ev-rule" data-target="c-notice"/>
<circle cx="254" cy="219" r="2" fill="#7b8ba0"/>
<path d="M222 286 L227 286 L227 301 L222 301" fill="none" stroke="#1b2733" stroke-width="1.5" data-bracket-for="c-repair"/>
<path d="M227 292 L252 292" fill="none" stroke="#7b8ba0" stroke-width="1" stroke-dasharray="4 3" data-leader-for="c-repair.no-evidence" data-target="c-repair"/>
<circle cx="254" cy="292" r="2" fill="#7b8ba0"/>
<path d="M215 143 L220 143 L220 158 L215 158" fill="none" stroke="#1b2733" stroke-width="1.5" data-bracket-for="c-notice" data-fragment="两个工作日"/>
<path d="M220 149 L252 149" fill="none" stroke="#7b8ba0" stroke-width="1" data-leader-for="cond-days" data-target="c-notice"/>
<circle cx="254" cy="149" r="2" fill="#7b8ba0"/>
<text x="0" y="331.2" font-size="12" font-weight="600" fill="#526276" data-text="g-synthetic.head">整体说明</text>
<text x="0" y="351.4" font-size="14" fill="#1b2733" data-text="g-synthetic.text">以上是合成示例，不是真实的馆务安排。</text>
</svg>
