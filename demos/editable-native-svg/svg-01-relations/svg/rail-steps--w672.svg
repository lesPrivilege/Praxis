<svg xmlns="http://www.w3.org/2000/svg" id="rail-steps-w672" viewBox="-2 -2 672 307" width="672" height="307" role="img" aria-labelledby="rail-steps-w672-title rail-steps-w672-desc" lang="zh-Hans" xml:lang="zh-Hans" font-family="system-ui, -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" data-asset="rel-rail" data-asset-version="0.3.0" data-scale="order">
<title id="rail-steps-w672-title">调阅一册古籍的步骤</title>
<desc id="rail-steps-w672-desc">5 项按先后排列，只表示次序。</desc>
<path d="M6 10.5V262.5" fill="none" stroke="#1b2733" stroke-width="1.5"/><circle cx="6" cy="10.5" r="5" fill="#ffffff" stroke="#1b2733" stroke-width="1.5"/><circle cx="6" cy="64.5" r="5" fill="#ffffff" stroke="#1b2733" stroke-width="1.5"/><circle cx="6" cy="136.5" r="5" fill="#ffffff" stroke="#1b2733" stroke-width="1.5"/><circle cx="6" cy="208.5" r="5" fill="#ffffff" stroke="#1b2733" stroke-width="1.5"/><circle cx="6" cy="262.5" r="5" fill="#ffffff" stroke="#1b2733" stroke-width="1.5"/>
<g data-row-id="s-submit" data-role="row" data-position="1" data-set-size="5">
<text x="20" y="15.4" font-size="14" font-weight="600" fill="#526276" data-text="s-submit.n">1.</text>
<text x="40" y="15.4" font-size="14" font-weight="600" fill="#1b2733" data-text="s-submit.label">提交调阅单</text>
<text x="40" y="36.4" font-size="14" fill="#1b2733" data-text="s-submit.text">写明馆藏号、取书时段和用途。</text>
</g>
<g data-row-id="s-check" data-role="row" data-position="2" data-set-size="5">
<text x="20" y="69.4" font-size="14" font-weight="600" fill="#526276" data-text="s-check.n">2.</text>
<text x="40" y="69.4" font-size="14" font-weight="600" fill="#1b2733" data-text="s-check.label">审核</text>
<text x="40" y="90.4" font-size="14" fill="#1b2733" data-text="s-check.text">馆员按当时有效的借阅规则核对。</text>
<text x="40" y="109.2" font-size="12" fill="#526276" data-text="s-check.basis">依据：借阅规则 v3 第 8 条</text>
</g>
<g data-row-id="s-repair" data-role="row" data-position="3" data-set-size="5">
<text x="20" y="141.4" font-size="14" font-weight="600" fill="#526276" data-text="s-repair.n">3.</text>
<text x="40" y="141.4" font-size="14" font-weight="600" fill="#1b2733" data-text="s-repair.label">修复室评估</text>
<text x="40" y="162.4" font-size="14" fill="#1b2733" data-text="s-repair.text">只在馆藏品相受损时需要。</text>
<text x="40" y="181.2" font-size="12" fill="#526276" data-text="s-repair.note">用时不定，从半天到数周 (case by case)</text>
</g>
<g data-row-id="s-release" data-role="row" data-position="4" data-set-size="5">
<text x="20" y="213.4" font-size="14" font-weight="600" fill="#526276" data-text="s-release.n">4.</text>
<text x="40" y="213.4" font-size="14" font-weight="600" fill="#1b2733" data-text="s-release.label">放行</text>
<text x="40" y="234.4" font-size="14" fill="#1b2733" data-text="s-release.text">由值班主任决定。</text>
</g>
<g data-row-id="s-pickup" data-role="row" data-position="5" data-set-size="5">
<text x="20" y="267.4" font-size="14" font-weight="600" fill="#526276" data-text="s-pickup.n">5.</text>
<text x="40" y="267.4" font-size="14" font-weight="600" fill="#1b2733" data-text="s-pickup.label">在古籍阅览室取书</text>
</g>
<g data-role="scale-note">
<text x="0" y="298.2" font-size="12" fill="#526276" data-text="scale#note">自上而下是先后次序；间距不表示时长。</text>
</g>
</svg>
