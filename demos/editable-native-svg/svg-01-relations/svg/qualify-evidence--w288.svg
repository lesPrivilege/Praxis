<svg xmlns="http://www.w3.org/2000/svg" id="qualify-evidence-w288" viewBox="-2 -2 288 512" width="288" height="512" role="img" aria-labelledby="qualify-evidence-w288-title qualify-evidence-w288-desc" lang="zh-Hans" xml:lang="zh-Hans" font-family="system-ui, -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" data-asset="rel-qualify" data-asset-version="0.2.0">
<title id="qualify-evidence-w288-title">三项主张各自的条件与证据</title>
<desc id="qualify-evidence-w288-desc">3 项主张，5 条限定、注释或证据，各自标在所限定的主张旁。</desc>
<g data-object-id="c-open" data-role="claim">
<text x="22" y="15.4" font-size="14" fill="#1b2733" data-text="c-open.text">古籍阅览室每周开放三天。</text>
</g>
<g data-qualifier-id="ev-notice" data-type="evidence" data-relation="supports" data-status="verified" data-source="notice-03@2#第 1 段">
<text x="40" y="42.2" font-size="12" font-weight="600" fill="#526276" data-text="ev-notice.head">证据 · 支持</text>
<text x="40" y="62.4" font-size="14" fill="#1b2733" data-text="ev-notice.text">公告写明周二、周四、周六开放。</text>
<text x="40" y="81.2" font-size="12" fill="#526276" data-text="ev-notice.source">notice-03@v2 第 1 段 · 已核对</text>
</g>
<g data-qualifier-id="ev-roster" data-type="evidence" data-relation="contradicts" data-status="verified" data-source="roster-10@1#第 3 行">
<text x="40" y="107.2" font-size="12" font-weight="600" fill="#526276" data-text="ev-roster.head">证据 · 反驳</text>
<text x="40" y="127.4" font-size="14" fill="#1b2733" data-text="ev-roster.text">十月值班表只排了两天。</text>
<text x="40" y="146.2" font-size="12" fill="#526276" data-text="ev-roster.source">roster-10@v1 第 3 行 · 已核对</text>
</g>
<g data-object-id="c-notice" data-role="claim">
<text x="22" y="182.4" font-size="14" fill="#1b2733" data-text="c-notice.text">调阅古籍须提前<tspan text-decoration="underline" data-fragment-of="cond-days">两个工作日</tspan>预约。</text>
</g>
<g data-qualifier-id="cond-days" data-type="condition">
<text x="40" y="209.2" font-size="12" font-weight="600" fill="#526276" data-text="cond-days.head">条件 · 限于“两个工作日”</text>
<text x="40" y="229.4" font-size="14" fill="#1b2733" data-text="cond-days.text"><tspan x="40" y="229.4">遇法定节假日顺延；跨馆调阅</tspan><tspan x="40" y="250.4">(inter-library) 另加 1 个工作日。</tspan></text>
</g>
<g data-qualifier-id="ev-rule" data-type="evidence" data-relation="supports" data-status="inferred" data-source="rule-loan@3">
<text x="40" y="277.2" font-size="12" font-weight="600" fill="#526276" data-text="ev-rule.head">证据 · 支持</text>
<text x="40" y="297.4" font-size="14" fill="#1b2733" data-text="ev-rule.text"><tspan x="40" y="297.4">规则只写“提前预约”，天数来自服务</tspan><tspan x="40" y="318.4">台的口头说明。</tspan></text>
<text x="40" y="337.2" font-size="12" fill="#526276" data-text="ev-rule.source">借阅规则 v3 · 推断，未核对</text>
</g>
<g data-object-id="c-repair" data-role="claim">
<text x="22" y="373.4" font-size="14" fill="#1b2733" data-text="c-repair.text">修复室今年内恢复使用。</text>
</g>
<g data-qualifier-id="c-repair.no-evidence" data-type="evidence" data-status="none">
<text x="40" y="400.2" font-size="12" font-weight="600" fill="#526276" data-text="c-repair.no-evidence.head">证据 · 尚无</text>
</g>
<path d="M10 3 L5 3 L5 18 L10 18" fill="none" stroke="#1b2733" stroke-width="1.5" data-bracket-for="c-open"/>
<path d="M5 18 L5 38 L32 38" fill="none" stroke="#7b8ba0" stroke-width="1" data-leader-for="ev-notice" data-target="c-open"/>
<circle cx="34" cy="38" r="2.5" fill="#3d4c5e"/>
<path d="M5 18 L5 103 L32 103" fill="none" stroke="#7b8ba0" stroke-width="1" data-leader-for="ev-roster" data-target="c-open"/>
<circle cx="34" cy="103" r="2.5" fill="#3d4c5e"/>
<path d="M10 170 L5 170 L5 185 L10 185" fill="none" stroke="#1b2733" stroke-width="1.5" data-bracket-for="c-notice"/>
<path d="M5 185 L5 273 L32 273" fill="none" stroke="#7b8ba0" stroke-width="1" data-leader-for="ev-rule" data-target="c-notice"/>
<circle cx="34" cy="273" r="2.5" fill="#ffffff" stroke="#3d4c5e" stroke-width="1.3"/>
<path d="M10 361 L5 361 L5 376 L10 376" fill="none" stroke="#1b2733" stroke-width="1.5" data-bracket-for="c-repair"/>
<path d="M5 376 L5 396 L32 396" fill="none" stroke="#7b8ba0" stroke-width="1" stroke-dasharray="4 3" data-leader-for="c-repair.no-evidence" data-target="c-repair"/>
<path d="M17 170 L12 170 L12 185 L17 185" fill="none" stroke="#1b2733" stroke-width="1.5" data-bracket-for="c-notice" data-fragment="两个工作日"/>
<path d="M12 185 L12 205 L32 205" fill="none" stroke="#7b8ba0" stroke-width="1" data-leader-for="cond-days" data-target="c-notice"/>
<text x="22" y="432.2" font-size="12" font-weight="600" fill="#526276" data-text="g-synthetic.head">整体说明</text>
<text x="22" y="452.4" font-size="14" fill="#1b2733" data-text="g-synthetic.text">以上是合成示例，不是真实的馆务安排。</text>
<g data-role="legend">
<path d="M0 479L20 479" fill="none" stroke="#3d4c5e" stroke-width="1.3" stroke-dasharray="4 3"/>
<text x="26" y="483.2" font-size="12" fill="#526276" data-text="legend.0">尚未成立或没有生效</text>
<circle cx="160" cy="479" r="2.5" fill="#3d4c5e" stroke="#3d4c5e" stroke-width="1.3"/>
<text x="176" y="483.2" font-size="12" fill="#526276" data-text="legend.1">已确认</text>
<circle cx="10" cy="499" r="2.5" fill="#ffffff" stroke="#3d4c5e" stroke-width="1.3"/>
<text x="26" y="503.2" font-size="12" fill="#526276" data-text="legend.2">未确认</text>
</g>
</svg>
