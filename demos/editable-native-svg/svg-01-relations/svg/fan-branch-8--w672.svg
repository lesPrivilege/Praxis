<svg xmlns="http://www.w3.org/2000/svg" id="fan-branch-8-w672" viewBox="-2 -2 672 657" width="672" height="657" role="img" aria-labelledby="fan-branch-8-w672-title fan-branch-8-w672-desc" lang="zh-Hans" xml:lang="zh-Hans" font-family="system-ui, -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" data-asset="rel-fan" data-asset-version="0.2.0" data-direction="out">
<title id="fan-branch-8-w672-title">借阅申请的八条分支</title>
<desc id="fan-branch-8-w672-desc">借阅申请到达之后有 8 条分支，各由条件决定。</desc>
<defs><marker id="fan-branch-8-w672-arrow-solid" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0.5 0.8 7.5 4 0.5 7.2Z" fill="#3d4c5e"/></marker></defs>
<path d="M187 47 L205 47 L205 47 L448 47" fill="none" stroke="#3d4c5e" stroke-width="1.3" marker-end="url(#fan-branch-8-w672-arrow-solid)" data-edge-id="b1" data-from="request" data-to="n1" data-state="established"/>
<text x="217" y="15.4" font-size="14" fill="#1b2733" data-text="b1.label"><tspan x="217" y="15.4">读者证有效，且近 12 个月没有</tspan><tspan x="217" y="36.4">逾期记录</tspan></text>
<g data-object-id="n1" data-role="node">
<rect x="448" y="27" width="220" height="40" rx="4" fill="#ffffff" stroke="#7b8ba0" stroke-width="1"/>
<text x="460" y="51.4" font-size="14" fill="#1b2733" data-text="n1.label">当日出借</text>
</g>
<path d="M187 47 L205 47 L205 128 L448 128" fill="none" stroke="#3d4c5e" stroke-width="1.3" marker-end="url(#fan-branch-8-w672-arrow-solid)" data-edge-id="b2" data-from="request" data-to="n2" data-state="established"/>
<text x="217" y="96.4" font-size="14" fill="#1b2733" data-text="b2.label"><tspan x="217" y="96.4">馆藏在架，但属于参考工具书</tspan><tspan x="217" y="117.4">(reference only)</tspan></text>
<g data-object-id="n2" data-role="node">
<rect x="448" y="108" width="220" height="40" rx="4" fill="#ffffff" stroke="#7b8ba0" stroke-width="1"/>
<text x="460" y="132.4" font-size="14" fill="#1b2733" data-text="n2.label">只在馆内阅览</text>
</g>
<path d="M187 47 L205 47 L205 209 L448 209" fill="none" stroke="#3d4c5e" stroke-width="1.3" marker-end="url(#fan-branch-8-w672-arrow-solid)" data-edge-id="b3" data-from="request" data-to="n3" data-state="established"/>
<text x="217" y="177.4" font-size="14" fill="#1b2733" data-text="b3.label"><tspan x="217" y="177.4">馆藏已借出，预约队列不超过 3</tspan><tspan x="217" y="198.4">人</tspan></text>
<g data-object-id="n3" data-role="node">
<rect x="448" y="189" width="220" height="40" rx="4" fill="#ffffff" stroke="#7b8ba0" stroke-width="1"/>
<text x="460" y="213.4" font-size="14" fill="#1b2733" data-text="n3.label">登记预约</text>
</g>
<path d="M187 47 L205 47 L205 290 L448 290" fill="none" stroke="#3d4c5e" stroke-width="1.3" marker-end="url(#fan-branch-8-w672-arrow-solid)" data-edge-id="b4" data-from="request" data-to="n4" data-state="established"/>
<text x="217" y="258.4" font-size="14" fill="#1b2733" data-text="b4.label"><tspan x="217" y="258.4">馆藏已借出，预约队列超过 3</tspan><tspan x="217" y="279.4">人，且读者同意等待 30 天以上</tspan></text>
<g data-object-id="n4" data-role="node">
<rect x="448" y="270" width="220" height="40" rx="4" fill="#ffffff" stroke="#7b8ba0" stroke-width="1"/>
<text x="460" y="294.4" font-size="14" fill="#1b2733" data-text="n4.label">登记预约，并告知预计等待时间</text>
</g>
<path d="M187 47 L205 47 L205 371 L448 371" fill="none" stroke="#3d4c5e" stroke-width="1.3" marker-end="url(#fan-branch-8-w672-arrow-solid)" data-edge-id="b5" data-from="request" data-to="n5" data-state="established"/>
<text x="217" y="339.4" font-size="14" fill="#1b2733" data-text="b5.label"><tspan x="217" y="339.4">馆藏属于古籍或 1949 年前的出</tspan><tspan x="217" y="360.4">版物</tspan></text>
<g data-object-id="n5" data-role="node">
<rect x="448" y="351" width="220" height="40" rx="4" fill="#ffffff" stroke="#7b8ba0" stroke-width="1"/>
<text x="460" y="375.4" font-size="14" fill="#1b2733" data-text="n5.label">转古籍阅览室，不外借</text>
</g>
<path d="M187 47 L205 47 L205 452 L448 452" fill="none" stroke="#3d4c5e" stroke-width="1.3" marker-end="url(#fan-branch-8-w672-arrow-solid)" data-edge-id="b6" data-from="request" data-to="n6" data-state="established"/>
<text x="217" y="420.4" font-size="14" fill="#1b2733" data-text="b6.label"><tspan x="217" y="420.4">馆藏在修复中，预计恢复日期</tspan><tspan x="217" y="441.4">未定</tspan></text>
<g data-object-id="n6" data-role="node">
<rect x="448" y="432" width="220" height="40" rx="4" fill="#ffffff" stroke="#7b8ba0" stroke-width="1"/>
<text x="460" y="456.4" font-size="14" fill="#1b2733" data-text="n6.label">告知暂不可借，登记到货通知</text>
</g>
<path d="M187 47 L205 47 L205 533 L448 533" fill="none" stroke="#3d4c5e" stroke-width="1.3" marker-end="url(#fan-branch-8-w672-arrow-solid)" data-edge-id="b7" data-from="request" data-to="n7" data-state="established"/>
<text x="217" y="501.4" font-size="14" fill="#1b2733" data-text="b7.label"><tspan x="217" y="501.4">读者证已过期，但在 30 天宽限</tspan><tspan x="217" y="522.4">期内</tspan></text>
<g data-object-id="n7" data-role="node">
<rect x="448" y="503" width="220" height="60" rx="4" fill="#ffffff" stroke="#7b8ba0" stroke-width="1"/>
<text x="460" y="527.4" font-size="14" fill="#1b2733" data-text="n7.label"><tspan x="460" y="527.4">先续证，再按上面的条件重新</tspan><tspan x="460" y="548.4">判断</tspan></text>
</g>
<path d="M187 47 L205 47 L205 603 L448 603" fill="none" stroke="#3d4c5e" stroke-width="1.3" marker-end="url(#fan-branch-8-w672-arrow-solid)" data-edge-id="b8" data-from="request" data-to="n8" data-state="established"/>
<text x="217" y="592.4" font-size="14" fill="#1b2733" data-text="b8.label">其余情况（默认）</text>
<g data-object-id="n8" data-role="node">
<rect x="448" y="583" width="220" height="40" rx="4" fill="#ffffff" stroke="#7b8ba0" stroke-width="1"/>
<text x="460" y="607.4" font-size="14" fill="#1b2733" data-text="n8.label">转人工核对</text>
</g>
<g data-object-id="request" data-role="hub">
<rect x="0" y="27" width="187" height="40" rx="4" fill="#f2f5f9" stroke="#7b8ba0" stroke-width="1"/>
<text x="12" y="51.4" font-size="14" font-weight="600" fill="#1b2733" data-text="request.label">借阅申请到达</text>
</g>
<text x="0" y="648.2" font-size="12" fill="#526276" data-text="request.basis">依据：借阅规则 v3 第 2–9 条</text>
</svg>
