<g data-role="scale-note">
<text x="0" y="244.2" font-size="12" fill="#526276" data-text="scale#note"><tspan x="0" y="244.2">标尺按时间比例，每格 30 分钟，从 2026-10-24 23:30 起；时刻按 UTC 写。文字挤在一起时上下让开，由引线接回它在标</tspan><tspan x="0" y="262.2">尺上的位置。结束时间未知的区间只画出起点，尖端的长短不表示时长。写着别的偏移的时刻，括号里是它在标尺上的时刻。</tspan><tspan x="0" y="280.2">合成偏移时钟，不声称对应真实城市的时区规则。</tspan></text>
</g>
