<svg xmlns="http://www.w3.org/2000/svg" id="fan-branch-w672" viewBox="-2 -2 672 242" width="672" height="242" role="img" aria-labelledby="fan-branch-w672-title fan-branch-w672-desc" lang="zh-Hans" xml:lang="zh-Hans" font-family="system-ui, -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" data-asset="rel-fan" data-asset-version="0.1.0" data-direction="out">
<title id="fan-branch-w672-title">借阅申请的分支</title>
<desc id="fan-branch-w672-desc">借阅申请到达之后有 4 条分支，各由条件决定。</desc>
<defs><marker id="fan-branch-w672-arrow-solid" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0.5 0.8 7.5 4 0.5 7.2Z" fill="#3d4c5e"/></marker></defs>
<path d="M187 26 L205 26 L205 26 L448 26" fill="none" stroke="#3d4c5e" stroke-width="1.3" marker-end="url(#fan-branch-w672-arrow-solid)" data-edge-id="on-shelf" data-from="request" data-to="lend" data-state="established"/>
<text x="217" y="15.4" font-size="14" fill="#1b2733" data-text="on-shelf.label">馆藏在架，读者证有效</text>
<text x="217" y="44.2" font-size="12" fill="#526276" data-text="on-shelf.sub">依据：借阅规则 v3 第 2 条</text>
<g data-object-id="lend" data-role="node">
<rect x="448" y="6" width="220" height="40" rx="4" fill="#ffffff" stroke="#7b8ba0" stroke-width="1"/>
<text x="460" y="30.4" font-size="14" fill="#1b2733" data-text="lend.label">当日出借</text>
</g>
<path d="M187 26 L205 26 L205 89 L448 89" fill="none" stroke="#3d4c5e" stroke-width="1.3" marker-end="url(#fan-branch-w672-arrow-solid)" data-edge-id="on-loan" data-from="request" data-to="reserve" data-state="established"/>
<text x="217" y="78.4" font-size="14" fill="#1b2733" data-text="on-loan.label">馆藏已借出</text>
<text x="217" y="107.2" font-size="12" fill="#526276" data-text="on-loan.sub">依据：借阅规则 v3 第 5 条</text>
<g data-object-id="reserve" data-role="node">
<rect x="448" y="69" width="220" height="40" rx="4" fill="#ffffff" stroke="#7b8ba0" stroke-width="1"/>
<text x="460" y="93.4" font-size="14" fill="#1b2733" data-text="reserve.label">登记预约</text>
</g>
<path d="M187 26 L205 26 L205 152 L448 152" fill="none" stroke="#3d4c5e" stroke-width="1.3" marker-end="url(#fan-branch-w672-arrow-solid)" data-edge-id="rare" data-from="request" data-to="reading-room" data-state="established"/>
<text x="217" y="141.4" font-size="14" fill="#1b2733" data-text="rare.label">馆藏属于古籍</text>
<text x="217" y="170.2" font-size="12" fill="#526276" data-text="rare.sub">依据：借阅规则 v3 第 8 条</text>
<g data-object-id="reading-room" data-role="node">
<rect x="448" y="132" width="220" height="40" rx="4" fill="#ffffff" stroke="#7b8ba0" stroke-width="1"/>
<text x="460" y="156.4" font-size="14" fill="#1b2733" data-text="reading-room.label">转古籍阅览室，不外借</text>
</g>
<path d="M187 26 L205 26 L205 215 L448 215" fill="none" stroke="#3d4c5e" stroke-width="1.3" marker-end="url(#fan-branch-w672-arrow-solid)" data-edge-id="otherwise" data-from="request" data-to="manual" data-state="established"/>
<text x="217" y="204.4" font-size="14" fill="#1b2733" data-text="otherwise.label">其余情况（默认）</text>
<text x="217" y="233.2" font-size="12" fill="#526276" data-text="otherwise.sub">依据：借阅规则 v3 第 9 条</text>
<g data-object-id="manual" data-role="node">
<rect x="448" y="195" width="220" height="40" rx="4" fill="#ffffff" stroke="#7b8ba0" stroke-width="1"/>
<text x="460" y="219.4" font-size="14" fill="#1b2733" data-text="manual.label">转人工核对</text>
</g>
<g data-object-id="request" data-role="hub">
<rect x="0" y="6" width="187" height="40" rx="4" fill="#f2f5f9" stroke="#7b8ba0" stroke-width="1"/>
<text x="12" y="30.4" font-size="14" font-weight="600" fill="#1b2733" data-text="request.label">借阅申请到达</text>
</g>
</svg>
