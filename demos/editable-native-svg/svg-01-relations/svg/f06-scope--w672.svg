<svg xmlns="http://www.w3.org/2000/svg" id="f06-scope-w672" viewBox="-2 -2 672 119" width="672" height="119" role="img" aria-labelledby="f06-scope-w672-title f06-scope-w672-desc" lang="zh-Hans" xml:lang="zh-Hans" font-family="system-ui, -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" data-asset="rel-qualify" data-asset-version="0.1.0">
<title id="f06-scope-w672-title">条件和注释的准确作用范围</title>
<desc id="f06-scope-w672-desc">2 项主张，2 条限定、注释或证据，各自标在所限定的主张旁。</desc>
<g data-object-id="claim-A" data-role="claim">
<text x="0" y="15.4" font-size="14" fill="#1b2733" data-text="claim-A.text">方案甲在 2027 年重新评估。</text>
</g>
<g data-qualifier-id="condition-1" data-type="condition">
<text x="234" y="13.2" font-size="12" font-weight="600" fill="#526276" data-text="condition-1.head">条件</text>
<text x="234" y="33.4" font-size="14" fill="#1b2733" data-text="condition-1.text"><tspan x="234" y="33.4">仅在两名管理员到位且改造完成后重新评估；条件文本加长时仍限定方</tspan><tspan x="234" y="54.4">案甲。</tspan></text>
</g>
<g data-object-id="claim-B" data-role="claim">
<text x="0" y="91.4" font-size="14" fill="#1b2733" data-text="claim-B.text">建议当前采用方案乙。</text>
</g>
<g data-qualifier-id="note-1" data-type="note">
<text x="234" y="89.2" font-size="12" font-weight="600" fill="#526276" data-text="note-1.head">注释</text>
<text x="234" y="109.4" font-size="14" fill="#1b2733" data-text="note-1.text">这是一项建议，未表示人已决定。</text>
</g>
<path d="M196 3 L201 3 L201 18 L196 18" fill="none" stroke="#1b2733" stroke-width="1.5" data-bracket-for="claim-A"/>
<path d="M201 9 L226 9" fill="none" stroke="#7b8ba0" stroke-width="1" data-leader-for="condition-1" data-target="claim-A"/>
<circle cx="228" cy="9" r="2" fill="#7b8ba0"/>
<path d="M196 79 L201 79 L201 94 L196 94" fill="none" stroke="#1b2733" stroke-width="1.5" data-bracket-for="claim-B"/>
<path d="M201 85 L226 85" fill="none" stroke="#7b8ba0" stroke-width="1" data-leader-for="note-1" data-target="claim-B"/>
<circle cx="228" cy="85" r="2" fill="#7b8ba0"/>
</svg>
