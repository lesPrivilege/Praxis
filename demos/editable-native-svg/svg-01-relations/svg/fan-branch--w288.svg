<svg xmlns="http://www.w3.org/2000/svg" id="fan-branch-w288" viewBox="-2 -2 288 436" width="288" height="436" role="img" aria-labelledby="fan-branch-w288-title fan-branch-w288-desc" lang="zh-Hans" xml:lang="zh-Hans" font-family="system-ui, -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" data-asset="rel-fan" data-asset-version="0.2.0" data-direction="out">
<title id="fan-branch-w288-title">借阅申请的分支</title>
<desc id="fan-branch-w288-desc">借阅申请到达之后有 4 条分支，各由条件决定。</desc>
<defs><marker id="fan-branch-w288-arrow-solid" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0.5 0.8 7.5 4 0.5 7.2Z" fill="#3d4c5e"/></marker></defs>
<text x="26" y="69.4" font-size="14" fill="#1b2733" data-text="on-shelf.label">馆藏在架，读者证有效</text>
<text x="26" y="88.2" font-size="12" fill="#526276" data-text="on-shelf.sub">依据：借阅规则 v3 第 2 条</text>
<g data-object-id="lend" data-role="node">
<rect x="26" y="98" width="258" height="40" rx="4" fill="#ffffff" stroke="#7b8ba0" stroke-width="1"/>
<text x="38" y="122.4" font-size="14" fill="#1b2733" data-text="lend.label">当日出借</text>
</g>
<text x="26" y="167.4" font-size="14" fill="#1b2733" data-text="on-loan.label">馆藏已借出</text>
<text x="26" y="186.2" font-size="12" fill="#526276" data-text="on-loan.sub">依据：借阅规则 v3 第 5 条</text>
<g data-object-id="reserve" data-role="node">
<rect x="26" y="196" width="258" height="40" rx="4" fill="#ffffff" stroke="#7b8ba0" stroke-width="1"/>
<text x="38" y="220.4" font-size="14" fill="#1b2733" data-text="reserve.label">登记预约</text>
</g>
<text x="26" y="265.4" font-size="14" fill="#1b2733" data-text="rare.label">馆藏属于古籍</text>
<text x="26" y="284.2" font-size="12" fill="#526276" data-text="rare.sub">依据：借阅规则 v3 第 8 条</text>
<g data-object-id="reading-room" data-role="node">
<rect x="26" y="294" width="258" height="40" rx="4" fill="#ffffff" stroke="#7b8ba0" stroke-width="1"/>
<text x="38" y="318.4" font-size="14" fill="#1b2733" data-text="reading-room.label">转古籍阅览室，不外借</text>
</g>
<text x="26" y="363.4" font-size="14" fill="#1b2733" data-text="otherwise.label">其余情况（默认）</text>
<text x="26" y="382.2" font-size="12" fill="#526276" data-text="otherwise.sub">依据：借阅规则 v3 第 9 条</text>
<g data-object-id="manual" data-role="node">
<rect x="26" y="392" width="258" height="40" rx="4" fill="#ffffff" stroke="#7b8ba0" stroke-width="1"/>
<text x="38" y="416.4" font-size="14" fill="#1b2733" data-text="manual.label">转人工核对</text>
</g>
<path d="M9 40 L9 118 L26 118" fill="none" stroke="#3d4c5e" stroke-width="1.3" marker-end="url(#fan-branch-w288-arrow-solid)" data-edge-id="on-shelf" data-from="request" data-to="lend" data-state="established" data-basis="rule-loan@3#第 2 条"/>
<path d="M9 40 L9 216 L26 216" fill="none" stroke="#3d4c5e" stroke-width="1.3" marker-end="url(#fan-branch-w288-arrow-solid)" data-edge-id="on-loan" data-from="request" data-to="reserve" data-state="established" data-basis="rule-loan@3#第 5 条"/>
<path d="M9 40 L9 314 L26 314" fill="none" stroke="#3d4c5e" stroke-width="1.3" marker-end="url(#fan-branch-w288-arrow-solid)" data-edge-id="rare" data-from="request" data-to="reading-room" data-state="established" data-basis="rule-loan@3#第 8 条"/>
<path d="M9 40 L9 412 L26 412" fill="none" stroke="#3d4c5e" stroke-width="1.3" marker-end="url(#fan-branch-w288-arrow-solid)" data-edge-id="otherwise" data-from="request" data-to="manual" data-state="established" data-basis="rule-loan@3#第 9 条"/>
<g data-object-id="request" data-role="hub">
<rect x="0" y="0" width="284" height="40" rx="4" fill="#f2f5f9" stroke="#7b8ba0" stroke-width="1"/>
<text x="12" y="24.4" font-size="14" font-weight="600" fill="#1b2733" data-text="request.label">借阅申请到达</text>
</g>
</svg>
