<svg xmlns="http://www.w3.org/2000/svg" id="f06-long-w288" viewBox="-2 -2 288 303" width="288" height="303" role="img" aria-labelledby="f06-long-w288-title f06-long-w288-desc" lang="zh-Hans" xml:lang="zh-Hans" font-family="system-ui, -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" data-asset="rel-qualify" data-asset-version="0.2.0">
<title id="f06-long-w288-title">条件和注释的准确作用范围</title>
<desc id="f06-long-w288-desc">2 项主张，2 条限定、注释或证据，各自标在所限定的主张旁。</desc>
<g data-object-id="claim-A" data-role="claim">
<text x="22" y="15.4" font-size="14" fill="#1b2733" data-text="claim-A.text">方案甲在 2027 年重新评估。</text>
</g>
<g data-qualifier-id="condition-1" data-type="condition">
<text x="40" y="42.2" font-size="12" font-weight="600" fill="#526276" data-text="condition-1.head">条件</text>
<text x="40" y="62.4" font-size="14" fill="#1b2733" data-text="condition-1.text"><tspan x="40" y="62.4">仅在两名管理员到位且改造完成后重新</tspan><tspan x="40" y="83.4">评估；条件文本加长时仍限定方案甲。</tspan><tspan x="40" y="104.4">补充：管理员须持 Level-2 证书，改</tspan><tspan x="40" y="125.4">造验收单 (sign-off) 编号</tspan><tspan x="40" y="146.4">2027-014 已归档。</tspan><tspan x="40" y="167.4">到位与验收缺一不可；任一项撤回，重</tspan><tspan x="40" y="188.4">新评估即中止，已作出的结论保留在记</tspan><tspan x="40" y="209.4">录里。条件再长，也只限定方案甲。</tspan></text>
</g>
<g data-object-id="claim-B" data-role="claim">
<text x="22" y="246.4" font-size="14" fill="#1b2733" data-text="claim-B.text">建议当前采用方案乙。</text>
</g>
<g data-qualifier-id="note-1" data-type="note">
<text x="40" y="273.2" font-size="12" font-weight="600" fill="#526276" data-text="note-1.head">注释</text>
<text x="40" y="293.4" font-size="14" fill="#1b2733" data-text="note-1.text">这是一项建议，未表示人已决定。</text>
</g>
<path d="M10 3 L5 3 L5 18 L10 18" fill="none" stroke="#1b2733" stroke-width="1.5" data-bracket-for="claim-A"/>
<path d="M5 18 L5 38 L32 38" fill="none" stroke="#7b8ba0" stroke-width="1" data-leader-for="condition-1" data-target="claim-A"/>
<path d="M10 234 L5 234 L5 249 L10 249" fill="none" stroke="#1b2733" stroke-width="1.5" data-bracket-for="claim-B"/>
<path d="M5 249 L5 269 L32 269" fill="none" stroke="#7b8ba0" stroke-width="1" data-leader-for="note-1" data-target="claim-B"/>
</svg>
