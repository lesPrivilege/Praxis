<svg xmlns="http://www.w3.org/2000/svg" id="scope-library-w480" viewBox="-2 -2 480 624" width="480" height="624" role="img" aria-labelledby="scope-library-w480-title scope-library-w480-desc" lang="zh-Hans" xml:lang="zh-Hans" font-family="system-ui, -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" data-asset="rel-scope" data-asset-version="0.1.0">
<title id="scope-library-w480-title">古籍调阅经过的范围</title>
<desc id="scope-library-w480-desc">5 个范围、4 个成员，3 条关系越过边界。</desc>
<defs><marker id="scope-library-w480-arrow-solid" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0.5 0.8 7.5 4 0.5 7.2Z" fill="#3d4c5e"/></marker><marker id="scope-library-w480-arrow-open" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1 7.5 4 1 7" fill="none" stroke="#3d4c5e" stroke-width="1.25"/></marker></defs>
<g data-object-id="area-reading" data-role="container">
<rect x="0" y="0" width="420" height="214" rx="6" fill="none" stroke="#7b8ba0" stroke-width="1"/>
<text x="10" y="24.4" font-size="14" font-weight="600" fill="#1b2733" data-text="area-reading.label">阅览区</text>
<text x="10" y="43.2" font-size="12" fill="#526276" data-text="area-reading.boundary">开放时间内读者可以进入；不表示馆藏可以借出</text>
<g data-object-id="shelf-open" data-role="member" data-container="area-reading">
<rect x="10" y="56" width="400" height="37" rx="4" fill="#ffffff" stroke="#7b8ba0" stroke-width="1"/>
<text x="20" y="79.4" font-size="14" fill="#1b2733" data-text="shelf-open.label">开架书架</text>
</g>
<g data-object-id="room-rare" data-role="container" data-parent="area-reading">
<rect x="10" y="101" width="400" height="103" rx="6" fill="none" stroke="#7b8ba0" stroke-width="1"/>
<text x="20" y="125.4" font-size="14" font-weight="600" fill="#1b2733" data-text="room-rare.label">古籍阅览室</text>
<text x="20" y="144.2" font-size="12" fill="#526276" data-text="room-rare.boundary">须预约进入；边界只表示房间位置</text>
<g data-object-id="desk-12" data-role="member" data-container="room-rare">
<rect x="20" y="157" width="380" height="37" rx="4" fill="#ffffff" stroke="#7b8ba0" stroke-width="1"/>
<text x="30" y="180.4" font-size="14" fill="#1b2733" data-text="desk-12.label">阅览桌 12</text>
</g>
</g>
</g>
<g data-object-id="area-stack" data-role="container">
<rect x="0" y="226" width="420" height="169" rx="6" fill="none" stroke="#7b8ba0" stroke-width="1"/>
<text x="10" y="250.4" font-size="14" font-weight="600" fill="#1b2733" data-text="area-stack.label">闭架书库</text>
<text x="10" y="269.2" font-size="12" fill="#526276" data-text="area-stack.boundary">只有馆员进入；在库内不等于有调阅权限</text>
<g data-object-id="vault" data-role="container" data-parent="area-stack">
<rect x="10" y="282" width="400" height="103" rx="6" fill="none" stroke="#7b8ba0" stroke-width="1"/>
<text x="20" y="306.4" font-size="14" font-weight="600" fill="#1b2733" data-text="vault.label">恒温库房</text>
<text x="20" y="325.2" font-size="12" fill="#526276" data-text="vault.boundary">温湿度受控的房间</text>
<g data-object-id="cabinet-a" data-role="member" data-container="vault">
<rect x="20" y="338" width="380" height="37" rx="4" fill="#ffffff" stroke="#7b8ba0" stroke-width="1"/>
<text x="30" y="361.4" font-size="14" fill="#1b2733" data-text="cabinet-a.label">古籍柜 A</text>
</g>
</g>
</g>
<g data-object-id="room-repair" data-role="container">
<rect x="0" y="407" width="420" height="84" rx="6" fill="none" stroke="#7b8ba0" stroke-width="1"/>
<text x="10" y="431.4" font-size="14" font-weight="600" fill="#1b2733" data-text="room-repair.label">修复室</text>
<text x="10" y="450.2" font-size="12" fill="#526276" data-text="room-repair.boundary">修复期间不对外</text>
<text x="10" y="476.2" font-size="12" fill="#526276" data-text="room-repair.empty">当前没有成员</text>
</g>
<g data-object-id="counter" data-role="member">
<rect x="0" y="503" width="420" height="37" rx="4" fill="#ffffff" stroke="#7b8ba0" stroke-width="1"/>
<text x="10" y="526.4" font-size="14" fill="#1b2733" data-text="counter.label">总服务台</text>
</g>
<path d="M400 352.5 L432 352.5 L432 167.5 L400 167.5" fill="none" stroke="#3d4c5e" stroke-width="1.3" marker-end="url(#scope-library-w480-arrow-solid)" data-edge-id="fetch" data-from="cabinet-a" data-to="desk-12" data-state="established"/>
<rect x="425" y="251" width="14" height="18" fill="#ffffff"/>
<text x="432" y="264.2" font-size="12" fill="#3d4c5e" text-anchor="middle" data-text="fetch.mark">①</text>
<path d="M400 175.5 L446 175.5 L446 360.5 L400 360.5" fill="none" stroke="#3d4c5e" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#scope-library-w480-arrow-open)" data-edge-id="return" data-from="desk-12" data-to="cabinet-a" data-state="pending"/>
<rect x="439" y="259" width="14" height="18" fill="#ffffff"/>
<text x="446" y="272.2" font-size="12" fill="#3d4c5e" text-anchor="middle" data-text="return.mark">②</text>
<path d="M420 521.5 L460 521.5 L460 183.5 L400 183.5" fill="none" stroke="#3d4c5e" stroke-width="1.3" marker-end="url(#scope-library-w480-arrow-solid)" data-edge-id="confirm" data-from="counter" data-to="desk-12" data-state="established"/>
<rect x="453" y="343.5" width="14" height="18" fill="#ffffff"/>
<text x="460" y="356.7" font-size="12" fill="#3d4c5e" text-anchor="middle" data-text="confirm.mark">③</text>
<text x="0" y="567.2" font-size="12" fill="#1b2733" data-text="fetch.key">① 调阅：古籍柜 A → 阅览桌 12。已送达。依据：调阅单 D-12</text>
<text x="0" y="589.2" font-size="12" fill="#1b2733" data-text="return.key">② 归还：阅览桌 12 → 古籍柜 A。尚未归还。依据：调阅单 D-12 回执栏</text>
<text x="0" y="611.2" font-size="12" fill="#1b2733" data-text="confirm.key">③ 预约确认：总服务台 → 阅览桌 12。已确认。依据：预约登记 0412</text>
</svg>
