<svg xmlns="http://www.w3.org/2000/svg" id="qualify-multi-w288" viewBox="-2 -2 288 193" width="288" height="193" role="img" aria-labelledby="qualify-multi-w288-title qualify-multi-w288-desc" lang="zh-Hans" xml:lang="zh-Hans" font-family="system-ui, -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" data-asset="rel-qualify" data-asset-version="0.2.0">
<title id="qualify-multi-w288-title">一条注释限定两项主张</title>
<desc id="qualify-multi-w288-desc">3 项主张，2 条限定、注释或证据，各自标在所限定的主张旁。</desc>
<g data-object-id="c-open" data-role="claim">
<text x="22" y="15.4" font-size="14" fill="#1b2733" data-text="c-open.text">古籍阅览室每周开放三天。</text>
</g>
<g data-qualifier-id="cond-holiday" data-type="condition">
<text x="40" y="42.2" font-size="12" font-weight="600" fill="#526276" data-text="cond-holiday.head">条件</text>
<text x="40" y="62.4" font-size="14" fill="#1b2733" data-text="cond-holiday.text">法定节假日当周另行公告。</text>
</g>
<g data-object-id="c-notice" data-role="claim">
<text x="22" y="99.4" font-size="14" fill="#1b2733" data-text="c-notice.text">调阅古籍须提前预约。</text>
</g>
<g data-qualifier-id="note-reader" data-type="note">
<text x="40" y="126.2" font-size="12" font-weight="600" fill="#526276" data-text="note-reader.head">注释</text>
<text x="40" y="146.4" font-size="14" fill="#1b2733" data-text="note-reader.text">这两项只适用于本馆读者。</text>
</g>
<g data-object-id="c-copy" data-role="claim">
<text x="22" y="183.4" font-size="14" fill="#1b2733" data-text="c-copy.text">馆内提供自助复印。</text>
</g>
<path d="M10 3 L5 3 L5 102 L10 102" fill="none" stroke="#1b2733" stroke-width="1.5" data-bracket-for="c-open c-notice"/>
<path d="M5 102 L5 122 L32 122" fill="none" stroke="#7b8ba0" stroke-width="1" data-leader-for="note-reader" data-target="c-open c-notice"/>
<path d="M17 3 L12 3 L12 18 L17 18" fill="none" stroke="#1b2733" stroke-width="1.5" data-bracket-for="c-open"/>
<path d="M12 18 L12 38 L32 38" fill="none" stroke="#7b8ba0" stroke-width="1" data-leader-for="cond-holiday" data-target="c-open"/>
</svg>
