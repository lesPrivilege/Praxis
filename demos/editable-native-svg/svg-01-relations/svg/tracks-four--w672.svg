<text x="20" y="510.4" font-size="14" fill="#1b2733" data-text="rule-loan@2.label">古籍可在阅览室调阅</text>
<text x="43" y="536.2" font-size="12" fill="#526276" data-text="check-01.ref.rule-loan@2">check-01 同时绑定这个版本（已记录）</text>
