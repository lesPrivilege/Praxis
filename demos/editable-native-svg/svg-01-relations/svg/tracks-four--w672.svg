<text x="43" y="656.2" font-size="12" fill="#526276" data-text="hint-01.basis">hint-01 绑定 rule-loan@v3 第 8 条</text>
<path d="M26 598 L26 613 L31 613" fill="none" stroke="#7b8ba0" stroke-width="1" stroke-dasharray="4 3" data-link-for="hint-01" data-to="rule-loan@3"/>
<circle cx="35" cy="613" r="2.5" fill="#ffffff" stroke="#3d4c5e" stroke-width="1.3"/>
</g>
</g>
</g>
