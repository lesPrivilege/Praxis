<text x="0" y="714.4" font-size="14" font-weight="600" fill="#1b2733" data-text="card-5521.id">card-5521</text>
<path d="M6 738.5V738.5" fill="none" stroke="#1b2733" stroke-width="1.5"/><circle cx="6" cy="738.5" r="5" fill="#1b2733" stroke="#1b2733" stroke-width="1.5"/>
