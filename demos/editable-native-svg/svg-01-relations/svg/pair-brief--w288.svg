<svg xmlns="http://www.w3.org/2000/svg" id="pair-brief-w288" viewBox="-2 -2 288 486" width="288" height="486" role="img" aria-labelledby="pair-brief-w288-title pair-brief-w288-desc" lang="zh-Hans" xml:lang="zh-Hans" font-family="system-ui, -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" data-asset="rel-pair" data-asset-version="0.3.0" data-scale="list" data-layout="stacked" data-lanes="source view">
<title id="pair-brief-w288-title">给修复室的摘要选了哪些字段</title>
<desc id="pair-brief-w288-desc">调阅单 D-12 v2 有 4 个字段，给修复室的摘要选入 2 个；没有选入的仍在源里。</desc>
<text x="0" y="13.2" font-size="12" fill="#526276" data-text="source.ref">调阅单：调阅单 D-12 v2</text>
<text x="0" y="31.2" font-size="12" fill="#526276" data-text="view.ref">给修复室的摘要：调阅单 D-12 v1</text>
<path d="M0 42H284" fill="none" stroke="#a7b4c4" stroke-width="1"/>
<g data-row-id="item" data-role="row" data-selected="true">
<text x="0" y="64.4" font-size="14" font-weight="600" fill="#1b2733" data-text="item.label">馆藏</text>
<text x="0" y="86.7" font-size="12" fill="#526276" data-text="item.source.lane">调阅单</text>
<text x="94" y="87.4" font-size="14" fill="#1b2733" data-text="item.source">0871</text>
<text x="0" y="109.7" font-size="12" fill="#526276" data-text="item.view.lane">给修复室的摘要</text>
<text x="94" y="110.4" font-size="14" fill="#1b2733" data-text="item.view">选入</text>
</g>
<path d="M0 123H284" fill="none" stroke="#a7b4c4" stroke-width="1"/>
<g data-row-id="slot" data-role="row" data-selected="true">
<text x="0" y="145.4" font-size="14" font-weight="600" fill="#1b2733" data-text="slot.label">取书时段</text>
<text x="0" y="167.7" font-size="12" fill="#526276" data-text="slot.source.lane">调阅单</text>
<text x="94" y="168.4" font-size="14" fill="#1b2733" data-text="slot.source">10 月 6 日 15:30–16:30</text>
<text x="0" y="190.7" font-size="12" fill="#526276" data-text="slot.view.lane">给修复室的摘要</text>
<text x="94" y="191.4" font-size="14" fill="#1b2733" data-text="slot.view">选入</text>
</g>
<path d="M0 204H284" fill="none" stroke="#a7b4c4" stroke-width="1"/>
<g data-row-id="reader" data-role="row" data-selected="false">
<text x="0" y="226.4" font-size="14" font-weight="600" fill="#1b2733" data-text="reader.label">读者证</text>
<text x="0" y="248.7" font-size="12" fill="#526276" data-text="reader.source.lane">调阅单</text>
<text x="94" y="249.4" font-size="14" fill="#1b2733" data-text="reader.source">5521</text>
<text x="0" y="271.7" font-size="12" fill="#526276" data-text="reader.view.lane">给修复室的摘要</text>
<text x="94" y="272.4" font-size="14" fill="#526276" data-text="reader.view">没有选入，仍在源里</text>
</g>
<path d="M0 285H284" fill="none" stroke="#a7b4c4" stroke-width="1"/>
<g data-row-id="purpose" data-role="row" data-selected="false">
<text x="0" y="307.4" font-size="14" font-weight="600" fill="#1b2733" data-text="purpose.label">用途说明</text>
<text x="0" y="329.7" font-size="12" fill="#526276" data-text="purpose.source.lane">调阅单</text>
<text x="94" y="330.4" font-size="14" fill="#1b2733" data-text="purpose.source">核对卷三眉批的墨色与笔迹</text>
<text x="0" y="352.7" font-size="12" fill="#526276" data-text="purpose.view.lane">给修复室的摘要</text>
<text x="94" y="353.4" font-size="14" fill="#526276" data-text="purpose.view"><tspan x="94" y="353.4">选取时还没有这个字段（v2 新</tspan><tspan x="94" y="374.4">增）</tspan></text>
</g>
<g data-role="scale-note">
<text x="0" y="405.2" font-size="12" fill="#526276" data-text="scale#note"><tspan x="0" y="405.2">同一行的几栏说的是同一项；行的次序没有含义。没</tspan><tspan x="0" y="423.2">有选入的字段照样列出；选取只读，不改源。给修复</tspan><tspan x="0" y="441.2">室的摘要依据的是调阅单 D-12 v1，源现在是调阅单</tspan><tspan x="0" y="459.2">D-12 v2（非当前版本）。1 个字段是选取之后才有</tspan><tspan x="0" y="477.2">的。</tspan></text>
</g>
</svg>
