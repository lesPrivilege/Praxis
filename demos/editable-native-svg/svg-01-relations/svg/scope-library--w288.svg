<svg xmlns="http://www.w3.org/2000/svg" id="scope-library-w288" viewBox="-2 -2 288 714" width="288" height="714" role="img" aria-labelledby="scope-library-w288-title scope-library-w288-desc" lang="zh-Hans" xml:lang="zh-Hans" font-family="system-ui, -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" data-asset="rel-scope" data-asset-version="0.1.0">
<title id="scope-library-w288-title">古籍调阅经过的范围</title>
<desc id="scope-library-w288-desc">5 个范围、4 个成员，3 条关系越过边界。</desc>
<defs><marker id="scope-library-w288-arrow-solid" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0.5 0.8 7.5 4 0.5 7.2Z" fill="#3d4c5e"/></marker><marker id="scope-library-w288-arrow-open" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1 7.5 4 1 7" fill="none" stroke="#3d4c5e" stroke-width="1.25"/></marker></defs>
<g data-object-id="area-reading" data-role="container">
<rect x="0" y="0" width="228" height="232" rx="6" fill="none" stroke="#7b8ba0" stroke-width="1"/>
<text x="10" y="24.4" font-size="14" font-weight="600" fill="#1b2733" data-text="area-reading.label">阅览区</text>
<text x="10" y="43.2" font-size="12" fill="#526276" data-text="area-reading.boundary"><tspan x="10" y="43.2">开放时间内读者可以进入；不表示馆藏</tspan><tspan x="10" y="61.2">可以借出</tspan></text>
<g data-object-id="shelf-open" data-role="member" data-container="area-reading">
<rect x="10" y="74" width="208" height="37" rx="4" fill="#ffffff" stroke="#7b8ba0" stroke-width="1"/>
<text x="20" y="97.4" font-size="14" fill="#1b2733" data-text="shelf-open.label">开架书架</text>
</g>
<g data-object-id="room-rare" data-role="container" data-parent="area-reading">
<rect x="10" y="119" width="208" height="103" rx="6" fill="none" stroke="#7b8ba0" stroke-width="1"/>
<text x="20" y="143.4" font-size="14" font-weight="600" fill="#1b2733" data-text="room-rare.label">古籍阅览室</text>
<text x="20" y="162.2" font-size="12" fill="#526276" data-text="room-rare.boundary">须预约进入；边界只表示房间位置</text>
<g data-object-id="desk-12" data-role="member" data-container="room-rare">
<rect x="20" y="175" width="188" height="37" rx="4" fill="#ffffff" stroke="#7b8ba0" stroke-width="1"/>
<text x="30" y="198.4" font-size="14" fill="#1b2733" data-text="desk-12.label">阅览桌 12</text>
</g>
</g>
</g>
<g data-object-id="area-stack" data-role="container">
<rect x="0" y="244" width="228" height="187" rx="6" fill="none" stroke="#7b8ba0" stroke-width="1"/>
<text x="10" y="268.4" font-size="14" font-weight="600" fill="#1b2733" data-text="area-stack.label">闭架书库</text>
<text x="10" y="287.2" font-size="12" fill="#526276" data-text="area-stack.boundary"><tspan x="10" y="287.2">只有馆员进入；在库内不等于有调阅</tspan><tspan x="10" y="305.2">权限</tspan></text>
<g data-object-id="vault" data-role="container" data-parent="area-stack">
<rect x="10" y="318" width="208" height="103" rx="6" fill="none" stroke="#7b8ba0" stroke-width="1"/>
<text x="20" y="342.4" font-size="14" font-weight="600" fill="#1b2733" data-text="vault.label">恒温库房</text>
<text x="20" y="361.2" font-size="12" fill="#526276" data-text="vault.boundary">温湿度受控的房间</text>
<g data-object-id="cabinet-a" data-role="member" data-container="vault">
<rect x="20" y="374" width="188" height="37" rx="4" fill="#ffffff" stroke="#7b8ba0" stroke-width="1"/>
<text x="30" y="397.4" font-size="14" fill="#1b2733" data-text="cabinet-a.label">古籍柜 A</text>
</g>
</g>
</g>
<g data-object-id="room-repair" data-role="container">
<rect x="0" y="443" width="228" height="84" rx="6" fill="none" stroke="#7b8ba0" stroke-width="1"/>
<text x="10" y="467.4" font-size="14" font-weight="600" fill="#1b2733" data-text="room-repair.label">修复室</text>
<text x="10" y="486.2" font-size="12" fill="#526276" data-text="room-repair.boundary">修复期间不对外</text>
<text x="10" y="512.2" font-size="12" fill="#526276" data-text="room-repair.empty">当前没有成员</text>
</g>
<g data-object-id="counter" data-role="member">
<rect x="0" y="539" width="228" height="37" rx="4" fill="#ffffff" stroke="#7b8ba0" stroke-width="1"/>
<text x="10" y="562.4" font-size="14" fill="#1b2733" data-text="counter.label">总服务台</text>
</g>
<path d="M208 388.5 L240 388.5 L240 185.5 L208 185.5" fill="none" stroke="#3d4c5e" stroke-width="1.3" marker-end="url(#scope-library-w288-arrow-solid)" data-edge-id="fetch" data-from="cabinet-a" data-to="desk-12" data-state="established"/>
<rect x="233" y="278" width="14" height="18" fill="#ffffff"/>
<text x="240" y="291.2" font-size="12" fill="#3d4c5e" text-anchor="middle" data-text="fetch.mark">①</text>
<path d="M208 193.5 L254 193.5 L254 396.5 L208 396.5" fill="none" stroke="#3d4c5e" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#scope-library-w288-arrow-open)" data-edge-id="return" data-from="desk-12" data-to="cabinet-a" data-state="pending"/>
<rect x="247" y="286" width="14" height="18" fill="#ffffff"/>
<text x="254" y="299.2" font-size="12" fill="#3d4c5e" text-anchor="middle" data-text="return.mark">②</text>
<path d="M228 557.5 L268 557.5 L268 201.5 L208 201.5" fill="none" stroke="#3d4c5e" stroke-width="1.3" marker-end="url(#scope-library-w288-arrow-solid)" data-edge-id="confirm" data-from="counter" data-to="desk-12" data-state="established"/>
<rect x="261" y="370.5" width="14" height="18" fill="#ffffff"/>
<text x="268" y="383.7" font-size="12" fill="#3d4c5e" text-anchor="middle" data-text="confirm.mark">③</text>
<text x="0" y="603.2" font-size="12" fill="#1b2733" data-text="fetch.key"><tspan x="0" y="603.2">① 调阅：古籍柜 A → 阅览桌 12。已送达。依据：调</tspan><tspan x="0" y="621.2">阅单 D-12</tspan></text>
<text x="0" y="643.2" font-size="12" fill="#1b2733" data-text="return.key"><tspan x="0" y="643.2">② 归还：阅览桌 12 → 古籍柜 A。尚未归还。依据：</tspan><tspan x="0" y="661.2">调阅单 D-12 回执栏</tspan></text>
<text x="0" y="683.2" font-size="12" fill="#1b2733" data-text="confirm.key"><tspan x="0" y="683.2">③ 预约确认：总服务台 → 阅览桌 12。已确认。依</tspan><tspan x="0" y="701.2">据：预约登记 0412</tspan></text>
</svg>
