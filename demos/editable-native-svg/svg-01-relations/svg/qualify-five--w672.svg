<svg xmlns="http://www.w3.org/2000/svg" id="qualify-five-w672" viewBox="-2 -2 672 359" width="672" height="359" role="img" aria-labelledby="qualify-five-w672-title qualify-five-w672-desc" lang="zh-Hans" xml:lang="zh-Hans" font-family="system-ui, -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" data-asset="rel-qualify" data-asset-version="0.2.0">
<title id="qualify-five-w672-title">一项主张的五条来源</title>
<desc id="qualify-five-w672-desc">1 项主张，5 条限定、注释或证据，各自标在所限定的主张旁。</desc>
<g data-object-id="c-open" data-role="claim">
<text x="0" y="15.4" font-size="14" fill="#1b2733" data-text="c-open.text">古籍阅览室每周开放三天。</text>
</g>
<g data-qualifier-id="ev-notice" data-type="evidence" data-relation="supports" data-status="verified" data-source="notice-03@2#第 1 段">
<text x="218" y="13.2" font-size="12" font-weight="600" fill="#526276" data-text="ev-notice.head">证据 · 支持</text>
<text x="218" y="33.4" font-size="14" fill="#1b2733" data-text="ev-notice.text">公告写明周二、周四、周六开放。</text>
<text x="218" y="52.2" font-size="12" fill="#526276" data-text="ev-notice.source">notice-03@v2 第 1 段 · 已核对</text>
</g>
<g data-qualifier-id="ev-site" data-type="evidence" data-relation="supports" data-status="verified" data-source="site-hours@5#开放时间表">
<text x="218" y="80.2" font-size="12" font-weight="600" fill="#526276" data-text="ev-site.head">证据 · 支持</text>
<text x="218" y="100.4" font-size="14" fill="#1b2733" data-text="ev-site.text">网站开放时间表与公告一致。</text>
<text x="218" y="119.2" font-size="12" fill="#526276" data-text="ev-site.source">site-hours@v5 开放时间表 · 已核对</text>
</g>
<g data-qualifier-id="ev-desk" data-type="evidence" data-relation="supports" data-status="inferred">
<text x="218" y="147.2" font-size="12" font-weight="600" fill="#526276" data-text="ev-desk.head">证据 · 支持</text>
<text x="218" y="167.4" font-size="14" fill="#1b2733" data-text="ev-desk.text">没有书面记录。</text>
<text x="218" y="186.2" font-size="12" fill="#526276" data-text="ev-desk.source">服务台口头确认（未定位） · 推断，未核对</text>
</g>
<g data-qualifier-id="ev-roster" data-type="evidence" data-relation="contradicts" data-status="verified" data-source="roster-10@1#第 3 行">
<text x="218" y="214.2" font-size="12" font-weight="600" fill="#526276" data-text="ev-roster.head">证据 · 反驳</text>
<text x="218" y="234.4" font-size="14" fill="#1b2733" data-text="ev-roster.text">十月值班表只排了两天。</text>
<text x="218" y="253.2" font-size="12" fill="#526276" data-text="ev-roster.source">roster-10@v1 第 3 行 · 已核对</text>
</g>
<g data-qualifier-id="ev-holiday" data-type="evidence" data-relation="limits" data-status="verified" data-source="notice-03@2#第 3 段">
<text x="218" y="281.2" font-size="12" font-weight="600" fill="#526276" data-text="ev-holiday.head">证据 · 限定</text>
<text x="218" y="301.4" font-size="14" fill="#1b2733" data-text="ev-holiday.text">法定节假日当周另行公告。</text>
<text x="218" y="320.2" font-size="12" fill="#526276" data-text="ev-holiday.source">notice-03@v2 第 3 段 · 已核对</text>
</g>
<path d="M180 3 L185 3 L185 18 L180 18" fill="none" stroke="#1b2733" stroke-width="1.5" data-bracket-for="c-open"/>
<path d="M185 9 L210 9" fill="none" stroke="#7b8ba0" stroke-width="1" data-leader-for="ev-notice" data-target="c-open"/>
<circle cx="212" cy="9" r="2.5" fill="#3d4c5e"/>
<path d="M185 18 L198 18 L198 76 L210 76" fill="none" stroke="#7b8ba0" stroke-width="1" data-leader-for="ev-site" data-target="c-open"/>
<circle cx="212" cy="76" r="2.5" fill="#3d4c5e"/>
<path d="M185 18 L198 18 L198 143 L210 143" fill="none" stroke="#7b8ba0" stroke-width="1" data-leader-for="ev-desk" data-target="c-open"/>
<circle cx="212" cy="143" r="2.5" fill="#ffffff" stroke="#3d4c5e" stroke-width="1.3"/>
<path d="M185 18 L198 18 L198 210 L210 210" fill="none" stroke="#7b8ba0" stroke-width="1" data-leader-for="ev-roster" data-target="c-open"/>
<circle cx="212" cy="210" r="2.5" fill="#3d4c5e"/>
<path d="M185 18 L198 18 L198 277 L210 277" fill="none" stroke="#7b8ba0" stroke-width="1" data-leader-for="ev-holiday" data-target="c-open"/>
<circle cx="212" cy="277" r="2.5" fill="#3d4c5e"/>
<g data-role="legend">
<circle cx="10" cy="346" r="2.5" fill="#3d4c5e" stroke="#3d4c5e" stroke-width="1.3"/>
<text x="26" y="350.2" font-size="12" fill="#526276" data-text="legend.0">已确认</text>
<circle cx="88" cy="346" r="2.5" fill="#ffffff" stroke="#3d4c5e" stroke-width="1.3"/>
<text x="104" y="350.2" font-size="12" fill="#526276" data-text="legend.1">未确认</text>
</g>
</svg>
