<svg xmlns="http://www.w3.org/2000/svg" id="fan-join-w288" viewBox="-2 -2 288 450" width="288" height="450" role="img" aria-labelledby="fan-join-w288-title fan-join-w288-desc" lang="zh-Hans" xml:lang="zh-Hans" font-family="system-ui, -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" data-asset="rel-fan" data-asset-version="0.2.0" data-direction="in" data-rule="all">
<title id="fan-join-w288-title">开馆前须到位的三项</title>
<desc id="fan-join-w288-desc">开馆由 3 项输入汇合，须全部到位，已到位 2 项，汇合条件未满足。</desc>
<defs><marker id="fan-join-w288-arrow-open" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1 7.5 4 1 7" fill="none" stroke="#3d4c5e" stroke-width="1.25"/></marker></defs>
<text x="26" y="15.4" font-size="14" fill="#1b2733" data-text="in-fire.label">当日记录已签字</text>
<g data-object-id="fire-check" data-role="node">
<rect x="26" y="26" width="258" height="40" rx="4" fill="#ffffff" stroke="#7b8ba0" stroke-width="1"/>
<text x="38" y="50.4" font-size="14" fill="#1b2733" data-text="fire-check.label">消防通道检查</text>
</g>
<text x="26" y="95.4" font-size="14" fill="#1b2733" data-text="in-roster.label">值班人已确认</text>
<g data-object-id="roster" data-role="node">
<rect x="26" y="106" width="258" height="40" rx="4" fill="#ffffff" stroke="#7b8ba0" stroke-width="1"/>
<text x="38" y="130.4" font-size="14" fill="#1b2733" data-text="roster.label">值班表</text>
</g>
<text x="26" y="175.4" font-size="14" fill="#1b2733" data-text="in-device.label">自检日志</text>
<text x="26" y="194.2" font-size="12" fill="#526276" data-text="in-device.sub">尚未成立，尚未提交</text>
<g data-object-id="device-log" data-role="node">
<rect x="26" y="204" width="258" height="40" rx="4" fill="#ffffff" stroke="#7b8ba0" stroke-width="1"/>
<text x="38" y="228.4" font-size="14" fill="#1b2733" data-text="device-log.label">借还设备自检</text>
</g>
<text x="26" y="273.4" font-size="14" font-weight="600" fill="#1b2733" data-text="opening.rule">须全部到位</text>
<text x="26" y="292.2" font-size="12" fill="#526276" data-text="opening.arrived"><tspan x="26" y="292.2">已到位 2/3</tspan><tspan x="26" y="310.2">汇合条件未满足</tspan></text>
<path d="M26 46 L9 46 L9 224" fill="none" stroke="#3d4c5e" stroke-width="1.3" data-edge-id="in-fire" data-from="fire-check" data-to="opening" data-state="established"/>
<path d="M26 126 L9 126 L9 224" fill="none" stroke="#3d4c5e" stroke-width="1.3" data-edge-id="in-roster" data-from="roster" data-to="opening" data-state="established"/>
<path d="M26 224 L9 224 L9 224" fill="none" stroke="#3d4c5e" stroke-width="1.3" stroke-dasharray="4 3" data-edge-id="in-device" data-from="device-log" data-to="opening" data-state="pending"/>
<path d="M9 224 L9 327" fill="none" stroke="#3d4c5e" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#fan-join-w288-arrow-open)" data-join-for="opening" data-rule="all" data-met="false"/>
<g data-object-id="opening" data-role="hub">
<rect x="0" y="327" width="284" height="59" rx="4" fill="#f2f5f9" stroke="#7b8ba0" stroke-width="1"/>
<text x="12" y="351.4" font-size="14" font-weight="600" fill="#1b2733" data-text="opening.label">开馆</text>
<text x="12" y="372.2" font-size="12" fill="#526276" data-text="opening.state">尚未开馆</text>
</g>
<text x="0" y="411.2" font-size="12" fill="#526276" data-text="opening.basis">依据：开馆检查表 v2</text>
<g data-role="legend">
<path d="M0 437L20 437" fill="none" stroke="#3d4c5e" stroke-width="1.3"/>
<text x="26" y="441.2" font-size="12" fill="#526276" data-text="legend.0">已经成立</text>
<path d="M90 437L110 437" fill="none" stroke="#3d4c5e" stroke-width="1.3" stroke-dasharray="4 3"/>
<text x="116" y="441.2" font-size="12" fill="#526276" data-text="legend.1">尚未成立或没有生效</text>
</g>
</svg>
