<svg xmlns="http://www.w3.org/2000/svg" id="qualify-five-w288" viewBox="-2 -2 288 350" width="288" height="350" role="img" aria-labelledby="qualify-five-w288-title qualify-five-w288-desc" lang="zh-Hans" xml:lang="zh-Hans" font-family="system-ui, -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" data-asset="rel-qualify" data-asset-version="0.1.0">
<title id="qualify-five-w288-title">一项主张的五条来源</title>
<desc id="qualify-five-w288-desc">1 项主张，5 条限定、注释或证据，各自标在所限定的主张旁。</desc>
<g data-object-id="c-open" data-role="claim">
<text x="22" y="15.4" font-size="14" fill="#1b2733" data-text="c-open.text">古籍阅览室每周开放三天。</text>
</g>
<g data-qualifier-id="ev-notice" data-type="evidence" data-relation="supports" data-status="verified">
<text x="40" y="42.2" font-size="12" font-weight="600" fill="#526276" data-text="ev-notice.head">证据 · 支持</text>
<text x="40" y="62.4" font-size="14" fill="#1b2733" data-text="ev-notice.text">公告写明周二、周四、周六开放。</text>
<text x="40" y="81.2" font-size="12" fill="#526276" data-text="ev-notice.source">notice-03@v2 第 1 段 · 已核对</text>
</g>
<g data-qualifier-id="ev-site" data-type="evidence" data-relation="supports" data-status="verified">
<text x="40" y="107.2" font-size="12" font-weight="600" fill="#526276" data-text="ev-site.head">证据 · 支持</text>
<text x="40" y="127.4" font-size="14" fill="#1b2733" data-text="ev-site.text">网站开放时间表与公告一致。</text>
<text x="40" y="146.2" font-size="12" fill="#526276" data-text="ev-site.source">site-hours@v5 开放时间表 · 已核对</text>
</g>
<g data-qualifier-id="ev-desk" data-type="evidence" data-relation="supports" data-status="inferred">
<text x="40" y="172.2" font-size="12" font-weight="600" fill="#526276" data-text="ev-desk.head">证据 · 支持</text>
<text x="40" y="192.4" font-size="14" fill="#1b2733" data-text="ev-desk.text">服务台口头确认，没有书面记录。</text>
<text x="40" y="211.2" font-size="12" fill="#526276" data-text="ev-desk.source">desk-note · 推断，未核对</text>
</g>
<g data-qualifier-id="ev-roster" data-type="evidence" data-relation="contradicts" data-status="verified">
<text x="40" y="237.2" font-size="12" font-weight="600" fill="#526276" data-text="ev-roster.head">证据 · 反驳</text>
<text x="40" y="257.4" font-size="14" fill="#1b2733" data-text="ev-roster.text">十月值班表只排了两天。</text>
<text x="40" y="276.2" font-size="12" fill="#526276" data-text="ev-roster.source">roster-10@v1 第 3 行 · 已核对</text>
</g>
<g data-qualifier-id="ev-holiday" data-type="evidence" data-relation="limits" data-status="verified">
<text x="40" y="302.2" font-size="12" font-weight="600" fill="#526276" data-text="ev-holiday.head">证据 · 限定</text>
<text x="40" y="322.4" font-size="14" fill="#1b2733" data-text="ev-holiday.text">法定节假日当周另行公告。</text>
<text x="40" y="341.2" font-size="12" fill="#526276" data-text="ev-holiday.source">notice-03@v2 第 3 段 · 已核对</text>
</g>
