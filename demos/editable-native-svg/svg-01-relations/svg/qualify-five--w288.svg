<path d="M5 18 L5 38 L32 38" fill="none" stroke="#7b8ba0" stroke-width="1" data-leader-for="ev-notice" data-target="c-open"/>
<circle cx="34" cy="38" r="2" fill="#7b8ba0"/>
<path d="M5 18 L5 103 L32 103" fill="none" stroke="#7b8ba0" stroke-width="1" data-leader-for="ev-site" data-target="c-open"/>
<circle cx="34" cy="103" r="2" fill="#7b8ba0"/>
<path d="M5 18 L5 168 L32 168" fill="none" stroke="#7b8ba0" stroke-width="1" stroke-dasharray="4 3" data-leader-for="ev-desk" data-target="c-open"/>
<circle cx="34" cy="168" r="2" fill="#7b8ba0"/>
<path d="M5 18 L5 233 L32 233" fill="none" stroke="#7b8ba0" stroke-width="1" data-leader-for="ev-roster" data-target="c-open"/>
<circle cx="34" cy="233" r="2" fill="#7b8ba0"/>
<path d="M5 18 L5 298 L32 298" fill="none" stroke="#7b8ba0" stroke-width="1" data-leader-for="ev-holiday" data-target="c-open"/>
<circle cx="34" cy="298" r="2" fill="#7b8ba0"/>
</svg>
