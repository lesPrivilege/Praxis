name: Publish Praxis Pages (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: praxis-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout committed main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            demos/drift/index.html
            demos/drift/app.js
            demos/drift/style.css
            scripts/build_drift_pages.py
      - name: Record the actual source revision
        run: git rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"
      - name: Read Pages configuration
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Build Drift static demonstration
        run: python3 scripts/build_drift_pages.py --output "${{ runner.temp }}/drift-pages"
      - name: Upload only the static package
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ${{ runner.temp }}/drift-pages
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish the selected package
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
