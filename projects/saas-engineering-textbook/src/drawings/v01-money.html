<div class="dw-scroll" style="--dw-min:600px;--dw-max:900px">
<svg viewBox="0 0 760 286" role="img" aria-labelledby="v01-money-t v01-money-d">
  <title id="v01-money-t">两条服务行的费用责任与核销</title>
  <desc id="v01-money-d">L1 收费 120，分为支付方 80、病人 20、合同调整 20；L2 收费 180，分为支付方 120、病人 30、合同调整 30。支付方到账 180，核销 L1 的 80 与 L2 的 100；病人另付 50。合计收费 300 等于合同调整 50、已收 230 与未收 20。</desc>
  <!-- L1 -->
  <text class="t-b end" x="98" y="78">L1 检验</text>
  <text class="t-s mid" x="190" y="48">支付方</text><text class="t-s mid" x="290" y="48">病人</text><text class="t-s mid" x="330" y="48">调整</text>
  <rect class="box" x="110" y="56" width="160" height="34"/><text class="t-n mid" x="190" y="78">80</text>
  <rect class="box" x="270" y="56" width="40" height="34"/><text class="t-n mid" x="290" y="78">20</text>
  <rect class="box f2" x="310" y="56" width="40" height="34"/><text class="t-n mid" x="330" y="78">20</text>
  <text class="t-s" x="360" y="78">收费 120</text>
  <!-- L2 -->
  <text class="t-b end" x="98" y="152">L2 影像</text>
  <text class="t-s mid" x="230" y="122">支付方</text><text class="t-s mid" x="380" y="122">病人</text><text class="t-s mid" x="440" y="122">调整</text>
  <rect class="box" x="110" y="130" width="240" height="34"/><text class="t-n mid" x="230" y="152">120</text>
  <rect class="box" x="350" y="130" width="60" height="34"/><text class="t-n mid" x="380" y="152">30</text>
  <rect class="box f2" x="410" y="130" width="60" height="34"/><text class="t-n mid" x="440" y="152">30</text>
  <text class="t-s" x="480" y="152">收费 180</text>
  <!-- payer pays 180 -->
  <g data-s="1">
    <rect class="box f3" x="110" y="56" width="160" height="34"/><text class="t-n mid" x="190" y="78">80</text>
    <rect class="box f3" x="110" y="130" width="200" height="34"/><text class="t-n mid" x="210" y="152">100</text>
    <rect class="box-em" x="310" y="130" width="40" height="34"/><text class="t-n mid t-em" x="330" y="152">20</text>
    <text class="t-b" x="560" y="70">支付方到账 180</text>
    <text class="t-s" x="560" y="90">核销 L1 80、L2 100</text>
    <text class="t-s" x="560" y="108">付款预算 fully-allocated</text>
  </g>
  <!-- patient pays 50 -->
  <g data-s="2">
    <rect class="box f3" x="270" y="56" width="40" height="34"/><text class="t-n mid" x="290" y="78">20</text>
    <rect class="box f3" x="350" y="130" width="60" height="34"/><text class="t-n mid" x="380" y="152">30</text>
    <text class="t-b" x="560" y="142">病人另付 50</text>
    <text class="t-s" x="560" y="160">L1 20、L2 30</text>
  </g>
  <!-- totals -->
  <g data-s="3">
    <path class="ln-soft" d="M0 190 H760"/>
    <text class="t-b end" x="98" y="228">收费 300</text>
    <rect class="box f2" x="110" y="206" width="100" height="34"/><text class="t-n mid" x="160" y="228">50</text>
    <rect class="box f3" x="210" y="206" width="460" height="34"/><text class="t-n mid" x="440" y="228">230</text>
    <rect class="box-em" x="670" y="206" width="40" height="34"/><text class="t-n mid t-em" x="690" y="228">20</text>
    <text class="t-s mid" x="160" y="258">合同调整</text>
    <text class="t-s mid" x="440" y="258">已收 = 80 + 100 + 50</text>
    <text class="t-s mid t-em" x="690" y="258">未收</text>
    <text class="t-s mid" x="690" y="276">partly-allocated</text>
  </g>
</svg>
</div>
<figcaption>支付方的 180 用完了付款预算，L2 的支付方责任仍差 20；就诊应收因此停在 partly-allocated。</figcaption>
