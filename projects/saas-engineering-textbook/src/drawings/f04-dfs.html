  <title id="f04-dfs-t">DFS：共享依赖与环</title>
  <desc id="f04-dfs-d">图 A→B、A→C、B→D、C→D、D→E。按 B 优先，路径 A→B→D→E；回到 A 后访问 C，C 指向已完成的 D，这是共享依赖。加一条 E→B，访问 E 时遇到仍在当前路径上、尚未完成的 B，发现环 B→D→E→B。</desc>

  <rect class="box" x="150" y="158" width="44" height="36"/><text class="t-b mid" x="172" y="181">C</text>
  <rect class="box" x="280" y="98" width="44" height="36"/><text class="t-b mid" x="302" y="121">D</text>
  <rect class="box" x="410" y="98" width="44" height="36"/><text class="t-b mid" x="432" y="121">E</text>

  <path class="ln-soft" marker-end="url(#f04-dfs-ah)" d="M64 124 L146 168"/>
  <path class="ln-soft" marker-end="url(#f04-dfs-ah)" d="M194 66 L276 108"/>
  <path class="ln-soft" marker-end="url(#f04-dfs-ah)" d="M194 168 L276 124"/>
  <path class="ln-soft" marker-end="url(#f04-dfs-ah)" d="M324 116 H406"/>
  <path class="ln-strong" data-draw="1" d="M64 108 L146 66 M194 66 L276 108 M324 116 H406"/>
  <g data-s="1"><text class="t" x="500" y="40">路径 A→B→D→E</text></g>

    <path class="ln" marker-end="url(#f04-dfs-ah)" d="M194 168 L276 124"/>
    <text class="t" x="500" y="96">回到 A，访问 C</text>

    <text class="t t-em" x="500" y="164">B 仍在当前路径上、尚未完成</text>
    <text class="t-b t-em" x="500" y="186">环 B→D→E→B</text>
  </g>
</svg>
</div>
<figcaption>指向已完成节点的边是共享依赖；指回当前路径上未完成节点的边才构成环。</figcaption>
