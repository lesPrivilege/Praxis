<div class="dw-scroll" style="--dw-min:640px;--dw-max:960px">
<svg viewBox="0 0 800 262" role="img" aria-labelledby="f05-outbox-t f05-outbox-d">
  <title id="f05-outbox-t">发件表、两种确认与重投</title>
  <desc id="f05-outbox-d">业务变更与发件表在同一个本地事务里保存。派发器反复投递未确认的事件；发布者确认表示 broker 已接手消息。消费者把业务效果与已消费的消息身份一起持久化，再向 broker 发送消费者确认。消费者在记录效果之后、确认之前崩溃，消息再次投递，由持久化去重挡住重复效果。</desc>
  <defs><marker id="f05-outbox-ah" viewBox="0 0 8 8" refX="7" refY="4" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto"><path class="f-ink" d="M0 0 L8 4 L0 8 z"/></marker></defs>
  <g data-s="1">
    <rect class="box f1" x="10" y="40" width="190" height="120"/>
    <text class="t-s" x="22" y="58">同一本地事务</text>
    <rect class="box" x="24" y="68" width="162" height="34"/><text class="t mid" x="105" y="90">业务变更</text>
    <rect class="box" x="24" y="112" width="162" height="34"/><text class="t mid" x="105" y="134">发件表 outbox</text>
  </g>
  <g data-s="2">
    <path class="ln" marker-end="url(#f05-outbox-ah)" d="M186 129 C220 129 222 100 248 100"/>
    <rect class="box" x="250" y="76" width="130" height="54"/><text class="t-b mid" x="315" y="99">派发器</text><text class="t-s mid" x="315" y="118">反复投递未确认事件</text>
  </g>
  <g data-s="3">
    <path class="ln" marker-end="url(#f05-outbox-ah)" d="M380 92 H438"/>
    <rect class="box" x="440" y="76" width="110" height="74"/><text class="t-b mid" x="495" y="118">broker</text>
    <path class="ln" marker-end="url(#f05-outbox-ah)" d="M440 116 H382"/>
    <text class="t-s mid" x="410" y="150">发布者确认</text><text class="t-s mid" x="410" y="165">broker 已接手</text>
  </g>
  <g data-s="4">
    <path class="ln" marker-end="url(#f05-outbox-ah)" d="M550 92 H608"/>
    <rect class="box f1" x="610" y="40" width="180" height="120"/>
    <text class="t-b" x="622" y="60">消费者</text>
    <rect class="box" x="624" y="72" width="152" height="54"/><text class="t mid" x="700" y="95">业务效果 + 消息身份</text><text class="t-s mid" x="700" y="114">一起持久化</text>
    <path class="ln" marker-end="url(#f05-outbox-ah)" d="M610 140 H552"/>
    <text class="t-s mid" x="580" y="178">消费者确认</text><text class="t-s mid" x="580" y="193">报告处理结果</text>
  </g>
  <g data-s="5">
    <path class="ln-dash" marker-end="url(#f05-outbox-ah)" d="M495 150 V226 H700 V164"/>
    <text class="t-s" x="506" y="218">记录效果后、确认前崩溃：再次投递</text>
    <text class="t t-em" x="506" y="250">按已消费的消息身份去重，挡住重复效果</text>
  </g>
</svg>
</div>
<figcaption>发布者确认与消费者确认守着两段不同的交接；重投到达时，挡住重复效果的是消费者存下的消息身份。</figcaption>
