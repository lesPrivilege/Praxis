  </g>

  </g>
  <g data-s="3">

  </g>
  <g data-s="4">
    <rect class="box-dash" x="590" y="24" width="120" height="52"/><text class="t-b mid" x="650" y="46">代次 1 迟到</text><text class="t-s mid" x="650" y="66">写前 0</text>

  <text class="t-n mid" x="712" y="156">版本 2</text>
</svg>
