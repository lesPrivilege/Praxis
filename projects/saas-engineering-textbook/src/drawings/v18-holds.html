<div class="dw-scroll" style="--dw-min:600px;--dw-max:880px">
<svg viewBox="0 0 780 232" role="img" aria-labelledby="v18-holds-t v18-holds-d">
  <title id="v18-holds-t">从 blob 反向找到仍在生效的保留义务</title>
  <desc id="v18-holds-d">blob A 有两个实例 O1、O2，H1 和 H2 都覆盖它们，另有独立保留规则。解除 H1 后，H2 仍是活动边，清除候选为空；H2 也解除、独立保留规则也满足后，A 才成为清除候选。</desc>
  <rect class="box" x="20" y="92" width="96" height="44"/><text class="t-b mid" x="68" y="119">blob A</text>
  <path class="ln" d="M116 106 L190 72 M116 122 L190 158"/>
  <rect class="box" x="190" y="54" width="80" height="36"/><text class="t-b mid" x="230" y="77">O1</text>
  <rect class="box" x="190" y="140" width="80" height="36"/><text class="t-b mid" x="230" y="163">O2</text>
  <path class="ln-soft" d="M270 66 H370 M270 152 L370 74"/>
  <path class="ln-strong" d="M270 80 L370 150 M270 166 H370"/>
  <rect class="box f2" x="370" y="46" width="130" height="40"/><text class="t" x="382" y="71">H1 · 已解除</text>
  <rect class="box" x="370" y="138" width="130" height="40"/><text class="t-b" x="382" y="163">H2 · 有效</text>
  <rect class="box" x="370" y="190" width="130" height="34"/><text class="t-s" x="382" y="212">独立保留规则</text>
  <path class="ln-soft" d="M530 20 V222"/>
  <g data-s="1">
    <text class="t-s" x="550" y="60">解除 H1</text>
    <text class="t-b" x="550" y="82">清除候选：<tspan class="t-em">空</tspan></text>
    <text class="t-s" x="550" y="102">H2 仍是活动边</text>
  </g>
  <g data-s="2">
    <text class="t-s" x="550" y="152">再解除 H2，</text>
    <text class="t-s" x="550" y="168">且独立保留规则满足</text>
    <text class="t-b" x="550" y="192">清除候选：A</text>
  </g>
</svg>
</div>
<figcaption>解除 H1 只去掉 H1 的两条边；只要还有一条活动边连到 A 的实例，清除候选就是空的。</figcaption>
