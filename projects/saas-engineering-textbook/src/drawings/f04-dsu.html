<div class="dw-scroll" style="--dw-min:460px;--dw-max:640px">
<svg viewBox="0 0 560 230" role="img" aria-labelledby="f04-dsu-t f04-dsu-d">
  <title id="f04-dsu-t">并查集逐次合并</title>
  <desc id="f04-dsu-d">站点初始为 {A}{B}{C}{D}。连上 A-B 得 {A,B}{C}{D}，连 C-D 得 {A,B}{C,D}，再连 B-C 得 {A,B,C,D}。</desc>
  <g>
    <text class="t" x="20" y="47">初始</text>
    <rect class="box" x="150" y="24" width="40" height="34"/>
    <rect class="box" x="200" y="24" width="40" height="34"/>
    <rect class="box" x="250" y="24" width="40" height="34"/>
    <rect class="box" x="300" y="24" width="40" height="34"/>
    <text class="t-b mid" x="170" y="46">A</text>
    <text class="t-b mid" x="220" y="46">B</text>
    <text class="t-b mid" x="270" y="46">C</text>
    <text class="t-b mid" x="320" y="46">D</text>
    <text class="t-n" x="380" y="46">{A}{B}{C}{D}</text>
    </g>
  <g data-s="1">
    <text class="t" x="20" y="99">连 A-B</text>
    <rect class="box f1" x="150" y="76" width="90" height="34"/>
    <rect class="box" x="250" y="76" width="40" height="34"/>
    <rect class="box" x="300" y="76" width="40" height="34"/>
    <path class="ln-strong" d="M179 93 H211"/>
    <text class="t-b mid" x="170" y="98">A</text>
    <text class="t-b mid" x="220" y="98">B</text>
    <text class="t-b mid" x="270" y="98">C</text>
    <text class="t-b mid" x="320" y="98">D</text>
    <text class="t-n" x="380" y="98">{A,B}{C}{D}</text>
    </g>
  <g data-s="2">
    <text class="t" x="20" y="151">连 C-D</text>
    <rect class="box f1" x="150" y="128" width="90" height="34"/>
    <rect class="box f1" x="250" y="128" width="90" height="34"/>
    <path class="ln-strong" d="M279 145 H311"/>
    <text class="t-b mid" x="170" y="150">A</text>
    <text class="t-b mid" x="220" y="150">B</text>
    <text class="t-b mid" x="270" y="150">C</text>
    <text class="t-b mid" x="320" y="150">D</text>
    <text class="t-n" x="380" y="150">{A,B}{C,D}</text>
    </g>
  <g data-s="3">
    <text class="t" x="20" y="203">连 B-C</text>
    <rect class="box f1" x="150" y="180" width="190" height="34"/>
    <path class="ln-strong" d="M229 197 H261"/>
    <text class="t-b mid" x="170" y="202">A</text>
    <text class="t-b mid" x="220" y="202">B</text>
    <text class="t-b mid" x="270" y="202">C</text>
    <text class="t-b mid" x="320" y="202">D</text>
    <text class="t-n" x="380" y="202">{A,B,C,D}</text>
    </g>
</svg>
</div>
<figcaption>每连一条边，两个组合成一个；连上 B-C 时，A 与 D 虽无直接连接，也落进同一组。</figcaption>
