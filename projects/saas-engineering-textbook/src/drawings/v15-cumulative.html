<div class="dw-scroll" style="--dw-min:600px;--dw-max:900px">
<svg viewBox="0 0 760 250" role="img" aria-labelledby="v15-cumulative-t v15-cumulative-d">
  <title id="v15-cumulative-t">两期累计计量与本期增量</title>

  <!-- x = 150 + v × 0.06 -->
  <path class="ln-strong" d="M510 38 V236"/>
  <text class="t-s mid" x="510" y="28">合同上限 6,000</text>
  <g data-s="1">
    <text class="t-b end" x="140" y="72">第一期累计</text>
    <rect class="box f1" x="150" y="50" width="180" height="34"/><text class="t mid" x="240" y="72">原合同 60 米</text>
    <rect class="box f2" x="330" y="50" width="24" height="34"/>
    <text class="t-s mid" x="342" y="99">变更 8 米</text>
    <text class="t-n end" x="752" y="72">3,400</text>
  </g>
  <g data-s="2">
    <path class="ln-soft" d="M354 84 V140"/>
    <text class="t-b end" x="140" y="157">第二期累计</text>
    <rect class="box f1" x="150" y="140" width="300" height="34"/><text class="t mid" x="300" y="162">原合同 100 米</text>
    <rect class="box f2" x="450" y="140" width="45" height="34"/>
    <text class="t-s mid" x="472" y="189">变更 15 米</text>
    <text class="t-n end" x="752" y="162">5,750</text>
  </g>
  <g data-s="3">
    <path class="ln-em" d="M354 132 V124 H495 V132"/>
    <text class="t-s t-em mid" x="424" y="116">本期增量 2,350</text>
  </g>
  <g data-s="4">
    <text class="t-b end" x="140" y="224">两期相加</text>
    <rect class="box-dash" x="150" y="202" width="549" height="34"/>
    <text class="t-n mid" x="330" y="224">3,400 + 5,750</text>
    <text class="t-n end" x="752" y="224">9,150</text>
  </g>
</svg>
</div>
<figcaption>每期报的是累计量；本期签证取两次累计之差 2,350，把两期累计值相加会越过 6,000 的上限。</figcaption>
