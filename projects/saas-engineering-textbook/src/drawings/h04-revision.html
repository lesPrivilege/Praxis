<div class="dw-scroll" style="--dw-min:620px;--dw-max:900px">
<svg viewBox="0 0 780 320" role="img" aria-labelledby="h04-revision-t h04-revision-d">
  <title id="h04-revision-t">返聘后迟到的撤权任务</title>
  <desc id="h04-revision-d">E1 已结束，E2 返聘，当前期望是 revision 2。先投递 E2 开通、再投递 E1 撤权，或交换次序，revision 1 的撤权都被挡住，目标账号最终保持启用。反例按到达顺序覆盖，账号被停用。</desc>
  <g data-s="1">
    <text class="t-b end" x="200" y="42">雇佣</text>
    <rect class="box f2" x="230" y="24" width="190" height="28"/><text class="t mid" x="325" y="43">E1 · 已结束</text>
    <rect class="box f0" x="440" y="24" width="320" height="28"/><text class="t mid" x="600" y="43">E2 · 返聘，当前期望 revision 2</text>
    <text class="t-s mid" x="320" y="92">第一个到达</text>
    <text class="t-s mid" x="530" y="92">第二个到达</text>
    <text class="t-s mid" x="700" y="92">目标账号最终</text>
  </g>
  <g data-s="2">
    <text class="t-b" x="20" y="124">次序一</text><text class="t-s" x="20" y="142">先开通，后撤权</text>
    <rect class="box" x="230" y="104" width="180" height="46"/>
    <text class="t mid" x="320" y="123">revision 2 · E2 开通</text><text class="t-s mid" x="320" y="141">执行：启用</text>
    <path class="ln" d="M410 127 H440"/>
    <rect class="box f2" x="440" y="104" width="180" height="46"/>
    <text class="t mid" x="530" y="123">revision 1 · E1 撤权</text><text class="t-s mid" x="530" y="141">挡住：1 &lt; 2</text>
    <path class="ln" d="M620 127 H650"/>
    <rect class="box" x="650" y="104" width="100" height="46"/><text class="t-b mid" x="700" y="132">启用</text>
  </g>
  <g data-s="3">
    <text class="t-b" x="20" y="194">次序二</text><text class="t-s" x="20" y="212">先撤权，后开通</text>
    <rect class="box f2" x="230" y="174" width="180" height="46"/>
    <text class="t mid" x="320" y="193">revision 1 · E1 撤权</text><text class="t-s mid" x="320" y="211">挡住：1 &lt; 2</text>
    <path class="ln" d="M410 197 H440"/>
    <rect class="box" x="440" y="174" width="180" height="46"/>
    <text class="t mid" x="530" y="193">revision 2 · E2 开通</text><text class="t-s mid" x="530" y="211">执行：启用</text>
    <path class="ln" d="M620 197 H650"/>
    <rect class="box" x="650" y="174" width="100" height="46"/><text class="t-b mid" x="700" y="202">启用</text>
  </g>
  <g data-s="4">
    <path class="ln-soft" d="M20 246 H760"/>
    <text class="t-b" x="20" y="280">反例</text><text class="t-s" x="20" y="298">按到达顺序覆盖</text>
    <rect class="box" x="230" y="260" width="180" height="46"/>
    <text class="t mid" x="320" y="279">revision 2 · E2 开通</text><text class="t-s mid" x="320" y="297">执行：启用</text>
    <path class="ln" d="M410 283 H440"/>
    <rect class="box" x="440" y="260" width="180" height="46"/>
    <text class="t mid" x="530" y="279">revision 1 · E1 撤权</text><text class="t-s mid" x="530" y="297">执行：停用</text>
    <path class="ln" d="M620 283 H650"/>
    <rect class="box-em" x="650" y="260" width="100" height="46"/><text class="t-b mid" x="700" y="288">停用</text>
  </g>
</svg>
</div>
<figcaption>任务按自己携带的 revision 与当前期望比较，到达次序不影响结果；只看到达顺序时，旧雇佣的撤权会停掉返聘后的账号。</figcaption>
