<div class="dw-scroll" style="--dw-min:600px;--dw-max:900px">
<svg viewBox="0 0 760 330" role="img" aria-labelledby="v04-handoff-t v04-handoff-d">
  <title id="v04-handoff-t">回执丢失时先释放与先核对</title>
  <desc id="v04-handoff-d">南仓的最后一个茶杯已经实物交接，本地回执丢失，记录仍是已占未交接 1。先释放：可用量变成 1，另一订单占用它，回执迟到后记为已交接 1，两个订单共占一件并不存在的货。先核对：这份分配转入待核对，按交接身份向仓库查询；未交接才取消、释放并退款，已交接转拦截或按退货政策处理，没有交接证据转仓库主管核查。</desc>
  <!-- panel A -->
  <g data-s="1">
    <text class="t-b" x="0" y="22">先释放</text>
    <text class="t-s" x="0" y="64">南仓实物</text><text class="t-s" x="0" y="118">本地记录</text>
    <path class="ln-soft" d="M110 60 H150"/><path class="ln-strong" d="M150 60 H740"/>
    <circle class="f-ink" cx="150" cy="60" r="4"/><text class="t" x="158" y="48">茶杯实物交接出库</text>
    <path class="ln" d="M110 114 H740"/>
    <text class="t-s" x="114" y="132">已占未交接 1</text>
    <path class="ln-dash" d="M150 66 V92"/><text class="t-s" x="158" y="86">回执丢失</text>
  </g>
  <g data-s="2">
    <circle class="f-ink" cx="270" cy="114" r="4"/><text class="t" x="278" y="104">释放占用</text><text class="t-s" x="278" y="132">可用 1</text>
    <circle class="f-ink" cx="410" cy="114" r="4"/><text class="t" x="418" y="104">另一订单占用</text><text class="t-s" x="418" y="132">另一订单占 1</text>
  </g>
  <g data-s="3">
    <path class="ln" d="M590 66 V108 M584 100 L590 108 L596 100"/><text class="t" x="598" y="88">回执迟到</text>
    <text class="t-s" x="598" y="132">已交接 1</text>
    <text class="t-em" x="418" y="156">两个订单共占一件并不存在的货</text>
  </g>
  <path class="ln-soft" d="M0 176 H760"/>
  <!-- panel B -->
  <g data-s="4">
    <text class="t-b" x="0" y="204">先核对</text>
    <text class="t-s" x="0" y="242">南仓实物</text><text class="t-s" x="0" y="296">本地记录</text>
    <path class="ln-soft" d="M110 238 H150"/><path class="ln-strong" d="M150 238 H740"/>
    <circle class="f-ink" cx="150" cy="238" r="4"/><text class="t" x="158" y="226">茶杯实物交接出库</text>
    <path class="ln" d="M110 292 H460"/>
    <text class="t-s" x="114" y="310">已占未交接 1</text>
    <path class="ln-dash" d="M150 244 V270"/><text class="t-s" x="158" y="264">回执丢失</text>
    <circle class="f-ink" cx="270" cy="292" r="4"/><text class="t" x="278" y="282">转入待核对</text><text class="t-s" x="278" y="310">占用保持</text>
  </g>
  <g data-s="5">
    <path class="ln" d="M400 286 V246 M394 254 L400 246 L406 254"/><text class="t" x="408" y="270">按交接身份查询</text>
    <path class="ln" d="M460 292 L530 264 M460 292 H530 M460 292 L530 320"/>
    <text class="t" x="538" y="268">已交接 → 拦截或按退货政策</text>
    <text class="t" x="538" y="296">未交接 → 取消、释放、退款</text>
    <text class="t" x="538" y="324">无交接证据 → 仓库主管核查</text>
  </g>
</svg>
</div>
<figcaption>同一件已经出库的茶杯，先释放会让第二个订单占到它；先核对则在查明交接之前保持占用。</figcaption>
