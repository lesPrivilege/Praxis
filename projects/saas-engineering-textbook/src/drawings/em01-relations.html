<div class="dw-scroll" style="--dw-min:640px;--dw-max:900px">
<svg viewBox="0 0 880 230" role="img" aria-labelledby="em01-relations-t em01-relations-d">
  <title id="em01-relations-t">发票与采购单的四种关系</title>
  <desc id="em01-relations-d">引用：发票指向采购单。替换：版本 2 取代版本 1。冲销：贷项发票抵消原发票的金额。占用：发票占用采购单一行中已验收的那部分数量。</desc>
  <g data-s="1">
    <text class="t-b mid" x="110" y="28">引用</text>
    <rect class="box" x="18" y="80" width="80" height="44"/><text class="t mid" x="58" y="107">发票</text>
    <path class="ln" d="M98 102 H132 M124 95 L132 102 L124 109"/>
    <rect class="box" x="132" y="80" width="80" height="44"/><text class="t mid" x="172" y="107">采购单</text>
    <text class="t-s mid" x="110" y="212">注明对应的采购单</text>
  </g>
  <g data-s="2">
    <text class="t-b mid" x="330" y="28">替换</text>
    <rect class="box f1" x="238" y="80" width="80" height="44"/><text class="t-s mid" x="278" y="107">版本 1</text>
    <path class="ln" d="M248 102 H308"/>
    <path class="ln" d="M318 102 H342 M334 95 L342 102 L334 109"/>
    <rect class="box" x="342" y="80" width="80" height="44"/><text class="t mid" x="382" y="107">版本 2</text>
    <text class="t-s mid" x="330" y="212">新版本取代旧版本</text>
  </g>
  <g data-s="3">
    <text class="t-b mid" x="550" y="28">冲销</text>
    <path class="ln-strong" d="M470 122 H630"/>
    <rect class="f-ink" x="492" y="70" width="40" height="52"/>
    <rect class="box f2" x="568" y="122" width="40" height="52"/>
    <text class="t-s mid" x="512" y="62">原发票</text><text class="t-s mid" x="588" y="190">贷项发票</text>
    <text class="t-s mid" x="550" y="212">抵消原发票的金额</text>
  </g>
  <g data-s="4">
    <text class="t-b mid" x="770" y="28">占用</text>
    <text class="t-s" x="670" y="80">采购单一行</text>
    <rect class="box f2" x="670" y="88" width="140" height="26"/>
    <rect class="box" x="810" y="88" width="56" height="26"/>
    <text class="t-s" x="676" y="105">已验收</text>
    <path class="ln-strong" d="M670 124 V134 H760 V124"/>
    <text class="t-s mid" x="715" y="152">发票占用</text>
    <text class="t-s mid" x="770" y="212">占用已验收的数量</text>
  </g>
</svg>
</div>
<figcaption>四种关系里，只有占用消耗采购单行上已验收的数量。</figcaption>
