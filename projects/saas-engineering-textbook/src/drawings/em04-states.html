<div class="dw-scroll" style="--dw-min:600px;--dw-max:880px">
<svg viewBox="0 0 740 250" role="img" aria-labelledby="em04-states-t em04-states-d">
  <title id="em04-states-t">适配器怎样对待新增状态</title>
  <desc id="em04-states-d">供应商升级后返回的状态里多了 applied_with_warning。已定义的 applied 和 rejected 照原契约对应；applied_with_warning 由适配器返回契约不匹配的错误，操作保持待核对。按字符串前缀把它当作 applied 是错误的映射。</desc>
  <text class="t-b mid" x="140" y="26">供应商返回的状态</text>
  <text class="t-b mid" x="570" y="26">适配器的结果</text>
  <g data-s="1">
    <rect class="box" x="60" y="44" width="160" height="34"/><text class="t-n mid" x="140" y="66">applied</text>
    <rect class="box" x="60" y="96" width="160" height="34"/><text class="t-n mid" x="140" y="118">rejected</text>
    <path class="ln" d="M220 61 H490"/><path class="ln" d="M220 113 H490"/>
    <rect class="box" x="490" y="44" width="160" height="34"/><text class="t-n mid" x="570" y="66">applied</text>
    <rect class="box" x="490" y="96" width="160" height="34"/><text class="t-n mid" x="570" y="118">rejected</text>
  </g>
  <g data-s="2">
    <rect class="box" x="20" y="176" width="240" height="34"/><text class="t-n mid" x="140" y="198">applied_with_warning</text>
    <path class="ln-em" d="M260 193 H490"/>
    <rect class="box-em" x="490" y="170" width="220" height="48"/>
    <text class="t mid" x="600" y="190">契约不匹配</text><text class="t-s mid" x="600" y="208">操作保持待核对</text>
  </g>
  <g data-s="3">
    <path class="ln-dash" d="M260 182 C340 182 400 70 490 66"/>
    <text class="t-s" x="250" y="90">按字符串前缀当作 applied：错误</text>
  </g>
</svg>
</div>
<figcaption>未定义语义的新状态走向契约不匹配，操作停在待核对；业务与技术负责人定义语义并补充测试后，才给它一条对应。</figcaption>
