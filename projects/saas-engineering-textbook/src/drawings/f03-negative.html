<div class="dw-scroll" style="--dw-min:520px;--dw-max:780px">
<svg viewBox="0 0 640 176" role="img" aria-labelledby="f03-negative-t f03-negative-d">
  <title id="f03-negative-t">负修正让可变窗口错过答案</title>
  <desc id="f03-negative-d">求合计不超过 5 的最长连续段。数组 [6,-3,2]：右端读入 6，合计 6 超额，收缩左端丢掉 6。整个三项区间 6 + (−3) + 2 = 5 其实满足条件，被错过。</desc>
  <text class="t-s" x="40" y="16">求合计不超过 5 的最长连续段</text>
  <g data-s="1">
    <rect class="box f2" x="40" y="30" width="60" height="36"/><text class="t-s mid" x="70" y="53">6</text>
    <rect class="box" x="100" y="30" width="60" height="36"/><text class="t-n mid" x="130" y="53">−3</text>
    <rect class="box" x="160" y="30" width="60" height="36"/><text class="t-n mid" x="190" y="53">2</text>
    <rect class="ln-strong" x="36" y="26" width="68" height="44"/>
    <text class="t" x="260" y="44">读入 6：合计 6 &gt; 5</text>
    <text class="t-s" x="260" y="61">收缩左端，丢掉 6</text>
  </g>
  <g data-s="2">
    <rect class="box" x="40" y="104" width="60" height="36"/><text class="t-n mid" x="70" y="127">6</text>
    <rect class="box" x="100" y="104" width="60" height="36"/><text class="t-n mid" x="130" y="127">−3</text>
    <rect class="box" x="160" y="104" width="60" height="36"/><text class="t-n mid" x="190" y="127">2</text>
    <path class="ln-em" d="M40 152 V160 H220 V152"/>
    <text class="t-n" x="260" y="118">6 + (−3) + 2 = 5</text>
    <text class="t t-em" x="260" y="138">三项区间满足条件，已被错过</text>
  </g>
</svg>
</div>
<figcaption>有了负数，合计不再随右端扩张只增不减；丢掉首项 6 时，后面的 −3 本可以把合计拉回 5。</figcaption>
