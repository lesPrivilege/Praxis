<div class="dw-scroll" style="--dw-min:600px;--dw-max:880px">
<svg viewBox="0 0 760 250" role="img" aria-labelledby="v20-events-t v20-events-d">
  <title id="v20-events-t">#4 先于 #3 到达</title>
  <desc id="v20-events-d">安装日志为 #1 开始（第 0 分钟）、#2 休息（第 40 分钟）、#3 恢复（第 50 分钟）、#4 完成（第 100 分钟）。到达次序是 #1、#2、#4、#3。#3 到达前，只应用 #1、#2，得 40 分钟，#4 停在缺口之后等待核对；#3 到达后按序号重放，得 40 + 50 = 90 分钟。</desc>
  <text class="t-b end" x="130" y="40">到达次序</text>
  <rect class="box" x="150" y="20" width="80" height="30"/><text class="t-n mid" x="190" y="40">#1 开始</text>
  <rect class="box" x="240" y="20" width="80" height="30"/><text class="t-n mid" x="280" y="40">#2 休息</text>
  <rect class="box" x="330" y="20" width="80" height="30"/><text class="t-n mid" x="370" y="40">#4 完成</text>
  <rect class="box-em" x="420" y="20" width="80" height="30"/><text class="t-n mid" x="460" y="40">#3 恢复</text>
  <path class="ln-soft" d="M20 70 H740"/>
  <!-- time axis labels -->
  <text class="t-s mid" x="150" y="88">0</text><text class="t-s mid" x="310" y="88">40</text><text class="t-s mid" x="350" y="88">50</text><text class="t-s mid" x="550" y="88">100</text>
  <g data-s="1">
    <text class="t-b end" x="130" y="128">#3 到达前</text>
    <rect class="f-ink" x="150" y="108" width="160" height="28"/>
    <rect class="box" x="310" y="108" width="40" height="28"/>
    <rect class="box-dash" x="350" y="108" width="200" height="28"/>
    <text class="t-s" x="360" y="127">缺口：#3 未到</text>
    <path class="ln-strong" d="M550 100 V144"/><text class="t-s" x="556" y="154">#4 待核对</text>
    <text class="t-n end" x="740" y="128">40</text>
  </g>
  <g data-s="2">
    <text class="t-b end" x="130" y="208">#3 到达后</text>
    <rect class="f-ink" x="150" y="188" width="160" height="28"/>
    <rect class="box" x="310" y="188" width="40" height="28"/>
    <rect class="f-ink" x="350" y="188" width="200" height="28"/>
    <text class="t-s" x="314" y="232">休息</text>
    <text class="t-n end" x="740" y="208">40 + 50 = 90</text>
  </g>
</svg>
</div>
<figcaption>按序号应用，#4 先到也只能等在缺口之后；#3 补上后重放，安装仍是 90 分钟，休息的 10 分钟不计。</figcaption>
