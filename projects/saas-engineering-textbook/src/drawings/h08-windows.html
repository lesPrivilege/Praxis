  <text class="t" x="30" y="30">相邻两条相隔不足 10 分钟即并组</text>
  <g data-s="1">
    <rect class="box f2" x="22" y="44" width="376" height="28"/>
    <circle class="f-ink" cx="30" cy="58" r="5"/><circle class="f-ink" cx="210" cy="58" r="5"/><circle class="f-ink" cx="390" cy="58" r="5"/>
    <text class="t-s" x="412" y="62">一组，跨 18 分钟</text>
  </g>
  <text class="t" x="30" y="108">R1：首条事件锚定半开窗口 [t₀, t₀+10)</text>
  <g data-s="2">
    <rect class="box f1" x="30" y="122" width="200" height="28"/>
    <rect class="box-em" x="390" y="122" width="200" height="28"/>

    <text class="t-s mid" x="130" y="168">[0, 10)</text>
    <text class="t-s mid t-em" x="490" y="168">[18, 28)</text>
  </g>
  <path class="ln" d="M30 186 H630"/>
  <path class="ln" d="M30 186 V192 M210 186 V192 M230 186 V192 M390 186 V192 M590 186 V192"/>
  <text class="t-s mid" x="30" y="206">0</text><text class="t-s mid" x="208" y="206">9</text><text class="t-s mid" x="234" y="206">10</text>
  <text class="t-s mid" x="390" y="206">18</text><text class="t-s mid" x="590" y="206">28</text><text class="t-s end" x="630" y="206">分钟</text>
</svg>
