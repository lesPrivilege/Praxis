<div class="dw-scroll" style="--dw-min:600px;--dw-max:860px">
<svg viewBox="0 0 740 222" role="img" aria-labelledby="v17-roster-t v17-roster-d">
  <title id="v17-roster-t">缺席的含义由交换模式决定</title>
  <desc id="v17-roster-d">旧名单是 S1、S2。新增 S3 的 delta 按增量应用，名单变为 S1、S2、S3；同一份 delta 误当全集，S1、S2 被移出，名单错成 S3。经验证的完整 bulk 只含 S3 时，名单才变为 S3，历史成绩保留。</desc>
  <text class="t-b mid" x="250" y="22">旧名单</text>
  <text class="t-b mid" x="400" y="22">本批</text>
  <text class="t-b" x="490" y="22">应用后的名单</text>
  <path class="ln-soft" d="M20 36 H730"/>
  <!-- row 1 -->
  <text class="t-b end" x="180" y="73">delta 按增量应用</text>
  <rect class="box" x="200" y="54" width="44" height="28"/><text class="t-n mid" x="222" y="73">S1</text>
  <rect class="box" x="252" y="54" width="44" height="28"/><text class="t-n mid" x="274" y="73">S2</text>
  <rect class="box" x="360" y="54" width="80" height="28"/><text class="t-n mid" x="400" y="73">+ S3</text>
  <path class="ln" d="M450 68 H482 M475 63 L482 68 L475 73"/>
  <rect class="box" x="490" y="54" width="44" height="28"/><text class="t-n mid" x="512" y="73">S1</text>
  <rect class="box" x="542" y="54" width="44" height="28"/><text class="t-n mid" x="564" y="73">S2</text>
  <rect class="box" x="594" y="54" width="44" height="28"/><text class="t-n mid" x="616" y="73">S3</text>
  <!-- row 2 -->
  <text class="t-b end" x="180" y="133">delta 误当全集</text>
  <rect class="box" x="200" y="114" width="44" height="28"/><text class="t-n mid" x="222" y="133">S1</text>
  <rect class="box" x="252" y="114" width="44" height="28"/><text class="t-n mid" x="274" y="133">S2</text>
  <rect class="box" x="360" y="114" width="80" height="28"/><text class="t-n mid" x="400" y="133">+ S3</text>
  <path class="ln" d="M450 128 H482 M475 123 L482 128 L475 133"/>
  <rect class="f2" x="490" y="114" width="44" height="28"/><text class="t-n mid" x="512" y="133">S1</text>
  <rect class="f2" x="542" y="114" width="44" height="28"/><text class="t-n mid" x="564" y="133">S2</text>
  <rect class="box" x="594" y="114" width="44" height="28"/><text class="t-n mid" x="616" y="133">S3</text>
  <path class="ln-em" d="M494 128 H582"/>
  <text class="t-s t-em" x="490" y="160">S1、S2 被误移出</text>
  <!-- row 3 -->
  <text class="t-b end" x="180" y="193">完整 bulk，已验证</text>
  <rect class="box" x="200" y="174" width="44" height="28"/><text class="t-n mid" x="222" y="193">S1</text>
  <rect class="box" x="252" y="174" width="44" height="28"/><text class="t-n mid" x="274" y="193">S2</text>
  <rect class="box" x="360" y="174" width="80" height="28"/><text class="t-n mid" x="400" y="193">{ S3 }</text>
  <path class="ln" d="M450 188 H482 M475 183 L482 188 L475 193"/>
  <rect class="f2" x="490" y="174" width="44" height="28"/><text class="t-n mid" x="512" y="193">S1</text>
  <rect class="f2" x="542" y="174" width="44" height="28"/><text class="t-n mid" x="564" y="193">S2</text>
  <rect class="box" x="594" y="174" width="44" height="28"/><text class="t-n mid" x="616" y="193">S3</text>
  <path class="ln" d="M494 188 H582"/>
  <text class="t-s" x="490" y="218">S1、S2 退出名单，历史成绩保留</text>
</svg>
</div>
<figcaption>同一份只写着“+ S3”的批次，按增量应用时 S1、S2 留在名单里；误当全集时，它们的缺席被读成移除。</figcaption>
