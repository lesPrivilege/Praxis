<div class="dw-scroll" style="--dw-min:520px;--dw-max:780px">
<svg viewBox="0 0 640 200" role="img" aria-labelledby="f03-window-t f03-window-d">
  <title id="f03-window-t">连续三日窗口的合计</title>
  <desc id="f03-window-d">每日确认的服务量 [2,1,3,0,4]。首个三日窗口和为 6；右移一格，减掉 2、加入 0 得 4；再右移，减掉 1、加入 4 得 7。</desc>
  <text class="t-s" x="40" y="16">每日确认的服务量</text>
  <g data-s="1">
    <rect class="box" x="40" y="30" width="56" height="36"/><text class="t-n mid" x="68" y="53">2</text>
    <rect class="box" x="96" y="30" width="56" height="36"/><text class="t-n mid" x="124" y="53">1</text>
    <rect class="box" x="152" y="30" width="56" height="36"/><text class="t-n mid" x="180" y="53">3</text>
    <rect class="box" x="208" y="30" width="56" height="36"/><text class="t-n mid" x="236" y="53">0</text>
    <rect class="box" x="264" y="30" width="56" height="36"/><text class="t-n mid" x="292" y="53">4</text>
    <rect class="ln-strong" x="40" y="26" width="168" height="44"/>
    <text class="t-n" x="350" y="53">2 + 1 + 3 = 6</text><text class="t-s" x="500" y="53">首窗</text>
    </g>
  <g data-s="2">
    <rect class="box f2" x="40" y="90" width="56" height="36"/><text class="t-s mid" x="68" y="113">2</text>
    <rect class="box" x="96" y="90" width="56" height="36"/><text class="t-n mid" x="124" y="113">1</text>
    <rect class="box" x="152" y="90" width="56" height="36"/><text class="t-n mid" x="180" y="113">3</text>
    <rect class="box f1" x="208" y="90" width="56" height="36"/><text class="t-n mid" x="236" y="113">0</text>
    <rect class="box" x="264" y="90" width="56" height="36"/><text class="t-n mid" x="292" y="113">4</text>
    <rect class="ln-strong" x="96" y="86" width="168" height="44"/>
    <text class="t-n" x="350" y="113">6 − 2 + 0 = 4</text><text class="t-s" x="500" y="113">减掉 2、加入 0</text>
    </g>
  <g data-s="3">
    <rect class="box" x="40" y="150" width="56" height="36"/><text class="t-n mid" x="68" y="173">2</text>
    <rect class="box f2" x="96" y="150" width="56" height="36"/><text class="t-s mid" x="124" y="173">1</text>
    <rect class="box" x="152" y="150" width="56" height="36"/><text class="t-n mid" x="180" y="173">3</text>
    <rect class="box" x="208" y="150" width="56" height="36"/><text class="t-n mid" x="236" y="173">0</text>
    <rect class="box f1" x="264" y="150" width="56" height="36"/><text class="t-n mid" x="292" y="173">4</text>
    <rect class="ln-strong" x="152" y="146" width="168" height="44"/>
    <text class="t-n" x="350" y="173">4 − 1 + 4 = 7</text><text class="t-s" x="500" y="173">减掉 1、加入 4</text>
    </g>
</svg>
</div>
<figcaption>窗口每右移一格，只减去离开的一项、加上进来的一项；中间两项的和沿用上一步。</figcaption>
