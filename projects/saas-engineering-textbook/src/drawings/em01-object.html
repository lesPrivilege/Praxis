<div class="dw-scroll" style="--dw-min:640px;--dw-max:900px">
<svg viewBox="0 0 880 230" role="img" aria-labelledby="em01-object-t em01-object-d">
  <title id="em01-object-t">一个对象回答的五个问题</title>
  <desc id="em01-object-d">身份：两条记录是否同一件事。范围：租户包含法人，法人包含场所。状态：生命周期上的当前位置。版本：决定依据其中一个版本。来源：供应商原单登记为应付记录。</desc>
  <g data-s="1">
    <text class="t-b mid" x="88" y="30">身份</text>
    <rect class="box" x="26" y="72" width="48" height="60"/><rect class="box" x="102" y="72" width="48" height="60"/>
    <text class="t-s mid" x="50" y="106">记录</text><text class="t-s mid" x="126" y="106">记录</text>
    <text class="t-b mid" x="88" y="108">=?</text>
    <text class="t-s mid" x="88" y="200">是不是同一件事</text>
  </g>
  <g data-s="2">
    <text class="t-b mid" x="264" y="30">范围</text>
    <rect class="box f1" x="186" y="50" width="156" height="124"/>
    <rect class="box f0" x="200" y="74" width="128" height="90"/>
    <rect class="box f1" x="214" y="98" width="100" height="56"/>
    <text class="t-s" x="192" y="65">租户</text><text class="t-s" x="206" y="89">法人</text><text class="t-s" x="220" y="113">场所</text>
    <circle class="f-ink" cx="264" cy="134" r="5"/>
    <text class="t-s mid" x="264" y="200">属于哪个租户、法人或场所</text>
  </g>
  <g data-s="3">
    <text class="t-b mid" x="440" y="30">状态</text>
    <path class="ln-strong" d="M372 110 H463"/><path class="ln-dash" d="M463 110 H508"/>
    <circle class="f-ink" cx="372" cy="110" r="4"/><circle class="f-ink" cx="417" cy="110" r="4"/>
    <circle class="box" cx="508" cy="110" r="4"/>
    <circle class="box" cx="463" cy="110" r="8"/><circle class="f-ink" cx="463" cy="110" r="4"/>
    <text class="t-s mid" x="463" y="92">此刻</text>
    <text class="t-s mid" x="440" y="200">走到了哪一步</text>
  </g>
  <g data-s="4">
    <text class="t-b mid" x="616" y="30">版本</text>
    <rect class="box" x="550" y="72" width="40" height="40"/><text class="t-n mid" x="570" y="97">v1</text>
    <rect class="box f-ink" x="596" y="72" width="40" height="40"/><text class="t-n mid t-inv" x="616" y="97">v2</text>
    <rect class="box" x="642" y="72" width="40" height="40"/><text class="t-n mid" x="662" y="97">v3</text>
    <path class="ln" d="M616 152 V118 M609 126 L616 118 L623 126"/>
    <text class="t mid" x="616" y="170">决定</text>
    <text class="t-s mid" x="616" y="200">依据哪一份内容</text>
  </g>
  <g data-s="5">
    <text class="t-b mid" x="792" y="30">来源</text>
    <rect class="box" x="732" y="54" width="120" height="36"/><text class="t mid" x="792" y="77">供应商原单</text>
    <path class="ln" d="M792 92 V128 M785 120 L792 128 L799 120"/>
    <rect class="box" x="732" y="130" width="120" height="36"/><text class="t mid" x="792" y="153">应付记录</text>
    <text class="t-s mid" x="792" y="200">由谁、从哪里记下</text>
  </g>
</svg>
</div>
<figcaption>五项属性各回答一个问题；状态只是其中一项。</figcaption>
