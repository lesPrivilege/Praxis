<div class="dw-scroll" style="--dw-min:620px;--dw-max:920px">
<svg viewBox="0 0 780 300" role="img" aria-labelledby="v06-balance-t v06-balance-d">
  <title id="v06-balance-t">实收、有效授权与未收余额</title>
  <desc id="v06-balance-d">总费用 460 EUR，其中房费 400、餐饮 60。退房时实收预付款 100，未收 360，另有 80 的有效授权待 capture。capture 80 成功后实收 180、未收 280；客人再付 280 后未收为零。授权失效时未收仍是 360。</desc>
  <path class="ln-soft" d="M170 34 V42 H650 V34 M650 42 H722 V34"/>
  <text class="t-s mid" x="410" y="28">房费 400</text><text class="t-s mid" x="686" y="28">餐饮 60</text>
  <text class="t-b" x="0" y="34">总费用 460 EUR</text>
  <g data-s="1">
    <text class="t" x="0" y="77">退房时</text>
    <rect class="box f-ink" x="170" y="56" width="120" height="32"/><text class="t-s mid t-inv" x="230" y="76">预付 100</text>
    <rect class="box" x="290" y="56" width="432" height="32"/><text class="t-s mid" x="506" y="76">未收 360</text>
    <rect class="box-dash" x="290" y="94" width="96" height="20"/><text class="t-s mid" x="338" y="108">授权 80</text>
    <text class="t-em" x="396" y="109">有效授权，待 capture，不计入实收</text>
  </g>
  <g data-s="2">
    <text class="t" x="0" y="155">capture 80 成功</text>
    <rect class="box f-ink" x="170" y="134" width="120" height="32"/><text class="t-s mid t-inv" x="230" y="154">预付 100</text>
    <rect class="box f-ink" x="290" y="134" width="96" height="32"/><text class="t-s mid t-inv" x="338" y="154">请款 80</text>
    <rect class="box" x="386" y="134" width="336" height="32"/><text class="t-s mid" x="554" y="154">未收 280</text>
  </g>
  <g data-s="3">
    <text class="t" x="0" y="207">客人再付 280</text>
    <rect class="box f-ink" x="170" y="186" width="120" height="32"/><text class="t-s mid t-inv" x="230" y="206">预付 100</text>
    <rect class="box f-ink" x="290" y="186" width="96" height="32"/><text class="t-s mid t-inv" x="338" y="206">请款 80</text>
    <rect class="box f-ink" x="386" y="186" width="336" height="32"/><text class="t-s mid t-inv" x="554" y="206">付款 280 · 未收 0</text>
  </g>
  <g data-s="4">
    <text class="t" x="0" y="259">授权失效</text>
    <rect class="box f-ink" x="170" y="238" width="120" height="32"/><text class="t-s mid t-inv" x="230" y="258">预付 100</text>
    <rect class="box" x="290" y="238" width="432" height="32"/><text class="t-s mid" x="506" y="258">未收 360</text>
    <text class="t-s" x="170" y="290">重新取得授权或另行付款，都是新的操作</text>
  </g>
</svg>
</div>
<figcaption>授权额度挂在未收部分旁边，capture 成功后才变成实收；授权失效时未收余额保持 360。</figcaption>
