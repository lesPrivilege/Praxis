<div class="dw-scroll" style="--dw-min:560px;--dw-max:860px">
<svg viewBox="0 0 720 230" role="img" aria-labelledby="h08-tokens-t h08-tokens-d">
  <title id="h08-tokens-t">撤销 access token 与撤销 refresh token</title>
  <desc id="h08-tokens-d">在 Okta Classic Engine 中，撤销 access token 后，对应的 refresh token 仍然有效；撤销 refresh token 时，对应的 access token 一并撤销。对无效、过期或已撤销令牌发出的撤销请求也可能返回 200 OK。</desc>
  <g data-s="1">
    <text class="t-b" x="30" y="28">撤销 access token</text>
    <rect class="box-em" x="30" y="50" width="170" height="40"/><text class="t-n" x="44" y="75">refresh token</text>
    <text class="t-s t-em" x="210" y="75">仍有效</text>
    <path class="ln-soft" d="M115 90 V130"/><text class="t-s" x="123" y="114">对应</text>
    <rect class="box f2" x="30" y="130" width="170" height="40"/><text class="t-n" x="44" y="155">access token</text>
    <text class="t-s" x="210" y="155">已撤销</text>
    <path class="ln" d="M330 150 H262 M270 143 L262 150 L270 157"/><text class="t-s" x="270" y="176">撤销请求</text>
  </g>
  <path class="ln-soft" d="M360 16 V184"/>
  <g data-s="2">
    <text class="t-b" x="390" y="28">撤销 refresh token</text>
    <rect class="box f2" x="390" y="50" width="170" height="40"/><text class="t-n" x="404" y="75">refresh token</text>
    <text class="t-s" x="570" y="75">已撤销</text>
    <path class="ln" d="M475 90 V130 M468 122 L475 130 L482 122"/><text class="t-s" x="483" y="114">一并撤销</text>
    <rect class="box f2" x="390" y="130" width="170" height="40"/><text class="t-n" x="404" y="155">access token</text>
    <text class="t-s" x="570" y="155">已撤销</text>
    <path class="ln" d="M690 70 H622 M630 63 L622 70 L630 77"/><text class="t-s" x="626" y="96">撤销请求</text>
  </g>
  <g data-s="3">
    <text class="t-s" x="30" y="214">撤销请求对无效、过期或已撤销的令牌也可能返回 200 OK：HTTP 成功与访问已被阻止分别核对。</text>
  </g>
</svg>
</div>
<figcaption>撤销沿 refresh → access 一个方向传递；只撤销 access token 时，refresh token 仍有效。</figcaption>
