  <text class="t-b end" x="140" y="135">收货与验收</text>
  <text class="t-b end" x="140" y="190">发票</text>
  <text class="t-b end" x="140" y="245">付款</text>
  <g data-s="1">
    <path class="ln-dash" d="M160 130 H390"/><path class="ln-dash" d="M160 185 H570"/><path class="ln-dash" d="M160 240 H610"/>
    <text class="t-s" x="168" y="119">未交货</text><text class="t-s" x="168" y="174">未到</text><text class="t-s" x="168" y="229">未发起</text>
  </g>
  <path class="ln-strong" data-draw="1" d="M160 75 H740"/>
  <path class="ln-strong" data-draw="2" d="M390 130 H740"/>
  <path class="ln-strong" data-draw="3" d="M570 185 H740"/>
  <path class="ln-strong" data-draw="3" d="M610 240 H740"/>
  <g data-s="1"><text class="t" x="168" y="64">已批准</text></g>
  <g data-s="2"><circle class="f-ink" cx="390" cy="130" r="4"/><text class="t" x="398" y="119">已验收</text></g>
  <g data-s="3"><circle class="f-ink" cx="570" cy="185" r="4"/><text class="t" x="578" y="174">未结清</text>
    <circle class="f-ink" cx="610" cy="240" r="4"/><text class="t" x="618" y="229">在途</text></g>
  <g data-s="4"><path class="ln-soft" d="M300 40 V262"/><text class="t-s mid" x="300" y="30">时刻一</text>
    <circle class="box" cx="300" cy="75" r="6"/><circle class="box" cx="300" cy="130" r="6"/></g>
