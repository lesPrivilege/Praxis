<div class="dw-scroll" style="--dw-min:600px;--dw-max:880px">
<svg viewBox="0 0 760 236" role="img" aria-labelledby="f01-dedupe-t f01-dedupe-d">
  <title id="f01-dedupe-t">“去重”背后的三种问题</title>
  <desc id="f01-dedupe-d">两条完全相同的展示行，删掉重复项是集合运算；两次扣款属于同一业务身份，防止重复扣款要靠持久化的业务身份和执行协议；两个名字相似的客户是否同一人，是证据判断。</desc>
  <defs><marker id="f01-dedupe-ah" viewBox="0 0 8 8" refX="7" refY="4" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto"><path class="f-ink" d="M0 0 L8 4 L0 8 z"/></marker></defs>
  <text class="t-s" x="120" y="18">两件看起来重复的东西</text>
  <text class="t-s" x="484" y="18">真正要解的问题</text>
  <path class="ln-soft" d="M120 28 H750"/>
  <g data-s="1">
    <rect class="box" x="120" y="44" width="100" height="40"/><text class="t mid" x="170" y="69">展示行</text>
    <path class="ln-soft" d="M220 64 H262 M288 64 H330"/><text class="t-b mid" x="275" y="69">=</text>
    <rect class="box" x="330" y="44" width="100" height="40"/><text class="t mid" x="380" y="69">展示行</text>
    <path class="ln" marker-end="url(#f01-dedupe-ah)" d="M434 64 H474"/>
    <text class="t-b" x="484" y="62">集合运算</text><text class="t-s" x="484" y="79">删掉重复的展示行</text>
  </g>
  <g data-s="2">
    <rect class="box" x="120" y="112" width="100" height="40"/><text class="t mid" x="170" y="137">扣款</text>
    <path class="ln-soft" d="M220 132 H232 M318 132 H330"/><text class="t-s mid" x="275" y="136">同一业务身份</text>
    <rect class="box" x="330" y="112" width="100" height="40"/><text class="t mid" x="380" y="137">扣款</text>
    <path class="ln" marker-end="url(#f01-dedupe-ah)" d="M434 132 H474"/>
    <text class="t-b" x="484" y="130">持久化的业务身份 + 执行协议</text><text class="t-s" x="484" y="147">防止重复扣款</text>
  </g>
  <g data-s="3">
    <rect class="box" x="120" y="180" width="100" height="40"/><text class="t mid" x="170" y="205">客户</text>
    <path class="ln-dash" d="M220 200 H250 M300 200 H330"/><text class="t-s mid" x="275" y="204">相似？</text>
    <rect class="box" x="330" y="180" width="100" height="40"/><text class="t mid" x="380" y="205">客户</text>
    <path class="ln" marker-end="url(#f01-dedupe-ah)" d="M434 200 H474"/>
    <text class="t-b" x="484" y="198">证据判断</text><text class="t-s" x="484" y="215">名字相似的两人是否同一人</text>
  </g>
  <text class="t-big mid" x="48" y="140">去重</text>
  <path class="ln-soft" d="M84 64 H112 M84 132 H112 M84 200 H112 M84 64 V200"/>
</svg>
</div>
<figcaption>同一个词指向三种关系：完全相同、同一业务身份、名字相似；三者各有自己的解法。</figcaption>
