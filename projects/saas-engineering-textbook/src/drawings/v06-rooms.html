<div class="dw-scroll" style="--dw-min:520px;--dw-max:780px">
<svg viewBox="0 0 640 250" role="img" aria-labelledby="v06-rooms-t v06-rooms-d">

  <text class="t-b mid" x="230" y="34">24 日</text><text class="t-b mid" x="370" y="34">25 日</text>
  <text class="t-b end" x="148" y="80">A 房</text><text class="t-b end" x="148" y="130">B 房</text>
  <g data-s="1">

    <rect class="box" x="300" y="50" width="140" height="50"/><text class="t-s" x="312" y="68">空</text>
    <rect class="box" x="160" y="100" width="140" height="50"/><text class="t-s" x="172" y="118">空</text>
    <rect class="box f-ink" x="300" y="100" width="140" height="50"/><text class="t mid t-inv" x="370" y="130">已占用</text>
  </g>
  <g data-s="2">
    <text class="t-s end" x="148" y="182">空房集合</text>
    <text class="t-n mid" x="230" y="182">{B}</text><text class="t-n mid" x="370" y="182">{A}</text>

  </g>
  <g data-s="4">
    <path class="ln-dash" d="M250 132 L398 82"/><path class="ln" d="M388 80 L398 82 L392 91"/>
    <text class="t" x="460" y="96">允许换房：B → A</text>
    <text class="t-s" x="460" y="114">另需客人同意、清洁与交接</text>
  </g>

<figcaption>每晚各剩一间，但剩的不是同一间；连住同房要对每晚的空房集合取交集。</figcaption>
