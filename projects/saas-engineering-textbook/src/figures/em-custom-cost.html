<div class="fig-body">
  <style>

    @media (prefers-reduced-motion: reduce) { .fig[data-fig="em-custom-cost"] .bar { transition: none; } }
  </style>
  <p class="fig-title">定制的两年劳动节约与 36 人日增量成本</p>
  <div class="mount"></div>
  <p class="fig-caption">数值是正文的假设：两年 8 个季度，每年 220 个工作日，每人日 8 小时。图中只计劳动，未计降低重大错误、支持必要业务等其他理由，也未扣除只是转移给其他人员的劳动。虚线标出 36 人日增量成本。</p>
