<svg xmlns="http://www.w3.org/2000/svg" id="pair-brief-w672" viewBox="-2 -2 672 227" width="672" height="227" role="img" aria-labelledby="pair-brief-w672-title pair-brief-w672-desc" lang="zh-Hans" xml:lang="zh-Hans" font-family="system-ui, -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" data-asset="rel-pair" data-asset-version="0.3.0" data-scale="list" data-layout="columns" data-lanes="source view">
<title id="pair-brief-w672-title">给修复室的摘要选了哪些字段</title>
<desc id="pair-brief-w672-desc">调阅单 D-12 v2 有 4 个字段，给修复室的摘要选入 2 个；没有选入的仍在源里。</desc>
<text x="150" y="13.2" font-size="12" font-weight="600" fill="#526276" data-text="source.lane">调阅单</text>
<text x="150" y="31.2" font-size="12" fill="#526276" data-text="source.ref">调阅单 D-12 v2</text>
<text x="417" y="13.2" font-size="12" font-weight="600" fill="#526276" data-text="view.lane">给修复室的摘要</text>
<text x="417" y="31.2" font-size="12" fill="#526276" data-text="view.ref">调阅单 D-12 v1</text>
<path d="M0 42H668" fill="none" stroke="#a7b4c4" stroke-width="1"/>
<g data-row-id="item" data-role="row" data-selected="true">
<text x="0" y="64.4" font-size="14" font-weight="600" fill="#1b2733" data-text="item.label">馆藏</text>
<text x="150" y="64.4" font-size="14" fill="#1b2733" data-text="item.source">0871</text>
<text x="417" y="64.4" font-size="14" fill="#1b2733" data-text="item.view">选入</text>
</g>
<path d="M0 77H668" fill="none" stroke="#a7b4c4" stroke-width="1"/>
<g data-row-id="slot" data-role="row" data-selected="true">
<text x="0" y="99.4" font-size="14" font-weight="600" fill="#1b2733" data-text="slot.label">取书时段</text>
<text x="150" y="99.4" font-size="14" fill="#1b2733" data-text="slot.source">10 月 6 日 15:30–16:30</text>
<text x="417" y="99.4" font-size="14" fill="#1b2733" data-text="slot.view">选入</text>
</g>
<path d="M0 112H668" fill="none" stroke="#a7b4c4" stroke-width="1"/>
<g data-row-id="reader" data-role="row" data-selected="false">
<text x="0" y="134.4" font-size="14" font-weight="600" fill="#1b2733" data-text="reader.label">读者证</text>
<text x="150" y="134.4" font-size="14" fill="#1b2733" data-text="reader.source">5521</text>
<text x="417" y="134.4" font-size="14" fill="#526276" data-text="reader.view">没有选入，仍在源里</text>
</g>
<path d="M0 147H668" fill="none" stroke="#a7b4c4" stroke-width="1"/>
<g data-row-id="purpose" data-role="row" data-selected="false">
<text x="0" y="169.4" font-size="14" font-weight="600" fill="#1b2733" data-text="purpose.label">用途说明</text>
<text x="150" y="169.4" font-size="14" fill="#1b2733" data-text="purpose.source">核对卷三眉批的墨色与笔迹</text>
<text x="417" y="169.4" font-size="14" fill="#526276" data-text="purpose.view">选取时还没有这个字段（v2 新增）</text>
</g>
<g data-role="scale-note">
<text x="0" y="200.2" font-size="12" fill="#526276" data-text="scale#note"><tspan x="0" y="200.2">同一行的几栏说的是同一项；行的次序没有含义。没有选入的字段照样列出；选取只读，不改源。给修复室的摘要依据的是调</tspan><tspan x="0" y="218.2">阅单 D-12 v1，源现在是调阅单 D-12 v2（非当前版本）。1 个字段是选取之后才有的。</tspan></text>
</g>
</svg>
