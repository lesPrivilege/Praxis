<g data-role="scale-note">
<text x="0" y="316.2" font-size="12" fill="#526276" data-text="scale#note"><tspan x="0" y="316.2">标尺按时间比例，每格 30 分钟，从 2026-10-24</tspan><tspan x="0" y="334.2">23:30 起；时刻按 UTC 写。文字挤在一起时上下让</tspan><tspan x="0" y="352.2">开，由引线接回它在标尺上的位置。结束时间未知的</tspan><tspan x="0" y="370.2">区间只画出起点，尖端的长短不表示时长。写着别的</tspan><tspan x="0" y="388.2">偏移的时刻，括号里是它在标尺上的时刻。合成偏移</tspan><tspan x="0" y="406.2">时钟，不声称对应真实城市的时区规则。</tspan></text>
</g>
