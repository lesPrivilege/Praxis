<g data-row-id="t1" data-role="row" data-at="2026-10-25T01:30:00+02:00" data-kind="point">
<text x="105" y="34.2" font-size="12" font-weight="600" fill="#526276" data-text="t1.when"><tspan x="105" y="34.2">01:30 UTC+02:00（标尺</tspan><tspan x="105" y="52.2">10-24 23:30）</tspan></text>
