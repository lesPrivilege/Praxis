<svg xmlns="http://www.w3.org/2000/svg" id="f04-times-w288" viewBox="-2 -2 288 415" width="288" height="415" role="img" aria-labelledby="f04-times-w288-title f04-times-w288-desc" lang="zh-Hans" xml:lang="zh-Hans" font-family="system-ui, -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" data-asset="rel-rail" data-asset-version="0.3.0" data-scale="time" data-layout="merged">
<title id="f04-times-w288-title">持续时间、重叠与播放时间</title>
<desc id="f04-times-w288-desc">2 个时刻、2 个区间，按时间比例排在一条标尺上，标尺从 2026-10-24 23:30（UTC）起。</desc>
