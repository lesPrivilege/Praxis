<svg xmlns="http://www.w3.org/2000/svg" id="f02-projection-w288" viewBox="-2 -2 288 249" width="288" height="249" role="img" aria-labelledby="f02-projection-w288-title f02-projection-w288-desc" lang="zh-Hans" xml:lang="zh-Hans" font-family="system-ui, -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" data-asset="rel-pair" data-asset-version="0.3.0" data-scale="list" data-layout="stacked" data-lanes="source view">
<title id="f02-projection-w288-title">本次上下文选入了哪些字段</title>
<desc id="f02-projection-w288-desc">object-demo-02@v2 有 2 个字段，本次上下文选入 1 个；没有选入的仍在源里。</desc>
<text x="0" y="13.2" font-size="12" fill="#526276" data-text="source.ref">对象：object-demo-02@v2</text>
<text x="0" y="31.2" font-size="12" fill="#526276" data-text="view.ref">本次上下文：object-demo-02@v2</text>
<path d="M0 42H284" fill="none" stroke="#a7b4c4" stroke-width="1"/>
<g data-row-id="期限" data-role="row" data-selected="true">
<text x="0" y="64.4" font-size="14" font-weight="600" fill="#1b2733" data-text="期限.label">期限</text>
<text x="0" y="86.7" font-size="12" fill="#526276" data-text="期限.source.lane">对象</text>
<text x="70" y="87.4" font-size="14" fill="#1b2733" data-text="期限.source">12 个月</text>
<text x="0" y="109.7" font-size="12" fill="#526276" data-text="期限.view.lane">本次上下文</text>
<text x="70" y="110.4" font-size="14" fill="#1b2733" data-text="期限.view">选入</text>
</g>
<path d="M0 123H284" fill="none" stroke="#a7b4c4" stroke-width="1"/>
<g data-row-id="付款" data-role="row" data-selected="false">
<text x="0" y="145.4" font-size="14" font-weight="600" fill="#1b2733" data-text="付款.label">付款</text>
<text x="0" y="167.7" font-size="12" fill="#526276" data-text="付款.source.lane">对象</text>
<text x="70" y="168.4" font-size="14" fill="#1b2733" data-text="付款.source">季度</text>
<text x="0" y="190.7" font-size="12" fill="#526276" data-text="付款.view.lane">本次上下文</text>
<text x="70" y="191.4" font-size="14" fill="#526276" data-text="付款.view">没有选入，仍在源里</text>
</g>
<g data-role="scale-note">
<text x="0" y="222.2" font-size="12" fill="#526276" data-text="scale#note"><tspan x="0" y="222.2">同一行的几栏说的是同一项；行的次序没有含义。没</tspan><tspan x="0" y="240.2">有选入的字段照样列出；选取只读，不改源。</tspan></text>
</g>
