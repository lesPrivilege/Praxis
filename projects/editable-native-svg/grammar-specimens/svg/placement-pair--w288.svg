<text x="0" y="709.4" font-size="14" font-weight="600" fill="#1b2733" data-text="copy.label">复制方式</text>
<text x="0" y="728.2" font-size="12" fill="#526276" data-text="copy.note">读者提出，等值班主任决定</text>
<text x="0" y="749.7" font-size="12" fill="#526276" data-text="copy.before.lane">提交时</text>
