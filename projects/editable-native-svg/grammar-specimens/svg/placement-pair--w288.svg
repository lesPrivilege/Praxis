<svg xmlns="http://www.w3.org/2000/svg" id="placement-pair-w288" viewBox="-2 -2 288 882" width="288" height="882" role="img" aria-labelledby="placement-pair-w288-title placement-pair-w288-desc" lang="zh-Hans" xml:lang="zh-Hans" font-family="system-ui, -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" data-asset="rel-pair" data-asset-version="0.3.0" data-scale="list" data-layout="stacked" data-lanes="before after change">
<title id="placement-pair-w288-title">调阅单 D-12 改了什么</title>
