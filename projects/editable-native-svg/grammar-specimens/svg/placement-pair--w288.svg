</g>
<g data-role="scale-note">
<text x="0" y="827.2" font-size="12" fill="#526276" data-text="scale#note"><tspan x="0" y="827.2">同一行的几栏说的是同一项；行的次序没有含义。没</tspan><tspan x="0" y="845.2">有变的字段照样列出。</tspan></text>
