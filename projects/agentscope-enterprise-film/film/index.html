<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>AgentScope 企业线：从文档到运行</title>
<link rel="stylesheet" href="film.css">
<style>
#hud{opacity:1!important;background:#101a2beF!important;padding:12px 18px!important;flex-wrap:wrap;min-height:66px;z-index:100!important}
#hud button,#hud select,#hud a{min-height:40px;font:15px/1.3 system-ui;display:inline-flex;align-items:center;padding:7px 12px}
#hud a{color:#b8d0ff}#hud :focus-visible{outline:3px solid #b4ceff;outline-offset:3px}#hud input{min-width:120px}
#hud output{font:14px/1.4 monospace;white-space:nowrap;color:#e5edff}#mobile-note{display:none}
body.render #hud,body.render #mobile-note{display:none!important}
@media(max-width:900px){#mobile-note{display:block;position:fixed;top:0;left:0;right:0;z-index:100;padding:12px 16px;background:#101a2b;color:#edf4ff;font:15px/1.5 system-ui}#mobile-note a{color:#b8d0ff}#hud{gap:5px!important}#hud input{flex-basis:100%}}
</style>
</head>
<body>
<div id="viewport"><div id="stage"></div></div>
<div id="mobile-note">小屏建议打开 <a href="../reading.html">逐章阅读稿</a>，可保留图文细节。</div>
<div id="hud" role="region" aria-label="影片播放控制">
<button id="play" type="button">播放</button>
<button id="prev" type="button" title="上一场，快捷键 [">上一场</button>
<button id="next" type="button" title="下一场，快捷键 ]">下一场</button>
<select id="chapters" aria-label="跳到章节"></select>
<input id="progress" aria-label="播放位置" type="range" min="0" step="0.0416667" value="0">
<output id="clock" aria-live="off"></output><a href="../reading.html">阅读稿</a>
</div>
<script src="gsap.min.js"></script><script src="timeline.js"></script><script src="engine.js"></script><script src="kit.js"></script><script src="scenes.js"></script><script src="boot.js"></script>
</body></html>
