<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Praxis 控制面</title>
<style>
/* Tokens follow DeepSeek Harness's design-platform sheet (alias layer), so the
   pane reads as part of DSH. Embedded in DSH, the theme follows the host's
   data-ds-dark-theme; standalone, it follows the system. */
:root {
  --bg: rgb(255 255 255); --layer: rgb(255 255 255); --platform: rgb(245 246 247); --active-item: rgb(235 238 242);
  --hover: rgba(38 49 72 / .06); --press: rgba(38 49 72 / .1);
  --l1: rgba(0 0 0 / .04); --l2: rgba(0 0 0 / .1); --l3: rgba(0 0 0 / .12); --l4: rgba(0 0 0 / .16);
  --text: rgb(15 17 21); --muted: rgb(97 102 107); --faint: rgb(129 133 140); --dimmed: rgb(173 178 184);
  --primary: rgb(15 17 21); --primary-hover: rgb(67 69 74); --on-primary: rgb(255 255 255);
  --accent: rgb(65 118 230); --ok: rgb(34 197 94); --warn: rgb(245 158 11); --warn-label: rgb(221 134 41); --danger: rgb(236 19 19);
  --toast: rgb(97 102 107); --on-toast: rgb(255 255 255);
  --shadow: 0 4px 12px 0 rgba(0 0 0 / .02), 0 2px 8px 0 rgba(0 0 0 / .04);
  --mono: 'SF Mono', 'JetBrains Mono', 'Fira Code', Consolas, Menlo, 'PingFang SC', monospace;
  --ease: cubic-bezier(.4, 0, .2, 1);
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: rgb(21 21 23); --layer: rgb(35 35 36); --platform: rgb(44 44 46); --active-item: rgb(67 69 74);
  --hover: rgba(255 255 255 / .08); --press: rgba(255 255 255 / .14);
  --l1: rgba(255 255 255 / .06); --l2: rgba(255 255 255 / .12); --l3: rgba(255 255 255 / .16); --l4: rgba(255 255 255 / .2);
  --text: rgb(249 250 251); --muted: rgb(207 211 214); --faint: rgb(173 178 184); --dimmed: rgb(97 102 107);
  --primary: rgb(249 250 251); --primary-hover: rgb(235 238 242); --on-primary: rgb(15 17 21);
  --accent: rgb(103 158 254); --danger: rgb(242 90 90);
  --toast: rgb(249 250 251); --on-toast: rgb(53 54 56);
  --shadow: 0 0 0 .5px rgba(255 255 255 / .06), 0 8px 24px rgba(0 0 0 / .3);
  color-scheme: dark;
}
@supports (corner-shape: superellipse(1.5)) { *, *::before, *::after { corner-shape: superellipse(1.5); } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif; -webkit-font-smoothing: antialiased; }
:root.embedded body { background: transparent; }
svg { flex: none; }
button { font: inherit; color: inherit; }
.mono, .meta, .id { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.meta { color: var(--muted); font-size: 11px; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--l3); border-radius: 5px; border: 3px solid transparent; background-clip: content-box; }
::-webkit-scrollbar-thumb:hover { background-color: var(--l4); }

/* shell: one 38px strip, then the views */
.top { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 6px 12px; flex-wrap: wrap; min-height: 38px; padding: 6px 12px;
  background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(12px); border-bottom: .5px solid var(--l3); }
:root.embedded .top { background: color-mix(in srgb, var(--layer) 88%, transparent); }
.brand { display: flex; align-items: center; gap: 6px; font-weight: 500; font-size: 13px; }
.brand svg { width: 16px; height: 16px; }
.tabs { display: flex; gap: 2px; }
.tabs button { display: flex; align-items: center; gap: 4px; height: 24px; padding: 0 9px; border: 0; border-radius: 12px; corner-shape: round; background: none; color: var(--muted); font-size: 12px; cursor: pointer; white-space: nowrap; transition: background var(--ease) .1s; }
.tabs button svg { width: 14px; height: 14px; }
.tabs button:hover { background: var(--hover); }
.tabs button[aria-selected="true"] { color: var(--text); background: var(--active-item); }
.stats { margin-left: auto; display: flex; align-items: center; gap: 10px; color: var(--faint); font-size: 11px; }
.live { display: inline-flex; align-items: center; gap: 5px; }
.stats b { color: var(--text); font: 500 12px var(--mono); margin-right: 3px; }
main { padding: 12px; max-width: 1360px; margin: 0 auto; }
.view { display: none; }
.view.on { display: block; animation: rise .16s var(--ease); }
@keyframes rise { from { opacity: 0; transform: translateY(3px); } }
@media (prefers-reduced-motion: reduce) { .view.on { animation: none; } * { transition: none !important; } }

.split { display: grid; grid-template-columns: 280px minmax(0, 1fr); gap: 12px; align-items: start; }
.panel { background: var(--layer); border: .5px solid var(--l2); border-radius: 12px; min-width: 0; }
.side { position: sticky; top: 50px; max-height: calc(100vh - 62px); overflow: auto; padding: 8px; }
.back { display: none; }

/* inputs: 32px, r8, 0.5px l4 hairline */
.field { position: relative; }
.field > svg { position: absolute; left: 9px; top: 50%; translate: 0 -50%; width: 15px; height: 15px; color: var(--faint); pointer-events: none; }
.field input { padding-left: 30px; }
input, select, textarea { font: inherit; color: var(--text); background: var(--layer); border: .5px solid var(--l4); border-radius: 8px; padding: 5px 9px; min-height: 32px; width: 100%; outline: none; transition: border-color .1s; }
input::placeholder, textarea::placeholder { color: var(--dimmed); }
input:focus, select:focus, textarea:focus { border-color: var(--primary); }
textarea { min-height: 64px; resize: vertical; line-height: 1.55; }
label, .label { display: block; font-size: 12px; color: var(--muted); margin: 10px 0 4px; }
:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
input:focus-visible, select:focus-visible, textarea:focus-visible { outline: none; }

/* buttons: capsules */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 4px; height: 28px; padding: 0 12px; border: .5px solid var(--l3); border-radius: 14px; corner-shape: round; background: transparent; color: var(--text); font-size: 12px; cursor: pointer; white-space: nowrap; transition: background .1s; }
.btn:hover { background: var(--hover); }
.btn:active { background: var(--press); }
.btn svg { width: 14px; height: 14px; }
.btn.primary { border-color: transparent; background: var(--primary); color: var(--on-primary); font-weight: 500; }
.btn.primary:hover { background: var(--primary-hover); }
.btn.ghost { border-color: transparent; color: var(--muted); }
.btn.ghost:hover { color: var(--text); }
.icon { border: 0; background: none; color: var(--faint); width: 28px; height: 28px; border-radius: 8px; display: inline-grid; place-items: center; cursor: pointer; transition: background .1s; }
.icon:hover { background: var(--hover); color: var(--text); }
.icon svg { width: 16px; height: 16px; }
.icon.on { color: var(--warn); }
.icon.danger:hover { color: var(--danger); background: color-mix(in srgb, var(--danger) 8%, transparent); }
.switch { position: relative; flex: none; width: 36px; height: 20px; padding: 0; border: 0; border-radius: 10px; corner-shape: round; background: var(--l3); cursor: pointer; }
.switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; corner-shape: round; background: var(--on-primary); transition: transform .12s ease; }
.switch[aria-checked="true"] { background: var(--primary); }
.switch[aria-checked="true"]::after { transform: translateX(16px); }
:root:not([data-theme="dark"]) .switch:not([aria-checked="true"])::after { background: #fff; }
.toggle { appearance: none; margin: 0; flex: none; width: 36px; height: 20px; min-height: 0; padding: 0; border: 0; border-radius: 10px; corner-shape: round; cursor: pointer;
  background: var(--l3) radial-gradient(circle, #fff 0 8px, transparent 8.5px) no-repeat 0 0 / 20px 20px; transition: background-position .12s ease; }
.toggle:checked { background-color: var(--primary); background-image: radial-gradient(circle, var(--on-primary) 0 8px, transparent 8.5px); background-position: 16px 0; }
.inline { display: inline-flex; align-items: center; gap: 8px; margin: 0; font-size: 12px; color: var(--muted); cursor: pointer; }

/* segmented radios: pills in a tray */
.seg { display: flex; gap: 2px; padding: 2px; background: var(--platform); border-radius: 14px; corner-shape: round; }
.seg label { flex: 1; margin: 0; display: flex; align-items: center; justify-content: center; gap: 4px; height: 24px; padding: 0 9px; border-radius: 12px; corner-shape: round; color: var(--muted); font-size: 12px; cursor: pointer; white-space: nowrap; }
.seg label svg { width: 14px; height: 14px; }
.seg label:hover { color: var(--text); }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg label:has(input:checked) { background: var(--layer); color: var(--text); box-shadow: 0 0 0 .5px var(--l3), 0 1px 2px rgba(0 0 0 / .06); }
.seg label:has(input:focus-visible) { outline: 2px solid var(--primary); }

/* tags: fixed capsule, tone-only variation */
.chip { display: inline-flex; align-items: center; gap: 3px; padding: 1px 8px; border-radius: 999px; corner-shape: round; font-size: 11px; line-height: 17px; font-weight: 500; white-space: nowrap; background: var(--platform); color: var(--muted); }
.chip svg { width: 11px; height: 11px; }
.chip.accent { background: color-mix(in srgb, var(--accent) 10%, transparent); color: var(--accent); }
.chip.outline { background: none; box-shadow: 0 0 0 .5px var(--l4) inset; color: var(--faint); }
.chip.mono { font: 500 11px/17px var(--mono); }
.count { font: 11px var(--mono); color: var(--faint); min-width: 18px; text-align: right; }
/* state dot: 10% halo, solid core */
.dot { position: relative; display: inline-block; flex: none; width: 10px; height: 10px; color: var(--faint); }
.dot::before, .dot::after { content: ""; position: absolute; border-radius: 50%; corner-shape: round; background: currentColor; }
.dot::before { inset: 0; opacity: .12; }
.dot::after { inset: 20%; }
.dot.verified { color: var(--ok); }
.dot.partial { color: var(--warn); }
.dot.verified-in-scope { color: color-mix(in srgb, var(--ok) 55%, var(--faint)); }
.dot.unverified { color: var(--faint); }
.dot.unverified::after, .dot.unavailable::after { background: none; box-shadow: 0 0 0 1.2px currentColor inset; }
.dot.unavailable { color: var(--dimmed); }
.glyph { width: 14px; height: 14px; color: var(--faint); }

/* tree rows: r10, 5/10 inset */
.group + .group { margin-top: 6px; }
.group-head { display: flex; align-items: center; gap: 6px; padding: 8px 10px 4px; font-size: 11px; color: var(--faint); font-weight: 500; }
.group-head .count { margin-left: auto; }
.item { display: grid; grid-template-columns: 6px minmax(0, 1fr) auto; align-items: center; gap: 8px; width: 100%; text-align: left; border: 0; background: none; padding: 5px 10px; border-radius: 10px; cursor: pointer; transition: background .1s; }
.item:hover { background: var(--hover); }
.item[aria-current="true"] { background: var(--active-item); }
.item .t { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .id { display: block; font-size: 10.5px; color: var(--faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pin { width: 6px; height: 6px; border-radius: 50%; corner-shape: round; background: var(--accent); }
.new { display: flex; align-items: center; gap: 6px; width: 100%; border: 0; background: none; color: var(--faint); border-radius: 10px; padding: 5px 10px; margin-top: 2px; cursor: pointer; font-size: 12px; }
.new:hover { color: var(--text); background: var(--hover); }
.new svg { width: 14px; height: 14px; }

/* detail */
.head { padding: 14px 16px 12px; border-bottom: .5px solid var(--l3); }
.crumb { display: flex; align-items: center; gap: 6px; color: var(--faint); font: 11px var(--mono); margin-bottom: 6px; min-width: 0; overflow: hidden; white-space: nowrap; }
.head h2 { margin: 0; font-size: 16px; font-weight: 600; line-height: 24px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.desc { margin: 4px 0 0; color: var(--muted); max-width: 72ch; }
.bar { display: flex; gap: 6px; align-items: center; padding: 6px 10px; border-bottom: .5px solid var(--l3); flex-wrap: wrap; }
.bar .grow { flex: 1; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
.actions { display: flex; gap: 8px; margin-top: 12px; align-items: center; flex-wrap: wrap; }
.reviews { list-style: none; margin: 10px 0 0; padding: 0; font-size: 12px; color: var(--muted); }
.reviews li { display: flex; gap: 6px; align-items: center; padding: 3px 0; flex-wrap: wrap; }
.source { margin-top: 12px; padding: 12px; border: .5px solid var(--l3); border-radius: 12px; background: var(--layer); }
.source p { margin: 4px 0; }
pre.md { white-space: pre-wrap; font: 12px/1.65 var(--mono); padding: 14px 16px; margin: 0; max-height: 60vh; overflow: auto; color: var(--muted); border-bottom: .5px solid var(--l3); background: var(--platform); }
.empty { display: grid; justify-items: center; gap: 8px; padding: 36px 16px; color: var(--faint); text-align: center; font-size: 12px; }
.empty svg { width: 24px; height: 24px; color: var(--dimmed); }
.section { padding: 12px 16px; }
.section + .section { border-top: .5px solid var(--l3); }
.h { display: flex; align-items: center; gap: 6px; margin: 0 0 8px; font-size: 12px; font-weight: 500; color: var(--muted); }
.h .count { margin-left: auto; }
.chips { display: flex; gap: 4px; flex-wrap: wrap; }

/* catalog: a settings-style list of units; a unit page holds its description, its source cards and their upkeep */
.pages { max-width: 920px; margin: 0 auto; }
.pages.focus > .list-pane, .pages:not(.focus) > .main-pane { display: none; }
.page-head { display: flex; align-items: center; gap: 10px 14px; flex-wrap: wrap; padding: 6px 4px 12px; }
.page-head h1 { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: -.01em; }
.page-head .tools { display: flex; align-items: center; gap: 6px; flex: 1 1 280px; justify-content: flex-end; }
.page-head .field { flex: 1; max-width: 300px; }
.sort { display: inline-flex; gap: 4px; width: auto; padding: 0 8px; font-size: 12px; }
.group-block + .group-block { margin-top: 12px; }
.group-toggle { display: flex; align-items: center; gap: 6px; border: 0; background: none; padding: 6px 4px 4px; font-size: 13px; font-weight: 500; cursor: pointer; }
.group-toggle svg { width: 12px; height: 12px; color: var(--faint); transform: rotate(90deg); transition: transform .15s var(--ease); }
.group-toggle[aria-expanded="false"] svg { transform: none; }
.unit-rows { display: grid; }
.unit-row { position: relative; display: grid; grid-template-columns: 36px minmax(0, 1fr) auto; gap: 12px; align-items: center; width: 100%; padding: 10px 8px; border: 0; border-radius: 12px; background: none; text-align: left; cursor: pointer; transition: background .1s; }
.unit-row + .unit-row::before { content: ""; position: absolute; top: 0; left: 56px; right: 8px; height: .5px; background: var(--l2); }
.unit-row:hover { background: var(--hover); }
.unit-row:hover::before, .unit-row:hover + .unit-row::before { opacity: 0; }
.tile { display: grid; place-items: center; width: 36px; height: 36px; border-radius: 10px; background: var(--layer); box-shadow: inset 0 0 0 .5px var(--l4); }
.tile .glyph { width: 17px; height: 17px; color: var(--muted); }
.tile.lg { width: 48px; height: 48px; border-radius: 13px; }
.tile.lg .glyph { width: 22px; height: 22px; color: var(--text); }
.unit-row .body { min-width: 0; }
.unit-row .title { display: flex; align-items: center; gap: 6px; min-width: 0; font-size: 14px; font-weight: 500; }
.unit-row .title .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.unit-row .sub { display: block; margin-top: 1px; overflow: hidden; color: var(--muted); font-size: 12px; text-overflow: ellipsis; white-space: nowrap; }
.unit-row .sub .mono { color: var(--faint); font-size: 11px; }
.unit-row .aside { display: flex; align-items: center; gap: 12px; color: var(--faint); font-size: 12px; }
.unit-row time { min-width: 48px; text-align: right; }
.src { display: inline-flex; align-items: center; gap: 4px; font: 11px var(--mono); }
.src svg { width: 13px; height: 13px; }

.hero { display: grid; grid-template-columns: 48px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 12px 4px 0; }
.hero h2 { margin: 0; font-size: 20px; font-weight: 600; line-height: 28px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.hero .sub { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 3px; color: var(--faint); font-size: 11px; }
.hero-actions { display: flex; align-items: center; gap: 6px; }
.lede { margin: 14px 4px 0; max-width: 72ch; color: var(--muted); line-height: 1.65; }
#unit pre.md { margin: 12px 4px 0; border: .5px solid var(--l3); border-radius: 12px; }
.attach { margin: 14px 4px 0; border: .5px solid var(--l3); border-radius: 12px; background: var(--layer); overflow: hidden; }
.attach-bar { display: flex; gap: 6px; align-items: center; padding: 8px; }
.attach-bar .field { flex: 1; }
.search-results { list-style: none; margin: 0; padding: 0; max-height: 320px; overflow: auto; }
.search-results li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 8px 12px; border-top: .5px solid var(--l2); }
.search-results .name { display: flex; align-items: center; gap: 6px; font-weight: 500; }
.search-results .line { margin-top: 2px; color: var(--muted); font-size: 12px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.upkeep { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin: 22px 4px 10px; }
.upkeep h3 { display: flex; align-items: center; gap: 6px; margin: 0 6px 0 0; font-size: 15px; font-weight: 600; }
.upkeep .inline { margin-left: auto; }
.pill { display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 9px; border: 0; border-radius: 12px; corner-shape: round; background: var(--platform); color: var(--muted); font-size: 12px; cursor: pointer; }
.pill b { font: 500 11px var(--mono); color: var(--faint); }
.pill:hover { background: var(--hover); }
.pill[aria-pressed="true"] { color: var(--text); background: var(--active-item); box-shadow: inset 0 0 0 .5px var(--l4); }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 10px; padding: 0 4px 16px; }
.cards > .empty { grid-column: 1 / -1; }
.card { display: flex; flex-direction: column; gap: 6px; min-width: 0; padding: 14px 16px; border: .5px solid var(--l3); border-radius: 16px; background: var(--layer); transition: border-color .1s; }
.card:hover { border-color: var(--l4); }
.card.open { grid-column: 1 / -1; }
.card-head { display: flex; align-items: center; gap: 8px; padding: 0; border: 0; background: none; text-align: left; cursor: pointer; }
.card-title { flex: 1; min-width: 0; overflow: hidden; font-size: 14px; font-weight: 600; text-overflow: ellipsis; white-space: nowrap; }
.card-head > svg { width: 14px; height: 14px; color: var(--faint); transition: transform .15s var(--ease); }
.card.open .card-head > svg { transform: rotate(180deg); }
.card.open .card-title { white-space: normal; }
.card-desc { margin: 0; color: var(--muted); font-size: 12.5px; line-height: 1.55; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card.open .card-desc { -webkit-line-clamp: unset; }
.card-foot { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: auto; padding-top: 4px; }
.chip.tag { border-radius: 6px; font-weight: 400; }
.chip.warn { background: color-mix(in srgb, var(--warn) 12%, transparent); color: var(--warn-label); }
.fav svg { display: block; width: 13px; height: 13px; color: var(--warn); }
.card.off .card-title, .card.off .card-desc { color: var(--faint); }
.card.removed { background: repeating-linear-gradient(135deg, var(--layer) 0 7px, var(--platform) 7px 14px); }
.card .detail { display: none; margin-top: 6px; padding-top: 10px; border-top: .5px solid var(--l3); }
.card.open .detail { display: block; }
.card-controls { display: flex; align-items: center; gap: 2px; }
.card-controls .grow { flex: 1; }

/* task */
.opts { display: grid; gap: 2px; margin: 0 -4px; }
.opt { display: grid; grid-template-columns: 16px minmax(0, 1fr); gap: 8px; align-items: start; margin: 0; padding: 7px 8px; border-radius: 10px; color: var(--text); font-size: 13px; cursor: pointer; transition: background .1s; }
.opt:hover { background: var(--hover); }
.opt:has(input:checked) { background: var(--active-item); }
.opt input { margin: 3px 0 0; accent-color: var(--primary); width: auto; min-height: 0; }
.opt .chips { margin-top: 4px; }
.flow { display: flex; align-items: center; padding: 12px 16px; border-bottom: .5px solid var(--l3); overflow-x: auto; }
.node { flex: 1 1 0; min-width: 56px; display: grid; justify-items: center; gap: 1px; padding: 8px 2px; border-radius: 12px; background: var(--platform); }
.node .glyph { width: 15px; height: 15px; color: var(--text); }
.node b { font: 500 16px/22px var(--mono); }
.node span { font-size: 10.5px; color: var(--faint); }
.node.dim { background: none; box-shadow: 0 0 0 .5px var(--l3) inset; }
.node.dim b, .node.dim .glyph { color: var(--dimmed); }
.link { flex: 0 0 14px; height: .5px; background: var(--l4); }
.ulist { list-style: none; margin: 0 -8px; padding: 0; }
.ulist li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 5px 8px; border-radius: 10px; transition: background .1s; }
.ulist li:hover { background: var(--hover); }
.ulist a { color: var(--text); text-decoration: none; display: block; min-width: 0; }
.ulist .t { display: block; }
.ulist .id { font-size: 10.5px; color: var(--faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ulist .chips { justify-content: flex-end; }
.checks { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.checks li { display: grid; grid-template-columns: 16px minmax(0, 1fr); gap: 8px; color: var(--muted); }
.checks svg { width: 15px; height: 15px; margin-top: 2px; color: var(--faint); }
.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 16px; margin: 0; font-size: 12px; }
.kv dt { color: var(--faint); font-family: var(--mono); font-size: 11px; padding-top: 1px; }
.kv dd { margin: 0; }
.ratios { display: flex; gap: 8px; align-items: flex-end; flex-wrap: wrap; }
.ratio { display: inline-grid; justify-items: center; gap: 3px; font: 10px var(--mono); color: var(--faint); }
.ratio i { display: block; height: 22px; border: 1px solid var(--text); border-radius: 3px; background: var(--platform); }

/* log */
.stack { display: grid; gap: 12px; }
.timeline { list-style: none; margin: 0; padding: 0; }
.timeline li { display: grid; grid-template-columns: 84px 10px minmax(0, 1fr); gap: 10px; padding: 5px 0; position: relative; }
.timeline li::before { content: ""; position: absolute; left: 98.5px; top: 0; bottom: 0; width: .5px; background: var(--l4); }
.timeline .dot { margin-top: 4px; color: var(--accent); }
.timeline time { font: 11px var(--mono); color: var(--faint); padding-top: 2px; }
.op { font: 500 11px/17px var(--mono); }
.op.remove { color: var(--danger); background: color-mix(in srgb, var(--danger) 10%, transparent); }
.op.restore, .op.capture { color: var(--ok); background: color-mix(in srgb, var(--ok) 10%, transparent); }
.op.review { color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, transparent); }

/* toast: top-anchored contrast capsule, as DSH's */
.toast { position: fixed; top: 46px; left: 50%; translate: -50% -6px; opacity: 0; pointer-events: none; display: flex; align-items: center; gap: 8px; width: max-content; max-width: calc(100vw - 32px);
  padding: 8px 14px; border-radius: 14px; background: var(--toast); color: var(--on-toast); font-size: 12px; box-shadow: var(--shadow); transition: opacity .16s ease-out, translate .16s ease-out; z-index: 10; }
.toast.show { opacity: 1; translate: -50% 0; }
.toast .dot { color: var(--ok); }
.toast.err .dot { color: var(--danger); }

/* the DSH sidebar is narrow: flat pane, one column, rows flush */
@media (max-width: 860px) {
  .split { grid-template-columns: minmax(0, 1fr); }
  .side { position: static; max-height: none; }
  .drill.focus > .side { display: none; }
  .drill:not(.focus) > .main-pane { display: none; }
  .back { display: inline-flex; margin: 8px 8px 0; }
  .grid2 { grid-template-columns: 1fr; }
}
@media (max-width: 560px) {
  .top { padding: 6px 8px; }
  .tabs { order: 3; width: 100%; }
  .tabs button { flex: 1; justify-content: center; padding: 0 4px; }
  .stats .lbl { display: none; }
  main { padding: 0; }
  .panel { border: 0; border-radius: 0; background: transparent; }
  .stack { gap: 0; }
  .stack > .panel + .panel, .split > .panel + .panel { border-top: .5px solid var(--l3); }
  .side { padding: 6px; }
  .row-main { grid-template-columns: 10px minmax(0, 1fr); }
  .controls { grid-column: 2; margin-left: -6px; }
  .detail { padding-left: 14px; }
  .stratum { grid-template-columns: 16px 64px minmax(0, 1fr) 60px; gap: 8px; }
  .page-head { padding: 10px 10px 8px; gap: 8px; }
  .page-head h1 { font-size: 18px; }
  .page-head .seg { order: 3; width: 100%; overflow-x: auto; }
  .page-head .tools { flex: 1; }
  .sort .lbl { display: none; }
  .unit-rows, .group-toggle { margin: 0 4px; }
  .unit-row { grid-template-columns: 32px minmax(0, 1fr) auto; gap: 10px; padding: 9px 6px; }
  .unit-row + .unit-row::before { left: 48px; }
  .tile { width: 32px; height: 32px; border-radius: 9px; }
  .unit-row time { display: none; }
  #unit > .btn { margin: 8px 6px 0; }
  .hero { grid-template-columns: 40px minmax(0, 1fr); padding: 8px 10px 0; gap: 12px; }
  .tile.lg { width: 40px; height: 40px; border-radius: 11px; }
  .hero h2 { font-size: 17px; line-height: 24px; }
  .hero-actions { grid-column: 1 / -1; }
  .lede, .upkeep, .attach, #unit pre.md { margin-left: 10px; margin-right: 10px; }
  .cards { grid-template-columns: minmax(0, 1fr); padding: 0 10px 16px; }
  .card { padding: 12px 14px; border-radius: 14px; }
  .timeline li { grid-template-columns: 10px minmax(0, 1fr); }
  .timeline li::before { left: 4.5px; }
  .timeline time { grid-column: 2; grid-row: 2; }
}
</style>
<script>
// Inside DSH the pane is a same-origin iframe: follow the host's theme switch.
function syncTheme() {
  let dark = matchMedia('(prefers-color-scheme: dark)').matches
  try { if (parent !== window) { dark = parent.document.body.hasAttribute('data-ds-dark-theme'); document.documentElement.classList.add('embedded') } } catch {}
  document.documentElement.dataset.theme = dark ? 'dark' : 'light'
}
syncTheme()
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', syncTheme)
try { if (parent !== window) new MutationObserver(syncTheme).observe(parent.document.body, { attributes: true, attributeFilter: ['data-ds-dark-theme'] }) } catch {}
</script>
</head>
<body>

      <div class="head"><div class="crumb" id="cap-crumb"></div><h2>登记来源</h2><p class="desc">同一 URL 只登记一次；登记后在目录里挂到单元。</p></div>
      <div class="section">
        <div class="grid2">
          <div><label for="cap-url">URL</label><input id="cap-url" name="url" type="url" placeholder="https://"></div>
          <div><label for="cap-locator">非 URL 定位</label><input id="cap-locator" name="locator" placeholder="书目、路径或档案号"></div>

        <label for="cap-revisit">何时重访</label><input id="cap-revisit" name="revisit_when" required>

  <section class="view" id="log">
    <div class="stack">
      <div class="panel section" id="stale"></div>

    </div>
  </section>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"><span class="dot"></span><span class="msg"></span></div>
<script>
const S = (body, fill) => `<svg viewBox="0 0 24 24" fill="${fill ? 'currentColor' : 'none'}" stroke="${fill ? 'none' : 'currentColor'}" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${body}</svg>`
const ICONS = {
  mark: S('<rect x="4" y="4" width="16" height="3.2" rx="1.6" fill="currentColor" stroke="none"/><rect x="4" y="9.6" width="12" height="3.2" rx="1.6" fill="currentColor" stroke="none" opacity=".7"/><rect x="4" y="15.2" width="8" height="3.2" rx="1.6" fill="currentColor" stroke="none" opacity=".45"/>'),
  layers: S('<path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/>'),
  flow: S('<circle cx="5" cy="6" r="2"/><circle cx="19" cy="18" r="2"/><path d="M7 6h6a3 3 0 0 1 3 3v6a3 3 0 0 0 3 3"/>'),
  sliders: S('<path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/>'),
  inbox: S('<path d="M4 13l2.5-8h11L20 13v6H4z"/><path d="M4 13h5l1 2h4l1-2h5"/>'),
  activity: S('<path d="M3 12h4l3-7 4 14 3-7h4"/>'),
  search: S('<circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/>'),
  doc: S('<path d="M7 3h7l4 4v14H7z"/><path d="M14 3v4h4M10 12h5M10 16h5"/>'),
  plus: S('<path d="M12 5v14M5 12h14"/>'),
  chevron: S('<path d="M9 6l6 6-6 6"/>'),
  back: S('<path d="M15 6l-6 6 6 6"/>'),
  close: S('<path d="M6 6l12 12M18 6L6 18"/>'),
  star: S('<path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"/>', true),
  starOff: S('<path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"/>'),
  trash: S('<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>'),
  undo: S('<path d="M9 7H4v5"/><path d="M4 12a8 8 0 1 0 2.3-5.7L4 8.5"/>'),
  circle: S('<circle cx="12" cy="12" r="8"/>'),
  up: S('<path d="M12 19V5M6 11l6-6 6 6"/>'),
  alert: S('<path d="M12 4l9 16H3z"/><path d="M12 10v4M12 17h.01"/>'),
  clock: S('<circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/>'),
  lock: S('<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>'),
  code: S('<path d="M8 8l-4 4 4 4M16 8l4 4-4 4"/>'),
  play: S('<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M10 9l5 3-5 3z"/>'),
  sort: S('<path d="M8 4v16M4 8l4-4 4 4M16 20V4M12 16l4 4 4-4"/>'),
  down: S('<path d="M6 9l6 6 6-6"/>'),
  refresh: S('<path d="M20 11a8 8 0 0 0-14.3-4.6L4 8"/><path d="M4 4v4h4"/><path d="M4 13a8 8 0 0 0 14.3 4.6L20 16"/><path d="M20 20v-4h-4"/>'),
  auto: S('<circle cx="12" cy="12" r="8"/><path d="M12 4v16" /><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/>'),
}
const GLYPHS = {
  task: S('<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/>'),
  writing: S('<path d="M5 7h14M5 12h14M5 17h9"/>'),
  design: S('<rect x="4" y="4" width="10" height="10" rx="2"/><circle cx="15" cy="15" r="5"/>'),
  publish: S('<path d="M12 15V4M7 9l5-5 5 5M5 15v4h14v-4"/>'),
  materials: ICONS.layers,
}
const LAYER_NAMES = { task: 'Task', writing: 'Writing', design: 'Design', publish: 'Publish' }
const PIPELINE_ICON = { html: 'code', video: 'play' }
const EVIDENCE = ['verified', 'partial', 'unavailable']
const EVIDENCE_ORDER = ['verified', 'verified-in-scope', 'partial', 'unverified', 'unavailable']

const base = location.pathname.replace(/\/(index\.html)?$/, '')
async function api(tool, args = {}) {
  const res = await fetch(`${base}/api/${tool}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(args) })
  const body = await res.json()
  if (!res.ok) { const e = new Error(body.error || res.statusText); e.status = res.status; e.current = body.current; throw e }
  return body
}
const $ = (sel, root = document) => root.querySelector(sel)
const el = (tag, attrs = {}, ...kids) => {
  const node = document.createElement(tag)
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'html') node.innerHTML = v
    else if (k.startsWith('on')) node.addEventListener(k.slice(2), v)
    else if (k.startsWith('aria-')) node.setAttribute(k, String(v))
    else if (v !== undefined && v !== null && v !== false) node.setAttribute(k, v === true ? '' : v)
  }
  for (const kid of kids.flat()) if (kid !== null && kid !== undefined && kid !== false) node.append(kid)
  return node
}
const svg = (markup, cls) => { const t = document.createElement('template'); t.innerHTML = markup; const s = t.content.firstChild; if (cls) s.setAttribute('class', cls); return s }
const glyph = (layer) => svg(GLYPHS[layer] || GLYPHS.materials, 'glyph')
const layerOf = (id) => id.split('/')[0]
const empty = (icon, text) => el('div', { class: 'empty' }, svg(ICONS[icon]), text)
const chip = (text, cls = '', icon) => el('span', { class: `chip ${cls}` }, icon ? svg(ICONS[icon]) : null, text)

let toastTimer
function toast(msg, err = false) {
  const t = $('#toast')
  t.className = `toast show${err ? ' err' : ''}`
  $('.msg', t).textContent = msg
  clearTimeout(toastTimer)
  toastTimer = setTimeout(() => t.classList.remove('show'), 2400)
}
const segment = (name, options, value) => options.map((o) => el('label', {},
  el('input', { type: 'radio', name, value: o.value, checked: o.value === value }), o.icon ? svg(o.icon) : null, o.label))

// ---- shell
$('#brand').append(svg(ICONS.mark), el('span', {}, 'Praxis'))
$('#tree-search').prepend(svg(ICONS.search))
$('#cap-crumb').append(svg(ICONS.inbox, 'glyph'), 'materials / capture')
$('#cap-back').prepend(svg(ICONS.back))
$('#cap-back').addEventListener('click', () => show('catalog'))
for (const b of document.querySelectorAll('.tabs button')) {
  b.prepend(svg(ICONS[b.dataset.icon]))
  b.addEventListener('click', () => show(b.dataset.view))
}
function show(view) {
  for (const x of document.querySelectorAll('.tabs button')) x.setAttribute('aria-selected', x.dataset.view === (view === 'capture' ? 'catalog' : view))
  for (const v of document.querySelectorAll('.view')) v.classList.toggle('on', v.id === view)
  if (view === 'log') loadLog()
  if (view === 'task') loadTaskTypes()
  if (view === 'presets') loadPresets()
}
function renderStats(bindingCount) {
  $('#stats').replaceChildren(
    el('span', {}, el('b', {}, String(units.length)), el('span', { class: 'lbl' }, '单元')),
    el('span', {}, el('b', {}, String(bindingCount)), el('span', { class: 'lbl' }, '挂载')),
    el('span', { class: 'live', title: '本机控制面' }, el('span', { class: 'dot verified' }), el('span', { class: 'lbl' }, 'local')))
}

// ---- catalog: units read as a list; a unit opens to its description, its source index and the upkeep on that index
let units = [], counts = {}, current = null, showRemoved = false, cardFilter = 'all', listScroll = 0
const view = { layer: '', sort: 'layer', q: '' }
const SORTS = { layer: '按层', updated: '最近更新', sources: '来源最多' }
const VERDICT = { accurate: '准确', revised: '已改', 'needs-work': '待改' }
const collapsed = new Set()

async function loadTree() {
  units = await api('praxis_units')
  const all = await api('praxis_bindings', {})
  counts = {}
  for (const b of all) { const key = b.target.split('#')[0]; counts[key] = (counts[key] || 0) + 1 }
  renderStats(all.length)
  renderList()
}

function when(iso) {
  if (!iso) return ''
  const d = new Date(iso), days = Math.floor((Date.now() - d) / 864e5)
  if (days < 1) return '今天'
  if (days < 7) return `${days} 天前`
  const md = `${d.getMonth() + 1}月${d.getDate()}日`
  return d.getFullYear() === new Date().getFullYear() ? md : `${d.getFullYear()}年${md}`
}
const tile = (layer, big) => el('span', { class: `tile${big ? ' lg' : ''}` }, glyph(layer))

function unitRow(u) {
  const n = counts[u.path] || 0
  return el('button', { class: 'unit-row', onclick: () => openUnit(u.id) },
    tile(u.layer),
    el('span', { class: 'body' },
      el('span', { class: 'title' }, el('span', { class: 't' }, u.title), u.resident ? chip('常驻', 'accent') : null),
      el('span', { class: 'sub' }, el('span', { class: 'mono' }, u.id), ' · ', u.description)),
    el('span', { class: 'aside' },
      n ? el('span', { class: 'src', title: `${n} 个来源` }, svg(ICONS.layers), String(n)) : null,
      el('time', { datetime: u.updated_at || '', title: u.updated_at || '' }, when(u.updated_at))))
}

function renderList() {
  const q = view.q.toLowerCase()
  let list = units.filter((u) => (!view.layer || u.layer === view.layer) && (!q || (u.id + u.title + u.description).toLowerCase().includes(q)))
  if (view.sort === 'updated') list = list.sort((a, b) => (b.updated_at || '').localeCompare(a.updated_at || ''))
  if (view.sort === 'sources') list = list.sort((a, b) => (counts[b.path] || 0) - (counts[a.path] || 0))
  const box = $('#unit-list')
  if (!list.length) return box.replaceChildren(empty('search', '没有匹配的单元'))
  if (view.sort !== 'layer') return box.replaceChildren(el('div', { class: 'unit-rows' }, list.map(unitRow)))
  box.replaceChildren(...Object.keys(LAYER_NAMES).flatMap((layer) => {
    const rows = list.filter((u) => u.layer === layer)
    if (!rows.length) return []
    const open = !collapsed.has(layer)
    return [el('section', { class: 'group-block' },
      el('button', { class: 'group-toggle', 'aria-expanded': open, onclick: () => { open ? collapsed.add(layer) : collapsed.delete(layer); renderList() } },
        svg(ICONS.chevron), LAYER_NAMES[layer], chip(String(rows.length))),
      open ? el('div', { class: 'unit-rows' }, rows.map(unitRow)) : null)]
  }))
}

$('#layer-seg').append(...segment('layer', [{ value: '', label: '全部' }, ...Object.entries(LAYER_NAMES).map(([value, label]) => ({ value, label }))], ''))
$('#layer-seg').addEventListener('change', (e) => { view.layer = e.target.value; renderList() })
$('#tree-filter').addEventListener('input', (e) => { view.q = e.target.value.trim(); renderList() })
function renderSort() { $('#sort').replaceChildren(svg(ICONS.sort), el('span', { class: 'lbl' }, SORTS[view.sort])) }
$('#sort').addEventListener('click', () => {
  const keys = Object.keys(SORTS)
  view.sort = keys[(keys.indexOf(view.sort) + 1) % keys.length]
  renderSort(); renderList()
})
renderSort()
$('#add-source').prepend(svg(ICONS.plus))
$('#add-source').addEventListener('click', () => show('capture'))

function closeUnit() {
  current = null
  $('#catalog-split').classList.remove('focus')
  window.scrollTo(0, listScroll)
}

async function openUnit(id) {
  const u = units.find((x) => x.id === id)
  if (!u) return
  if (!current) listScroll = window.scrollY
  current = u
  cardFilter = 'all'
  $('#catalog-split').classList.add('focus')
  window.scrollTo(0, 0)
  $('#unit').replaceChildren(
    el('button', { class: 'btn ghost', onclick: closeUnit }, svg(ICONS.back), 'Kit'),
    el('header', { class: 'hero' }, tile(u.layer, true),
      el('div', { style: 'min-width:0' },
        el('h2', {}, u.title, u.resident ? chip('常驻', 'accent') : null),
        el('div', { class: 'sub' }, chip(LAYER_NAMES[u.layer], 'outline'), el('span', { class: 'mono' }, u.id), el('span', { class: 'mono', title: '内容版本' }, u.version),
          u.updated_at ? el('time', { title: u.updated_at }, when(u.updated_at)) : null)),
      el('div', { class: 'hero-actions' },
        el('button', { class: 'icon', title: '正文', 'aria-label': '正文', html: ICONS.doc, onclick: () => readUnit(u.id) }),
        el('button', { class: 'btn primary', onclick: () => addPanel(u) }, svg(ICONS.plus), '来源'))),
    el('p', { class: 'lede' }, u.description),
    el('div', { id: 'add-panel' }),
    el('div', { class: 'upkeep', id: 'upkeep' }),
    el('div', { class: 'cards', id: 'cards' }))
  await loadCards()
}

async function readUnit(id) {

      el('span', { class: 'chips' }, s.units.map((x) => chip(x, 'mono')), s.bindings.map((x) => chip(x.split('@')[0], 'mono outline'))))))
    : empty('check', '交付都与当前 Kit 一致')))
  $('#runs').replaceChildren(...logCard('clock', '运行', runList.length, runList.length
    ? el('ol', { class: 'timeline' }, runList.map((r) => el('li', {}, el('time', {}, r.at.slice(5, 16).replace('T', ' ')), el('span', { class: 'dot' }),
      el('div', {}, el('div', {}, r.title), el('div', { class: 'chips', style: 'margin-top:4px' },
        chip(`${r.units.length}`, 'mono', 'layers'), chip(`${r.bindings.length}`, 'mono', 'inbox'), chip(`${r.artifacts.length}`, 'mono', 'doc'))))))
    : empty('clock', '还没有运行')))
  $('#history').replaceChildren(...logCard('activity', '维护', history.length, history.length
    ? el('ol', { class: 'timeline' }, history.map((h) => el('li', {}, el('time', {}, h.at.slice(5, 16).replace('T', ' ')), el('span', { class: 'dot' }),
      el('div', { style: 'min-width:0' }, el('span', { class: 'chips' }, chip(h.op, `op ${h.op.replace('praxis_', '')}`), h.id ? el('span', { class: 'meta' }, h.id) : null),
        h.by || h.reason ? el('div', { class: 'desc', style: 'margin-top:2px;font-size:12px' }, [h.by, h.reason].filter(Boolean).join(' · ')) : null))))
    : empty('activity', '还没有维护')))
}
ICONS.check = S('<circle cx="12" cy="12" r="8"/><path d="M8.5 12.5l2.5 2.5 4.5-5"/>')

loadTree()
</script>
