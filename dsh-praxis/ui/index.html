<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Praxis 控制面</title>
<style>
:root {
  --bg: #f6f8fb; --panel: #ffffff; --line: #dde3ec; --line-strong: #c4ccd8;
  --text: #1c2430; --muted: #5d6878; --faint: #8a94a3;
  --accent: #2f5bd3; --accent-soft: #e8eefc; --danger: #b4372f; --ok: #2e7d5b;
  --radius: 8px; --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #11151b; --panel: #171c24; --line: #273040; --line-strong: #364256;
    --text: #e4e9f0; --muted: #a2adbd; --faint: #758195; --accent: #7fa2ff; --accent-soft: #1d2a48; --danger: #f08a80; --ok: #7cc9a4; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.55 -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", sans-serif; }
header { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 24px; padding: 12px 20px; border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; z-index: 2; }
header h1 { font-size: 15px; margin: 0; font-weight: 600; letter-spacing: .02em; white-space: nowrap; }
nav { display: flex; gap: 4px; }
nav button { white-space: nowrap; border: 0; background: none; color: var(--muted); padding: 6px 12px; border-radius: 6px; font: inherit; cursor: pointer; }
nav button[aria-selected="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
main { padding: 16px 20px; }
.view { display: none; }
.view.on { display: block; }
.split { display: grid; grid-template-columns: 300px 1fr; gap: 16px; align-items: start; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); }
.tree { max-height: calc(100vh - 110px); overflow: auto; padding: 8px; position: sticky; top: 64px; }
.tree input { width: 100%; margin-bottom: 8px; }
.tree h3 { font-size: 12px; color: var(--faint); text-transform: uppercase; letter-spacing: .06em; margin: 10px 6px 4px; }
.tree button { display: block; width: 100%; text-align: left; border: 0; background: none; font: inherit; color: var(--text); padding: 4px 8px; border-radius: 6px; cursor: pointer; }
.tree button small { color: var(--faint); font-family: var(--mono); font-size: 11px; display: block; }
.tree button[aria-current="true"] { background: var(--accent-soft); color: var(--accent); }
.tree button .count { float: right; color: var(--faint); font-size: 12px; }
.unit-head { padding: 14px 16px; border-bottom: 1px solid var(--line); }
.unit-head h2 { margin: 0 0 4px; font-size: 17px; }
.meta { color: var(--muted); font-size: 12px; font-family: var(--mono); }
.badge { display: inline-block; font-size: 11px; padding: 0 6px; border-radius: 10px; border: 1px solid var(--line-strong); color: var(--muted); margin-left: 6px; font-family: inherit; }
.badge.accent { border-color: var(--accent); color: var(--accent); }
.desc { margin: 6px 0 0; color: var(--text); }
.toolbar { display: flex; gap: 8px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.toolbar .grow { flex: 1; }
.rows { list-style: none; margin: 0; padding: 0; }
.row { border-bottom: 1px solid var(--line); }
.row:last-child { border-bottom: 0; }
.row-main { display: grid; grid-template-columns: 1fr auto; gap: 12px; padding: 10px 16px; align-items: center; }
.row-main .name { font-weight: 600; cursor: pointer; }
.row-main .line { color: var(--muted); font-size: 13px; }
.row.off .name, .row.off .line { color: var(--faint); }
.row.removed { background: repeating-linear-gradient(135deg, transparent 0 8px, var(--bg) 8px 16px); }
.controls { display: flex; gap: 4px; align-items: center; }
.icon { border: 1px solid transparent; background: none; color: var(--muted); width: 30px; height: 30px; border-radius: 6px; display: inline-grid; place-items: center; cursor: pointer; }
.icon:hover { border-color: var(--line); }
.icon svg { width: 16px; height: 16px; }
.icon.on { color: var(--accent); }
.icon.danger:hover { color: var(--danger); }
.switch { position: relative; width: 34px; height: 20px; border-radius: 10px; background: var(--line-strong); border: 0; cursor: pointer; transition: background .15s; }
.switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .15s; }
.switch[aria-checked="true"] { background: var(--accent); }
.switch[aria-checked="true"]::after { transform: translateX(14px); }
.detail { padding: 4px 16px 16px; display: none; }
.row.open .detail { display: block; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 16px; }
label { display: block; font-size: 12px; color: var(--muted); margin: 8px 0 3px; }
input, select, textarea { font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line-strong); border-radius: 6px; padding: 6px 8px; width: 100%; }
textarea { min-height: 64px; resize: vertical; }
button.primary, button.plain { font: inherit; border-radius: 6px; padding: 6px 12px; cursor: pointer; border: 1px solid var(--accent); }
button.primary { background: var(--accent); color: #fff; }
button.plain { background: none; color: var(--accent); }
.actions { display: flex; gap: 8px; margin-top: 10px; align-items: center; }
.note { font-size: 12px; color: var(--muted); }
.note.err { color: var(--danger); }
.note.ok { color: var(--ok); }
.reviews { font-size: 12px; color: var(--muted); margin: 8px 0 0; padding-left: 16px; }
.empty { padding: 24px 16px; color: var(--muted); }
pre.md { white-space: pre-wrap; font: 13px/1.6 var(--mono); padding: 16px; margin: 0; max-height: 60vh; overflow: auto; }
.section { padding: 14px 16px; }
.section h3 { margin: 0 0 8px; font-size: 14px; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--muted); font-weight: 500; font-size: 12px; }
.search-results { max-height: 280px; overflow: auto; border-top: 1px solid var(--line); }
.search-results li { padding: 8px 16px; border-bottom: 1px solid var(--line); display: grid; grid-template-columns: 1fr auto; gap: 8px; }
.stack > * + * { margin-top: 16px; }
@media (max-width: 520px) { header { padding: 10px 12px; } main { padding: 12px; } nav button { padding: 6px 8px; } .row-main { grid-template-columns: 1fr; } }
@media (max-width: 820px) { .split { grid-template-columns: 1fr; } .tree { position: static; max-height: 40vh; } .grid2 { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <h1>Praxis 控制面</h1>
  <nav role="tablist">
    <button role="tab" data-view="catalog" aria-selected="true">目录</button>
    <button role="tab" data-view="task" aria-selected="false">任务</button>
    <button role="tab" data-view="presets" aria-selected="false">预设</button>
    <button role="tab" data-view="capture" aria-selected="false">收录</button>
    <button role="tab" data-view="log" aria-selected="false">记录</button>
  </nav>
</header>
<main>
  <section class="view on" id="catalog">
    <div class="split">
      <div class="panel tree" id="tree"><input id="tree-filter" placeholder="筛选单元" aria-label="筛选单元"></div>
      <div class="panel" id="unit"><p class="empty">选一个单元，查看挂在它上面的来源。</p></div>
    </div>
  </section>
  <section class="view" id="task">
    <div class="split">
      <div class="panel section">
        <label for="task-type">任务类型</label>
        <select id="task-type"></select>
        <label for="task-pipeline">流水线</label>
        <select id="task-pipeline"><option value="">默认</option><option value="html">html</option><option value="video">video</option></select>
        <label for="task-preset">预设</label>
        <select id="task-preset"><option value="">该流水线的默认预设</option></select>
        <div class="actions"><button class="primary" id="task-go">展开</button></div>
        <p class="note" id="task-note"></p>
      </div>
      <div class="panel" id="task-out"><p class="empty">选任务类型，列出这次要读的单元和素材。</p></div>
    </div>
  </section>
  <section class="view" id="presets">
    <div class="split">
      <div class="panel tree" id="preset-list"></div>
      <div class="panel section" id="preset-edit"><p class="empty">选一个预设，或新建。预设是流水线的默认配置；每次运行记下它当时的版本。</p></div>
    </div>
  </section>
  <section class="view" id="capture">
    <div class="panel section" style="max-width: 760px">
      <h3>登记一个来源</h3>
      <p class="note">同一 URL 已登记时返回已有条目。登记后到目录里把它挂到单元上。</p>
      <form id="cap-form">
        <div class="grid2">
          <div><label for="cap-url">URL</label><input id="cap-url" name="url" type="url"></div>
          <div><label for="cap-locator">非 URL 来源的定位</label><input id="cap-locator" name="locator"></div>
        </div>
        <label for="cap-title">标题</label><input id="cap-title" name="title" required>
        <label for="cap-summary">概要：是什么、能支持什么判断</label><textarea id="cap-summary" name="summary" required></textarea>
        <label for="cap-scope">实际读取范围</label><input id="cap-scope" name="read_scope" required placeholder="读过正文 / 看过输出 / 运行过实现">
        <div class="grid2">
          <div><label for="cap-status">证据状态</label><select id="cap-status" name="evidence_status"><option>partial</option><option>verified</option><option>unavailable</option></select></div>
          <div><label for="cap-tags">用途 tag（空格分隔）</label><input id="cap-tags" name="tags"></div>
        </div>
        <label for="cap-limits">边界：不能证明什么</label><textarea id="cap-limits" name="limits" required></textarea>
        <label for="cap-revisit">何时重访</label><input id="cap-revisit" name="revisit_when" required>
        <div class="actions"><button class="primary" type="submit">登记</button><span class="note" id="cap-note"></span></div>
      </form>
    </div>
  </section>
  <section class="view" id="log">
    <div class="stack">
      <div class="panel section"><h3>可能要重看的交付</h3><div id="stale"></div></div>
      <div class="panel section"><h3>运行记录</h3><div id="runs"></div></div>
      <div class="panel section"><h3>维护记录</h3><div id="history"></div></div>
    </div>
  </section>
</main>
<script>
const ICONS = {
  star: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"/></svg>',
  starOff: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"/></svg>',
  trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>',
  undo: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M9 7H4v5M4 12a8 8 0 1 0 2.3-5.7L4 8.5"/></svg>',
}
const base = location.pathname.replace(/\/(index\.html)?$/, '')
async function api(tool, args = {}) {
  const res = await fetch(`${base}/api/${tool}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(args) })
  const body = await res.json()
  if (!res.ok) { const e = new Error(body.error || res.statusText); e.status = res.status; e.current = body.current; throw e }
  return body
}
const $ = (sel, root = document) => root.querySelector(sel)
const el = (tag, attrs = {}, ...kids) => {
  const node = document.createElement(tag)
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'html') node.innerHTML = v
    else if (k.startsWith('on')) node.addEventListener(k.slice(2), v)
    else if (k.startsWith('aria-')) node.setAttribute(k, String(v))
    else if (v !== undefined && v !== null && v !== false) node.setAttribute(k, v === true ? '' : v)
  }
  for (const kid of kids.flat()) if (kid !== null && kid !== undefined) node.append(kid)
  return node
}
const LAYER_NAMES = { task: 'Task', writing: 'Writing', publish: 'Publish', design: 'Design' }

// ---- tabs
for (const b of document.querySelectorAll('nav button')) b.addEventListener('click', () => {
  for (const x of document.querySelectorAll('nav button')) x.setAttribute('aria-selected', x === b)
  for (const v of document.querySelectorAll('.view')) v.classList.toggle('on', v.id === b.dataset.view)
  if (b.dataset.view === 'log') loadLog()
  if (b.dataset.view === 'task') loadTaskTypes()
  if (b.dataset.view === 'presets') loadPresets()
})

// ---- catalog
let units = [], counts = {}, current = null, showRemoved = false
async function loadTree() {
  units = await api('praxis_units')
  const all = await api('praxis_bindings', {})
  counts = {}
  for (const b of all) { const key = b.target.split('#')[0]; counts[key] = (counts[key] || 0) + 1 }
  renderTree()
}
function renderTree() {
  const tree = $('#tree'), q = $('#tree-filter').value.trim().toLowerCase()
  for (const n of [...tree.children]) if (n.id !== 'tree-filter') n.remove()
  for (const layer of Object.keys(LAYER_NAMES)) {
    const list = units.filter((u) => u.layer === layer && (!q || (u.id + u.title).toLowerCase().includes(q)))
    if (!list.length) continue
    tree.append(el('h3', {}, LAYER_NAMES[layer]))
    for (const u of list) tree.append(el('button', { 'aria-current': current?.id === u.id, onclick: () => openUnit(u.id) },
      counts[u.path] ? el('span', { class: 'count' }, String(counts[u.path])) : null, u.title, el('small', {}, u.id)))
  }
}
$('#tree-filter').addEventListener('input', renderTree)

async function openUnit(id) {
  const u = units.find((x) => x.id === id)
  current = u
  renderTree()
  const box = $('#unit')
  box.replaceChildren(el('div', { class: 'unit-head' },
    el('h2', {}, u.title, u.resident ? el('span', { class: 'badge accent' }, '常驻') : null),
    el('div', { class: 'meta' }, `${u.id} · ${u.path} · ${u.version}`),
    el('p', { class: 'desc' }, u.description)))
  const tools = el('div', { class: 'toolbar' },
    el('button', { class: 'plain', onclick: () => readUnit(u.id) }, '读正文'),
    el('span', { class: 'grow' }),
    el('label', { style: 'margin:0;display:flex;gap:6px;align-items:center' },
      el('input', { type: 'checkbox', style: 'width:auto', checked: showRemoved, onchange: (e) => { showRemoved = e.target.checked; openUnit(id) } }), '显示已删除'),
    el('button', { class: 'primary', onclick: () => addPanel(u) }, '添加来源'))
  box.append(tools, el('div', { id: 'add-panel' }))
  const list = await api('praxis_bindings', { target: u.path, include_removed: showRemoved })
  const exact = list.filter((b) => b.target.split('#')[0] === u.path)
  if (!exact.length) return box.append(el('p', { class: 'empty' }, '这个单元还没有挂来源。'))
  const ul = el('ul', { class: 'rows' })
  for (const b of exact.sort((a, b) => (b.priority === 'preferred') - (a.priority === 'preferred') || b.favorite - a.favorite)) ul.append(row(b))
  box.append(ul)
}

async function readUnit(id) {
  const u = await api('praxis_unit', { ref: id })
  const box = $('#unit')
  const pre = $('pre.md', box) || box.appendChild(el('pre', { class: 'md' }))
  pre.textContent = u.body
  pre.scrollIntoView({ behavior: 'smooth', block: 'nearest' })
}

function row(b) {
  const li = el('li', { class: `row${b.enabled ? '' : ' off'}${b.state === 'removed' ? ' removed' : ''}` })
  const note = el('span', { class: 'note' })
  const act = async (fn, ok) => {
    try { await fn(); note.className = 'note ok'; note.textContent = ok; await refreshRow(li, b.id) }
    catch (e) { note.className = 'note err'; note.textContent = e.status === 409 ? '已被他人更新，已载入最新版本' : e.message; if (e.status === 409) await refreshRow(li, b.id) }
  }
  const controls = b.state === 'removed'
    ? el('div', { class: 'controls' }, el('button', { class: 'icon', title: '恢复', 'aria-label': '恢复', html: ICONS.undo, onclick: () => act(() => api('praxis_restore', { binding: b.id, expected_revision: b.revision }), '已恢复') }))
    : el('div', { class: 'controls' },
      el('button', { class: 'switch', role: 'switch', 'aria-checked': b.enabled, 'aria-label': '启用', title: '启用：进入任务默认可选范围',
        onclick: () => act(() => api('praxis_curate', { binding: b.id, expected_revision: b.revision, enabled: !b.enabled }), b.enabled ? '已停用' : '已启用') }),
      el('button', { class: `icon${b.favorite ? ' on' : ''}`, 'aria-pressed': b.favorite, 'aria-label': '收藏', title: '收藏', html: b.favorite ? ICONS.star : ICONS.starOff,
        onclick: () => act(() => api('praxis_curate', { binding: b.id, expected_revision: b.revision, favorite: !b.favorite }), b.favorite ? '已取消收藏' : '已收藏') }),
      el('button', { class: 'icon danger', 'aria-label': '删除', title: '删除（可恢复）', html: ICONS.trash,
        onclick: () => act(() => api('praxis_remove', { binding: b.id, expected_revision: b.revision }), '已删除，可恢复') }))
  li.append(el('div', { class: 'row-main' },
    el('div', {},
      el('div', { class: 'name', onclick: () => li.classList.toggle('open') }, b.title,
        b.priority === 'preferred' ? el('span', { class: 'badge accent' }, '优先') : null,
        el('span', { class: 'badge' }, b.evidence_status || '—'),
        b.description_curated ? null : el('span', { class: 'badge', title: '还没有写取用说明，显示的是来源概要' }, '概要')),
      el('div', { class: 'line' }, b.description)),
    el('div', {}, controls, note)))
  li.append(detail(b, act))
  return li
}

function detail(b, act) {
  const f = (name, label, value, tag = 'input') => el('div', {}, el('label', {}, label), el(tag, { name, value: tag === 'input' ? (value ?? '') : null }, tag === 'textarea' ? (value ?? '') : null))
  const u = b.usage || {}
  const form = el('form', { onsubmit: (e) => {
    e.preventDefault()
    const d = Object.fromEntries(new FormData(form))
    const patch = { binding: b.id, expected_revision: b.revision, description: d.description.trim(), priority: d.priority,
      tags: d.tags.split(/\s+/).filter(Boolean) }
    if (d.problem.trim() || d.how.trim()) patch.usage = { problem: d.problem.trim(), how: d.how.trim(), conditions: d.conditions.trim() || undefined, limits: d.limits.trim() || undefined }
    act(() => api('praxis_curate', patch), '已保存')
  } },
    f('description', '目录说明（240 字内：何时用、取用什么）', b.description, 'textarea'),
    el('div', { class: 'grid2' }, f('problem', '适用的问题', u.problem), f('how', '怎样取用', u.how), f('conditions', '条件', u.conditions), f('limits', '不适用或易误用', u.limits)),
    el('div', { class: 'grid2' },
      el('div', {}, el('label', {}, '优先级'), el('select', { name: 'priority' }, el('option', { value: 'normal', selected: b.priority !== 'preferred' }, '普通'), el('option', { value: 'preferred', selected: b.priority === 'preferred' }, '优先'))),
      f('tags', 'tag', (b.tags || []).join(' '))),
    el('div', { class: 'actions' }, el('button', { class: 'primary', type: 'submit' }, '保存'), el('span', { class: 'note' }, `revision ${b.revision} · ${b.source}`)))
  const review = el('form', { class: 'actions', onsubmit: (e) => {
    e.preventDefault()
    const d = Object.fromEntries(new FormData(review))
    act(() => api('praxis_review', { binding: b.id, verdict: d.verdict, note: d.note.trim() || undefined }), '已记录 review')
  } },
    el('select', { name: 'verdict', style: 'width:auto', 'aria-label': 'review 结论' }, el('option', { value: 'accurate' }, '准确'), el('option', { value: 'revised' }, '已改'), el('option', { value: 'needs-work' }, '待改')),
    el('input', { name: 'note', placeholder: 'review 说明', 'aria-label': 'review 说明' }),
    el('button', { class: 'plain', type: 'submit' }, '记录 review'))
  const reviews = b.reviews.length ? el('ul', { class: 'reviews' }, b.reviews.map((r) => el('li', {}, `r${r.revision} · ${r.verdict} · ${r.by || ''}${r.note ? ' · ' + r.note : ''}`))) : null
  return el('div', { class: 'detail' }, form, review, reviews,
    el('div', { class: 'actions' }, el('button', { class: 'plain', type: 'button', onclick: (e) => showSource(b.source, e.target) }, '来源条目')))
}

async function refreshRow(li, id) {
  const [b] = (await api('praxis_bindings', { source: id.slice(0, id.lastIndexOf('@')), include_removed: true })).filter((x) => x.id === id)
  if (!b) return li.remove()
  const open = li.classList.contains('open')
  const next = row(b)
  if (open) next.classList.add('open')
  li.replaceWith(next)
  loadTree()
}

async function showSource(id, anchor) {
  const s = await api('praxis_source', { id })
  const box = el('div', { class: 'section' },
    el('p', { class: 'meta' }, `${s.id}${s.url ? ' · ' + s.url : ''}`),
    el('p', {}, s.summary),
    s.limits?.length ? el('p', { class: 'note' }, '边界：' + s.limits.join('；')) : null,
    s.excerpts?.length ? el('ul', { class: 'reviews' }, s.excerpts.map((x) => el('li', {}, `${x.claim}（${x.locator}）`))) : null,
    el('p', { class: 'note' }, `证据 ${s.evidence_status} · 卡片 ${s.card || '—'}${s.snapshot ? ' · 快照 ' + s.snapshot.path : ''}`))
  anchor.closest('.detail').append(box)
  anchor.remove()
}

function addPanel(u) {
  const box = $('#add-panel')
  const input = el('input', { placeholder: '按标题、摘要或 tag 搜索来源', 'aria-label': '搜索来源' })
  const results = el('ul', { class: 'rows search-results' })
  let timer
  input.addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(async () => {
    const hits = await api('praxis_search', { query: input.value, limit: 15 })
    results.replaceChildren(...hits.map((h) => el('li', {},
      el('div', {}, el('strong', {}, h.title), el('div', { class: 'line note' }, h.summary)),
      h.grammar_paths.includes(u.path) ? el('span', { class: 'note' }, '已挂载')
        : el('button', { class: 'plain', onclick: async (e) => {
          try { await api('praxis_curate', { binding: `${h.id}@${u.path}`, expected_revision: 0 }); openUnit(u.id); loadTree() }
          catch (err) { e.target.replaceWith(el('span', { class: 'note err' }, err.message)) }
        } }, '挂到本单元'))))
  }, 200) })
  box.replaceChildren(el('div', { class: 'section' }, input), results)
  input.focus()
}

// ---- task
let typesLoaded = false
async function loadTaskTypes() {
  if (typesLoaded) return
  const entry = await api('praxis_entry')
  $('#task-type').replaceChildren(...entry.task_types.map((t) => el('option', { value: t.id }, `${t.title}（${t.pipelines.join(' / ')}）`)))
  const ps = await api('praxis_presets')
  $('#task-preset').append(...ps.presets.map((p) => el('option', { value: p.id }, `${p.pipeline} · ${p.title}`)))
  typesLoaded = true
}
$('#task-go').addEventListener('click', async () => {
  const out = $('#task-out'), note = $('#task-note')
  try {
    const r = await api('praxis_resolve', { task_type: $('#task-type').value, pipeline: $('#task-pipeline').value || undefined, preset: $('#task-preset').value || undefined })
    note.textContent = ''
    out.replaceChildren(
      el('div', { class: 'unit-head' }, el('h2', {}, `${r.task_type.title} · ${r.pipeline}`), el('p', { class: 'desc' }, r.task_type.outcome)),
      el('div', { class: 'section' }, el('h3', {}, `要读的单元（${r.units.length}）`),
        el('table', {}, el('tr', {}, el('th', {}, '单元'), el('th', {}, '为什么读')),
          r.units.map((u) => el('tr', {}, el('td', {}, el('strong', {}, u.title), el('div', { class: 'meta' }, u.id)), el('td', {}, u.reasons.join('；')))))),
      el('div', { class: 'section' }, el('h3', {}, `可取用的素材（${r.materials.length}）`),
        r.materials.length ? el('table', {}, r.materials.map((m) => el('tr', {}, el('td', {}, el('strong', {}, m.title), el('div', { class: 'note' }, m.description)), el('td', { class: 'note' }, m.priority === 'preferred' ? '优先' : '', m.favorite ? ' ★' : ''))))
          : el('p', { class: 'note' }, '这些单元上没有已启用的来源。')),
      r.preset ? el('div', { class: 'section' }, el('h3', {}, `预设：${r.preset.title}`), el('table', {}, Object.entries(r.preset.values).map(([k, v]) => el('tr', {}, el('td', { class: 'meta' }, k), el('td', {}, Array.isArray(v) ? v.join(' ') : String(v)))))) : null,
      el('div', { class: 'section' }, el('h3', {}, '验收'), el('ul', {}, r.task_type.acceptance.map((a) => el('li', {}, a)))))
  } catch (e) { note.className = 'note err'; note.textContent = e.message }
})

// ---- presets
let presetData = null
async function loadPresets(selectId) {
  presetData = await api('praxis_presets')
  const list = $('#preset-list')
  list.replaceChildren()
  for (const pipeline of Object.keys(presetData.fields)) {
    list.append(el('h3', {}, pipeline))
    for (const pr of presetData.presets.filter((x) => x.pipeline === pipeline)) {
      list.append(el('button', { 'aria-current': pr.id === selectId, onclick: () => editPreset(pr.id) }, pr.title, pr.default ? el('span', { class: 'count' }, '默认') : null, el('small', {}, pr.id)))
    }
    list.append(el('button', { onclick: () => editPreset(null, pipeline) }, el('small', {}, `＋ 新建 ${pipeline} 预设`)))
  }
  if (selectId) editPreset(selectId)
}
function editPreset(id, pipeline) {
  const pr = id ? presetData.presets.find((x) => x.id === id) : { pipeline, title: '', values: {}, tags: [], revision: 0 }
  const fields = presetData.fields[pr.pipeline]
  const note = el('span', { class: 'note' })
  const input = (f) => {
    const v = pr.values?.[f.key]
    if (f.type === 'boolean') return el('select', { name: f.key }, el('option', { value: '' }, '—'), el('option', { value: 'true', selected: v === true }, '是'), el('option', { value: 'false', selected: v === false }, '否'))
    if (f.type === 'text') return el('textarea', { name: f.key, placeholder: f.hint }, v ?? '')
    return el('input', { name: f.key, value: Array.isArray(v) ? v.join(' ') : (v ?? ''), placeholder: f.hint || '', required: f.required })
  }
  const form = el('form', { onsubmit: async (e) => {
    e.preventDefault()
    const d = Object.fromEntries(new FormData(form))
    const values = {}
    for (const f of fields) {
      const raw = (d[f.key] ?? '').trim()
      if (!raw) continue
      values[f.key] = f.type === 'number' ? Number(raw) : f.type === 'boolean' ? raw === 'true' : f.type === 'list' ? raw.split(/\s+/) : raw
    }
    try {
      const saved = await api('praxis_preset_save', { id: id || undefined, expected_revision: id ? pr.revision : undefined, pipeline: pr.pipeline,
        title: d.title.trim(), description: d.description.trim() || undefined, tags: d.tags.split(/\s+/).filter(Boolean), default: d.default === 'on', values })
      await loadPresets(saved.id)
      $('#preset-edit .note').className = 'note ok'; $('#preset-edit .note').textContent = '已保存'
    } catch (err) { note.className = 'note err'; note.textContent = err.status === 409 ? '已被他人更新，请重新打开' : err.message }
  } },
    el('h3', {}, id ? pr.title : `新建 ${pr.pipeline} 预设`), el('p', { class: 'meta' }, id ? `${id} · revision ${pr.revision}` : pr.pipeline),
    el('label', {}, '名称'), el('input', { name: 'title', value: pr.title, required: true }),
    el('label', {}, '什么时候用'), el('input', { name: 'description', value: pr.description ?? '' }),
    el('div', { class: 'grid2' }, fields.map((f) => el('div', {}, el('label', {}, f.label + (f.required ? ' *' : '')), input(f)))),
    el('label', {}, 'tag（空格分隔）'), el('input', { name: 'tags', value: (pr.tags || []).join(' ') }),
    el('label', { style: 'display:flex;gap:6px;align-items:center' }, el('input', { type: 'checkbox', name: 'default', style: 'width:auto', checked: !!pr.default }), `设为 ${pr.pipeline} 的默认预设`),
    el('div', { class: 'actions' }, el('button', { class: 'primary', type: 'submit' }, '保存'),
      id ? el('button', { class: 'plain', type: 'button', onclick: async () => {
        try { await api('praxis_preset_remove', { id, expected_revision: pr.revision }); $('#preset-edit').replaceChildren(el('p', { class: 'empty' }, '已删除。旧运行记录里仍有它的值。')); loadPresets() }
        catch (err) { note.className = 'note err'; note.textContent = err.message }
      } }, '删除') : null, note))
  $('#preset-edit').replaceChildren(form)
}

// ---- capture
$('#cap-form').addEventListener('submit', async (e) => {
  e.preventDefault()
  const d = Object.fromEntries(new FormData(e.target))
  const note = $('#cap-note')
  const args = { ...d, tags: d.tags.split(/\s+/).filter(Boolean) }
  for (const k of ['url', 'locator']) if (!args[k]) delete args[k]
  try {
    const r = await api('praxis_capture', args)
    note.className = 'note ok'
    note.textContent = r.existing ? `已有条目：${r.source.id}` : `已登记：${r.source.id}`
    if (!r.existing) e.target.reset()
  } catch (err) { note.className = 'note err'; note.textContent = err.message }
})

// ---- log
async function loadLog() {
  const [stale, runList, history] = await Promise.all([api('praxis_stale'), api('praxis_runs'), api('praxis_history', { limit: 60 })])
  $('#stale').replaceChildren(stale.length ? el('table', {}, el('tr', {}, el('th', {}, '运行'), el('th', {}, '之后改过的单元'), el('th', {}, '之后改过的挂载')),
    stale.map((s) => el('tr', {}, el('td', {}, s.title), el('td', { class: 'meta' }, s.units.join('\n')), el('td', { class: 'meta' }, s.bindings.join('\n')))))
    : el('p', { class: 'note' }, '没有。'))
  $('#runs').replaceChildren(runList.length ? el('table', {}, runList.map((r) => el('tr', {}, el('td', { class: 'meta' }, r.at.slice(0, 16)), el('td', {}, r.title), el('td', { class: 'note' }, `${r.units.length} 个单元 · ${r.bindings.length} 条挂载 · ${r.artifacts.length} 个产物`))))
    : el('p', { class: 'note' }, '还没有运行记录。'))
  $('#history').replaceChildren(history.length ? el('table', {}, history.map((h) => el('tr', {}, el('td', { class: 'meta' }, h.at.slice(0, 16)), el('td', {}, h.op), el('td', { class: 'meta' }, h.id || ''), el('td', { class: 'note' }, [h.by, h.reason].filter(Boolean).join(' · ')))))
    : el('p', { class: 'note' }, '还没有维护记录。'))
}

loadTree()
</script>
